<script>
(function(){
  /* ---------- Image viewer ---------- */
  function openViewer(src, alt){
    if(!src) return;
    var old = document.getElementById('ivOverlay'); if(old) old.remove();
    var v = document.createElement('div'); v.id = 'ivOverlay'; v.className = 'iv';
    v.innerHTML = '<div class="iv-stage"><img class="iv-img" alt="" draggable="false"></div>'
      + '<button type="button" class="iv-close" aria-label="Close">&times;</button>'
      + '<div class="iv-hint">Tap to zoom · drag to move · tap outside to close</div>';
    var img = v.querySelector('.iv-img'); img.src = src; img.alt = alt || 'Image';
    var scale = 1, tx = 0, ty = 0, startX = 0, startY = 0, moved = false, lastTap = 0, pinch = null;
    function apply(){
      img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
      v.classList.toggle('zoomed', scale > 1);
      img.style.cursor = scale > 1 ? 'grab' : 'zoom-in';
    }
    function close(){ v.remove(); document.removeEventListener('keydown', onKey, true); }
    function onKey(e){ if(e.key === 'Escape') close(); }
    function zoomAt(target){ scale = scale > 1 ? 1 : 2.5; tx = 0; ty = 0; apply(); }
    v.querySelector('.iv-close').onclick = close;
    v.addEventListener('click', function(e){ if(e.target === v || e.target.classList.contains('iv-stage')) close(); });
    img.addEventListener('click', function(e){
      e.stopPropagation();
      if(moved){ moved = false; return; }
      zoomAt(e);
    });
    // drag to pan when zoomed (mouse and touch)
    function down(x,y){ startX = x - tx; startY = y - ty; moved = false; }
    function move(x,y){ if(scale <= 1) return; var nx = x - startX, ny = y - startY; if(Math.abs(nx-tx)+Math.abs(ny-ty) > 3) moved = true; tx = nx; ty = ny; apply(); }
    img.addEventListener('mousedown', function(e){ down(e.clientX,e.clientY); });
    window.addEventListener('mousemove', function(e){ if(v.isConnected && e.buttons) move(e.clientX,e.clientY); });
    img.addEventListener('touchstart', function(e){
      if(e.touches.length === 2){
        var a = e.touches[0], b = e.touches[1];
        pinch = { d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), s: scale };
      } else {
        down(e.touches[0].clientX, e.touches[0].clientY);
        var now = Date.now(); if(now - lastTap < 300){ zoomAt(e); lastTap = 0; } else lastTap = now;
      }
    }, {passive:true});
    img.addEventListener('touchmove', function(e){
      if(pinch && e.touches.length === 2){
        var a = e.touches[0], b = e.touches[1];
        var d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
        scale = Math.min(5, Math.max(1, pinch.s * d / pinch.d)); apply(); moved = true; e.preventDefault();
      } else if(e.touches.length === 1){
        move(e.touches[0].clientX, e.touches[0].clientY);
        if(scale > 1) e.preventDefault();
      }
    }, {passive:false});
    img.addEventListener('touchend', function(){ pinch = null; if(scale < 1.05){ scale = 1; tx = 0; ty = 0; apply(); } });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(v);
    apply();
  }
  window.openImageViewer = openViewer;

  /* ---------- Figures open in the viewer (question figures and option figures) ---------- */
  document.addEventListener('click', function(e){
    var img = e.target && e.target.closest && e.target.closest('.qfig img, .optbox img');
    if(!img || !img.src) return;
    e.preventDefault(); e.stopPropagation();
    openViewer(img.src, img.alt);
  }, true);

  /* ---------- Profile photo: tap the photo to choose Upload or View ---------- */
  function avatarSheet(pick){
    var old = document.getElementById('avSheet'); if(old) old.remove();
    var hasPhoto = !!(pick.querySelector('.av-circle img'));
    var wrap = document.createElement('div'); wrap.id = 'avSheet'; wrap.className = 'av-sheet-wrap';
    wrap.innerHTML = '<div class="av-sheet" role="dialog" aria-modal="true">'
      + '<div class="av-sheet-title">Profile photo</div>'
      + '<button type="button" class="av-primary av-upload">Upload new profile picture</button>'
      + (hasPhoto ? '<button type="button" class="av-view">View profile picture</button>' : '')
      + '<button type="button" class="av-cancel">Cancel</button></div>';
    function close(){ wrap.remove(); document.removeEventListener('keydown', onKey, true); }
    function onKey(e){ if(e.key === 'Escape') close(); }
    wrap.addEventListener('click', function(e){ if(e.target === wrap) close(); });
    wrap.querySelector('.av-cancel').onclick = close;
    wrap.querySelector('.av-upload').onclick = function(){
      close();
      var input = pick.querySelector('input[type="file"]');
      if(input) input.click();
    };
    var view = wrap.querySelector('.av-view');
    if(view) view.onclick = function(){
      close();
      var img = pick.querySelector('.av-circle img');
      if(img) openViewer(img.src, 'Profile picture');
    };
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(wrap);
  }
  document.addEventListener('click', function(e){
    var pick = e.target && e.target.closest && e.target.closest('label.av-pick');
    if(!pick) return;
    e.preventDefault(); e.stopPropagation();   // stop the browser opening the file picker straight away
    avatarSheet(pick);
  }, true);
})();
</script>

<script>
// ---------- Data paths (adjust here if the folder layout changes) ----------
// Serve the repo root with a local server (e.g. `python3 -m http.server`); opening the file directly blocks fetch().
const APP_BUILD = '2026-11-01-c';   // bumped with every release; the app compares it with the hosted file
const PATHS = {
  index: 'data/index.json',  // lists every paper; each paper's "file" field points at its question JSON
  solutions: 'data/solutions/'    // one file per paper: data/solutions/<paper-id>.json
};

// ---------- Question bank (filled from data/ at startup) ----------
let QUESTIONS = [];
let PAPERS = [];
let BANK_ERROR = null;

const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : 'Medium';
const MONTH_KEY = {jan:'Jan', feb:'Feb', mar:'Mar', apr:'April'};
const monthKey = s => { const m = /(jan|feb|mar|apr)/i.exec(String(s || '')); return m ? MONTH_KEY[m[1].toLowerCase()] : 'Jan'; };
const paperTitle = p => [p.year, p.session, p.shift_label].filter(Boolean).join(' · ');

function solText(v){
  if(typeof v === 'string') return v;
  if(v && typeof v.text === 'string') return v.text;
  if(v && Array.isArray(v.steps)) return v.steps.join(' ');

}
// Accepts [{id, solution}], {questions:[...]} or {"<question-id>": "..."}
function readSolutions(data){
  const map = {};
  const list = Array.isArray(data) ? data : (data && (data.solutions || data.questions));
  if(Array.isArray(list)){
    list.forEach(x => { const id = x.id || x.question_id; if(id) map[id] = solText(x.solution ?? x.explanation); });
  } else if(data){
    Object.entries(data).forEach(([k, v]) => { if(k.indexOf('-p-') > -1) map[k] = solText(v); });
  }
  return map;
}
// Convert one raw question from the extracted JSON into the shape the app renders.
function normaliseQuestion(raw, paper, solution){
  const isInt = raw.question_type === 'integer';
  const opts = raw.options || [];
  const key = (raw.correct_answer || [])[0];
  return {
    id: raw.id,
    paperId: paper.id,
    subject: raw.subject,
    chapter: canonChapter(raw.subject, raw.chapter || 'Other'),
    rawChapter: raw.chapter || null,
    topic: raw.topic || '',
    year: raw.year,
    shift: monthKey(raw.session_month || paper.session),
    type: isInt ? 'integer' : 'single',
    difficulty: cap(raw.difficulty),
    text: raw.text || '',
    image: raw.image || null,
    options: opts.map(o => o.text || ''),           // options are NOT shuffled, so key order is stable
    optionImages: opts.map(o => o.image || null),
    correct: isInt ? -1 : opts.findIndex(o => String(o.key) === String(key)),
    answer: isInt ? String(key ?? '') : null,        // exact value for integer-type questions
    hint: null,
    explanation: solution || 'Solution not added yet.'

}
async function loadJSON(url){
  const r = await fetch(url, {cache: 'no-cache'});

}
async function loadBank(){
  try{
    const index = await loadJSON(PATHS.index);
    PAPERS = index.papers || [];
    const all = [];
    for(const paper of PAPERS){
      try{
        const raw = await loadJSON(paper.file);     // "file" is already a repo-root path, e.g. data/....json
        let sols = {};
        try{ sols = readSolutions(await loadJSON(PATHS.solutions + paper.id + '.json')); }
        catch(e){ /* no solutions file for this paper yet */ }
        raw.forEach(q => all.push(normaliseQuestion(q, paper, sols[q.id] || null)));

function normalizeStore(){
  // Older saves may lack newer fields or store values in an old shape. Repair them once at load time.
  if(!store || typeof store!=='object') store = {};
  ['bookmarks','errorLog','attempts','myCards'].forEach(k=>{ if(!Array.isArray(store[k])) store[k]=[]; });
  if(!store.notes || typeof store.notes!=='object') store.notes={};
  if(!store.reportCounts || typeof store.reportCounts!=='object') store.reportCounts={};
  if(!store.mistakes || typeof store.mistakes!=='object') store.mistakes={};

    const m = store.mistakes[id];
    if(m && !Array.isArray(m.types)) m.types = m.type ? [m.type] : [];
  });

  store.points = isFinite(pts) ? Math.round(pts) : 0;

// Merges two lists without repeats. Objects are matched by id, or by content when they have none.
function unionItems(a, b){
  const seen = new Set(), out = [];
  a.concat(b).forEach(x=>{
    const k = (x && typeof x === 'object') ? (x.id != null ? 'id:' + x.id : 'json:' + JSON.stringify(x)) : 'v:' + String(x);
    if(!seen.has(k)){ seen.add(k); out.push(x); }
  });
  return out;
}
// Adds a saved copy (on this device or from the server) into the live store. Nothing already there is thrown away.
function absorbLocal(incoming){
  if(!incoming || typeof incoming !== 'object') return;
  Object.keys(incoming).forEach(k=>{
    const inc = incoming[k], cur = store[k];
    if(cur === undefined || cur === null){ store[k] = inc; return; }
    if(k === 'attempts' && Array.isArray(cur) && Array.isArray(inc)){
      const have = new Set(cur.filter(Boolean).map(a => a.q + '|' + a.at));
      store.attempts = cur.concat(inc.filter(a => a && !have.has(a.q + '|' + a.at)));
      return;
    }
    if(typeof cur === 'number' && typeof inc === 'number'){ store[k] = Math.max(cur, inc); return; }
    if(Array.isArray(cur) && Array.isArray(inc)){ store[k] = unionItems(cur, inc); return; }
    if(cur && typeof cur === 'object' && !Array.isArray(cur) && inc && typeof inc === 'object' && !Array.isArray(inc)){ store[k] = Object.assign({}, cur, inc); return; }
    store[k] = inc;
  });
}
function persist(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} markCloudDirty(); }

// ----- Cloud save: the whole progress (streak, notes, quote, answers) is kept on the server too -----
let cloudReady = false, cloudDirty = false, cloudTimer = null, cloudChain = Promise.resolve();
function markCloudDirty(){
  cloudDirty = true;
  if(!sbSession) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(flushCloud, 300);
}
// Sends the current progress if it changed. Never runs before the saved copy has been read, so nothing is overwritten by mistake.
function flushCloud(){
  clearTimeout(cloudTimer);
  if(!cloudReady || !cloudDirty || !sbSession) return cloudChain;
  const db = sbClient(); if(!db) return cloudChain;
  cloudDirty = false;
  const uid = sbSession.user.id;
  cloudChain = cloudChain.then(async ()=>{
    let quote = null; try{ quote = JSON.parse(localStorage.getItem(QUOTE_KEY)); }catch(e){}
    const { error } = await db.from('user_state').upsert({ user_id: uid, data: { store: store, quote: quote }, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
    if(error){ cloudDirty = true; console.error('Cloud save failed, will retry', error); }
  }).catch(e=>{ cloudDirty = true; console.error(e); });
  return cloudChain;
}
// Reads the saved progress and merges it with this device. Nothing is written back until this succeeds.
async function restoreCloudState(uid){
  const db = sbClient(); if(!db || !uid) return;
  const { data, error } = await db.from('user_state').select('data').eq('user_id', uid).maybeSingle();
  if(error){ console.error('Could not read saved progress', error); return; }
  const saved = data && data.data;
  if(saved && saved.store){
    const s = saved.store;
    const have = new Set(store.attempts.filter(Boolean).map(a => a.q + '|' + a.at));
    (s.attempts || []).forEach(a => { if(!a) return; const k = a.q + '|' + a.at; if(!have.has(k)){ have.add(k); store.attempts.push(a); } });
    Object.keys(s).forEach(k => {
      if(k === 'attempts') return;
      const sv = s[k], lv = store[k];
      if(lv === undefined || lv === null) store[k] = sv;
      else if(Array.isArray(lv) && Array.isArray(sv)) store[k] = unionItems(lv, sv);
      else if(typeof lv === 'number' && typeof sv === 'number') store[k] = Math.max(lv, sv);
      else if(typeof lv === 'object' && !Array.isArray(lv) && sv && typeof sv === 'object') store[k] = Object.assign({}, sv, lv);
    });
  }
  if(saved && saved.quote){
    try{ if(!localStorage.getItem(QUOTE_KEY)) localStorage.setItem(QUOTE_KEY, JSON.stringify(saved.quote)); }catch(e){}
  }
  cloudReady = true;
  persist();
  markCloudDirty();
}

function finalizeSkips(){
  if(!session || session.skipsDone) return;
  session.skipsDone = true;
  if(session.mode==='mock') return; // mocks record skips in submitMock
  session.queue.forEach(q=>{ const a = session.answers[q.id]; if(!a || a.skip) recordSkip(q, Math.round((a && a.time) || 0), (a && !a.auto) ? 1 : 0); });
}
function statsOf(list){
  list = list.filter(a=>!a.skipped && !a.nullified);
  const total=list.length, correct=list.filter(a=>a.c).length;
  const time=list.reduce((s,a)=>s+(a.t||0),0);
  return {total, correct, acc: total?Math.round(correct/total*100):null,
          avg: total?Math.round(time/total):0, confWrong: list.filter(a=>a.conf==='sure' && !a.c).length};
}
function attemptsWhere(fn){ return store.attempts.filter(a=>{ const q=QMAP[a.q]; return q && fn(q); }); }
const chapterStats = c => statsOf(attemptsWhere(q=>q.chapter===c));
const subjectStats = s => statsOf(attemptsWhere(q=>q.subject===s));
// Days in a row. While today is still open the streak is held (frozen) at yesterday's count.
function streakInfo(){
  const days = qotdDays();
  const d = new Date();
  let frozen = false;
  if(!days.has(dayKey(d))){ d.setDate(d.getDate()-1); frozen = true; }
  let n = 0;
  while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return {n, frozen};
}
function streak(){ return streakInfo().n; }

function dailyQueue(){ return shuffle(QUESTIONS, rng(seed('daily-'+dayKey()))).slice(0,10); }
function weakChapter(){
  const c = ALL_CHAPTERS.map(name=>({name, s:chapterStats(name)})).filter(x=>x.s.total>=2);
  if(!c.length) return null;
  return c.sort((a,b)=>a.s.acc-b.s.acc)[0];
}

// TORQ wordmark: the O is redrawn as a torque arc, since torque is a rotational force. Letters use the serif face.
function torqWordmark(cls){
  const cx = 42, cy = 20, r = 10.5;
  const pt = a => [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  const a0 = -0.9, a1 = 4.2;                       // arc runs clockwise, leaving a gap at the top
  const [x0,y0] = pt(a0), [x1,y1] = pt(a1);
  const arc = 'M'+x0.toFixed(2)+' '+y0.toFixed(2)+' A'+r+' '+r+' 0 1 1 '+x1.toFixed(2)+' '+y1.toFixed(2);
  const tx = -Math.sin(a1), ty = Math.cos(a1), nx = Math.cos(a1), ny = Math.sin(a1);
  const tip = [x1 + tx*7, y1 + ty*7], b1 = [x1 + nx*4.8, y1 + ny*4.8], b2 = [x1 - nx*4.8, y1 - ny*4.8];
  const head = [tip,b1,b2].map(q=>q[0].toFixed(2)+','+q[1].toFixed(2)).join(' ');
  return '<svg class="wm '+cls+'" viewBox="0 0 128 40" role="img" aria-label="TORQ" focusable="false">'
    +'<text x="0" y="31" font-family="Lora, Georgia, serif" font-weight="600" font-size="31" fill="currentColor">T</text>'
    +'<g class="torq-arc"><path d="'+arc+'" fill="none" stroke="var(--accent)" style="stroke-width:var(--torq-stroke,3.2)" stroke-linecap="round"/>'
    +'<polygon points="'+head+'" fill="var(--accent)"/></g>'
    +'<text x="62" y="31" font-family="Lora, Georgia, serif" font-weight="600" font-size="31" fill="currentColor">R</text>'
    +'<text x="94" y="31" font-family="Lora, Georgia, serif" font-weight="600" font-size="31" fill="currentColor">Q</text>'
    +'</svg>';
}
// The torque arrow as a loading circle: the same arc and arrowhead, spinning
function torqSpinner(px){
  const cx = 22, cy = 22, r = 15, a0 = -0.9, a1 = 4.2;
  const pt = a => [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  const [x0,y0] = pt(a0), [x1,y1] = pt(a1);
  const arc = 'M'+x0.toFixed(2)+' '+y0.toFixed(2)+' A'+r+' '+r+' 0 1 1 '+x1.toFixed(2)+' '+y1.toFixed(2);
  const tx = -Math.sin(a1), ty = Math.cos(a1), nx = Math.cos(a1), ny = Math.sin(a1);
  const tip = [x1 + tx*5, y1 + ty*5], b1 = [x1 + nx*3.4, y1 + ny*3.4], b2 = [x1 - nx*3.4, y1 - ny*3.4];
  const head = [tip,b1,b2].map(q=>q[0].toFixed(2)+','+q[1].toFixed(2)).join(' ');
  const s = px || 48;
  return '<svg class="torq-spinner" width="'+s+'" height="'+s+'" viewBox="0 0 44 44" role="img" aria-label="Loading" focusable="false">'
    +'<g class="torq-arc"><path d="'+arc+'" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round"/>'
    +'<polygon points="'+head+'" fill="var(--accent)"/></g></svg>';
}

const REPORT_REASONS = [
  ['wrong_answer','Wrong answer is marked correct'],
  ['wrong_option','An option is wrong or missing'],
  ['unclear','The question is unclear or garbled'],
  ['image','A figure or image is missing or wrong'],

function reportCount(qid){ return (store.reportCounts && store.reportCounts[qid]) || 0; }
// A second or later report on the same question asks for confirmation first
function reportGate(q){
  if(!reportCount(String(q.id))) return reportSheet(q);
  const scrim = el('<div class="scrim"></div>');
  const box = el('<div class="rpt-modal" role="dialog" aria-modal="true" aria-label="Report again"><div class="rpt-modal-title">You have already submitted a report once</div><p class="note-line" style="margin:0">Are you sure you want to continue? A repeat report is passed to the team as a second report on this question.</p></div>');
  const row = el('<div class="rpt-modal-actions"></div>');
  const no = el('<button type="button" class="btn ghost">No</button>');
  const yes = el('<button type="button" class="btn">Yes, I want to continue</button>');
  const close = ()=>{ scrim.remove(); box.remove(); };
  no.onclick = close; scrim.onclick = close;
  yes.onclick = ()=>{ close(); reportSheet(q); };
  row.appendChild(no); row.appendChild(yes); box.appendChild(row);
  document.body.appendChild(scrim); document.body.appendChild(box);
}
function reportSheet(q){
  const picked = new Set();
  const scrim = el('<div class="scrim"></div>');
  const sheet = el('<div class="sheet rpt-center" role="dialog" aria-modal="true" aria-label="Report this question"><div class="sheet-title">Report this question</div></div>');
  sheet.appendChild(el('<p class="note-line" style="margin:0 0 10px">Select every problem you see. Your report goes to the team, and we will look at it.</p>'));
  const list = el('<div class="sheet-list"></div>');
  REPORT_REASONS.forEach(r=>{
    const b = el('<button class="sheet-opt" type="button" role="checkbox" aria-checked="false"><span class="rdot" aria-hidden="true"></span><span>'+esc(r[1])+'</span></button>');
    b.onclick = ()=>{
      if(picked.has(r[0])) picked.delete(r[0]); else picked.add(r[0]);
      const on = picked.has(r[0]);
      b.classList.toggle('on', on); b.setAttribute('aria-checked', on ? 'true' : 'false');
      send.disabled = picked.size === 0;
    };
    list.appendChild(b);
  });
  sheet.appendChild(list);
  const note = el('<textarea placeholder="Tell us more (optional)"></textarea>');
  sheet.appendChild(note);
  const send = el('<button class="btn block" style="margin-top:10px" disabled>Send report</button>');
  const cancel = el('<button class="btn ghost block" style="margin-top:8px">Cancel</button>');
  const close = ()=>{ scrim.remove(); sheet.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e=>{ if(e.key==='Escape') close(); };
  cancel.onclick = close; scrim.onclick = close;
  send.onclick = ()=>{
    if(!picked.size) return;
    const qid = String(q.id);
    const reasons = REPORT_REASONS.map(r=>r[0]).filter(k=>picked.has(k));
    const text = note.value.trim();
    const n = reportCount(qid) + 1;                 // 1 = first report, 2+ = repeat
    store.reportCounts = store.reportCounts || {}; store.reportCounts[qid] = n; persist();
    submitReport({
      question_id: qid, paper_id: q.paperId || null, subject: q.subject || null,
      chapter: q.chapter || null, topic: q.topic || null, year: q.year || null, shift: q.shift || null,
      qtype: q.type || null, category: reasons.join(','), note: text.slice(0,1000) || null,
      reasons: reasons, reason_count: reasons.length, word_count: text ? text.split(/\s+/).length : 0,
      report_no: n, priority: n === 1 ? 1 : 2,
      app_view: view + (session && session.title ? ' / ' + session.title : ''),
      user_id: sbSession ? sbSession.user.id : null
    });
    send.textContent = 'Sent. Thank you.'; send.disabled = true;
    setTimeout(close, 800);
  };
  sheet.appendChild(send); sheet.appendChild(cancel);
  document.body.appendChild(scrim); document.body.appendChild(sheet);
  document.addEventListener('keydown', onKey);
}
function queueFor(key, row){
  try{ const q = JSON.parse(localStorage.getItem(key)) || []; q.push(row); localStorage.setItem(key, JSON.stringify(q.slice(-200))); }catch(e){}
}
function submitReport(row){
  const db = sbClient();
  if(!db){ queueFor('torq_report_queue', row); return; }
  db.from('question_reports').insert(row).then(({error})=>{ if(error) queueFor('torq_report_queue', row); }, ()=>queueFor('torq_report_queue', row));
}
// Sends any reports that could not be sent earlier (offline, or before sign-in finished)
function flushReports(){
  const db = sbClient(); if(!db) return;
  let q = []; try{ q = JSON.parse(localStorage.getItem('torq_report_queue')) || []; }catch(e){}
  if(!q.length) return;
  localStorage.removeItem('torq_report_queue');
  const putBack = ()=>{ try{ const cur = JSON.parse(localStorage.getItem('torq_report_queue')) || []; localStorage.setItem('torq_report_queue', JSON.stringify(q.concat(cur).slice(-200))); }catch(e){} };
  db.from('question_reports').insert(q).then(({error})=>{ if(error) putBack(); }, putBack);
}
// Errors: anything that breaks in a student's browser is recorded once per session, so the creator can see it
const __seenErr = {};
function reportError(msg, stack){
  const text = String(msg || '').slice(0, 500);
  if(!text || __seenErr[text.slice(0,120)]) return;
  __seenErr[text.slice(0,120)] = 1;
  const db = sbClient(); if(!db) return;
  db.from('app_errors').insert({
    message: text, stack: String(stack || '').slice(0, 1500), app_view: view,
    user_id: sbSession ? sbSession.user.id : null, user_agent: navigator.userAgent.slice(0, 200)
  }).then(()=>{}, ()=>{});
}
window.addEventListener('error', e=> reportError(e.message, e.error && e.error.stack));
window.addEventListener('unhandledrejection', e=> reportError(e.reason && e.reason.message || String(e.reason), e.reason && e.reason.stack));

// Submitting a practice set: this is the only moment answers are marked, scored and recorded
function submitPractice(silent){
  if(!session || session.submitted || session.review) return;
  const untouched = session.queue.filter(q=>!session.answers[q.id]).length;
  if(!silent && untouched){
    appDialog({eyebrow:'Submit', title:'Submit now?', body:untouched+' question'+(untouched>1?'s are':' is')+' untouched. '+(untouched>1?'They':'It')+' will count as skipped with no points.', ok:'Submit', cancel:'Keep going'})
      .then(ok=>{ if(ok) submitPractice(true); });
    return;
  }
  session.queue.forEach(q=>{
    const a = session.answers[q.id];
    if(!a || !a.pending) return;
    if(a.nullified){
      const sec = a.time || 0;
      store.attempts.push({q:q.id, c:null, nullified:true, t:sec, d:dayKey(), at:Date.now()});
      addPoints(0 - (a.prevPts || 0));
      session.answers[q.id] = {sel:a.sel, nullified:true, time:sec, pts:0, at:Date.now()};
      return;
    }
    const ok = q.type==='integer' ? sameAnswer(String(a.sel), q.answer) : a.sel===q.correct;
    const pts = scoreFor(ok, a.conf || 'guess', a.time || 0);
    const att = recordAttempt(q, ok, a.time || 0); att.conf = a.conf || null;
    addPoints(pts - (a.prevPts || 0));
    session.answers[q.id] = {sel:a.sel, correct:ok, time:a.time || 0, att:att, at:Date.now(), pts:pts};
  });
  checkDailyDone();
  session.submitted = true;
  saveSessionRecord();
  if(!silent) go('results');

function suDraft(){ try{ return JSON.parse(localStorage.getItem('torq_profile_draft_v1')) || {}; }catch(e){ return {}; } }
function suSaveDraft(d){ try{ localStorage.setItem('torq_profile_draft_v1', JSON.stringify(d)); }catch(e){} }
function suIsGoogleNoPassword(){
  const u = sbSession && sbSession.user;
  return !!(u && u.app_metadata && u.app_metadata.provider === 'google' && !(u.user_metadata && u.user_metadata.password_set));
}
function suSteps(){
  if(!sbSession) return ['account','username','about','exam','finish'];
  return suIsGoogleNoPassword() ? ['password','username','about','exam','finish'] : ['username','about','exam','finish'];
}
function suCurrent(){
  const steps = suSteps();
  let cur = null; try{ cur = localStorage.getItem(SU_KEY); }catch(e){}
  return steps.indexOf(cur) >= 0 ? cur : steps[0];
}
function suGo(step){ try{ localStorage.setItem(SU_KEY, step); }catch(e){} render(); }
function suLabelIndex(step){ return step === 'password' ? 0 : ['account','username','about','exam','finish'].indexOf(step); }
function suLeaderPreview(on, uname, name, av){
  const pic = (on && av) ? '<img alt="" src="'+av+'">' : (on ? '<i>'+esc((name||'?').trim().charAt(0).toUpperCase()||'?')+'</i>' : ANON_SVG);
  return '<div class="lb-row lb-prev"><span class="lb-av">'+pic+'</span><span class="lb-name">'+(on ? esc(uname||'your_username') : 'Anonymous User')+'</span><span class="lb-pts">— pts</span></div>'
    +'<p class="note-line">'+(on ? 'Others see your username and photo.' : 'Others see a generic avatar and "Anonymous User". Your points still count.')+'</p>';
}
function signupCard(card, onSave){
  const steps = suSteps();
  const step = suCurrent();
  const d = suDraft();
  const idx = suLabelIndex(step);
  card.appendChild(el('<div class="onb-cardhead">Create your account</div>'));
  const pill = card.closest('.onb') && card.closest('.onb').querySelector('.onb-step');
  if(pill) pill.textContent = 'Step '+(idx+1)+' of 5';
  const f = el('<form class="profile-form" autocomplete="off"></form>');
  const err = el('<p class="note-line err" hidden></p>');
  const fail = m=>{ err.textContent = m; err.hidden = false; };
  const back = steps.indexOf(step) > 0 ? el('<button type="button" class="btn ghost">Back</button>') : null;
  const next = el('<button class="btn block" type="submit">Continue</button>');
  const bar = el('<div class="su-bar"></div>');
  if(back) bar.appendChild(back);
  bar.appendChild(next);
  const field = (label, html)=>el('<label class="pf"><span class="eyebrow">'+label+'</span>'+html+'</label>');
  const esc2 = v=>esc(v==null?'':v);
  let exam = d.exam || 'main';
  let avatar = { data: loadAvatarCache(), fresh: false };
  const save = ()=>{ const dd = Object.assign({}, suDraft()); f.querySelectorAll('input[name],select[name]').forEach(i=>{ if(i.type==='checkbox') dd[i.name]=i.checked; else if(i.type!=='password') dd[i.name]=i.value; }); dd.exam = exam; suSaveDraft(dd); };
  if(step === 'account'){
    f.appendChild(field('Email','<input name="email" type="email" autocomplete="email" maxlength="120" placeholder="you@example.com" value="'+esc2(d.email)+'">'));
    f.appendChild(field('Password <small style="opacity:.6">(8+ characters)</small>','<input name="password" type="password" autocomplete="new-password">'));
    f.appendChild(field('Confirm password','<input name="password2" type="password" autocomplete="new-password">'));
    next.textContent = 'Continue';
  } else if(step === 'password'){
    f.appendChild(el('<p class="note-line" style="margin:0 0 10px">You signed in with Google as '+esc2(sbSession.user.email)+'. Set a password so you can also log in with email.</p>'));
    f.appendChild(field('New password <small style="opacity:.6">(8+ characters)</small>','<input name="password" type="password" autocomplete="new-password">'));
    f.appendChild(field('Confirm password','<input name="password2" type="password" autocomplete="new-password">'));
  } else if(step === 'username'){
    f.appendChild(field('Username','<input name="username" maxlength="20" placeholder="e.g. rahul_jee" value="'+esc2(d.username)+'">'));
    f.appendChild(el('<p class="note-line" style="margin:-6px 0 12px">3 to 20 letters, numbers or underscores. Shown on the leaderboard.</p>'));
    f.appendChild(field('Name','<input name="name" maxlength="40" value="'+esc2(d.name)+'">'));
    f.appendChild(field('Surname','<input name="surname" maxlength="40" value="'+esc2(d.surname)+'">'));
  } else if(step === 'about'){
    f.appendChild(field('Birthdate <small style="opacity:.6">(optional)</small>','<input name="birthdate" type="date" min="1940-01-01" value="'+esc2(d.birthdate)+'">'));
    f.appendChild(field('Age','<input name="age" type="number" min="10" max="60" inputmode="numeric" value="'+esc2(d.age)+'">'));
  } else if(step === 'exam'){
    f.appendChild(field('Standard','<select name="standard">'+STD_OPTS.map(x=>'<option'+(d.standard===x?' selected':'')+'>'+x+'</option>').join('')+'</select>'));
    const seg = el('<div class="pf"><span class="eyebrow">Exam you are preparing for</span><div class="seg exam-seg"><button type="button" data-v="main">JEE Main</button><button type="button" data-v="adv">JEE Main + Advanced</button></div></div>');
    const btns = [...seg.querySelectorAll('button')];
    const sync = ()=>btns.forEach(b=>b.classList.toggle('on', b.dataset.v===exam));
    btns.forEach(b=>b.onclick = e=>{ e.preventDefault(); exam = b.dataset.v; sync(); save(); });
    sync();
    f.appendChild(seg);
  } else if(step === 'finish'){
    const vis = d.visible !== false;
    const pick = el('<div class="pf"><span class="eyebrow">Profile picture <small style="opacity:.6">(optional)</small></span><label class="av-pick"><input type="file" accept="image/*" hidden><span class="av-circle"></span><span class="av-text"><b>Add a photo</b></span></label></div>');
    const circle = pick.querySelector('.av-circle');
    const paintAv = ()=>{ circle.innerHTML = avatar.data ? '<img alt="" src="'+avatar.data+'">' : '<i>+</i>'; };
    paintAv();
    pick.querySelector('input').onchange = e=>{ const file = e.target.files && e.target.files[0]; if(file) readAvatar(file, dd=>{ avatar = {data: dd, fresh: true}; paintAv(); paintPrev(); }); };
    f.appendChild(pick);
    const vblock = el('<div class="pf vis-block"><span class="eyebrow">Show me on the leaderboard</span>'
      +'<label class="vis-toggle"><input type="checkbox" name="visible"'+(vis?' checked':'')+'><span class="vis-sw" aria-hidden="true"></span><span class="vis-lbl">'+(vis?'Visible to others':'Anonymous to others')+'</span></label>'
      +'<div class="vis-preview" aria-live="polite"></div></div>');
    const vcb = vblock.querySelector('input[name="visible"]');
    const prev = vblock.querySelector('.vis-preview');
    const paintPrev = ()=>{
      const on = vcb.checked;
      vblock.querySelector('.vis-lbl').textContent = on ? 'Visible to others' : 'Anonymous to others';
      prev.innerHTML = suLeaderPreview(on, d.username, d.name, avatar.data);
    };
    vcb.onchange = ()=>{ paintPrev(); save(); };
    paintPrev();
    f.appendChild(vblock);
    next.textContent = 'Create account';
  }
  f.appendChild(err);
  f.appendChild(bar);
  f.addEventListener('input', save);
  f.addEventListener('change', save);
  if(back) back.onclick = ()=>{ save(); suGo(steps[steps.indexOf(step)-1]); };
  f.onsubmit = async e=>{
    e.preventDefault();
    save();
    const v = name=>{ const i = f.querySelector('[name="'+name+'"]'); return i ? i.value.trim() : ''; };
    const db = sbClient();
    if(step === 'account'){
      const email = v('email'), pw = f.querySelector('[name="password"]').value, pw2 = f.querySelector('[name="password2"]').value;
      if(!db) return fail('Sign-up is unavailable right now. Check your connection and try again.');
      if(!/^\S+@\S+\.\S+$/.test(email)) return fail('Enter a valid email address.');
      if(pw.length < 8) return fail('Password must be at least 8 characters.');
      if(pw !== pw2) return fail('The two passwords do not match.');
      next.disabled = true; authBusy = true;
      const { data, error } = await db.auth.signUp({ email, password: pw });
      authBusy = false; next.disabled = false;
      if(error) return fail(error.message);
      if(!data.session) return fail('Account created. Confirm your email from the message we sent, then log in. What you typed is kept on this device.');
      sbSession = data.session;
      suGo('username');
      return;
    }
    if(step === 'password'){
      const pw = f.querySelector('[name="password"]').value, pw2 = f.querySelector('[name="password2"]').value;
      if(!db) return fail('Sign-up is unavailable right now. Check your connection and try again.');
      if(pw.length < 8) return fail('Password must be at least 8 characters.');
      if(pw !== pw2) return fail('The two passwords do not match.');
      next.disabled = true; authBusy = true;
      const { data, error } = await db.auth.updateUser({ password: pw, data: { password_set: true } });
      authBusy = false; next.disabled = false;
      if(error) return fail(error.message);
      if(data && data.user) sbSession.user = data.user;
      suGo('username');
      return;
    }
    if(step === 'username'){
      const username = v('username'), name = v('name'), surname = v('surname');
      if(!/^[A-Za-z0-9_]{3,20}$/.test(username)) return fail('Username must be 3 to 20 letters, numbers or underscores.');
      if(!name) return fail('Please enter your name.');
      if(!surname) return fail('Please enter your surname.');
      return suGo('about');
    }
    if(step === 'about'){
      const age = parseInt(v('age'), 10), bd = v('birthdate');
      if(!(age >= 10 && age <= 60)) return fail('Please enter an age between 10 and 60.');
      if(bd){ const dt = new Date(bd+'T00:00:00'); if(isNaN(dt) || dt > new Date()) return fail('Birthdate cannot be in the future.'); }
      return suGo('exam');
    }
    if(step === 'exam') return suGo('finish');
    // finish: create the account
    const d2 = suDraft();
    const profile = { username: d2.username.trim(), name: d2.name.trim(), surname: d2.surname.trim(), age: parseInt(d2.age,10),
      birthdate: d2.birthdate || null, standard: d2.standard || STD_OPTS[0], exam: d2.exam || 'main', visible: !!d2.visible || d2.visible===undefined };
    profile.visible = f.querySelector('[name="visible"]').checked;
    next.disabled = true; authBusy = true;
    const res = await saveRemote(profile, avatar.fresh ? avatar.data : null);
    authBusy = false; next.disabled = false;
    if(res.taken) return fail('That username is taken. Go back and try another.');
    if(res.error) return fail('Could not save: ' + (res.error.message || 'unknown error') + '. Check the message and try again.');
    try{ localStorage.removeItem('torq_profile_draft_v1'); localStorage.removeItem(SU_KEY); }catch(ex){}
    onSave(profile, res.avatar || avatar.data);
  };
  f.appendChild(el('<div></div>'));
  card.appendChild(f);
}
function loginForm(){
  const f = el('<form class="profile-form" autocomplete="on"></form>');
  f.innerHTML = '<div class="pf"><span class="eyebrow">Email</span><input name="id" type="email" autocomplete="email" placeholder="you@example.com" value="'+esc(lastEmail)+'"></div>'
    +'<div class="pf"><span class="eyebrow">Password</span><input name="pw" type="password" autocomplete="current-password"></div>'
    +'<p class="note-line err" hidden></p>'
    +'<button class="btn block" type="submit">Log in</button>';
  f.onsubmit = async e=>{
    e.preventDefault();
    const err = f.querySelector('.err');
    const fail = m=>{ err.textContent = m; err.hidden = false; };
    const id = f.querySelector('[name="id"]').value.trim();
    const pw = f.querySelector('[name="pw"]').value;
    if(!id || !pw) return fail('Enter your email and password.');
    const db = sbClient();
    if(!db) return fail('Log-in is unavailable right now. Check your connection and try again.');
    const btn = f.querySelector('button[type="submit"]'); btn.disabled = true; authBusy = true;
    try{
      const email = id;
      lastEmail = email;
      const { data, error } = await db.auth.signInWithPassword({ email, password: pw });
      if(error || !data.session) return fail('Wrong email or password.');
      sbSession = data.session;
      await restoreFromServer(data.session.user.id);
      render();
    } catch(ex){
      fail('Could not log in. Check your connection and try again.');
    } finally {
      authBusy = false; btn.disabled = false;
    }
  };
  return f;
}
// After logging in (or returning with a session), bring the saved profile, photo and practice history down from the server.
async function restoreFromServer(uid){
  const db = sbClient(); if(!db || !uid) return;
  {
    const { data } = await db.from('profiles').select('username, first_name, surname, standard, exam, age, birthdate, hide_from_leaderboard, avatar_data').eq('id', uid).maybeSingle();
    if(data && data.avatar_data) cacheUser({avatar: data.avatar_data});
    if(data && !store.profile){
      const age = data.age || (data.birthdate ? Math.floor((Date.now() - new Date(data.birthdate+'T00:00:00').getTime())/(365.25*864e5)) : '');
      store.profile = {username: data.username||'', name: data.first_name||'', surname: data.surname||'', age: age||'', birthdate: data.birthdate||null,
        standard: data.standard||'', exam: data.exam||'main', visible: !data.hide_from_leaderboard};
      persist();
    }
  }
  await restoreCloudState(uid);
  // Practice history: every attempt the server holds that this device does not have yet
  const rows = [];
  for(let from = 0; ; from += 1000){
    const { data, error } = await db.from('attempts').select('question_id,is_correct,skipped,time_ms,confidence,points,created_at')
      .eq('user_id', uid).order('created_at', {ascending:true}).range(from, from+999);
    if(error || !data) break;
    rows.push(...data);
    if(data.length < 1000) break;
  }
  if(!rows.length) return;
  const have = new Set(store.attempts.filter(Boolean).map(a => a.q + '|' + a.at));
  let added = 0;
  rows.forEach(r=>{
    const at = Date.parse(r.created_at);
    const key = r.question_id + '|' + at;
    if(have.has(key)) return;
    have.add(key); added++;
    store.attempts.push({q: r.question_id, c: !!r.is_correct, skipped: !!r.skipped, t: r.time_ms != null ? r.time_ms/1000 : null,
      conf: r.confidence || undefined, at, d: dayKey(new Date(at)), up: true});
  });
  if(added){
    const total = rows.reduce((s,r)=>s + (Number(r.points)||0), 0);
    store.points = Math.max(store.points||0, Math.round(total));
    persist();
  }
}
// A mock test is locked until it is submitted, so leaving cannot throw away the marks.
let leaveArmed = 0;
// A practice set with unsubmitted answers: leaving marks and saves them, after one warning
function practiceLeavePending(){ return !!(session && session.mode!=='mock' && !session.review && !session.submitted && hasPending()); }
function finalizeLeave(){
  if(!session) return;
  if(window.__t){ clearInterval(window.__t); window.__t=null; }
  try{ submitPractice(true); }catch(e){ console.error(e); }
  try{ finalizeSkips(); }catch(e){}
  session = null;
  leaveArmed = 0;
}
function leaveNotice(msg){
  const old = document.querySelector('.mock-notice'); if(old) old.remove();
  const n = el('<div class="mock-notice" role="status"></div>');
  n.textContent = msg;
  document.body.appendChild(n);
  setTimeout(()=>{ n.classList.add('out'); setTimeout(()=>n.remove(), 400); }, 3800);
}
const LEAVE_MSG = 'Leaving now marks the answers you have given so far. Press Leave or back again to exit.';
// Every exit from a practice set goes through here: first attempt warns, a second attempt within 4 seconds leaves
function requestLeave(then){
  if(!practiceLeavePending()){ then(); return; }
  if(leaveArmed && Date.now()-leaveArmed < 4000){ finalizeLeave(); then(); return; }
  leaveArmed = Date.now();
  leaveNotice(LEAVE_MSG);
}

let __renderBusy = false, __lastRecover = 0;
function render(){
  if(__renderBusy) return;
  document.body.classList.remove('flash-session');   // no nested redraws
  __renderBusy = true;
  try{ renderInner(); saveSessionSnapshot(); }
  catch(err){
    console.error(err);
    const now = Date.now();
    if(now - __lastRecover > 2000){ __lastRecover = now; try{ view = 'home'; saveLastView(); renderInner(); }catch(e2){ console.error(e2); } }
    __renderBusy = false; return;
  }
  __renderBusy = false;
  // Size the quote synchronously, before the browser paints, so it never jumps after load
  document.querySelectorAll('figure.qcard').forEach(c=>fitQuote(c));
  histSync(); addBackCard(); if(store.profile && !store.introSeen && !window.__introShown){ window.__introShown = true; setTimeout(showIntro, 500); } }
function navKey(){
  const o = {};
  Object.keys(nav).forEach(k=>{ if(k!=='cfg' && k!=='mockCfg') o[k] = nav[k]; });
  return JSON.stringify({view, idx: (session && session.mode) ? session.idx : null, nav:o});
}
function histSync(){
  const key = navKey();
  const state = {torq:1, key, view, idx: (session && session.mode) ? session.idx : null, nav: JSON.parse(JSON.stringify(nav))};
  const prev = history.state;
  window.__lastTorqState = state;
  // a real change of screen or question adds a history step; a settings tweak only updates the current one
  if(prev && prev.torq && prev.key!==key){ history.pushState(state, ''); window.__depth = (window.__depth||0)+1; }
  else history.replaceState(state, '');
}
// Tablet landscape: scale the app with the screen height so pages fill the screen instead of leaving empty space.
function fitToScreen(){
  const app = document.getElementById('app');
  if(!app) return;
  const w = window.innerWidth, h = window.innerHeight;
  const landscapeTablet = w >= 900 && w / h >= 1.2;
  const f = landscapeTablet ? Math.min(1.35, Math.max(1, h / 700)) : 1;
  const next = f === 1 ? '' : String(f.toFixed(3));
  if(app.style.zoom !== next) app.style.zoom = next;
}
window.addEventListener('resize', fitToScreen);
window.addEventListener('orientationchange', fitToScreen);

// Collapsible navigation: three bars at the top left open the tab list; they turn into a cross while it is open
let navOpen = false;
function setNavOpen(open){
  navOpen = !!open;
  const p = document.querySelector('.navpanel'), t = document.getElementById('navTog'), sc = document.getElementById('navScrim');
  if(p){
    clearTimeout(p.__closeT);
    if(navOpen){
      // The glint plays only after the menu has been left alone for a while, not on every open
      const idle = Date.now() - (window.__navLastOpen || 0);
      p.classList.toggle('glint', idle > 7 * 60 * 1000);
      window.__navLastOpen = Date.now();
      p.classList.remove('closing'); p.classList.add('open');
    }
    else if(p.classList.contains('open')){
      // Keep the panel on screen while it plays its closing animation, then unmount the state class
      p.classList.remove('open'); p.classList.add('closing');
      p.__closeT = setTimeout(()=>p.classList.remove('closing'), 600);
    }
  }
  if(p && navOpen){ const r = p.querySelector('.np-draw rect'); if(r){ r.setAttribute('width', Math.max(0, p.offsetWidth-1.6)); r.setAttribute('height', Math.max(0, p.offsetHeight-1.6)); } }
  if(t){ t.classList.toggle('x', navOpen); t.setAttribute('aria-expanded', navOpen ? 'true' : 'false'); }
  if(sc) sc.classList.toggle('on', navOpen);
}
function mountNav(){
  const tog = el('<button id="navTog" class="navtog" type="button" aria-label="Menu" aria-expanded="false"><i class="b1"></i><i class="b2"></i><i class="b3"></i></button>');
  tog.onclick = ()=>setNavOpen(!navOpen);
  const sc = el('<div id="navScrim" class="navscrim"></div>');
  sc.onclick = ()=>setNavOpen(false);
  document.body.appendChild(sc);
  document.body.appendChild(tog);
  document.body.appendChild(bottomNav());
  setNavOpen(navOpen);
}

const NOTES = {"Kinematics":{"formulas":[{"eq":"v = u + at","use":"Velocity after time t, starting at u with constant acceleration a"},{"eq":"s = ut + \\tfrac{1}{2}at^{2}","use":"Displacement in time t"},{"eq":"v^{2} = u^{2} + 2as","use":"Velocity after a displacement s, when time is not given"},{"eq":"s_{n} = u + a\\left(n - \\tfrac{1}{2}\\right)","use":"Displacement in the nth second"},{"eq":"\\bar{v} = \\tfrac{u + v}{2}","use":"Average velocity under constant acceleration"},{"eq":"\\vec{v}_{AB} = \\vec{v}_{A} - \\vec{v}_{B}","use":"Velocity of A as seen from B"},{"eq":"v = \\dfrac{dx}{dt}","use":"Velocity: the slope of the position–time graph"},{"eq":"a = \\dfrac{dv}{dt}","use":"Acceleration: the slope of the velocity–time graph"},{"eq":"\\Delta x = \\text{area under } v\\text{–}t","use":"Displacement: the area under the velocity–time graph"},{"eq":"a = g \\text{ downward}","use":"Free fall: only gravity acts (g = 10 m/s² in JEE problems unless told otherwise)"},{"eq":"T = \\dfrac{2u\\sin\\theta}{g}","use":"Time of flight of a projectile launched at θ on level ground"},{"eq":"H = \\dfrac{u^{2}\\sin^{2}\\theta}{2g}","use":"Maximum height of a projectile"},{"eq":"R = \\dfrac{u^{2}\\sin 2\\theta}{g}","use":"Horizontal range on level ground"}],"concepts":[{"title":"Displacement is not distance","analogy":"Walk 5 floors up a staircase, then 3 floors down. You walked 8 floors (distance), but you finish 2 floors above where you started (displacement).","body":["Distance counts every metre of the path. Displacement only compares where you finish with where you started, so it can be smaller than the distance, or even zero.","This is why a closed loop always gives zero displacement, however long the loop is. Many JEE traps come from mixing these two quantities.","Displacement is a vector: it has a size and a direction. Distance is a scalar: it only has a size."],"example":{"q":"A particle goes 4 m east, then 3 m west. Find the distance and the displacement.","a":"Distance = 4 + 3 = 7 m. Displacement = 4 − 3 = 1 m east."}},{"title":"Velocity is speed with a direction","analogy":"A speedometer tells you how fast you go. A weather forecast saying “15 km/h from the north” adds the direction, and that changes what it means for a sailor.","body":["Average velocity is displacement divided by time. Average speed is distance divided by time. They agree only when the motion is in one straight line without turning back.","Velocity can change while speed stays fixed. A car going round a circular track at constant speed has a changing velocity, because its direction keeps changing."],"example":{"q":"A runner completes one lap of a 400 m circular track in 80 s. Find the average speed and the average velocity.","a":"Average speed = 400 / 80 = 5 m/s. Average velocity = 0, because the displacement after a full lap is zero."}},{"title":"Acceleration is how velocity changes","analogy":"Acceleration is the gas pedal and the brake combined. It describes how quickly your velocity is changing, not how fast you are going.","body":["If acceleration points the same way as velocity, the body speeds up. If it points the opposite way, the body slows down, even when the acceleration is written as a positive number.","A body moving west while accelerating east is slowing down. It will stop, then speed up eastward. Always check signs against a chosen positive direction."],"example":{"q":"A ball is thrown up at 10 m/s. Is it speeding up or slowing down during the rise?","a":"Gravity points down, against the upward velocity, so the ball slows down at 10 m/s² until it stops."}},{"title":"Reading the graphs: slope and area","analogy":"A position–time graph is the journey log. Its steepness is how fast you travel. A velocity–time graph is the speedometer history, and the area under it is the total distance travelled, with sign.","body":["Slope of x–t gives velocity. A horizontal line means at rest. A steeper line means faster.","Slope of v–t gives acceleration. Area under v–t gives displacement. Area below the time axis is negative displacement.","For a v–t graph that is a straight line, the average velocity is simply (u + v)/2 and the area is a trapezium or triangle."],"example":{"q":"A v–t graph rises from 0 to 8 m/s in 4 s, then stays at 8 m/s for 6 s. Find the displacement.","a":"Triangle: ½ × 4 × 8 = 16 m. Rectangle: 8 × 6 = 48 m. Total = 64 m."}},{"title":"The four equations are four recipes","analogy":"The five quantities are s, u, v, a and t. Each equation leaves one of them out. Pick the equation that leaves out the quantity you neither know nor need.","body":["If the question does not mention time and asks for velocity, use v² = u² + 2as. If it asks for displacement after a given time, use s = ut + ½at².","Write down what is known and what is asked before choosing. Most errors come from using an equation that needs a quantity you do not have.","These equations assume constant acceleration. They fail for a changing acceleration, and then you must use calculus."],"example":{"q":"A bike starts from rest and accelerates at 2 m/s² for 5 s. Find its speed and the distance covered.","a":"v = u + at = 10 m/s. s = ut + ½at² = 0 + ½ × 2 × 25 = 25 m."}},{"title":"Free fall: gravity as a constant pull","analogy":"Think of gravity as an escalator that always pulls down at the same rate, whatever you are doing. Going up or down, your speed changes by the same amount every second.","body":["Near the Earth’s surface gravity gives every body the same downward acceleration, about 9.8 m/s², which JEE usually rounds to 10 m/s².","The mass does not matter if air resistance is ignored. A feather and a stone fall together in vacuum.","A body thrown up returns to the same height with the same speed, but in the opposite direction, because the motion is symmetric about the top."],"example":{"q":"A stone is dropped from a 20 m tall tower. Find its speed on landing (g = 10).","a":"v² = 0 + 2 × 10 × 20 = 400, so v = 20 m/s downward."}},{"title":"Projectile motion: two independent motions","analogy":"Drop a ball inside a moving bus. To a passenger it falls straight down. To someone on the road it moves forward and down along a curve. The sideways motion and the falling motion do not affect each other.","body":["Horizontally there is no acceleration, so the horizontal velocity stays at u cos θ for the whole flight.","Vertically gravity acts, so the vertical motion follows the free-fall equations, starting with u sin θ upward.","The time of flight is decided by the vertical motion alone. The range is then the horizontal velocity times that time. The highest point is where the vertical velocity becomes zero."],"example":{"q":"A ball is thrown at 20 m/s at 30° above the horizontal. Find the time of flight (g = 10).","a":"T = 2u sinθ / g = 2 × 20 × ½ / 10 = 2 s."}},{"title":"Relative velocity: what the other body sees","analogy":"You walk at 2 m/s on a walkway that moves at 3 m/s in the same direction. To the floor you move at 5 m/s, but to the walkway you only move at 2 m/s.","body":["To find how A looks from B, subtract B’s velocity from A’s velocity: the vector $\\vec{v}_{AB} = \\vec{v}_{A} - \\vec{v}_{B}$.","Choose one direction as positive and keep the signs consistent for every body.","Relative velocity explains why rain seems to fall slantwise to a moving cyclist, even though it falls straight down to someone standing still."],"example":{"q":"Train A moves east at 30 m/s and train B moves west at 20 m/s. Find A’s velocity as seen from B.","a":"$\\vec{v}_{AB} = 30 - (-20) = 50$ m/s east."}}]},"Laws of Motion":{"formulas":[{"eq":"\\vec{F}_{net} = m\\vec{a}","use":"Net force equals mass times acceleration, in the same direction"},{"eq":"\\vec{F}_{AB} = -\\vec{F}_{BA}","use":"Action and reaction: equal, opposite, acting on different bodies"},{"eq":"\\vec{J} = \\vec{F}\\,\\Delta t = \\Delta\\vec{p}","use":"Impulse equals the change in momentum"},{"eq":"f_s \\le \\mu_s N","use":"Static friction adjusts itself, up to a maximum"},{"eq":"f_k = \\mu_k N","use":"Kinetic friction once the surfaces slide past each other"},{"eq":"a = g\\sin\\theta","use":"Smooth block sliding down an incline of angle theta"},{"eq":"N = m(g + a)","use":"Apparent weight in a lift accelerating upward with a"},{"eq":"\\vec{F}_{pseudo} = -m\\vec{a}_0","use":"Pseudo force felt in a frame accelerating with a_0"},{"eq":"a = \\frac{(m_1-m_2)\\,g}{m_1+m_2}","use":"Atwood machine: two masses over a light frictionless pulley"},{"eq":"T = \\frac{2m_1m_2\\,g}{m_1+m_2}","use":"Tension in the string of an Atwood machine"}],"concepts":[{"title":"A force changes motion, not motion itself","analogy":"Pushing a shopping trolley. Keep pushing and it speeds up. Stop pushing and it slows. Nothing about the trolley's speed is 'used up' by the push; the push is what changes the speed.","body":["Newton's first law says a body keeps its velocity, rest included, unless a net external force acts on it. So zero net force means no change in velocity, not no motion.","The second law turns that into a number: the net force divides by the mass to give the acceleration. Forces add like vectors, so it is the net force that matters, not each force alone."],"example":{"q":"A 2 kg block has 4 N pushing east and 1 N pushing west. What is its acceleration?","a":"Net force is 4 - 1 = 3 N east. a = F/m = 3 / 2 = 1.5 m/s^2, east."}},{"title":"Mass is inertia: resistance to a change in motion","analogy":"Pushing an empty supermarket cart versus a loaded one. The same push gives a big speed-up to the empty cart and a small one to the full cart. The full cart has more inertia.","body":["For a fixed force, a bigger mass gives a smaller acceleration. This is why a heavy truck takes longer to get going than a bicycle.","Mass is a measure of how hard a body is to accelerate. It is not the same as weight, which is the gravitational pull on that mass."],"example":{"q":"The same 10 N force acts on a 2 kg body and then on a 5 kg body. Which accelerates more, and by how much?","a":"2 kg: a = 10/2 = 5 m/s^2. 5 kg: a = 10/5 = 2 m/s^2. The 2 kg body accelerates 2.5 times as much."}},{"title":"Action and reaction act on different bodies","analogy":"When you walk, your foot pushes the ground backward and the ground pushes you forward. The two pushes are equal and opposite, but they are felt by different things: you and the ground.","body":["Newton's third law pairs forces. Each force has an equal and opposite partner, and the two partners act on different bodies. That is why they never cancel out for the same body.","A common trap is to think a pair of equal forces means no motion. Always ask: on which body does this force act?"],"example":{"q":"A 50 kg person stands on the floor. What is the force the person exerts on the floor, and what is the floor's reaction?","a":"The person presses down with weight 50 x 10 = 500 N (taking g = 10). The floor pushes up on the person with 500 N. Those two forces are the action-reaction pair."}},{"title":"Friction matches what you push with, up to a limit","analogy":"A sticky table. Push gently and the friction pushes back just as hard. Push harder and it still pushes back, but only up to a point. Past that point the object starts to slide, and friction drops to a smaller, steady value.","body":["Static friction grows to match your push, up to the maximum mu_s times the normal force. Kinetic friction, once sliding, is a fixed value mu_k times the normal force, usually a bit smaller.","Because kinetic friction is smaller than the maximum static friction, a sliding object is easier to keep sliding than to start."],"example":{"q":"A 5 kg block on a flat floor has mu_s = 0.4 and mu_k = 0.3 (g = 10). It is pushed with 15 N, then with 25 N. What happens?","a":"Maximum static friction is 0.4 x 50 = 20 N. At 15 N the block stays put and friction is 15 N. At 25 N it slides, friction is kinetic 0.3 x 50 = 15 N, and a = (25 - 15)/5 = 2 m/s^2."}},{"title":"Pseudo forces: the force you feel inside an accelerating frame","analogy":"You lean back when a bus pulls away. Nothing pushed you backward; the bus accelerated forward and your body wanted to stay where it was. Inside the bus, that tug looks like a real backward force.","body":["In a frame accelerating with a_0, an extra fictitious force -m a_0 appears. It is not caused by any object, which is why it is called pseudo. It lets you use Newton's laws inside the accelerating frame.","Pseudo forces are real as far as the observer inside the frame is concerned, but an observer outside the frame sees no such force."],"example":{"q":"A bus accelerates forward at 3 m/s^2. A pendulum bob hangs at rest relative to the bus. At what angle does the string tilt? (g = 10)","a":"Inside the bus the bob feels a backward pseudo force m x 3 and gravity m x 10 down. Balance gives tan(theta) = 3/10 = 0.3, so theta is about 17 degrees, tilted backward."}},{"title":"Your apparent weight changes in a lift","analogy":"A bathroom scale in a fast lift. Going up quickly, the scale reads more. Going down quickly, it reads less. In free fall it reads zero, and that is what astronauts feel.","body":["The scale reads the normal force the floor pushes with, not your mass. Accelerating up makes that force bigger: N = m(g + a). Accelerating down makes it smaller: N = m(g - a).","If the lift falls freely with a = g, N becomes zero. That is weightlessness, and nothing about gravity has changed."],"example":{"q":"A 60 kg person stands in a lift accelerating upward at 2 m/s^2 (g = 10). What does the scale read?","a":"N = 60 x (10 + 2) = 720 N, which is larger than the true weight of 600 N."}}]},"Work, Energy and Power":{"formulas":[{"eq":"W = F\\,s\\cos\\theta","use":"Work done by a constant force F over displacement s, at angle theta to it"},{"eq":"K = \\tfrac{1}{2}mv^{2}","use":"Kinetic energy of a body of mass m moving at speed v"},{"eq":"W_{net} = \\Delta K","use":"Work-energy theorem: net work changes the kinetic energy"},{"eq":"U_{g} = mgh","use":"Gravitational potential energy above a chosen reference level"},{"eq":"U_{s} = \\tfrac{1}{2}kx^{2}","use":"Energy stored in a spring stretched or compressed by x"},{"eq":"K + U = \\text{constant}","use":"Mechanical energy is conserved when only conservative forces do work"},{"eq":"F = -\\frac{dU}{dx}","use":"A conservative force is the negative slope of its potential energy"},{"eq":"P = \\frac{W}{t} = \\vec{F}\\cdot\\vec{v}","use":"Power: the rate of doing work, or force times velocity"},{"eq":"e = \\frac{v_2 - v_1}{u_1 - u_2}","use":"Coefficient of restitution for a collision, e = 1 elastic, e = 0 perfectly inelastic"}],"concepts":[{"title":"Work counts only the part of the push along the motion","analogy":"Carrying a heavy bag while walking flat. Your arms hold it up all the way, but they do no work on the bag, because the bag does not move up. Lift it up and you do work.","body":["Work is force times the displacement in the direction of the force. A force at right angles to the motion does no work. A force against the motion does negative work and takes energy away.","Only the component of force along the displacement matters, which is why the cosine appears."],"example":{"q":"A 10 N force acts at 60 degrees to a 5 m displacement. How much work does it do?","a":"W = 10 x 5 x cos 60 = 10 x 5 x 0.5 = 25 J."}},{"title":"Kinetic energy and the work-energy theorem","analogy":"A bank account for motion. The net work deposited or withdrawn equals the change in the balance. Every bit of net work shows up as a change in speed.","body":["Kinetic energy is half the mass times the speed squared, so doubling the speed quadruples the energy. That is why stopping a fast car takes so much more distance than a slow one.","The work-energy theorem holds for any net force, constant or not. You only need the start and end speeds."],"example":{"q":"A 2 kg body speeds up from 3 m/s to 7 m/s. What is the net work done on it?","a":"Change in K = (1/2) x 2 x (7^2 - 3^2) = 49 - 9 = 40 J. So the net work is 40 J."}},{"title":"Potential energy is stored, and only differences matter","analogy":"Winding up a toy car's spring, or lifting a book onto a shelf. The energy waits in the position, ready to come back out as motion.","body":["Gravitational potential energy depends on height above a reference level you choose. The choice of reference is arbitrary, so only changes in potential energy have physical meaning.","A spring stores energy that grows with the square of the stretch, so stretching twice as far stores four times as much energy."],"example":{"q":"A 0.5 kg book is lifted 2 m. How much potential energy does it gain? (g = 10)","a":"U = m g h = 0.5 x 10 x 2 = 10 J."}},{"title":"Mechanical energy is conserved when friction is absent","analogy":"A roller coaster trading height for speed. At the top it has energy stored as height; at the bottom that energy has become motion. The total stays the same, unless friction takes a cut.","body":["When only conservative forces such as gravity and springs do work, kinetic plus potential energy stays constant. This lets you find speeds without tracking the path.","If friction or air resistance acts, mechanical energy drops by the work those forces do. Always check whether a non-conservative force is present before using conservation."],"example":{"q":"A block slides down a smooth 5 m high slope from rest. What is its speed at the bottom? (g = 10)","a":"m g h = (1/2) m v^2, so v = sqrt(2 g h) = sqrt(100) = 10 m/s. The mass cancels, so the answer is the same for any mass."}},{"title":"Power is how fast the work happens","analogy":"Two people carry the same bricks up the same stairs. The one who finishes first is using more power, even though both did the same work.","body":["Power is the rate of doing work. A car climbing a hill at a fixed speed needs more power than on flat ground, because the engine must push against gravity all the time.","Power is also force times velocity, which is why the same engine feels weak in a high gear at low speed."],"example":{"q":"A 1000 kg car climbs 10 m in 5 s at steady speed. What power does the engine deliver? (g = 10)","a":"Work = m g h = 1000 x 10 x 10 = 100000 J. Power = 100000 / 5 = 20000 W = 20 kW."}},{"title":"Collisions: momentum always, energy only sometimes","analogy":"A bouncy ball gives back most of the speed it had. A lump of clay gives back none. The coefficient of restitution measures how bouncy the collision is.","body":["In any collision momentum is conserved. Kinetic energy is conserved only for an elastic collision, where e = 1. Some kinetic energy turns into heat and sound in a real collision, so e is less than 1.","A perfectly inelastic collision, e = 0, is the case where the two bodies stick together after impact."],"example":{"q":"A ball dropped from 2 m rebounds to 1.28 m. What is e?","a":"The speeds before and after scale as the square roots of the heights: e = sqrt(1.28/2) = sqrt(0.64) = 0.8."}}]},"Gravitation":{"formulas":[{"eq":"F = \\frac{G\\,m_1 m_2}{r^{2}}","use":"Newton's law of gravitation between two masses a distance r apart"},{"eq":"g = \\frac{GM}{R^{2}}","use":"Gravitational field at the surface of a planet of mass M and radius R"},{"eq":"g_h = g\\left(\\frac{R}{R+h}\\right)^{2}","use":"Value of g at height h above the surface"},{"eq":"g_d = g\\left(1-\\frac{d}{R}\\right)","use":"Value of g at depth d below the surface (uniform planet)"},{"eq":"U = -\\frac{G M m}{r}","use":"Gravitational potential energy, zero at infinity"},{"eq":"v_o = \\sqrt{\\frac{GM}{r}}","use":"Speed for a circular orbit of radius r"},{"eq":"v_e = \\sqrt{\\frac{2GM}{R}} = \\sqrt{2gR}","use":"Escape speed from the surface of a planet"},{"eq":"T = 2\\pi\\sqrt{\\frac{r^{3}}{GM}}","use":"Orbital period; T squared is proportional to r cubed (Kepler's third law)"},{"eq":"E = -\\frac{GMm}{2r}","use":"Total energy of a body in a circular orbit"}],"concepts":[{"title":"Gravity pulls on everything, and weakens with distance","analogy":"Think of a heavy ball on a stretched trampoline. It dips, and anything nearby rolls toward it. The farther away you are, the shallower the dip you feel.","body":["Every two masses attract each other. The force falls off as the inverse square of the distance, so doubling the separation cuts the pull to a quarter.","G is very small, about 6.67 x 10^-11, so gravity between everyday objects is tiny. It matters only when at least one of the masses is a planet or a star."],"example":{"q":"Two 1000 kg cars are 1 m apart. What is the gravitational force between them?","a":"F = G m1 m2 / r^2 = 6.67 x 10^-11 x 10^6 / 1 = 6.67 x 10^-5 N. Far too small to notice."}},{"title":"g is not the same everywhere","analogy":"Standing on a mountain or in a deep mine. On the mountain you are farther from the planet's centre, so the pull is weaker. In the mine, the rock above you pulls the other way and cancels part of the pull.","body":["Above the surface, g falls with the inverse square of the distance from the centre. Inside a uniform planet, only the inner part attracts you, so g falls linearly with depth and reaches zero at the centre.","The value of g is the gravitational field, and weight is m times g. Weight therefore changes slightly from place to place."],"example":{"q":"What is g at a height equal to the planet's radius R?","a":"g_h = g (R / (R + R))^2 = g x (1/2)^2 = g/4. With g = 10 that is 2.5 m/s^2."}},{"title":"Orbits are falling that keeps missing","analogy":"Newton's cannon. Fire a cannonball flat from a very high mountain. The faster it goes, the farther it lands. If it is fast enough, the ground curves away as fast as it falls, and it never lands. That is an orbit.","body":["A satellite in a circular orbit is always falling toward the planet, but its sideways speed carries it around. The required speed is sqrt(GM/r), so higher orbits are slower.","Speed and period depend only on the planet's mass and the orbit's radius, not on the satellite's mass."],"example":{"q":"What is the speed of a satellite skimming just above Earth's surface? Use g = 9.8 and R = 6.4 x 10^6 m.","a":"v = sqrt(g R) = sqrt(9.8 x 6.4 x 10^6) = sqrt(6.27 x 10^7), about 7.9 km/s."}},{"title":"Escape speed: a throw that never comes back","analogy":"Throwing a ball so hard it leaves the planet's pull for good. You do not need to aim beyond the right speed; any direction works, because the planet's pull weakens in every direction the same way.","body":["Escape speed is sqrt(2 g R), about 11.2 km/s for Earth. It does not depend on the escaping object's mass.","Escape speed is sqrt(2) times the orbital speed at the same distance. Kinetic energy must cover the whole climb out of the potential well."],"example":{"q":"Show that escape speed is sqrt(2) times the speed of a skimming orbit.","a":"v_e / v_o = sqrt(2 GM/R) / sqrt(GM/R) = sqrt(2)."}},{"title":"Kepler's third law: farther means slower and longer","analogy":"A runner on an outer lane covers more ground in the same time, but the planets farther out have a larger loop to complete at a slower pace. Overall they take much longer for one lap around the Sun.","body":["For orbits around the same central body, T squared is proportional to r cubed. Doubling the radius makes the period about 2.8 times longer.","This law holds for any circular orbit around a given mass, and it is the reason outer planets have longer years."],"example":{"q":"A satellite's orbit radius is 4 times that of another. How do their periods compare?","a":"T is proportional to r^(3/2). T2/T1 = 4^(3/2) = 8. The outer satellite takes 8 times as long."}},{"title":"Geostationary satellites hang over one spot","analogy":"A spinning top that seems to sit still. A geostationary satellite goes around once every 24 hours, exactly as fast as Earth turns, so from the ground it seems fixed above the equator.","body":["The satellite must orbit in the equatorial plane with a period of 24 hours. That fixes its radius at about 42,000 km from Earth's centre, roughly 36,000 km above the surface.","This is why TV and communication satellites sit in this one special orbit."],"example":{"q":"Using T = 24 h, roughly how far is a geostationary satellite from Earth's centre? (GM = 4 x 10^14 m^3/s^2)","a":"r^3 = G M T^2 / (4 pi^2). T = 8.64 x 10^4 s gives r^3 about 7.5 x 10^22, so r is about 4.2 x 10^7 m, or 42,000 km."}}]},"Rotational Motion":{"formulas":[{"eq":"\\vec{\\tau} = \\vec{r}\\times\\vec{F}, \\quad \\tau = rF\\sin\\theta","use":"Torque: the turning effect of a force about an axis"},{"eq":"\\tau = I\\alpha","use":"Rotational form of Newton's second law"},{"eq":"I = \\sum m_i r_i^{2}","use":"Moment of inertia: how the mass is spread about the axis"},{"eq":"I = I_{cm} + Md^{2}","use":"Parallel axis theorem, d is the distance between the two parallel axes"},{"eq":"I_{disc} = \\tfrac{1}{2}MR^{2}, \\quad I_{ring} = MR^{2}","use":"Moments of inertia about the central axis"},{"eq":"I_{sphere} = \\tfrac{2}{5}MR^{2}, \\quad I_{rod,\\,end} = \\tfrac{1}{3}ML^{2}","use":"Solid sphere about its centre, and a thin rod about one end"},{"eq":"\\vec{L} = I\\vec{\\omega}","use":"Angular momentum; conserved when the external torque is zero"},{"eq":"K_{rot} = \\tfrac{1}{2}I\\omega^{2}","use":"Kinetic energy of a body spinning about a fixed axis"},{"eq":"v = R\\omega","use":"Rolling without slipping: speed of the centre equals R times the angular speed"},{"eq":"a = \\frac{g\\sin\\theta}{1 + I/(MR^{2})}","use":"Acceleration of a rolling body down a rough incline"}],"concepts":[{"title":"Torque: a push works better far from the hinge","analogy":"Opening a door. Push near the hinge and it barely moves. Push at the handle, far from the hinge, and it swings easily. The same force gives more turning effect at a larger distance.","body":["Torque is the force times the perpendicular distance from the axis to the line of the force. A force pointing straight at the axis gives no torque, however hard it pushes.","Only the component of force perpendicular to the lever arm turns the body, which is why the sine of the angle appears."],"example":{"q":"A 20 N force acts 0.5 m from the axis. What is the torque if the force is (a) perpendicular, (b) at 30 degrees to the lever arm?","a":"(a) tau = 20 x 0.5 = 10 N m. (b) tau = 20 x 0.5 x sin 30 = 5 N m."}},{"title":"Moment of inertia: rotation depends on where the mass sits","analogy":"A figure skater spinning with arms out, then pulling them in. Arms out means mass far from the spin axis, a big moment of inertia, slow spin. Arms in means mass near the axis, small moment of inertia, fast spin.","body":["Moment of inertia plays the role of mass in rotation. It depends on the mass and on how far each piece is from the axis, as the square of that distance.","Two bodies with the same mass can have very different moments of inertia. A hoop resists spinning more than a solid disc of the same mass and radius."],"example":{"q":"Two 1 kg masses sit 1 m from an axis on a light rod. What is I? A solid disc of mass 2 kg and radius 0.5 m is spun about its centre; what is its I?","a":"Rod: I = 1 x 1^2 + 1 x 1^2 = 2 kg m^2. Disc: I = (1/2) x 2 x 0.5^2 = 0.25 kg m^2."}},{"title":"Newton's second law for rotation: tau = I alpha","analogy":"The same push on a heavy wheel and a light one. The light one spins up quickly; the heavy one resists. Torque drives angular acceleration, and moment of inertia resists it.","body":["The angular acceleration is the torque divided by the moment of inertia. Doubling the torque doubles the angular acceleration, while doubling I halves it.","The equation looks the same as F = ma, with torque for force, I for mass and alpha for acceleration."],"example":{"q":"A net torque of 10 N m acts on a body with I = 2 kg m^2 starting from rest. What is its angular acceleration?","a":"alpha = tau / I = 10 / 2 = 5 rad/s^2."}},{"title":"Angular momentum is conserved when no external torque acts","analogy":"The skater again. Pulling the arms in reduces I, so the spin speeds up to keep I times omega fixed. Nothing pushed her; she simply redistributed her mass.","body":["Angular momentum is I times omega. When the net external torque is zero, it stays constant, however the body changes shape.","This explains a lot: a spinning top stays upright, a diver tucks to spin faster, and a planet speeds up when it moves closer to the Sun."],"example":{"q":"A skater has I = 4 kg m^2 and spins at 2 rad/s. She pulls her arms in, so I becomes 2 kg m^2. What is her new spin rate?","a":"I1 omega1 = I2 omega2, so 4 x 2 = 2 x omega2, giving omega2 = 4 rad/s."}},{"title":"Rolling without slipping: the contact point is at rest","analogy":"A wheel rolling along the road. The point touching the road is momentarily still, while the top of the wheel moves at twice the speed of the centre. Rolling is a spin and a shift happening together.","body":["Rolling without slipping links the centre's speed to the spin: v = R omega. Its kinetic energy has two parts, the motion of the centre and the spin about it.","For a solid cylinder or disc, the total kinetic energy is 3/4 of M v^2, because the spin takes up half of the translational share."],"example":{"q":"A solid cylinder of mass 2 kg and radius 0.3 m rolls with omega = 10 rad/s. Find its speed and total kinetic energy.","a":"v = R omega = 0.3 x 10 = 3 m/s. I = (1/2) x 2 x 0.3^2 = 0.09 kg m^2. Kinetic energy = (1/2) x 2 x 3^2 + (1/2) x 0.09 x 10^2 = 9 + 4.5 = 13.5 J, which equals (3/4) x 2 x 3^2."}},{"title":"Parallel axis theorem: shifting the axis","analogy":"Spinning a rod about its middle is easy. Spinning the same rod about one end is harder, because all its mass sits farther from the axis. The theorem gives the extra cost of moving the axis.","body":["Moment of inertia about any axis parallel to one through the centre of mass is I_cm plus M d^2, where d is the distance between the axes.","This saves work: find I about the centre once, then shift it to any parallel axis with one addition."],"example":{"q":"A 3 kg rod of length 1 m has I about its centre of 3 x 1^2 / 12 = 0.25 kg m^2. Find I about one end.","a":"I_end = I_cm + M (L/2)^2 = 0.25 + 3 x 0.5^2 = 0.25 + 0.75 = 1.0 kg m^2, which matches M L^2 / 3."}},{"title":"Why a hollow ball loses to a solid one on a slope","analogy":"A race down a ramp between a solid ball and a hollow ball of the same size. The solid one wins. Its mass is closer to the centre, so less of its energy goes into spinning, and more into going forward.","body":["A body with a small I/(MR^2) gets more of its gravitational energy as motion of its centre, so it accelerates faster down the incline. Rolling is slower than sliding, because some energy goes into spin.","Acceleration is g sin theta divided by (1 + I/(MR^2)). A solid sphere has I/(MR^2) = 2/5, giving a = (5/7) g sin theta."],"example":{"q":"A solid sphere and a hollow sphere of the same mass and radius roll down the same incline. Compare their accelerations.","a":"Solid: a = g sin theta / 1.4 = 0.714 g sin theta. Hollow (I = 2/3 MR^2): a = g sin theta / 1.67 = 0.6 g sin theta. The solid sphere is faster."}}]},"Current Electricity":{"formulas":[{"eq":"I = \\frac{Q}{t}","use":"Electric current: charge passing a point per unit time"},{"eq":"V = IR","use":"Ohm's law for a conductor at constant temperature"},{"eq":"R = \\rho\\frac{L}{A}","use":"Resistance of a wire of length L, area A and resistivity rho"},{"eq":"I = nev_dA","use":"Current from the drift velocity, n free electrons per m^3 and cross-section A"},{"eq":"R_{series} = R_1 + R_2 + \\cdots","use":"Resistors in series share the same current"},{"eq":"\\frac{1}{R_{parallel}} = \\frac{1}{R_1} + \\frac{1}{R_2} + \\cdots","use":"Resistors in parallel share the same voltage"},{"eq":"P = VI = I^{2}R = \\frac{V^{2}}{R}","use":"Electrical power dissipated in a resistor"},{"eq":"V = E - Ir","use":"Terminal voltage of a cell with internal resistance r"},{"eq":"\\frac{P}{Q} = \\frac{R}{S}","use":"Wheatstone bridge is balanced (no current through the galvanometer)"},{"eq":"\\tau = RC","use":"Time constant of an RC circuit; charge grows as 1 - e^(-t/RC)","oos":true}],"concepts":[{"title":"Current is the rate of flow of charge, not the speed of electrons","analogy":"A crowd shuffling through a long corridor. Each person moves slowly, but a signal like a shout passes the whole crowd almost instantly. The electrons drift slowly; the effect of the push travels at nearly the speed of light.","body":["Current is the charge crossing a cross-section per unit time. Conventional current is taken in the direction a positive charge would move, opposite to the electron flow.","The drift speed of electrons in a copper wire is typically well under a millimetre per second, yet a bulb lights the moment a switch closes."],"example":{"q":"A wire carries 2 A for 10 s. How much charge flows, and how many electrons is that?","a":"Q = I t = 2 x 10 = 20 C. Electrons = 20 / (1.6 x 10^-19), about 1.25 x 10^20."}},{"title":"Resistance depends on the material and the shape","analogy":"Water in a pipe. A long, narrow pipe resists flow more than a short, wide one. Resistance is the pipe's shape and material rolled into a single number.","body":["Resistance rises with length and falls with cross-sectional area. Resistivity rho is a property of the material itself, and it also changes with temperature.","For most metals resistance grows as temperature rises, because the atoms vibrate more and scatter the drifting electrons. Use R_t = R_0 (1 + alpha Delta T) for small changes."],"example":{"q":"A copper wire is 2 m long with area 1.0 x 10^-6 m^2, and rho = 1.7 x 10^-8 ohm m. What is its resistance?","a":"R = rho L / A = 1.7 x 10^-8 x 2 / 1.0 x 10^-6 = 0.034 ohm."}},{"title":"Series adds the resistances, parallel adds the currents","analogy":"Series is one long road with a toll at each stretch, so the tolls add up. Parallel is several lanes side by side, so more lanes let more traffic through and the total resistance falls.","body":["In se
