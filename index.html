// A sheet for detail views, in the app's own style.
// It owns one browser-history step while open, so the Back button closes the sheet instead of leaving it stranded.
const adminSheetStack = [];   // open sheets, the top one last
let adminSheetPopSkip = 0;    // history.back() calls we started ourselves, which popstate must ignore
function adminSheet(eyebrow, title, build){
  const scrim = el('<div class="scrim ad-detail-scrim"></div>');
  const sheet = el('<div class="sheet ad-detail" role="dialog" aria-modal="true"><div class="grab"></div>'
    +'<div class="eyebrow">'+esc(eyebrow)+'</div><h2 class="ad-d-title">'+esc(title)+'</h2><div class="ad-d-body"></div></div>');
  const body = sheet.querySelector('.ad-d-body');
  let closed = false, pushed = false;
  const entry = { popClose: ()=>finish(true) };
  function finish(fromPop){
    if(closed) return; closed = true;
    scrim.remove(); sheet.remove(); document.removeEventListener('keydown', onKey);
    const i = adminSheetStack.indexOf(entry); if(i > -1) adminSheetStack.splice(i, 1);
    // closed by a button, the scrim or Escape: also remove the history step this sheet added
    if(!fromPop && pushed){ adminSheetPopSkip++; try{ history.back(); }catch(e){ adminSheetPopSkip--; } }
  }
  const close = ()=>finish(false);
  function onKey(e){ if(e.key==='Escape' && adminSheetStack[adminSheetStack.length-1]===entry) close(); }
  scrim.onclick = close;
  if(typeof setNavOpen === 'function') setNavOpen(false);   // the menu never stays open behind a sheet
  build(body, close);
  if(closed) return close;
  document.addEventListener('keydown', onKey);
  document.body.appendChild(scrim); document.body.appendChild(sheet);
  adminSheetStack.push(entry);
  try{ history.pushState(Object.assign({}, history.state || window.__lastTorqState || {torq:1}), ''); pushed = true; }catch(e){}
  return close;
}

      if(before.note !== (patch.admin_note || '')) changes.push(['note', before.note, patch.admin_note || '']);
      if(changes.length){

function weekStartOf(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
function digestCard(reports){
  const now = weekStartOf(new Date());

  reports.forEach(r=>{
    if(!r.created_at) return;
    const ws = weekStartOf(new Date(r.created_at)).getTime();
    const hit = weeks.find(w=>w.start.getTime()===ws); if(hit) hit.n++;
  });
  const max = Math.max(1, ...weeks.map(w=>w.n));
  const total = weeks.reduce((a,w)=>a+w.n,0);
  const card = el('<div class="card ad-digest"><div class="eyebrow">Weekly digest</div><p class="note-line">'+total+' reports across the last eight weeks.</p><div class="ad-trend"></div></div>');
  const trend = card.querySelector('.ad-trend');

function filteredReports(){
  const q = (adminState.q||'').trim().toLowerCase();
  return reportSort((adminState.reports||[]).filter(r=>{
    if(adminState.status !== 'all' && reportStatus(r) !== adminState.status) return false;
    if(!q) return true;
    const hay = [r.subject, r.chapter, r.topic, r.note, r.admin_note, reportReasons(r).map(reasonLabel).join(' ')].join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  }));
}

function fmtLeft(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60), sec = t%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

const reduceMotion = ()=> window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function eyeCard(r){
  if(!r.seen_at){
    const c = el('<div class="eye-card sealed"><div class="eye-seal" aria-hidden="true"><span>T</span></div>'
      +'<div class="eye-meta">Sealed · from the TORQ team</div>'
      +'<p class="eye-lede">A reply is waiting for you.</p>'
      +'<p class="eye-warn">Break the seal and the 24-hour clock starts. Then it burns.</p></div>');
    const open = el('<button class="btn block eye-open" type="button">Break the seal</button>');
    open.onclick = ()=>{
      if(reduceMotion()){ openEye(r); return; }
      open.disabled = true;
      c.classList.add('breaking');
      setTimeout(()=>openEye(r), 470);
    };
    c.appendChild(open);
    return c;
  }
  const exp = r.expires_at || new Date(Date.parse(r.seen_at)+EYES_WINDOW_MS).toISOString();
  const ms = Date.parse(exp) - Date.now();
  const card = el('<div class="eye-card opened'+(ms < 3600000 ? ' urgent' : '')+'"><div class="eye-meta">From the TORQ team · opened '+esc(fmtWhen(r.seen_at))+'</div>'
    +'<p class="eye-body">'+esc(r.body)+'</p>'
    +'<div class="eye-timer"><div class="eye-fuse"><i data-fuse="'+esc(r.id)+'" data-exp="'+esc(exp)+'"></i></div>'
    +'<div class="eye-clock" data-clock="'+esc(r.id)+'" data-exp="'+esc(exp)+'">'+fmtLeft(ms)+'</div>'
    +'<small>until it burns</small></div></div>');
  const burn = el('<button class="btn secondary small eye-burnnow" type="button">Let it burn now</button>');
  burn.onclick = async ()=>{
    const ok = await appDialog({eyebrow:'For your eyes only', title:'Let it burn now?', body:'This reply disappears for good. You will not be able to read it again.', ok:'Burn it', cancel:'Keep it', danger:true});
    if(ok) burnEye(r.id);
  };
  card.appendChild(burn);
  card.appendChild(threadPart(r));
  return card;
}
function threadPart(r){
  const box = el('<div class="eye-thread"><div class="eye-thread-title">Write back</div><div class="eye-thread-list"></div></div>');
  const list = box.querySelector('.eye-thread-list');
  const ta = el('<textarea class="ad-reply eye-thread-input" rows="3" maxlength="1000" placeholder="Write back. The team sees it under this reply."></textarea>');
  const send = el('<button class="btn secondary block" type="button">Send reply</button>');
  box.appendChild(ta); box.appendChild(send);
  const draw = items=>{
    list.innerHTML = '';
    if(!items.length){ list.appendChild(el('<p class="eye-thread-empty">Nothing sent yet.</p>')); return; }
    items.forEach(t=> list.appendChild(el('<div class="eye-thread-msg"><small>'+esc(fmtWhen(t.created_at))+'</small><p>'+esc(t.body)+'</p></div>')));
  };
  draw([]);
  sbClient().from('eye_thread').select('*').eq('reply_id', String(r.id)).order('created_at',{ascending:true})
    .then(({data,error})=>{ if(!error) draw(data||[]); });
  send.onclick = async ()=>{
    const body = ta.value.trim();
    if(!body){ appNotice('Nothing to send', 'Write a line first.'); return; }
    send.disabled = true;
    const { error } = await sbClient().from('eye_thread').insert({reply_id:String(r.id), user_id:sbSession.user.id, body:body});
    send.disabled = false;
    if(error){ appNotice('Not sent', error.message); return; }
    ta.value = '';
    const { data } = await sbClient().from('eye_thread').select('*').eq('reply_id', String(r.id)).order('created_at',{ascending:true});
    draw(data || []);
  };
  return box;
}
let eyesTimer = null;
function startEyesTicker(){
  if(eyesTimer) clearInterval(eyesTimer);

}
function tickEyes(){
  if(view !== 'eyes'){ clearInterval(eyesTimer); eyesTimer = null; return; }
  document.querySelectorAll('[data-clock]').forEach(n=>{
    const ms = Date.parse(n.dataset.exp) - Date.now();
    n.textContent = fmtLeft(ms);
    const cardEl = n.closest('.eye-card'); if(cardEl) cardEl.classList.toggle('urgent', ms < 3600000);
    const fuse = document.querySelector('[data-fuse="'+n.dataset.clock+'"]');
    if(fuse) fuse.style.width = Math.max(0, Math.min(100, ms/EYES_WINDOW_MS*100)) + '%';
    if(ms <= 0 && !n.dataset.burning){ n.dataset.burning = '1'; burnEye(n.dataset.clock); }
  });
}

function contactForm(){
  const card = el('<div class="card"><div class="eyebrow">Contact us</div><p class="note-line" style="margin:6px 0 12px">Send us a question or a problem. We use your details only to reply to you.</p></div>');

    +'<label class="pf"><span class="eyebrow">Email</span><input name="email" type="email" maxlength="120" placeholder="you@example.com"></label>'
    +'<label class="pf"><span class="eyebrow">Phone <small style="opacity:.6">(optional)</small></span><input name="phone" type="tel" maxlength="20" placeholder="+91 98765 43210"></label>'
    +'<label class="pf"><span class="eyebrow">Comment</span><textarea name="message" maxlength="1000" placeholder="Tell us what is on your mind"></textarea></label>'
    +'<p class="note-line err" hidden></p>'
    +'<button class="btn block" type="submit">Send message</button>';
  const err = f.querySelector('.err'), btn = f.querySelector('button[type="submit"]');
  const fail = m=>{ err.textContent = m; err.hidden = false; };
  f.onsubmit = async e=>{
    e.preventDefault();
    const v = n=>f.querySelector('[name="'+n+'"]').value.trim();
    const name = v('name'), email = v('email'), phone = v('phone'), message = v('message');
    if(!name) return fail('Please enter your name.');
    if(!/^\S+@\S+\.\S+$/.test(email)) return fail('Enter a valid email address.');
    if(phone && !/^\+?[0-9 ()-]{7,20}$/.test(phone)) return fail('Enter a valid phone number, or leave it empty.');
    if(message.length < 5) return fail('Please write a short comment.');
    const db = sbClient();
    if(!db) return fail('Sending is unavailable right now. Check your connection and try again.');
    btn.disabled = true; err.hidden = true;
    const { error } = await db.from('contact_messages').insert({ name, email, phone: phone || null, message, user_id: sbSession ? sbSession.user.id : null });
    btn.disabled = false;
    if(error) return fail('Could not send: ' + error.message);
    f.reset();
    btn.textContent = 'Sent. Thank you.';
    setTimeout(()=>{ btn.textContent = 'Send message'; }, 2600);
  };
  card.appendChild(f);
  return card;
}

// Wide screens: the question sits on the left, the options and the Sure / Guessing choice on the right.
// The page then fits without scrolling. Phones and narrow tablets keep the single column.
function splitQuestionCard(card){
  if(!window.matchMedia('(min-width:1100px)').matches) return card;
  const right = el('<div class="qside qside-r"></div>'), left = el('<div class="qside qside-l"></div>');
  [...card.children].forEach(k=>{
    const isRight = k.matches('.opt, .sog-head, .chips, .mock-sog, .numpad, .qopts');
    (isRight ? right : left).appendChild(k);
  });
  card.appendChild(left); card.appendChild(right);
  card.classList.add('qsplit');
  return card;
}
function pyqPractice(w){
  const q = session.queue[session.idx];
  const a = session.answers[q.id];
  const reviewing = !!session.review;
  const locked = !!(a && a.pending);                       // chosen, waiting for submit
  const answered = reviewing || !!(a && !a.skip && !a.pending);   // reveal only when reviewing or submitted
  const hasAns = !!(a && !a.skip && a.sel!=null && a.sel!=='');
  const isOk = hasAns && (a.correct!=null ? !!a.correct : (q.type==='integer' ? sameAnswer(a.sel,q.answer) : a.sel===q.correct));
  const sk = reviewing && !hasAns;   // skipped: yellow, never red
  const n = session.queue.length;
  const elapsed = answered && a && a.time!=null ? a.time : Math.floor((Date.now()-qStartOf(q))/1000);
  const left = 120 - elapsed;
  const fresh = !!(answered && a.at && Date.now()-a.at < 900);
  const doneCount = session.queue.filter(x=>{ const y=session.answers[x.id]; return y && !y.skip; }).length;
  w.appendChild(topRow(session.title, '<span class="tag">'+(session.idx+1)+' / '+n+'</span>',
    ()=>requestLeave(exitSession)));
  w.appendChild(el('<div class="progress"><i style="width:'+Math.round((session.idx+1)/n*100)+'%"></i></div>'));
  const over = !answered && left<0, warn = !answered && left<=20 && left>=0;
  const glow = Math.min(1, Math.max(0, (elapsed-120)/120)).toFixed(2);   // grows the longer the student runs over
  w.appendChild(el('<div class="qclock'+(over?' over':(warn?' warn':''))+'" style="--glow:'+glow+'">'
    +'<svg viewBox="0 0 44 44" aria-hidden="true"><circle class="qc-bg" cx="22" cy="22" r="18"/>'
    +'<circle id="qArc" class="qc-fg" cx="22" cy="22" r="18" style="stroke-dashoffset:'+ringOffset(elapsed)+'"/></svg>'
    +'<div class="qc-txt"><span id="qTimer">'+clockLabel(answered, elapsed, left)+'</span>'
    +'<small>'+(answered?'The exam expects this in under 2 minutes':'Aim to solve this in under 2 minutes')+'</small></div>'
    +'<div class="qc-pts">'+(session.points||0)+' pts</div></div>'));

  const card = el('<div class="card qcard" style="--bar:'+(SUBJ_VAR[q.subject]||'')+'"></div>');
  card.appendChild(el('<div class="tags"><span class="tag shift">'+q.year+' · '+SHIFT_NAME[q.shift]+'</span><span class="tag diff diff-'+q.difficulty.toLowerCase()+'">'+q.difficulty+'</span><span class="tag">'+esc(q.topic)+'</span>'+wtTag(q.subject,q.chapter)+'</div>'));
  card.appendChild(el('<div class="qtext">'+qtextHTML(q.text)+'</div>'));
  if(q.image) card.appendChild(qImage(q.image));

  if(!answered){
    const pre = session.conf[q.id] || '';
    card.appendChild(el('<div class="sog-head">'+sogMark()+'<div><div class="sog-title">Choose before you answer</div><div class="sog-req">Required. Skip if you are not attempting.</div></div></div>'));
    const cr0 = el('<div class="chips"></div>');
    [['sure','Sure'],['guess','Guessing']].forEach(p=>{
      const b = el('<button class="sog-choice sog-'+p[0]+(pre===p[0]?' on':'')+'" aria-pressed="'+(pre===p[0])+'"><span class="sog-ico">'+(p[0]==='sure'?'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6M12 17h.01"/></svg>')+'</span><span>'+p[1]+'</span></button>');
      b.onclick = ()=>{ session.conf[q.id] = pre===p[0] ? null : p[0]; render(); };
      cr0.appendChild(b);
    });
    card.appendChild(cr0);
  }

  if(q.type==='integer'){
    const val = (answered || locked) ? String(a.sel||'') : (session.draft[q.id]||'');
    const state = answered && !sk ? (isOk?'ok':'bad') : '';
    card.appendChild(numpad(q, val, v=>{ session.draft[q.id]=v; render(); },
      ()=>{ const v = session.draft[q.id]; if(v) answerNumeric(v); }, answered || locked, state));
  } else q.options.forEach((o,i)=>{
    const picked = (answered || locked) && a && a.sel===i;
    const cls = answered ? (sk ? (i===q.correct ? 'skipans' : '') : (i===q.correct ? 'ok' : (picked ? 'bad' : ''))) : (picked ? 'sel' : '');
    const row = el('<div class="opt '+cls+(fresh?' fx':'')+(q.optionImages && q.optionImages[i] ? ' hasimg' : '')+'"><span class="k">'+L(i)+'</span>'+optBody(q,i)+'</div>');
    if(!answered && !locked) row.onclick = ()=>answerPYQ(i);
    card.appendChild(row);
  });

  let noteTa = null;
  if(locked){
    card.appendChild(el('<div class="note">Your answer is locked in. It is marked when you submit this set.</div>'));
  } else if(!answered){
    if(q.hint){
      if(!session.hints[q.id]){
        const hb = el('<button class="linkish" style="margin-top:6px">Show hint</button>');
        hb.onclick = ()=>{ session.hints[q.id]=true; render(); };
        card.appendChild(hb);
      } else card.appendChild(el('<div class="hint">Hint: '+esc(q.hint)+'</div>'));
    }
    if(a && a.skip) card.appendChild(el('<div class="note skipnote">Skipped. Leaving a question you are unsure of is the right call. It still earns '+a.pts+' point.</div>'));
  } else {
    const ptsLine = (!reviewing && a.pts!=null) ? '<div class="ptsline">+'+a.pts+' points</div>' : '';
    const verdict = sk ? 'Skipped. The answer is '+answerLabel(q) : (isOk ? 'Correct' : 'Not quite. The answer is '+answerLabel(q));
    card.appendChild(el('<div class="note '+(sk?'skipped':(isOk?'ok':'bad'))+'"><div class="verdict">'+verdict+'</div>'+ptsLine+esc(q.explanation)+'</div>'));

    noteTa = el('<textarea placeholder="Add a note"></textarea>');
    noteTa.value = store.notes[q.id] || '';
    card.appendChild(el('<div class="field">Note</div>'));
    card.appendChild(noteTa);
    logicBlock(q, card);
    card.appendChild(el('<div class="field">My solution</div>'));
    const mysTa = el('<textarea placeholder="Your own, better way to solve this. Only you can see it."></textarea>');
    mysTa.value = (store.mySol && store.mySol[q.id]) || '';
    card.appendChild(mysTa);
    const mysBtn = el('<button class="linkish">Save my solution</button>');
    mysBtn.onclick = ()=>{ store.mySol = store.mySol || {}; const t = mysTa.value.trim(); if(t) store.mySol[q.id] = t; else delete store.mySol[q.id]; persist(); mysBtn.innerText = 'Saved'; };
    card.appendChild(mysBtn);
    mistakeMirrorUI(q, card);
    const saved = store.bookmarks.indexOf(q.id)>=0;
    const bmRow = el('<div class="row" style="justify-content:flex-start;margin-top:12px;padding:0;border:none"></div>');
    const bm = el('<button class="linkish">'+(saved?'★ Saved':'☆ Save for later')+'</button>');
    bm.onclick = ()=>{ saveNote(q.id, noteTa.value); toggleBookmark(q.id); };
    bmRow.appendChild(bm);
    const rp = el('<button class="linkish" style="margin-left:14px">⚑ Report</button>');
    rp.onclick = ()=>reportGate(q);
    bmRow.appendChild(rp);
    card.appendChild(bmRow);
  }

  const last = session.idx===n-1;
  const nv = el('<div class="qnav-row"></div>');
  const prev = el('<button class="btn secondary"'+(session.idx===0?' disabled':'')+'>Previous</button>');
  prev.onclick = ()=>goQ(session.idx-1);
  const skip = el('<button class="linkish"'+((answered||locked)?' style="visibility:hidden"':'')+'>Skip</button>');
  skip.onclick = ()=>skipQ();
  const next = el('<button class="btn">'+(reviewing ? (last?'Done':'Next') : (last?'Submit set':'Next'))+'</button>');
  next.onclick = ()=>{
    if(noteTa) saveNote(q.id, noteTa.value);
    if(reviewing){ if(last) exitReview(); else goQ(session.idx+1); return; }
    if(last) submitPractice(); else goQ(session.idx+1);
  };
  nv.appendChild(prev); nv.appendChild(skip); nv.appendChild(next);
  card.appendChild(nv);

  w.appendChild(card);
  if(!reviewing){
    const sub = el('<div style="margin-top:12px"></div>');
    const sb = el('<button class="btn secondary block">Submit this set</button>');
    sb.onclick = ()=>submitPractice();
    sub.appendChild(sb);
    sub.appendChild(el('<p class="note-line" style="margin:8px 4px 0">Answers are marked only when you submit. Until then you can change your mind by going back to the question.</p>'));
    w.appendChild(sub);
  }
  w.appendChild(qNavDrawer());
  return w;
}

// Sure or Guessing for mocks and custom tests. It is compulsory and recorded for analysis only: it never changes marks, points or the leaderboard.
function sogPicker(q){

function mockResults(w){
  const n = session.queue.length;
  let score=0, c=0, wr=0, sk=0;
  const bySub = {};
  session.queue.forEach(q=>{
    bySub[q.subject] = bySub[q.subject] || {score:0, max:0};
    bySub[q.subject].max += 4;
    const a = session.answers[q.id];
    if(!a){ sk++; return; }
    if(a.correct){ c++; score+=4; bySub[q.subject].score+=4; }
    else { wr++; score-=1; bySub[q.subject].score-=1; }
  });
  w.appendChild(el('<div class="hm-hero result-hero"><div class="hm-orbs" aria-hidden="true"><i></i><i></i></div><div class="hm-eyebrow">Your result'+nameSuffix()+'</div><h1 class="hm-title">'+esc(session.title)+'</h1></div>'));
  w.appendChild(ringMarks(score, n*4));
  w.querySelector('.resultcard').appendChild(el('<div class="note-line res-line">'+c+' correct · '+wr+' wrong · '+sk+' skipped</div>'));
  flair(w, Math.max(0,Math.round(score/(n*4)*100)), c+wr, 60);
  const sl = el('<div class="list"></div>');
  Object.keys(bySub).forEach(s=>{
    const d = bySub[s];
    sl.appendChild(el('<div class="row" style="cursor:default"><div class="name">'+esc(s)+'</div><div class="end" style="color:var(--text);font-weight:600">'+d.score+' / '+d.max+'</div></div>'));
  });
  w.appendChild(sl);
  w.appendChild(el('<div class="eyebrow" style="margin:22px 0 8px">Review</div>'));
  w.appendChild(reviewListEl());
}
function pyqResults(w){
  // Anything left untouched when the set ends is marked as skipped. Those earn no points; a deliberate skip earns 1.
  session.queue.forEach(q=>{
    if(session.answers[q.id]) return;
    session.answers[q.id] = {skip:true, auto:true, time:0, pts:0};
    if(session.title==='Question of the day'){ store.qotdSkip = store.qotdSkip || {}; store.qotdSkip[dayKey()] = q.id; persist(); }
  });
  const total = session.queue.length;
  const answered = session.queue.filter(q=>session.answers[q.id] && !session.answers[q.id].skip);
  const correct = answered.filter(q=>session.answers[q.id].correct).length;
  w.appendChild(el('<div class="hm-hero result-hero"><div class="hm-orbs" aria-hidden="true"><i></i><i></i></div><div class="hm-eyebrow">Session results'+nameSuffix()+'</div><h1 class="hm-title">'+esc(session.title)+'</h1></div>'));
  { const wrong = answered.filter(q=>!session.answers[q.id].correct).length;
    const marks = correct*4 - wrong, max = total*4;
    const mp = max>0 ? Math.round(marks/max*100) : 0;
    const acc = answered.length ? Math.round(correct/answered.length*100) : 0;
    w.appendChild(ringMarks(marks, max));
    w.querySelector('.resultcard').appendChild(el('<div class="note-line res-line">Accuracy '+acc+'% · '+correct+' of '+answered.length+' answered correct</div>'));
    flair(w, mp, answered.length, 75);
    if(mp>=80) w.appendChild(shareBtn('I scored '+marks+' out of '+max+' marks ('+mp+'%) on TORQ. JEE practice that works.'));
  }
  w.appendChild(el('<div class="stats">'
    +'<div class="stat"><div class="n">'+correct+'/'+total+'</div><div class="l">Correct</div></div>'
    +'<div class="stat"><div class="n">'+(answered.length?Math.round(correct/answered.length*100):0)+'%</div><div class="l">Accuracy</div></div>'
    +'<div class="stat"><div class="n">'+answered.length+'</div><div class="l">Answered</div></div></div>'));

  const byCh = {};
  answered.forEach(q=>{
    byCh[q.chapter] = byCh[q.chapter] || {c:0,t:0};
    byCh[q.chapter].t++; if(session.answers[q.id].correct) byCh[q.chapter].c++;
  });
  const keys = Object.keys(byCh);
  if(keys.length){
    const list = el('<div class="list"></div>');
    keys.forEach(k=>list.appendChild(barRow(k, Math.round(byCh[k].c/byCh[k].t*100), byCh[k].c+' of '+byCh[k].t+' correct')));
    w.appendChild(list);
  }
  const wrong = answered.filter(q=>!session.answers[q.id].correct);
  if(wrong.length){
    const rb = el('<button class="btn block" style="margin-top:6px">Practice the '+wrong.length+' wrong one'+(wrong.length>1?'s':'')+'</button>');
    rb.onclick = ()=>startSession({mode:'redo', title:'Redo: '+session.title, queue:sortQs(wrong)});
    w.appendChild(rb);
  }
}

let qotdOpen = false;
function streakStrip(){

// The question for a given day, the same for every user that day
function qotdFor(d){
  if(!QUESTIONS.length) return null;
  const pinned = store.qotdPick && store.qotdPick[d];
  if(pinned && QMAP[pinned]) return QMAP[pinned];
  return QUESTIONS[seed('qotd-'+d) % QUESTIONS.length];
}
// Days on which the question of the day was answered (right or wrong). A skip does not count.
function qotdDays(){
  const set = new Set();
  store.attempts.forEach(a=>{ const q = qotdFor(a.d); if(q && a.q===q.id && !a.skipped && a.c!==null) set.add(a.d); });
  return set;
}
// 'ok' | 'bad' | 'skip' | null for a given day
function qotdState(d){
  const q = qotdFor(d); if(!q) return null;
  let last = null;
  store.attempts.forEach(a=>{ if(a.q===q.id && a.d===d) last = a; });
  if(last && last.skipped) return 'skip';
  if(last) return last.c ? 'ok' : 'bad';
  if(store.qotdSkip && store.qotdSkip[d]===q.id) return 'skip';
  return null;
}
function qotdCard(){
  if(!QUESTIONS.length) return el('<div></div>');
  const q = qotdFor(dayKey());
  if(q){ store.qotdPick = store.qotdPick || {}; if(!store.qotdPick[dayKey()]){ store.qotdPick[dayKey()] = q.id; persist(); } }
  const st = qotdState(dayKey());
  const c = el('<div class="card qotd'+(st?' st-'+st:'')+'"><div class="eyebrow">Question of the day</div>'
    +'<div class="tags"><span class="tag subj subj-'+q.subject.toLowerCase()+'">'+esc(q.subject)+'</span>'
    +'<span class="tag shift">'+esc(q.year+' · '+SHIFT_NAME[q.shift])+'</span>'
    +'<span class="tag diff diff-'+q.difficulty.toLowerCase()+'">'+esc(q.difficulty)+'</span>'+wtTag(q.subject,q.chapter)+'</div>'
    +'<div class="qtext qclamp">'+qtextHTML(q.text)+'</div></div>');
  if(qotdOpen) c.appendChild(el('<div class="note">Answer: '+esc(answerLabel(q))+'. '+esc(q.explanation)+'</div>'));
  const actions = el('<div class="qotd-actions"></div>');
  const rv = el('<button class="btn secondary small">'+(qotdOpen?'Hide answer':'Reveal answer')+'</button>');
  rv.onclick = ()=>{ qotdOpen = !qotdOpen; render(); };
  const tr = el('<button class="btn small">Try it</button>');
  tr.onclick = ()=>startSession({mode:'pyq', title:'Question of the day', queue:[q]});
  if(!st){ actions.appendChild(tr); }
  actions.appendChild(rv);
  c.appendChild(actions);
  if(st){ const lab = {ok:'Answered correctly', bad:'Answered wrong', skip:'Skipped'}[st]; c.appendChild(el('<div class="qotd-status st-'+st+'">'+lab+'</div>')); }
  const wrap = el('<div></div>');
  wrap.appendChild(c);
  wrap.appendChild(el('<div class="qotd-rule"><b>Keep your streak:</b> answer today\u2019s question, right or wrong. Skipping it or missing the day breaks the streak. The easiest way is to open it first thing.</div>'));
  return wrap;
}

// A day counts once, the first time the whole daily set is answered
function checkDailyDone(){

  const t = dayKey();

function qStartOf(q){
  if(!session.started) session.started = {};
  if(!session.started[q.id]) session.started[q.id] = Date.now();
  return session.started[q.id];
}
function clockLabel(answered, elapsed, left){

function ringOffset(sec){ return (113*(1-Math.min(1, sec/120))).toFixed(1); }
// Practice-set points (separate from the JEE score, which is unchanged).
// Correct and sure: 6. Correct and guessing: 3. Up to +2 speed bonus for correct answers (under 2 minutes).
// Wrong and sure: -1. Wrong and guessing: -3. Skipping gives +1 (set in skipQ).
// Top ranks taper the points for correct answers only; penalties are never tapered.
// Top ranks taper slightly so the leaderboard rewards steady consistency over time.
function rankMult(){
  const r = store.lbRank;
  if(!r) return 1;
  if(r===1) return 0.8;
  if(r<=3) return 0.85;
  if(r<=10) return 0.9;
  if(r<=25) return 0.95;
  return 1;
}
function scoreFor(ok, conf, sec){
  if(!ok) return conf==='sure' ? -1 : -3;
  const speed = Math.max(0, Math.min(2, 2*(120-sec)/120));
  const base = (conf==='sure' ? 6 : 3) + speed;
  return Math.round(base * rankMult());
}
function addPoints(p){

function skipQ(){

  const sec = Math.round((Date.now()-qStartOf(q))/1000);

const CONF_GLYPHS = ['\u03C0','\u2211','\u0394','\u03BB','\u03A9','\u222B','\u221A','\u03B8','\u03BC','\u221E'];
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches || view!=='results') return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = innerWidth, H = innerHeight;
  const c = document.createElement('canvas'); c.className = 'confetti'; c.setAttribute('aria-hidden', 'true');
  c.width = Math.round(W*dpr); c.height = Math.round(H*dpr); c.style.width = W+'px'; c.style.height = H+'px';
  document.body.appendChild(c);
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--accent','--c-easy','--c-medium','--c-phys','--c-maths','--c-chem','--c-hard'].map(v=>cs.getPropertyValue(v).trim()).filter(Boolean);
  const kinds = ['dot','bar','glyph','glyph','glyph'];
  const cannons = [
    {x:W*0.5, y:H*0.38, a:-Math.PI/2, spread:0.9, n:64},
    {x:-10,   y:H*0.86, a:-Math.PI/2+0.55, spread:0.35, n:30},
    {x:W+10,  y:H*0.86, a:-Math.PI/2-0.55, spread:0.35, n:30}
  ];
  const P = [];
  cannons.forEach(cn=>{
    for(let i=0;i<cn.n;i++){
      const ang = cn.a + (Math.random()-0.5)*cn.spread*2;
      const sp = 7 + Math.random()*9;
      P.push({
        x:cn.x, y:cn.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
        kind: kinds[Math.random()*kinds.length|0],
        ch: CONF_GLYPHS[Math.random()*CONF_GLYPHS.length|0],
        size: 7 + Math.random()*8,
        r: Math.random()*Math.PI*2, vr: (Math.random()-0.5)*0.22,
        flip: Math.random()*Math.PI*2, vf: 0.1 + Math.random()*0.16,

    }
  });
  const DUR = 3400, FADE = 800, t0 = performance.now();
  (function f(t){
    const e = t - t0;
    const alpha = Math.max(0, Math.min(1, (DUR - e) / FADE));
    g.clearRect(0, 0, W, H);
    P.forEach(p=>{
      p.vy += 0.2; p.vx *= 0.985; p.vy *= 0.992;
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.flip += p.vf;
      const squash = Math.max(0.18, Math.abs(Math.cos(p.flip)));
      g.save();

      g.translate(p.x, p.y); g.rotate(p.r); g.scale(1, squash);
      g.fillStyle = p.c;
      if(p.kind === 'dot'){ g.beginPath(); g.arc(0, 0, p.size*0.38, 0, Math.PI*2); g.fill(); }
      else if(p.kind === 'bar'){ g.fillRect(-p.size*0.18, -p.size*0.65, p.size*0.36, p.size*1.3); }
      else { g.font = 'italic 600 ' + Math.round(p.size*2.1) + 'px Lora, Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(p.ch, 0, 0); }

  })(t0);
}

// Cloud sync: each network step has its own timeout so a slow or missing bridge never blocks the app.
function cloudSync(){
  if(typeof claude === 'undefined' || !claude.use) return Promise.resolve();
  const timeout = ms => new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms));
  return Promise.race([claude.use('db'), timeout(3000)]).then(db=>{
    if(!db) return;
    return Promise.race([claude.use('user'), timeout(3000)]).then(user=>{
      if(!user) return;
      return Promise.race([user.id(), timeout(3000)]).then(uid=>{
        if(!uid) return;
        return Promise.race([db.doc('data/users/'+uid+'/progress').get(), timeout(3000)]).then(doc=>{
          if(doc && doc.data){ absorbLocal(doc.data); normalizeStore(); persist(); render(); }
        });
      });
    });
  }).catch(()=>{});
}

    if(label) msg.textContent = label;
  };
  const finish = ()=>{
    if(finished) return; finished = true;
    show(100, 'Ready');
    setTimeout(()=>{ TL.classList.add('off'); setTimeout(()=>{ TL.remove(); if(appEl) appEl.style.visibility = ''; }, 300); }, 200);
  };
  const withTimeout = (p, ms)=> Promise.race([p, new Promise(r=>setTimeout(r, ms))]);
  const hardStop = setTimeout(finish, 3500);
  setTimeout(()=>{ if(appEl) appEl.style.visibility = ''; }, 6000); // never leave the user on the splash indefinitely

  (async ()=>{
    await loadBank();
    buildGutter();
    registerSW();
    setTimeout(logAppOpen, 2500);
    for(const st of steps){
      msg.textContent = st.label;
      try{ await withTimeout(Promise.resolve().then(st.run), 3000); }catch(e){}
      if(st.after){ try{ st.after(); }catch(e){} }
      done++;
      show(Math.round(done/steps.length*100));
    }
    clearTimeout(hardStop);
    finish();
  })();
})();

// ---------- Flashcards v3: adaptive text, keyword highlights, split formulas ----------
const FX_KEYWORDS = ['vicinal','geminal','Markovnikov','anti-Markovnikov','electrophile','nucleophile','carbocation','carbanion','free radical','resonance','hyperconjugation','inductive effect','chiral','enantiomers','racemic','isomers','homologous series','functional group','torque','moment of inertia','angular momentum','coefficient of restitution','Hess','Carnot','half-life','photon','molarity','Kohlrausch','Bohr','conservation'];
const FX_KW_RE = new RegExp('\\b('+FX_KEYWORDS.slice().sort((a,b)=>b.length-a.length).map(k=>k.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&')).join('|')+')\\b','gi');
// Escaped text in, HTML out: **word** and any listed keyword become orange italic serif
// Formula display: turns plain-typed maths into proper notation. Stored data is not changed.
function texify(s){
  if(!s || String(s).indexOf('\\') >= 0) return s;
  let t = String(s);
  const FN = 'sin|cos|tan|cot|sec|cosec|ln|log|exp';
  t = t.replace(new RegExp('(^|[^\\\\A-Za-z])(' + FN + ')\\^\\(([^()]*)\\)', 'g'), (m,pre,f,p)=>pre+'\\'+f+'^{'+p+'}');
  t = t.replace(new RegExp('(^|[^\\\\A-Za-z])(' + FN + ')(?![A-Za-z])', 'g'), (m,pre,f)=>pre+'\\'+f);
  t = t.replace(/\^\(([^()]*)\)/g, (m,p)=>'^{'+p+'}');
  t = t.replace(/\^(-?\d+(?:\.\d+)?|[A-Za-z])(?![A-Za-z0-9])/g, (m,p)=>'^{'+p+'}');
  t = t.replace(/_([A-Za-z0-9])(?![A-Za-z0-9])/g, (m,p)=>'_{'+p+'}');
  t = t.replace(/\b(mu|lambda|theta|omega|pi|sigma|rho|alpha|beta|gamma|phi)\b/g, (m,g)=>'\\'+g);
  t = t.replace(/\bDelta\b/g, '\\Delta');
  t = t.replace(/\bepsilon_0\b/g, '\\varepsilon_0');
  t = t.replace(/\bsqrt\(([^()]*)\)/g, (m,p)=>'\\sqrt{'+p+'}');
  t = t.replace(/\bplus or minus\b/g, '\\pm').replace(/\+\/-/g, '\\pm');
  t = t.replace(/>=/g, '\\geq').replace(/<=/g, '\\leq');
  t = t.replace(/(\d)\s*x\s*(10)/g, (m,a,b)=>a+' \\times '+b);
  t = t.replace(/\bdelta\b/g, '\\Delta');
  t = t.replace(/(\b[A-Z][a-z]?\d*|\d[\d.]*|\))\s+x\s+(?=[A-Za-z(\d\\])/g, (m,p)=>p+' \\times ');
  t = t.replace(/\bC\((\w+),\s*([^()]+)\)/g, (m,a,b)=>'\\binom{'+a+'}{'+b+'}');
  t = t.replace(/\bsum from (\w+) = ([^ ]+) to ([^ ]+) of/g, (m,v,lo,hi)=>'\\sum_{'+v+'='+lo+'}^{'+hi+'}');
  t = t.replace(/\|([^|]+)\|/g, (m,p)=>'\\lvert '+p+' \\rvert');
  return t;
}
function fxKey(s){
  let t = esc(s).replace(/\[\[(.+?)\]\]/g, '<em class="fx2-key">$1</em>');
  return t.replace(FX_KW_RE, '<em class="fx2-key">$1</em>');
}
// Splits a LaTeX line at top-level operators (outside braces and brackets).
// keepLeft: the operator stays at the end of the left part (used for '=');
// otherwise the operator starts the next part (used for '+' and '-').
function fxSplitAt(eq, ops, keepLeft){
  const parts=[]; let depth=0, cur='';
  for(let i=0;i<eq.length;i++){
    const ch=eq[i];
    if(ch==='{'||ch==='(') depth++; else if(ch==='}'||ch===')') depth--;
    if(depth===0 && ops.indexOf(ch)>=0 && cur.trim()){
      if(keepLeft){ parts.push((cur+ch).trim()); cur=''; }
      else { parts.push(cur.trim()); cur=ch; }
      continue;
    }
    cur+=ch;
  }
  if(cur.trim()) parts.push(cur.trim());
  return parts;
}
function fx2Front(c){
  if(c.kind!=='Formula') return fxKey(c.front.replace(/<[^>]+>/g,''));
  const body = String(c.front).replace(/^\$|\$$/g,'');
  const plainText = /[a-z]{3,}\s+[a-z]{2,}/i.test(body) && !/\\/.test(body);
  if(!plainText) return '<span class="fx2-math" data-eq="'+esc(body)+'">'+c.front+'</span>';
  // Text card: each clause sits on its own line. A "Label: text" opener gets a small label above it.
  const lines = body.split(/;\s*/).map(s=>s.trim()).filter(Boolean);
  const html = lines.map(s=>{
    const m = s.match(/^([A-Za-z][A-Za-z \-]{1,30}):\s*(.+)$/);
    if(!m) return '<span class="fx2-line">'+fxKey(s)+'</span>';
    const lab = m[1].charAt(0).toUpperCase()+m[1].slice(1);
    return '<span class="fx2-line"><b class="fx2-lab">'+esc(lab)+'</b>'+fxKey(m[2])+'</span>';
  }).join('');
  return '<span class="fx2-plain fx2-lines" data-eq="'+esc(body)+'">'+html+'</span>';
}
function fitFront(){
  const box = document.querySelector('.fx2-face.front .fx2-front'); if(!box) return;
  const area = box.parentElement; const maxW = area.clientWidth, maxH = area.clientHeight;
  const m = box.querySelector('.fx2-math');
  if(!m){ // text cards: shrink until the text fits the card
    let size = 26; box.style.fontSize = size+'px';
    while(box.scrollHeight > maxH && size > 14){ size--; box.style.fontSize = size+'px'; }
    return;
  }
  const tgt = m; tgt.style.whiteSpace='nowrap'; tgt.style.display='inline-block';
  const fits = ()=> tgt.scrollWidth <= maxW;
  let size = 30; tgt.style.fontSize = size+'px';
  while(size < 44){ size++; tgt.style.fontSize=size+'px'; if(!fits()){ size--; tgt.style.fontSize=size+'px'; break; } }
  while(!fits() && size > 13){ size--; tgt.style.fontSize = size+'px'; }
  // Too long even at the smallest size: break the formula over several lines.
  // First at the equals sign, then at the + and - terms of any line that still does not fit.
  const level = +(tgt.dataset.split||0);
  if(!fits() && level < 2){
    const src = (level===0 || !tgt.dataset.lines) ? [tgt.dataset.eq||''] : JSON.parse(tgt.dataset.lines);
    const parts = [];
    src.forEach(s=>{ const p = fxSplitAt(s, level===0 ? '=' : '+-', level===0); parts.push(...(p.length>1 ? p : [s])); });
    tgt.dataset.split = String(level+1);
    if(parts.length>1){
      tgt.dataset.lines = JSON.stringify(parts);
      tgt.innerHTML = parts.map(p=>'<span class="fx2-ln">$'+p+'$</span>').join('');
      tgt.classList.add('fx2-stacked');
      if(window.renderMathInElement) renderMathInElement(tgt, {delimiters:[{left:'$',right:'$',display:false}]});
    }
    fitFront();
  }
}

// Flashcard faces: front shows the prompt, back shows the answer and its explanation
function fxFace(c, side){
  const meta = '<div class="fx2-meta"><span class="fx2-kind">'+esc(c.kind)+'</span>'+(c.oos?'<span class="oos-tag">Not in JEE Main syllabus</span>':'')
    +'<span class="fx2-chap">'+esc(flashState.chapter||'')+'</span></div>';

  const back = c.back || [];
  const first = back[0] ? back[0].text : '';
  const rest = back.slice(1).map(x=>x.label
      ? '<div class="fx2-sec"><b>'+esc(x.label)+'</b>'+fxKey(x.text)+'</div>'
      : '<div class="fx2-sec">'+fxKey(x.text)+'</div>').join('');
  return '<div class="fx2-face back">'+meta+'<div class="fx2-mid fx2-scroll"><div class="fx2-answer">'+fxKey(first)+'</div>'+rest+'</div><div class="fx2-hint">Tap to flip back</div></div>';
}
function flashSession(w){
  document.body.classList.add('flash-session');
  const st = flashState, n = st.pool.length, c = st.pool[st.i];
  const enterCls = st.enter ? ' fx2-swap-in' : ''; st.enter = false; st.busy = false;
  const top = el('<div class="fx2-top"><button type="button" class="fx2-back" id="fx2Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>'+(st.mine?'My cards':'Chapters')+'</span></button><span class="fx2-count">'+(st.i+1)+' / '+n+'</span></div>');
  top.querySelector('#fx2Back').onclick = ()=>leaveFlash();
  w.appendChild(top);

  const split = el('<div class="fx2-split'+enterCls+'"></div>');
  // Left: the deck. Cards underneath are static; only the top card is ever animated away.
  const deck = el('<div class="fx2-deck"></div>');
  for(let k=Math.min(2, n-st.i-1); k>=1; k--){
    const under = st.pool[st.i+k];
    deck.appendChild(el('<div class="fx2-under u'+k+'"><div class="fx2-face front fx2-ghost"><div class="fx2-meta"><span class="fx2-kind">'+esc(under.kind)+'</span></div></div></div>'));
  }
  const stage = el('<div class="fx2-stage" role="button" tabindex="0" aria-label="Flip card"><div class="fx2-stack"><div class="fx2-card'+(st.flipped?' flip':'')+'">'
    +fxFace(c,'front')+fxFace(c,'back')+'</div></div></div>');
  stage.onclick = flashFlip;
  stage.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); flashFlip(); } };
  deck.appendChild(stage);
  split.appendChild(deck);
  // Right (wide screens): progress and actions. On phones it stacks under the card.
  const side = el('<div class="fx2-side"><div class="fx2-side-k">'+esc(st.chapter)+'</div><div class="fx2-big">'+(st.i+1)+'<span> / '+n+'</span></div>'
    +'<div class="fx2-progress"><i style="width:'+(st.i/n*100)+'%"></i></div>'
    +'<div class="fx2-actions"><button type="button" class="fx2-btn quiet">Still learning</button><button type="button" class="fx2-btn primary">Got it</button></div>'
    +'<div class="fx2-keys pc-only">Space to flip · arrows to answer</div></div>');
  const bs = side.querySelectorAll('.fx2-btn');
  bs[0].onclick = ()=>flashAnswer(false);
  bs[1].onclick = ()=>flashAnswer(true);
  split.appendChild(side);
  w.appendChild(split);
  setTimeout(fitFront, 0);
  return w;
}
function flashAnswer(ok){
  const st = flashState, c = st.pool[st.i];
  if(!c || st.busy) return;
  st.busy = true;
  flashKnown(st.chapter)[c.key] = ok;
  const top = document.querySelector('.fx2-stage .fx2-card');   // the card leaves sideways
  if(top) top.classList.add(ok ? 'fx2-out-r' : 'fx2-out-l');
  const next = document.querySelector('.fx2-under.u1');         // the next card rises into place
  if(next) next.classList.add('fx2-promote');
  setTimeout(swapFlashCard, 460);
}
// Replaces only the top bar and the card area, in the same frame, so the screen never goes blank
function swapFlashCard(){
  const st = flashState;
  if(st.i >= st.pool.length-1){ st.done = true; render(); return; }
  st.i++; st.enter = true; st.flipped = false;
  const split = document.querySelector('.fx2-split');
  if(!split){ render(); return; }
  const host = split.parentNode;
  const old = [...host.children].filter(n=>/\bfx2-top\b|\bviva-callout\b|\bfx2-split\b/.test(n.className));
  const tmp = el('<div></div>');
  flashSession(tmp);
  const fresh = [...tmp.children];
  old.forEach(n=>host.insertBefore(fresh.shift(), n));
  fresh.forEach(n=>host.insertBefore(n, old[old.length-1].nextSibling));
  old.forEach(n=>n.remove());
  renderMath();
}

// ---------- Keep the screen awake while TORQ is open and visible ----------
let __wakeLock = null;
async function keepAwake(){
  if(!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  if(__wakeLock && !__wakeLock.released) return;
  try{
    __wakeLock = await navigator.wakeLock.request('screen');
    __wakeLock.addEventListener('release', ()=>{ __wakeLock = null; });
  }catch(e){ /* denied or unsupported: the app works normally */ }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') keepAwake(); });
// Some browsers only allow the request after a user gesture, so retry on the first touch or key
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, keepAwake, {passive:true}));
keepAwake();


// ---------- Pop-ups never let the page behind them move ----------
(function scrollLockInit(){
  let saved = 0, locked = false;
  const overlayOpen = ()=> !!document.querySelector('.scrim, .navscrim.on');
  function sync(){
    const want = overlayOpen();
    if(want === locked) return;
    locked = want;
    const b = document.body;
    if(want){
      saved = window.scrollY;
      b.style.position = 'fixed'; b.style.top = (-saved)+'px';
      b.style.left = '0'; b.style.right = '0'; b.style.width = '100%';
    } else {
      b.style.position = ''; b.style.top = '';
      b.style.left = ''; b.style.right = ''; b.style.width = '';
      window.scrollTo(0, saved);
    }
  }
  new MutationObserver(sync).observe(document.body, {childList:true});
  sync();
})();
