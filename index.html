let flashState = {chapter:null, i:0, flipped:false, pool:[], filter:'All', done:false, busy:false, enter:false};
const FL_KNOWN = {}; // chapter -> {cardKey: true|false}, kept for this session
const FL_EXPLAIN = {"Kinematics":[["Velocity after time t when the velocity starts at u and changes steadily at a. Use it when the displacement is not asked for.","Acceleration is the change in velocity per second, so over t seconds the change is a multiplied by t. Add that change to the starting velocity.","Start at u, then add a for every second. The equation is that sentence in symbols."],["Displacement after time t under constant acceleration. Use it when the final velocity is not asked for.","Speed rises steadily, so the average speed is (u + v)/2. Displacement is average speed times time, ((u + v)/2) t. Substituting v = u + at gives ut + ½at².","The ½ comes from averaging the start and end speeds. ut is the uniform part; the ½at² is the extra gained from acceleration."],["Links final velocity to displacement with no time in it. Use it when the question gives s but never t.","From v = u + at, t = (v − u)/a. Substitute into s = ((u + v)/2) t. Then s = (v² − u²)/(2a), which rearranges to this form.","Say it aloud: v squared equals u squared plus two a s. If the question gives no time, reach for this one first."],["Distance covered during the nth second alone, not from the start.","It is the displacement at the end of second n minus the displacement at the end of second n − 1. Subtracting the two formulas leaves u + a(n − ½). The nth second is centred on time n − ½.","Place the nth second at time n minus half a second. That is where the half comes from."],["Average velocity under constant acceleration, equal to the mean of the start and end velocities.","Under constant acceleration the velocity changes in a straight line over time, and the average of a straight line is the average of its two ends.","Valid only for constant acceleration. If the acceleration changes, this shortcut fails."],["Velocity of A as seen by B. Subtract B's velocity from A's.","Every velocity is measured relative to the observer. A car going 60 km/h, seen from a car going 40 km/h in the same direction, appears to move at 20 km/h.","Subtract the observer. Whatever the observer does is taken away."],["Velocity is the rate at which position changes, which is the slope of the position–time graph.","The slope is change in position divided by change in time. Shrinking that time interval towards zero gives the derivative.","A steeper line on the x–t graph means faster motion; a flat line means at rest."],["Acceleration is the slope of the velocity–time graph.","Slope is change in velocity over change in time, which is exactly the definition of acceleration.","A straight, steady slope on the v–t graph means constant acceleration."],["Displacement is the area between the velocity–time graph and the time axis.","Each thin strip has area v times a tiny time, which is a tiny displacement. Adding the strips gives the total. Area below the axis counts as negative.","Area under v–t is displacement; slope of v–t is acceleration. Don't swap them."],["Acceleration of a body falling freely, with only gravity acting.","Without air resistance nothing else acts, so the acceleration is constant and the same for every mass. JEE uses g = 10 m/s² unless the question says otherwise.","Mass and shape don't matter in a vacuum: a feather and a hammer fall together."],["Total time a projectile launched from ground level stays in the air.","The vertical component of launch velocity is u sinθ. It takes u sinθ / g to reach the top, and the rise and fall are symmetric, so double it.","Time up equals time down. Find the time to the top and double it."],["Greatest height reached by a projectile launched at angle θ.","At the top the vertical velocity is zero. Use v² = u² − 2gh with only the vertical part, u sinθ, which gives u² sin²θ / (2g).","At the top, use only the vertical velocity: square it and divide by 2g."],["Horizontal distance from launch to landing on level ground.","Range = horizontal speed × time of flight = u cosθ × (2u sinθ / g). Using sin 2θ = 2 sinθ cosθ gives u² sin 2θ / g.","sin 2θ is largest when 2θ = 90°, so the range is greatest at 45°. Complementary angles give equal ranges."]],"Laws of Motion":[["Net force gives a body an acceleration in the same direction as the force.","A force changes motion, and mass is the body's resistance to that change. Use the net force, the vector sum of all the forces on the body.","Heavier means harder to accelerate: a bigger mass needs a bigger force for the same acceleration."],["Forces between two bodies are equal in size, opposite in direction, and act on different bodies.","Each body pushes the other, so the forces always come in pairs. They act on different bodies, so they never cancel in a single free-body diagram.","Equal and opposite, but on different bodies. Never cancel them against each other."],["Impulse, force times the time it acts, equals the change in momentum.","Integrating F over time gives the total change in momentum. For a fixed change in momentum, a longer time means a smaller average force.","Catching a cricket ball with hands moving back: longer contact time means less force."],["The static friction force adjusts itself, up to a maximum of μs times the normal force.","Static friction matches whatever force tends to slide the object, up to its limit. Beyond that limit the object starts to slide.","Static friction supplies only what is needed, up to μs N."],["Kinetic friction, once the surfaces slide, has a fixed size of μk times the normal force.","Once sliding starts, friction does not depend on the speed or on the applied force. It always opposes the relative motion.","Sliding friction is steady, so the net force is the applied force minus μk N."],["Acceleration of a smooth block sliding down an incline of angle θ.","Gravity has a component mg sinθ along the slope and mg cosθ into it. The surface cancels the second, and with no friction the first gives a = g sinθ.","sin for along the slope, cos for into the slope. Gravity's along-slope part is sin."],["Apparent weight, the normal force from the floor, in a lift accelerating upward at a.","Newton's second law gives N − mg = ma, so N = m(g + a). The floor pushes harder, so you feel heavier.","Feel heavier going up, lighter going down. The change in what you feel is the acceleration."],["Pseudo force in an accelerating frame: −ma0 in a frame accelerating with a0.","Inside an accelerating frame, Newton's laws need an extra force to match what is observed. It points opposite to the frame's acceleration.","The pseudo force points backwards, like being pressed into the seat when a car speeds up."],["Acceleration of two masses connected over a light frictionless pulley.","The net driving force is (m1 − m2)g and the total mass moved is m1 + m2. Divide the force by the mass.","Difference over sum, times g."],["Tension in the string of an Atwood machine.","From the heavier mass, T = m1(g − a). Substituting a gives T = 2m1m2 g / (m1 + m2).","Tension is twice the product of the two masses over their sum, times g."]],"Work, Energy and Power":[["Work done by a constant force F acting over displacement s at angle θ to it.","Only the component of the force along the displacement moves the body. That component is F cosθ, so W = F s cosθ.","Work counts only the force that points along the motion. A force at right angles does zero work."],["Kinetic energy of a body of mass m moving at speed v.","The work needed to bring a body from rest to speed v is F s = m a s. With v² = 2as, this becomes ½mv².","Double the speed and the kinetic energy quadruples."],["Work-energy theorem: net work equals the change in kinetic energy.","Net force times displacement is the net work, and Newton's second law converts that into a change in ½mv².","Use the net work, so include every force that acts."],["Gravitational potential energy relative to a chosen reference level.","Work done to lift a mass steadily through height h against gravity is mgh. Only the height difference matters.","Pick the reference level that makes the problem simplest, then measure height from there."],["Energy stored in a spring stretched or compressed by x.","The force grows linearly as kx. The work equals the area under the force–displacement graph, a triangle with base x and height kx, which gives ½kx².","Spring energy is the area of the triangle under the force graph."],["Mechanical energy is conserved when only conservative forces do work.","Work by a conservative force changes kinetic and potential energy by equal and opposite amounts, so their sum stays the same.","What leaves kinetic energy goes into potential energy, and back again."],["A conservative force is the negative slope of its potential energy curve.","A conservative force pushes a particle towards lower potential energy. The minus sign encodes that direction.","The force points downhill on the potential energy graph."],["Power is the rate of doing work, which equals force times velocity in the direction of motion.","P = W/t = Fs/t, and s/t = v, so P = Fv.","At constant power, doubling the speed halves the force. This is why a car pulls less hard at high speed."],["Coefficient of restitution: the ratio of separation speed to approach speed.","It measures how much of the relative speed survives the collision. e = 1 is elastic and e = 0 is perfectly inelastic.","Speed apart after, over speed together before."]],"Rotational Motion":[["Torque is the turning effect of a force, equal to r F sinθ.","Only the perpendicular part of the force turns a body. The lever arm is r sinθ, the perpendicular distance from the axis to the line of the force.","Push far from the hinge and at right angles to it to get the most turning."],["Rotational form of Newton's second law: torque equals moment of inertia times angular acceleration.","It parallels F = ma. Torque causes angular acceleration, and the moment of inertia resists it.","I plays the role of mass."],["Moment of inertia, the rotational analogue of mass, depends on how the mass is spread about the axis.","Each particle contributes m times the square of its distance from the axis, so mass far away counts much more.","Distance squared: mass far from the axis dominates."],["Parallel axis theorem: moment of inertia about any axis equals the centre-of-mass value plus M d².","Moving the axis a distance d from the centre adds M d² for the whole body. The centre of mass therefore always gives the smallest I.","The centre is always the easiest axis to spin about."],["Moments of inertia about the central axis of a disc and of a ring.","A disc has its mass spread through the interior, giving ½MR². A ring has all its mass at distance R, giving MR².","Ring: all the mass is on the rim, so it's the full MR². Disc: half of that."],["Moment of inertia of a solid sphere about its centre, and of a thin rod about one end.","Sphere: (2/5)MR². Rod: ML²/12 about its centre, plus M(L/2)² from the parallel axis theorem, giving ML²/3.","Rod end is the centre value plus the parallel axis term: 1/12 + 1/4 = 1/3."],["Angular momentum, L = Iω, is conserved when the external torque is zero.","Rotation has its own momentum. Torque changes it, so with no external torque it stays constant. A smaller I then needs a larger ω.","Pull the arms in: I shrinks, so the spin speeds up."],["Kinetic energy of a body spinning about a fixed axis.","Each particle contributes ½mv² with v = rω. Summing these gives ½Iω².","I replaces m, and ω replaces v."],["Rolling without slipping: the centre's speed equals R times the angular speed.","The contact point is momentarily at rest, so the centre moves exactly one radius for every radian the body turns.","The contact point is instantly still, so each radian of spin moves the centre by exactly R."],["Acceleration of a body rolling down a rough incline.","Energy splits between translation and rotation, so the effective inertia becomes M + I/R². This gives a = g sinθ / (1 + I/(MR²)).","A smaller I/MR² means faster rolling: a disc beats a ring, and a solid sphere beats both."]],"Gravitation":[["Attractive force between two masses a distance r apart.","Each mass pulls the other, and the pull weakens with distance squared because the same influence spreads over a sphere of area 4πr².","Same shape as Coulomb's law, with masses instead of charges. Gravity is always attractive."],["Gravitational field at the surface of a planet of mass M and radius R.","Surface gravity comes from F = GMm/R² divided by m, so the planet's own mass is what sets g.","g depends only on the planet's mass and radius, never on the mass of the object falling."],["Value of g at height h above the surface.","g falls as 1/r², and r = R + h is measured from the centre. So g_h / g = (R/(R + h))².","Height is measured from the centre of the planet, so add h to R."],["Value of g at depth d below the surface of a uniform planet.","Only the inner sphere of radius R − d attracts you. Inside a uniform planet g grows in proportion to r, so g = g(R − d)/R = g(1 − d/R).","Deeper down, the shell above you pulls nothing, so g drops linearly and reaches zero at the centre."],["Gravitational potential energy, taken as zero at infinity.","Bringing a mass in from infinity means gravity does positive work, so the energy of the bound mass is negative.","Negative means bound. You must add energy to get the mass out to infinity."],["Speed for a circular orbit of radius r.","Gravity supplies the centripetal force: GMm/r² = mv²/r, which gives v² = GM/r.","v² = GM/r. The higher the orbit, the slower the satellite moves."],["Escape speed from the surface of a planet.","Escape needs total energy of zero: ½mv² = GMm/R. This is √2 times the orbital speed at the surface.","Escape speed is the orbit speed times √2, because the kinetic energy must match the depth of the gravitational well."],["Orbital period; T² is proportional to r³ (Kepler's third law).","Combine T = 2πr/v with v² = GM/r to get T² = 4π²r³/(GM).","T² goes with r³: double the orbit radius and the period grows by about 2.8."],["Total energy of a body in a circular orbit.","Kinetic energy is GMm/(2r) and potential energy is −GMm/r. Adding them gives −GMm/(2r).","Total energy is half the potential energy, since kinetic energy is minus half the potential energy."]],"Current Electricity":[["Electric current: charge passing a point per unit time.","Current is the rate at which charge flows past a point, so it is charge divided by time.","Charge is how much flows; current is how fast it flows."],["Ohm's law for a conductor at constant temperature.","The field pushes electrons, and collisions with the lattice limit their drift. That limit makes the current proportional to the voltage.","Think of a water pipe at constant width: more pressure means more flow."],["Resistance of a wire of length L, area A and resistivity rho.","A longer wire has more collisions to get through, and a wider one gives electrons more paths. So R rises with L and falls with A.","Longer means more resistance; fatter means less. It works like a crowded corridor."],["Current from the drift velocity, n free electrons per m³ and cross-section A.","The charge crossing a section in time t is the charge in the volume A v_d t, which is n e A v_d t.","Electrons per unit volume times the volume the flow sweeps past in one second."],["Resistors in series share the same current.","The same current passes through each resistor, so the voltages add, and resistances add with them.","In series there is one path, so the resistances simply stack up."],["Resistors in parallel share the same voltage.","Each branch sees the same voltage, so the currents add. Adding conductances (1/R) gives the total.","In parallel the total is always smaller than the smallest branch."],["Electrical power dissipated in a resistor.","Power is energy per second, which is VI. Using V = IR gives I²R, and using I = V/R gives V²/R.","Use V²/R when the voltage across a load is fixed, and I²R when the current through it is fixed."],["Terminal voltage of a cell with internal resistance r.","The EMF E is shared between the external load and the cell's own resistance. The drop Ir inside the cell grows with current, so the terminal voltage falls under load.","Terminal voltage is EMF minus the drop across the internal resistance."],["Wheatstone bridge is balanced, so no current flows through the galvanometer.","The bridge balances when both midpoints are at the same potential, which means the arm ratios on each side match.","A balanced bridge has P/Q = R/S: the ratios on the two sides are equal."],["Time constant of an RC circuit; charge grows as 1 − e^(−t/RC).","The current into a capacitor depends on how much charge it still lacks, which makes the growth exponential. The time constant τ = RC is the time to reach 63% of full charge.","After one time constant the capacitor is at 63% of its final charge, and after about 5τ it is effectively full."]],"Electrostatics":[["Coulomb's law: force between two point charges, attractive for opposite signs.","The force follows an inverse-square law, like gravity. Like charges repel and opposite charges attract.","The shape of gravity, but charges can repel as well as attract."],["Electric field of a point charge Q at distance r.","The field is the force per unit positive test charge, so E = F/q0 gives kQ/r².","The field points away from a positive charge and towards a negative one."],["Electric potential of a point charge, zero at infinity.","Potential is work per unit charge brought in from infinity. It is a scalar, so potentials from several charges simply add.","Potential is a scalar: add the potentials directly and skip the vectors."],["Work done moving a charge q through a potential difference.","Work equals the charge times the potential difference it moves through.","Moving 1 coulomb through 1 volt does 1 joule of work."],["Gauss's law: total flux through a closed surface.","The flux depends only on the charge enclosed, because field lines leaving the surface count positive and entering count negative.","Only charges inside the surface matter. Charges outside add as many field lines in as out."],["Capacitance of a parallel plate capacitor, and its definition.","The plates store charge Q for voltage V. A larger plate area or smaller gap lets more charge build up for the same voltage.","Bigger plates and closer plates both increase the capacitance."],["Energy stored in a charged capacitor.","Charging takes place as the voltage climbs from zero to V, so the average voltage is V/2. That gives energy ½QV.","The average voltage during charging is half the final voltage, which gives ½CV²."],["A dielectric of constant K multiplies the capacitance.","The dielectric reduces the field between the plates, so the same charge gives a smaller voltage, and capacitance rises by K.","A dielectric lowers the voltage for the same charge, so capacitance goes up by K."]],"Magnetic Effects of Current and Magnetism":[["Field at distance r from a long straight wire carrying current I.","Ampère's law says the field circles the wire, and its strength falls off with r.","Right-hand grip rule: thumb along the current, fingers curl in the direction of the field."],["Field at the centre of a circular loop of radius R with N turns.","Each turn adds to the field, and every point of the loop is the same distance from the centre.","N turns multiply the field, and a bigger radius weakens it."],["Field inside a long solenoid with n turns per metre.","Inside a long solenoid the field is uniform and points along the axis. Outside it is nearly zero.","Inside a solenoid the field is uniform and strong; outside it nearly cancels, like a flat tube."],["Magnetic (Lorentz) force on a moving charge.","The force is perpendicular to both velocity and field. Since it never acts along the motion, it does no work and the speed stays the same.","Right-hand rule: thumb along the velocity, fingers along the field, palm pushes a positive charge."],["Force on a straight current-carrying wire in a magnetic field.","A wire is a stream of moving charges, and each one feels a Lorentz force qvB sinθ. Adding them up gives BIL sinθ.","Same right-hand rule as the Lorentz force, applied to the whole wire."],["Radius and period of a charge moving perpendicular to a uniform field.","The magnetic force supplies the centripetal force: qvB = mv²/r, so r = mv/(qB). The period T = 2πm/(qB) does not depend on speed.","The period is the same for any speed: faster particles simply make bigger circles."],["Force per unit length between two long parallel wires.","Each wire's field acts on the current in the other wire. Parallel currents attract, and antiparallel currents repel.","Parallel currents attract; antiparallel currents repel."],["Torque on a rectangular coil of area A in a magnetic field.","The forces on opposite sides of the coil form a couple. Here θ is the angle between the coil's normal and the field.","Torque is greatest when the coil is parallel to the field lines, and zero when it is perpendicular to them."]],"Electromagnetic Induction and Alternating Currents":[["Faraday's law: EMF induced by a changing magnetic flux; the minus sign is Lenz's law.","A changing flux through a loop induces an EMF. The minus sign means the induced current opposes the change that produced it.","Lenz's law: the induced current always opposes the change in flux."],["Motional EMF of a rod of length L moving at speed v across a field B.","Electrons in the moving rod feel a force qvB along its length, so they are pushed to one end. This gives EMF = BLv.","A rod sliding through a field is a generator in one step: EMF = BLv."],["Self-induced EMF in an inductor of inductance L.","A changing current changes the flux through the inductor itself, and that change opposes the current.","An inductor resists changes in current, the way inertia resists changes in motion."],["Root mean square value of a sinusoidal alternating voltage.","The average of sin² over a cycle is ½, so the root of the mean square is v0 divided by √2.","For a sine wave the RMS value is the peak divided by √2."],["Inductive and capacitive reactance.","An inductor's opposition grows with frequency, while a capacitor's falls. So inductors block high frequencies and capacitors block low ones.","Inductors resist high frequencies; capacitors resist low frequencies."],["Impedance of a series RLC circuit.","Resistance and net reactance are 90° out of phase, so they add as perpendicular phasors.","Impedance is the Pythagorean sum of R and the net reactance."],["Resonant angular frequency, where the reactances cancel.","At resonance X_L = X_C, so the reactances cancel, leaving impedance equal to R and current at its maximum.","At resonance the inductor and capacitor cancel each other out, leaving only R."],["Average power; cos φ is the power factor.","Only the in-phase part of the current delivers average power. The reactive part swaps energy back and forth and delivers none on average.","Power factor cos φ: the reactive part moves energy back and forth without delivering any on average."],["Ideal transformer voltage ratio.","The changing flux links both coils, so the EMF per turn is the same. The voltage ratio therefore equals the turns ratio. In an ideal transformer power is conserved, so the current falls as the voltage rises.","More turns on the secondary means higher voltage and lower current."]],"Experimental Skills":[["Least count of a vernier caliper: the smallest reading it can give.","Ten vernier divisions span the same length as nine main-scale divisions, so each vernier division is a tenth of a main division shorter. The least count is 1 MSD − 1 VSD, which is one tenth of 1 MSD.","Ten vernier divisions cover nine main divisions, so each one is a tenth short."],["Least count of a screw gauge.","One full turn of the screw moves it forward by one pitch. One circular-scale division is a fraction of a turn, so it moves the screw by pitch divided by the number of divisions.","One full turn advances the screw by one pitch, so divide the pitch by the number of divisions on the head."],["Corrected reading of a vernier caliper: MSR + (VSC × LC) − zero error.","The main-scale reading plus the vernier coincidence times the least count gives the raw reading. The zero error is then subtracted to correct for an instrument that doesn't read zero when closed.","Add the main scale and vernier readings, then subtract the zero error. If the zero error is negative, subtracting it adds the magnitude."],["Period of a simple pendulum for small amplitudes, used to find g.","For small angles the restoring force mg sinθ is roughly mgθ, which gives simple harmonic motion with ω² = g/L. The period then depends only on length and g.","The period depends on length and g, not on the bob's mass. Measure T and L to find g."],["Resistivity from a wire's resistance, length and cross-sectional area.","This is R = ρL/A rearranged to make resistivity the subject.","Rearrange R = ρL/A: resistivity is resistance times area over length."]],"Some Basic Concepts in Chemistry":[["Converts between grams and moles.","Molar mass is the mass of one mole in grams, so dividing a mass by it gives the number of moles.","Mass over molar mass, the same way you would divide a total cost by the price of one item."],["Converts moles to atoms, molecules or ions.","One mole contains Avogadro's number, 6.022 × 10²³, of particles, so the count is moles times that number.","One mole is just a very large counting unit, 6.022 × 10²³ items, as a dozen is 12."],["Percentage composition of an element in a compound.","The mass of the element in one formula unit divided by the molar mass gives its fraction of the compound. Multiplying by 100 gives the percentage.","Element's share of the whole molecule's mass, then times 100."],["Concentration in mol per litre.","Molarity counts how many moles of solute are dissolved in each litre of solution, so volume must be in litres.","Convert mL to litres before dividing, which means dividing by 1000. This is the most common error."]],"Atomic Structure":[["Energy of an electron in a hydrogen-like atom.","In the Bohr model the electrostatic pull is balanced by quantised angular momentum. The energy scales with Z² and falls off as 1/n², and the negative sign means the electron is bound.","The energy ladder: the ground state n = 1 is the deepest, and the levels climb towards zero as n grows."],["Radius of the nth Bohr orbit.","Allowed orbits are quantised, so the radius grows as n². A larger nuclear charge Z pulls the electron closer, so the radius shrinks as 1/Z.","The orbit radius goes up with n² and down with Z."],["de Broglie wavelength of a particle with momentum mv.","Every moving particle has a matter wave. Its wavelength is h divided by its momentum, so heavier or faster particles have shorter wavelengths.","Heavier or faster means shorter wavelength: λ = h/(mv)."],["Heisenberg uncertainty principle.","Position and momentum cannot both be known exactly. Their uncertainties multiply to at least h/4π, so sharpening one blurs the other.","Pin down where it is and you lose how fast it is moving."],["Allowed values of the quantum numbers.","For a shell n, l runs from 0 to n − 1, m runs from −l to +l, giving 2l + 1 orbitals. Each orbital takes two electrons, one for each spin value.","Count the boxes: each l gives 2l + 1 orbitals, and each orbital holds two electrons with opposite spins."]],"Chemical Bonding and Molecular Structure":[["Formal charge on an atom in a Lewis structure.","Each atom is credited with its lone-pair electrons and half of its shared electrons. The formal charge is what remains compared with its valence electrons.","Each atom keeps all its lone-pair electrons and half of each bond it makes."],["Molecular orbital bond order.","Bonding electron pairs hold atoms together, while antibonding electrons pull them apart. The bond order is the net number of bonding pairs.","Bond order is the net bonding pairs. Zero means no stable bond."],["Dipole moment of a charge separation.","A dipole is a pair of equal and opposite charges a distance d apart. The moment is q times d, and it is a vector pointing from positive to negative.","A symmetric molecule can have polar bonds and still have zero dipole, because the bond dipoles cancel, as in CO2."],["Ideal bond angles by hybridisation.","Hybrid orbitals point as far apart as possible. sp is linear at 180°, sp2 is trigonal planar at 120°, and sp3 is tetrahedral at 109.5°.","Count the hybridised orbitals: two gives linear, three gives planar, four gives tetrahedral."]],"Chemical Thermodynamics":[["First law of thermodynamics: ΔU = q + w.","Energy is conserved. Heat added to the system and work done on it both raise its internal energy, with the signs taken as positive when they go into the system.","Positive means the system gains energy, whether as heat or as work."],["Relation between enthalpy and internal energy change.","Enthalpy includes the pV term. For a reaction in which gas moles change by Δn_g, Δ(pV) = Δn_g RT, so only gaseous moles count.","Only gas moles matter. Solids and liquids barely change volume."],["Gibbs energy; a process is spontaneous when ΔG is negative.","Enthalpy tends to fall in an exothermic process, while entropy tends to rise. Temperature sets how much weight the entropy term carries.","Enthalpy pushes the reaction down, while entropy, weighted by T, pushes it up. Negative ΔG means it goes forward."],["Links Gibbs energy to the equilibrium constant.","At equilibrium ΔG = 0 for the actual mixture. The standard Gibbs energy and K are then tied together by this relation.","A large K means a negative standard ΔG, so products are favoured."],["Second law criterion: ΔS_universe.","A spontaneous process must increase the total entropy of the system plus its surroundings. At equilibrium this total stays unchanged.","The universe must gain entropy for a change to be spontaneous; the system alone may lose it."]],"Optics":[["Snell's law of refraction.","Light bends at a boundary because its speed changes. The product n sinθ is the same on both sides, which keeps the wavefronts continuous across the interface.","n sinθ is the same on both sides of the boundary."],["Critical angle for total internal reflection, light going from a denser medium n1 into a rarer medium n2.","At the critical angle the refracted ray grazes the surface, θ2 = 90°. Beyond it there is no refracted ray, so all the light reflects.","At the critical angle the refracted ray grazes along the surface, so sin C = n2/n1."],["Mirror formula, with the real-is-positive sign convention.","Rays from the object converge at the image, and the focal length marks where parallel rays converge. Relating object and image distances to f gives this formula.","Object and image distances add to the reciprocal of f, so the image sits farther out as the object moves towards the focus."],["Lens formula with the Cartesian sign convention; u is negative for a real object.","The formula follows from refraction at the two lens surfaces. With the Cartesian convention, distances are measured from the optical centre and u is taken as negative for real objects.","With Cartesian signs, 1/v − 1/u = 1/f. Remember that u is negative for a real object."],["Lensmaker's formula for a thin lens in air.","Each curved surface bends the light, and the total power of the lens is the sum of the two surface powers. The radii set the power, and the refractive index sets how strongly the glass bends light.","A stronger curvature means a shorter focal length: a thicker, more curved lens bends light more."],["Fringe width in Young's double-slit experiment.","Two slits act as coherent sources. Path differences change steadily across the screen, and the spacing of successive bright fringes is λD/d.","The fringe width grows with wavelength and screen distance, and shrinks as the slit gap grows."],["Dark fringes (minima) of single-slit diffraction for slit width a.","The slit splits into pieces that cancel in pairs when the path difference a sinθ is a whole number of wavelengths.","Dark fringes sit where a sinθ = nλ. Central maximum is wider than the rest."],["Refractive index: ratio of the speed of light in vacuum to its speed in the medium.","Light slows down in a medium, and the ratio of vacuum speed to medium speed is the refractive index. A larger n means light travels more slowly there.","n = c/v: the bigger the number, the slower light moves through it."]],"Dual Nature of Matter and Radiation":[["Energy of a photon, with h = 6.63 × 10⁻³⁴ J s.","Light arrives in packets called photons, and each packet's energy is set by its frequency, E = hν. Since ν = c/λ, this equals hc/λ.","Short wavelength means high energy: violet light carries more energy per photon than red."],["Maximum kinetic energy of photoelectrons (Einstein's photoelectric equation).","One photon gives its whole energy to one electron. Part of it is needed to escape the metal, the work function φ, and the rest is kinetic energy.","Photon energy minus the work function gives the maximum kinetic energy."],["Threshold frequency below which no electrons are emitted.","Setting K_max = 0 in the photoelectric equation gives the minimum frequency that can free an electron.","Below the threshold, no amount of extra light intensity will emit electrons. Only frequency matters."],["Stopping potential V0 measures the maximum kinetic energy of photoelectrons.","The stopping potential is the reverse voltage needed to stop the fastest electrons, so eV0 equals their maximum kinetic energy.","Stopping potential in volts times the electron charge gives the maximum kinetic energy in joules."],["de Broglie wavelength of a particle with momentum p.","Matter also has wave properties. The wavelength is h divided by momentum, so faster and heavier particles have shorter wavelengths.","The same formula as for light, now applied to matter. Heavier or faster means shorter wavelength."],["Handy form: photon energy in eV equals 1240 divided by wavelength in nm.","hc is about 1240 eV nm, so dividing by the wavelength in nanometres gives the photon energy directly in electronvolts.","Memorise 1240: photon energy in eV is 1240 divided by the wavelength in nm."]],"Units and Measurements":[["Dimensions of force, energy and pressure, built from the base quantities M, L and T.","Each quantity is built from mass, length and time in powers that follow its defining relation, such as F = ma giving MLT⁻² for force.","Force is mass times acceleration, so MLT⁻². Energy is force times length, so ML²T⁻²."],["Maximum fractional error of a product z = xy.","The worst case adds the fractional errors of the factors, since each one can push the result in the same direction.","For products and quotients, the fractional errors add."],["Error when the quantity is raised to the power a.","If z = x^a, the fractional error is multiplied by the power, because the same relative change in x is magnified a times in z.","The power multiplies the fractional error."],["Least count of a screw gauge with N circular scale divisions.","One full turn advances the screw by one pitch. Dividing the pitch by N gives the smallest distance the screw can measure.","Pitch divided by the number of head divisions is the least count."],["Relative error expressed as a percentage.","Dividing the absolute error by the measured value gives the fractional error, and multiplying by 100 turns it into a percentage.","Absolute error over value, then times 100."]],"Properties of Solids and Liquids":[["Young's modulus: stress divided by longitudinal strain.","A wire stretches in proportion to the load when the stress is within the elastic limit. Young's modulus measures how stiff the material is.","A large Y means a stiff material that barely stretches."],["Extension of a wire under a load F.","Rearranging Y = (F/A)/(ΔL/L) gives ΔL = FL/(AY). The extension grows with load and length, and falls with area and stiffness.","Longer and more loaded means more stretch; thicker and stiffer means less stretch."],["Bulk modulus: pressure change per unit fractional volume change.","Pressure squeezes a material, and the bulk modulus measures how resistant it is to volume change. The minus sign reflects that pressure increases as volume falls.","A large B means the material is hard to compress."],["Pressure at depth h in a liquid of density ρ.","The column of liquid above a point has weight ρ g h per unit area, which adds to the pressure at the surface.","Pressure at depth is the surface pressure plus the weight of the liquid column above."],["Surface tension: force per unit length of a surface.","The molecules at a surface are pulled inward, and surface tension is the force per unit length that acts along the surface.","Surface tension is the force along a line of unit length in the surface."],["Excess pressure inside a liquid drop of radius r.","A drop has one surface, so the inward pull of surface tension raises its pressure. Smaller drops have more curvature and so higher excess pressure.","Small drops are squeezed harder: excess pressure is 2T/r, so it rises as r falls."],["Height of capillary rise in a tube of radius r.","Surface tension pulls the liquid up the wall until the weight of the raised column balances the pull, which gives h = 2T cosθ/(ρgr).","Narrow tubes raise liquid higher. Rise is greater for small radius."],["Equation of continuity for steady flow.","Liquid can't pile up or vanish, so the volume flow rate A v is the same at every section of the pipe.","Narrow pipe means fast flow: the speed rises when the area falls."],["Bernoulli's principle along a streamline.","Bernoulli's equation is energy conservation for a fluid: pressure energy, kinetic energy and potential energy per unit volume sum to a constant.","Faster flow means lower pressure, provided the height stays the same."]],"Thermodynamics":[["First law of thermodynamics: heat added minus work done by the gas.","Energy is conserved. Heat added raises the internal energy, and work done by the gas uses some of it.","Here W is work done by the gas. Heat in increases energy; work out decreases it."],["Work done by a gas at constant pressure.","A constant pressure times the volume change gives the area under the PV graph, which is the work done.","At constant pressure, work is pressure times volume change, the area under the PV line."],["Work done in an isothermal expansion of an ideal gas.","Integrating P dV with P = nRT/V at constant temperature gives nRT ln(V2/V1).","Isothermal work is the logarithm of the volume ratio."],["Adiabatic process: PV^γ is constant, with γ = Cp/Cv.","In an adiabatic process no heat flows, so the change in internal energy alone gives the relation PV^γ = constant. γ is the ratio of specific heats.","Adiabatic means no heat in or out. Gas gets hotter when compressed."],["Mayer's relation for one mole of an ideal gas.","At constant pressure the gas also does work pushing its boundary outward, so it needs R more heat per mole than at constant volume.","Cp exceeds Cv by exactly R per mole."],["Efficiency of a Carnot engine, with temperatures in kelvin.","No engine can beat a reversible engine working between the same two temperatures. Its efficiency depends only on the cold and hot reservoir temperatures.","Efficiency depends on temperatures in kelvin only. Hotter source and colder sink mean higher efficiency."],["Ideal gas law.","Molecules are assumed to have negligible size and no forces between them, so pressure, volume and temperature follow PV = nRT.","Pressure times volume is proportional to amount times temperature."]],"Kinetic Theory of Gases":[["Ideal gas law, in moles or molecules.","This is the same ideal gas law, with N molecules and Boltzmann's constant k_B = R/N_A used in place of n and R.","k_B is R per molecule, so PV = NkT and PV = nRT say the same thing."],["Pressure from molecular collisions with the walls.","Each molecule bounces off a wall and transfers momentum. Averaging over all molecules gives one third of the density times the mean square speed.","One third of the density times the mean square speed."],["Average translational kinetic energy per molecule.","The mean kinetic energy depends only on temperature, and each of the three translational directions carries an equal share, ½ k_B T.","Three directions, each with half k_B T, gives 3/2 k_B T."],["Root mean square speed of molecules of molar mass M.","Equating the average kinetic energy to ½mv² and writing m = M/N_A gives v_rms = √(3RT/M).","Heavier molecules move more slowly at the same temperature."],["Equipartition: each degree of freedom gets half of k_B T per molecule.","Energy is shared equally among the independent ways a molecule can store energy, each getting half k_B T.","Every degree of freedom gets an equal share: ½ k_B T each."],["Ratio of specific heats in terms of the number of degrees of freedom f.","Each degree of freedom adds half a unit of R to Cv, so Cv = fR/2 and γ = 1 + 2/f.","Monatomic gas: f = 3, so γ = 5/3. Diatomic: f = 5, so γ = 7/5."]],"Oscillations and Waves":[["Displacement in simple harmonic motion.","A point moving in a circle at constant speed casts a shadow that moves in simple harmonic motion, and its displacement is a sine function of time.","The shadow of a point on a rotating circle is the simplest picture of SHM."],["Angular frequency and period of a mass on a spring.","Hooke's law gives a restoring force kx, so Newton's second law gives ω² = k/m. The period follows from ω.","A stiffer spring speeds it up. A heavier mass slows it down."],["Period of a simple pendulum for small swings.","For small angles the restoring force is proportional to displacement, which gives SHM with ω² = g/L.","The period depends on length and g, not on the bob's mass."],["Total energy in SHM, shared between kinetic and potential.","Energy swaps between kinetic and potential as the oscillator moves. The total stays constant and equals the potential energy at maximum displacement, ½kA².","The total energy depends on the square of the amplitude, so doubling the amplitude quadruples it."],["Speed of a wave in terms of frequency and wavelength.","In one period the wave advances one wavelength, so the wave speed is wavelength times frequency.","Speed equals frequency times wavelength: v = fλ."],["Speed of a transverse wave on a string of tension T and mass per unit length μ.","Tension supplies the restoring force, and the mass per unit length sets how much inertia the string has.","More tension makes the wave faster; more mass per length makes it slower."],["Beat frequency from two close frequencies.","Two nearly equal frequencies interfere, and the loudness rises and falls at the difference frequency.","Beats are the difference of the two frequencies, one beat each time the sound swells and fades."],["Doppler effect for sound, with observer speed v0 and source speed vs.","Moving towards a sound compresses its wavefronts and raises the pitch, and moving away lowers it. The upper signs apply when the observer moves towards a source, or the source moves towards the observer.","Approaching raises the pitch; receding lowers it. In the formula, + for the observer approaching, − for the source approaching."]],"Electromagnetic Waves":[["Speed of every electromagnetic wave in vacuum.","Changing electric and magnetic fields sustain each other, and the speed of the resulting wave depends only on the vacuum permittivity and permeability.","Every electromagnetic wave travels at the same speed in vacuum: about 3 × 10⁸ m/s."],["Peak electric and magnetic fields of a plane wave are linked by c.","In an electromagnetic wave E and B are in phase and perpendicular, and their ratio is the wave speed.","E is always c times B, so the electric field is the bigger of the two in numbers."],["Ampère–Maxwell law: a changing electric flux acts like a current.","Maxwell added a displacement current, ε0 dΦE/dt, which completes the loop of magnetic field around a changing electric field.","A changing electric field produces a magnetic field, just as a current does."],["Average intensity of a plane wave with peak field E0.","Intensity is the average energy flux, and for a plane wave it depends on the square of the peak electric field.","Double the field and the intensity quadruples."],["Momentum carried by radiation of energy U, absorbed completely.","Electromagnetic waves carry momentum, equal to energy divided by c. An absorbed photon hands over all of its momentum.","Light carries momentum: U/c, so energy and momentum are linked by c."],["Radiation pressure on a perfectly absorbing or reflecting surface.","Absorbing a beam transfers its momentum rate I/c. A reflecting surface reverses the momentum, which doubles the transfer to 2I/c.","Reflection doubles the radiation pressure, because the momentum is reversed as well as absorbed."]],"Atoms and Nuclei":[["Radius of the nth Bohr orbit in hydrogen.","Bohr's quantised orbits grow as the square of n, and a0 is the radius of the first orbit.","Orbit radius grows as n², with a0 ≈ 0.53 Å for the innermost orbit."],["Energy of the nth level of hydrogen.","The electron's energy is negative because it is bound. Levels approach zero as n grows, so higher levels lie closer to the top.","Negative energy means bound. The ground state is −13.6 eV, the deepest level."],["Photon emitted when an electron drops from level i to level f.","The energy lost by the electron in the jump appears as a single photon, with energy equal to the difference of the two levels.","Drop from high to low, and the photon energy is the gap between the two rungs."],["Wavelengths of the spectral lines of hydrogen.","Combining E = hc/λ with the energy levels gives the Rydberg formula. The lines are grouped by the lower level n_f.","The lower level sets the series: n_f = 1 is Lyman, n_f = 2 is Balmer, and n_f = 3 is Paschen."],["Energy needed to remove the electron from the ground state of hydrogen.","Ionisation takes the electron from the ground state to zero energy, which costs the full 13.6 eV binding energy.","The ionisation energy is the magnitude of the ground-state energy: 13.6 eV."]],"Electronic Devices":[["Current relation in a transistor: emitter current equals base plus collector current.","Charge is conserved, so the current leaving the emitter splits between the base and collector, and the base current is always the smallest.","The emitter sends everything: the base and collector share it between them."],["Current gain of a common base transistor.","Most carriers from the emitter reach the collector, so the collector current is a large fraction of the emitter current.","Alpha is always slightly less than 1, because a few carriers are lost in the base."],["Current gain of a common emitter transistor.","A small base current controls a much larger collector current, so beta measures amplification.","Beta is the amplification: a small base current controls a large collector current."],["Links alpha and beta.","Substituting I_E = I_B + I_C into alpha = I_C/I_E and beta = I_C/I_B gives this relation.","Alpha and beta are linked: beta is large when alpha is close to 1."],["Behaviour of a p–n junction diode.","Forward bias narrows the depletion region, so current flows freely. Reverse bias widens it, leaving only a tiny leakage current.","Forward bias: current flows. Reverse bias: almost none."]],"Solutions":[["Molality: moles of solute per kilogram of solvent.","Molality uses the mass of solvent rather than the volume of solution, so it does not change when the temperature changes the solution's volume.","Molality uses kg of solvent, so it stays fixed when the liquid expands or contracts."],["Raoult's law for an ideal solution: the solvent's vapour pressure is its mole fraction times the pure vapour pressure.","Adding solute lowers the number of solvent molecules at the surface, so the vapour pressure of the solvent drops in proportion to its mole fraction.","The solvent's vapour pressure falls in proportion to how much of the solution it makes up."],["Depression of freezing point: ΔTf = i Kf m.","Solute particles get in the way of freezing, so the solution must be cooled further. The drop is proportional to the number of particles, which is i times the molality.","More particles, bigger drop. The van't Hoff factor i counts them."],["Elevation of boiling point: ΔTb = i Kb m.","Solute particles lower the solvent's vapour pressure, so the solution must be heated further to reach atmospheric pressure. The rise is proportional to the number of particles.","Boiling rises when freezing falls, by the same factor i."],["Osmotic pressure: π = i C R T.","Solvent moves across a semipermeable membrane to dilute the solute, and the pressure needed to stop that flow is the number of particles times the concentration, RT.","Osmotic pressure works like an ideal gas: the particles press as much as a gas of the same concentration."]],"Equilibrium":[["Converts Kc to Kp for gas reactions: Kp = Kc (RT)^Δn_g.","Kp uses partial pressures and Kc uses concentrations. Each gas pressure is its concentration times RT, so the difference in gas moles gives the power of RT.","Only gases change the conversion: Δn_g is moles of gaseous products minus gaseous reactants."],["Conjugate acid–base pairs: Ka × Kb = Kw = 1.0 × 10⁻¹⁴ at 25 °C.","The acid and its conjugate base together reproduce water's self-ionisation, so their constants multiply to Kw.","Strong acid, weak conjugate base: the product of the two constants always equals 10⁻¹⁴ at 25 °C."],["Definition of pH: pH = −log10[H⁺].","pH is a logarithmic scale for hydrogen-ion concentration. Each unit change is a tenfold change in concentration.","Lower pH means more H⁺. Each whole step is a factor of ten."],["Henderson–Hasselbalch equation for buffers: pH = pKa + log([A⁻]/[HA]).","A buffer resists pH change because it holds both the acid and its salt. The ratio of salt to acid sets the pH relative to pKa.","When the salt and acid are equal, the pH equals pKa. Doubling the salt shifts the pH up by about 0.3."],["Solubility product of a sparingly soluble salt: Ksp = [M⁺]^a [X⁻]^b.","At equilibrium the ion product of a saturated solution equals Ksp. If the ion product exceeds Ksp, a precipitate forms.","Ion product above Ksp means precipitation; below Ksp means the solid dissolves."]],"Redox Reactions and Electrochemistry":[["Nernst equation: E = E° − (0.0591/n) log Q at 25 °C.","Cell potential depends on the reaction quotient Q. As reactants are used up and products build, Q rises and the potential falls.","The Nernst correction shifts E away from E° as the reaction moves towards equilibrium."],["Links cell potential to Gibbs energy: ΔG = −nFE, with F = 96500 C/mol.","Electrical work per mole of electrons is nFE, and this work comes from the free energy released. A positive E means a negative ΔG and a spontaneous reaction.","Positive E means negative ΔG: the cell reaction runs by itself."],["Kohlrausch's law for molar conductivity: Λm = λ+ + λ−.","At infinite dilution each ion moves independently, so the total conductivity is the sum of the individual ionic contributions.","Add the contributions of the two ions: each ion carries its own share."],["Mass deposited in electrolysis (Faraday's law): m = ZIt.","The mass deposited is proportional to the charge passed, which is current times time. Z is the electrochemical equivalent of the substance.","Mass depends only on charge passed: current times time, times Z."]],"Chemical Kinetics":[["Concentration against time for a zero-order reaction: [A] = [A]0 − kt.","The rate does not depend on concentration, so the concentration falls in a straight line at constant rate.","Zero order: straight line down, reaching zero at t = [A]0/k."],["Concentration against time for a first-order reaction: ln([A]0/[A]) = kt.","The rate is proportional to concentration, so the amount remaining falls exponentially, and the logarithm of the ratio grows linearly with time.","First order: a straight line when you plot ln[A] against time."],["Half-life of a first-order reaction: t½ = 0.693/k.","Setting [A] = [A]0/2 in the first-order equation gives t½ = ln2/k, and ln2 is about 0.693.","Half-life depends only on k, not on the starting concentration."],["Arrhenius equation: k = A exp(−Ea/RT).","Only molecules with energy at least Ea react. The exponential factor is the fraction of collisions carrying that energy, and A counts how often collisions happen.","A high activation energy slows the reaction; a high temperature speeds it up."],["Temperature dependence of k: log(k2/k1) = (Ea/2.303R)(1/T1 − 1/T2).","Taking the logarithm of the Arrhenius equation at two temperatures and subtracting gives this relation between the two rate constants.","Raise the temperature by 10 K and the rate roughly doubles for most reactions."]],"Classification of Elements and Periodicity in Properties":[["Periodic trend in atomic size: radius decreases across a period and increases down a group.","Across a period the nuclear charge rises with the same shielding, so the electrons are pulled closer. Down a group each new shell adds size.","Across a row the nucleus pulls harder; down a column each new shell adds size."],["Periodic trend in ionisation enthalpy: increases across a period, decreases down a group.","A smaller atom with a higher nuclear charge holds its electrons more tightly, so more energy is needed to remove one. Larger atoms lose electrons more easily.","Smaller and more charged means harder to ionise."],["Periodic trend in electron gain enthalpy: becomes more negative across a period, with exceptions in groups 2, 15 and 18.","Atoms that gain an electron more readily release more energy. The exceptions are groups 2, 15 and 18, where the added electron must enter a filled or half-filled subshell or pair with another electron.","Trend is more negative across a period; exceptions come from stable configurations and electron repulsion."]],"p-Block Elements":[["Counting outer electrons for p-block elements: groups 13 to 18 have valence electrons running from 3 to 8.","The p-block fills its p subshell, so the group number minus 10 gives the valence electron count, from 3 for group 13 to 8 for group 18.","Group number minus 10 gives valence electrons for p-block elements."],["Inert pair effect: heavier p-block elements prefer lower oxidation states, for example +2 for Pb.","The ns² pair is held tightly in heavier atoms, so it is not used in bonding. This makes lower oxidation states more stable, as in Pb²⁺.","The heaviest element of a group often keeps its two s electrons back, so it shows the lower oxidation state."]],"d- and f-Block Elements":[["Definition of a transition element: a partly filled d subshell in at least one common oxidation state.","Transition metals have d electrons that can be used in bonding, and they form ions with partly filled d subshells.","Transition metals have partly filled d orbitals in common ions. Zinc is not one of them."],["Lanthanoid contraction: atomic radii shrink steadily across the 4f series.","Each added 4f electron shields the nucleus poorly, so the nuclear pull on the outer electrons grows and the atoms shrink.","Filling the f subshell does not add much shielding, so the atoms get smaller across the series."],["Highest oxidation states in the oxidising salts: Mn in KMnO4 is +7; Cr in K2Cr2O7 is +6.","Mn in MnO4⁻ is +7 and Cr in Cr2O7²⁻ is +6. These are the highest states, and they make the salts strong oxidising agents.","Permanganate has Mn +7 and dichromate has Cr +6, both strong oxidisers."],["Spin-only magnetic moment: sqrt(n(n + 2)) BM, where n is the number of unpaired electrons.","Each unpaired electron adds spin angular momentum, and the magnetic moment grows with the square root of this count.","Count the unpaired electrons, add two, multiply, and take the square root."]],"Coordination Compounds":[["Coordination number: the number of donor atoms bonded to the central metal.","Each donor atom forms one coordinate bond to the metal, so counting donors gives the number of bonds.","Count the donor atoms that attach to the metal, not the total number of ligands."],["Finding the metal's oxidation state: oxidation state of metal + charges of ligands = overall charge of complex.","The overall charge of the complex must equal the metal's charge plus the charges of its ligands.","Metal charge equals the complex charge minus the ligand charges."],["Crystal field splitting: Δo, the energy gap between t2g and eg orbitals.","In an octahedral field the d orbitals split into a lower t2g set and a higher eg set. Strong-field ligands make the gap larger.","The gap is larger for strong-field ligands; the split decides whether electrons pair up."],["IUPAC naming rule: ligands in alphabetical order, the metal name last, its oxidation state in Roman numerals.","The name is built in a fixed order so that the complex can be read without ambiguity.","Ligands first in alphabetical order, then the metal with its Roman numeral. Anionic ligands end in -o."]],"Sets, Relations and Functions":[["Counting elements in two overlapping sets: n(A ∪ B) = n(A) + n(B) − n(A ∩ B).","Adding the sets counts the overlap twice, so one copy of the intersection is subtracted.","Add the two sets, then subtract the overlap once."],["Number of subsets: n(power set of A) = 2^n(A).","Each element is either in a subset or not, so with n elements there are two choices for each element, giving 2^n subsets.","Each element is in or out, so 2^n."],["Test for equivalence: a relation is an equivalence relation if it is reflexive, symmetric and transitive.","Equivalence relations group elements into classes. Each element relates to itself, relating in one direction implies the other, and chains of relations connect.","Reflexive, symmetric, transitive: all three must hold."],["Injective (one-one) test: f is one-one if f(a) = f(b) implies a = b.","Distinct inputs must always give distinct outputs. A horizontal line test on the graph shows whether it holds.","One-one means no two inputs share an output: a horizontal line crosses the graph at most once."],["Surjective (onto) test: f is onto if every element of the codomain is an image.","The range must cover the whole codomain, so nothing in the codomain is left without an input.","Onto means the range equals the codomain."]],"Complex Numbers and Quadratic Equations":[["Definition of the imaginary unit: i² = −1.","The square root of −1 is defined as i, which lets quadratic equations with negative discriminant have solutions.","i is the square root of minus one: i² = −1."],["Modulus of a complex number: |z| = √(a² + b²) for z = a + ib.","The modulus is the distance of the point a + ib from the origin in the Argand plane, found by Pythagoras.","Modulus is the length of the arrow from the origin to the point."],["Quadratic formula: x = (−b ± √(b² − 4ac)) / 2a.","Completing the square on ax² + bx + c = 0 gives this expression for both roots.","Negative b, plus or minus the root of b squared minus four a c, over two a."],["Relations between roots and coefficients: sum of roots = −b/a, product of roots = c/a.","Expanding a(x − α)(x − β) and comparing coefficients gives these two relations between the roots and the coefficients.","Sum equals minus b over a, and product equals c over a."],["Nature of roots from the discriminant D = b² − 4ac: D > 0 gives two real roots, D = 0 equal roots, D < 0 complex roots.","The discriminant is the quantity under the square root in the quadratic formula. A positive value gives two real roots, zero gives one repeated root, and a negative value gives complex roots.","Positive means two real roots, zero means one repeated root, negative means complex roots."]],"Matrices and Determinants":[["Determinant of a 2 × 2 matrix: ad − bc.","The determinant measures how a matrix scales area. It is the product of the main diagonal minus the product of the other diagonal.","Main diagonal product minus the other diagonal product."],["Inverse of a square matrix: A⁻¹ = adj(A)/det(A).","Multiplying A by adj(A) gives det(A) times the identity, so dividing by det(A) gives the inverse. It exists only when det(A) is not zero.","No determinant, no inverse. For a 2 × 2, swap a and d, negate b and c, then divide by the determinant."],["Area of a triangle from its vertices: ½ |det of the coordinate matrix|.","Each vertex becomes a row (x, y, 1). The determinant of this matrix is twice the signed area of the triangle.","Write each vertex as (x, y, 1), take the determinant, halve it, and drop the sign."],["Adjoint identity: A(adj A) = (adj A)A = det(A) I.","The off-diagonal terms cancel out in each product, and the diagonal terms each give det(A).","Diagonal entries give the determinant; off-diagonal entries cancel to zero."],["Cramer's rule: x = det(Dx)/det(D).","Replacing the column of the unknown with the constants builds a new determinant, and dividing by the original determinant gives the solution.","Replace the unknown's column with the constants, then divide by the original determinant."]],"Permutations and Combinations":[["Arrangements of r objects from n when order matters: P(n, r) = n!/(n − r)!.","The first slot has n choices, the next n − 1, and so on for r slots. This product is n!/(n − r)!.","Fill the slots from left to right: n, then n − 1, down to r terms."],["Selections of r objects from n when order does not matter: C(n, r) = n!/(r!(n − r)!).","Each selection can be arranged in r! orders, so dividing the permutations by r! removes the ordering.","Combinations are permutations divided by r!, since each group can be ordered r! ways."],["Symmetry of combinations: C(n, r) = C(n, n − r).","Choosing the r people to include is the same as choosing the n − r people to leave out.","Choosing who goes in is the same as choosing who stays out."],["Pascal's recurrence: C(n, r) = C(n − 1, r − 1) + C(n − 1, r).","Either a particular object is in the selection, which leaves r − 1 choices from n − 1, or it is not, which leaves r choices from n − 1.","Pascal's triangle: each entry is the sum of the two entries directly above it."]],"Binomial Theorem":[["Binomial expansion for a positive integer n.","Multiplying out (a + b) n times means choosing a or b from each factor. Counting the choices that give b exactly r times gives C(n, r).","C(n, r) counts how many factors give b, so the power of b is the index r."],["General term T(r+1) = C(n, r) a^(n−r) b^r.","The general term is the one in which exactly r factors give b. Its position is r + 1, which is why the index and the term number differ by one.","Index r is the power of b. The term number is one more than the index."],["Middle term: if n is even, T(n/2 + 1); if n is odd, the two terms T((n + 1)/2) and T((n + 3)/2).","An expansion has n + 1 terms, so an even n gives one middle term, and an odd n gives two.","n + 1 terms: an odd count has one middle, an even count has two."],["Sum of coefficients = 2^n.","Setting a = b = 1 turns the expansion into (1 + 1)^n = 2^n, which is the sum of all coefficients.","Set every variable to 1 to add up the coefficients."]],"Sequence and Series":[["Arithmetic progression: a_n = a + (n − 1)d and S_n = (n/2)(2a + (n − 1)d).","Each term adds d to the one before, so the nth term is a plus (n − 1) steps of d. The sum pairs the first and last terms, which all have the same total.","Sum is the number of terms times the average of the first and last terms."],["Geometric progression: a_n = a r^(n − 1) and S_n = a(r^n − 1)/(r − 1).","Each term is r times the one before. Multiplying the sum by r and subtracting cancels all middle terms, leaving only the first and last.","Multiply the sum by r and subtract: almost everything cancels."],["Sum to infinity of a geometric progression: S = a/(1 − r) for |r| < 1.","When |r| < 1 the term r^n shrinks to zero, so the partial sum formula reduces to a/(1 − r).","If the ratio is between −1 and 1, the terms shrink and the sum settles to a/(1 − r)."],["Means of two numbers: AM = (a + b)/2, GM = √(ab), and AM ≥ GM.","The inequality follows from (√a − √b)² ≥ 0, which expands to a + b ≥ 2√(ab).","The square of a real difference is never negative, which is why AM is always at least GM."]],"Limit, Continuity and Differentiability":[["Standard limit: sin x/x tends to 1 as x tends to 0.","For small angles in radians, sin x is almost equal to x, and a geometric squeeze between triangle and sector areas proves the limit.","For small x in radians, sin x is almost x, so the ratio is nearly one."],["Definition of e: (1 + 1/x)^x tends to e as x tends to infinity.","This is the limit of compound interest compounded more and more often, which gives the constant e.","e is what you get from compounding continuously."],["Basic derivatives: d/dx(xⁿ) = nx^(n − 1), d/dx(sin x) = cos x, d/dx(eˣ) = eˣ, d/dx(ln x) = 1/x.","Each comes from the limit definition of the derivative. The exponential function is special because its rate of growth equals its value.","eˣ is its own derivative, and ln x has derivative 1/x."],["Product rule (uv)′ = u′v + uv′ and quotient rule (u/v)′ = (u′v − uv′)/v².","Adding and subtracting the same term in the limit definition gives these rules. The quotient rule is the product rule applied to u times 1/v.","Quotient rule: low times d-high, minus high times d-low, all over low squared."],["Chain rule: dy/dx = (dy/du)(du/dx).","A change in x changes u, and that change changes y. Multiplying the two rates gives the overall rate.","Treat du like a fraction that cancels across the two derivatives."]],"Integral Calculus":[["Power rule: ∫xⁿ dx = x^(n + 1)/(n + 1) + C, for n ≠ −1.","Integration reverses differentiation. Differentiating x^(n+1)/(n+1) gives xⁿ, so this works for every power except n = −1.","Raise the power by one and divide by the new power. The exception is n = −1."],["Logarithm rule: ∫(1/x) dx = ln|x| + C.","The derivative of ln|x| is 1/x for both positive and negative x. The absolute value makes the function defined on both sides of zero.","ln of the absolute value, because logs of negatives are undefined."],["Integration by parts: ∫u dv = uv − ∫v du.","This is the product rule read backwards. It trades a hard integral for a simpler one, and it works when one factor becomes simpler on differentiation.","Use ILATE to pick u: Inverse, Logarithmic, Algebraic, Trigonometric, Exponential."],["Fundamental theorem of calculus: ∫ from a to b of f(x) dx = F(b) − F(a).","The integral is the accumulated area, and the antiderivative F measures that accumulation. The area between a and b is the change in F.","Evaluate at the top limit, then subtract the value at the bottom limit."],["Standard form: ∫1/(x² + a²) dx = (1/a) arctan(x/a) + C.","The substitution x = a tanθ turns the integrand into a constant, which gives the arctangent after dividing by a.","Arctan appears when the denominator is a squared plus x squared, and you divide by a."]],"Differential Equations":[["Separation of variables: if dy/dx = f(x)g(y), integrate dy/g(y) = f(x) dx.","Rearranging puts all the y terms with dy and all the x terms with dx, so each side can be integrated on its own.","Collect all the y terms and dy on one side, and all the x terms and dx on the other."],["Linear first-order equation: dy/dx + p(x)y = q(x), with integrating factor e^(∫p dx).","Multiplying by the integrating factor makes the left side the exact derivative of y times the factor, so it can be integrated directly.","Multiply by e^(∫p dx), and the left side becomes a single derivative."],["Order is the highest derivative present; degree is the power of that highest derivative.","Order counts how many times the function is differentiated. Degree is the exponent of the highest-order term, once the equation is free of fractions and radicals.","Order counts how many derivatives; degree is the power on the top one."],["Homogeneous equation: substitute y = vx, so dy/dx = v + x dv/dx.","If the right side depends only on y/x, the substitution turns the equation into one that is separable in v and x.","If the equation depends only on y/x, let y = vx and separate."]],"Co-ordinate Geometry":[["Distance formula between (x1, y1) and (x2, y2).","The horizontal and vertical differences form the legs of a right triangle, and the distance is its hypotenuse.","The horizontal and vertical steps form a right triangle, so use Pythagoras."],["Section formula: the point dividing a segment in the ratio m : n.","Each coordinate is a weighted average of the two endpoints. The weight on each endpoint is the ratio on the opposite side, so the point sits closer to the endpoint with the smaller weight.","Each endpoint is weighted by the ratio on the opposite side of the point."],["Slope m = (y2 − y1)/(x2 − x1); parallel lines have equal slopes, perpendicular lines have m1m2 = −1.","Slope is rise over run. Parallel lines rise at the same rate. Perpendicular lines turn through 90°, which makes their slopes negative reciprocals.","Parallel means equal slopes; perpendicular means the slopes multiply to −1."],["Distance from a point to a line ax + by + c = 0: |ax1 + by1 + c|/√(a² + b²).","Substituting the point into the line gives a value proportional to its distance. Dividing by the length of the normal vector (a, b) converts it into true distance.","Plug the point into the line, take the absolute value, and divide by the length of (a, b)."],["Standard equation of a circle: (x − h)² + (y − k)² = r².","Every point on the circle is at distance r from the centre (h, k), and Pythagoras gives this equation.","Centre (h, k) enters with opposite signs; r² sits on the right."]],"Three Dimensional Geometry":[["Distance between two points in space.","Adding a third coordinate extends Pythagoras to three dimensions, giving the square root of the sum of the three squared differences.","The 2D distance formula with one more squared term for z."],["Direction cosines l, m, n satisfy l² + m² + n² = 1.","Direction cosines are the cosines of the angles the line makes with the three axes. They are the components of a unit vector along the line, so their squares sum to 1.","The three cosines are the components of a unit vector, so their squares add to 1."],["Direction cosines from direction ratios a, b, c: a/R, b/R, c/R, where R = √(a² + b² + c²).","Dividing each ratio by its length R scales the direction vector to unit length, and the scaled components are the direction cosines.","Divide each ratio by the length R to turn it into a unit vector."],["Angle between two lines: cosθ = |a1a2 + b1b2 + c1c2| / (product of the two lengths).","The angle between two directions is found from the dot product of their direction vectors. The absolute value gives the acute angle between the lines.","Dot product over the product of lengths; the absolute value always gives the acute angle."],["Shortest distance between skew lines: |(a2 − a1)·(b1 × b2)| / |b1 × b2|.","The shortest distance is the component of the vector joining any two points on the lines along their common perpendicular, which is b1 × b2.","Project the vector between the two lines onto the common perpendicular b1 × b2."]],"Vector Algebra":[["Scalar (dot) product: a · b = |a||b| cosθ.","The dot product multiplies the length of one vector by the component of the other along it.","The dot product is largest when vectors are parallel and zero when they are perpendicular."],["Magnitude of the vector (cross) product: |a × b| = |a||b| sinθ.","The cross product's size is the area of the parallelogram formed by the two vectors, which depends on the perpendicular component.","The cross product is largest when vectors are perpendicular and zero when they are parallel."],["Area of a triangle using the cross product: ½|a × b|.","The two sides of the triangle span a parallelogram, and the triangle is half of that parallelogram.","Half the parallelogram formed by the two sides."],["Scalar projection of a on b: (a · b)/|b|.","The projection is the length of the shadow that a casts on the direction of b, found by dividing the dot product by the length of b.","Dot product over the length of b gives the shadow length of a on b."],["Scalar triple product a · (b × c), equal to the volume of the parallelepiped.","The volume of the parallelepiped formed by three edges is the base area times the height, which the triple product gives. If the three vectors are coplanar, the volume is zero.","If the three vectors lie in one plane, the box they form has no volume, so the triple product is zero."]]};

eating a partial charge. The effect weakens quickly with distance. Chloroethane's carbon is slightly positive because chlorine pulls electrons."]}, {"title": "Resonance", "analogy": "Several Lewis structures for one molecule.", "body": ["Resonance describes electrons spread over several positions. The real molecule is a blend of the contributing structures, which makes it more stable than any single one, as in benzene."]}, {"title": "Hyperconjugation", "analogy": "Stabilisation by neighbouring C-H bonds.", "body": ["Hyperconjugation is the donation of electrons from adjacent C-H sigma bonds into an empty or partly empty orbital. More alkyl groups mean more hyperconjugation, which stabilises carbocations."]}, {"title": "Electrophile", "analogy": "Electron-loving, seeks electrons.", "body": ["An electrophile is an electron-deficient species that accepts an electron pair, such as H+, Br+ or a carbocation. Electrophilic addition and substitution are driven by them."]}, {"title": "Nucleophile", "analogy": "Nucleus-loving, donates electrons.", "body": ["A nucleophile has a lone pair it donates to an electron-poor centre, such as OH-, CN- or NH3. Nucleophilic substitution and addition are driven by them."]}, {"title": "Homolytic and heterolytic fission", "analogy": "Bond breaking that gives radicals or ions.", "body": ["In homolytic fission each atom keeps one electron, giving free radicals. In heterolytic fission one atom keeps both electrons, giving a carbocation and a carbanion."]}, {"title": "Carbocation, carbanion, free radical", "analogy": "Carbon with a positive, negative or single electron.", "body": ["A carbocation has six electrons and a positive charge, a carbanion has a lone pair and a negative charge, and a free radical has an unpaired electron. Stability follows the number of alkyl groups."]}, {"title": "Ortho, meta and para", "analogy": "Positions on a benzene ring relative to a substituent.", "body": ["Ortho is adjacent (1,2), meta has one carbon between (1 function flashCardsBuild(c){

    const ex = (FL_EXPLAIN[c]||[])[n];
    const back = ex ? ex.map((t,j)=>({label:LBL[j], text:t})) : [{label:'Use', text:f.use}];
    out.push({key:'f'+n, ch:c, kind:'Formula', front:'$'+texify(f.eq)+'$', back, oos:!!f.oos});

// Shrink a chosen photo to a 160px square JPEG before it is cached (shown at 54px at most, so this stays sharp and small)
function readAvatar(file, done){
  if(!file || !file.type || file.type.indexOf('image/') !== 0){ appNotice('Photo not supported', 'Please choose a photo (JPG or PNG).'); return; }
  const fr = new FileReader();
  fr.onerror = ()=>appNotice('Photo not read', 'That photo could not be read. Try another one.');
  fr.onload = ()=>{
    const img = new Image();
    img.onerror = ()=>appNotice('Photo not opened', 'That photo could not be opened. Try a JPG or PNG.');
    img.onload = ()=>{
      const S = 160, m = Math.min(img.width, img.height);
      const c = document.createElement('canvas'); c.width = S; c.height = S;
      c.getContext('2d').drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
      done(c.toDataURL('image/jpeg', 0.82));
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

const LB_BOARDS = [
  {k:'points', l:'Points',   sub:'Most points earned',            need:false, note:'Points come from your answers. A correct, sure answer earns the most, a quick one adds a bonus, and a wrong answer costs a little.'},
  {k:'time',   l:'Time',     sub:'Most time spent answering',     need:false, note:'Total time spent answering questions in this period.'},

];
const LB_PERIODS = [['day','Today'],['week','This week'],['month','This month'],['3m','Last 3 months'],['6m','Last 6 months'],['year','Last year'],['all','All time']];
const LB_LIMIT = 50, LB_TTL = 60000, LB_STUCK = 15000;
let lbState = {board:'points', period:'all', cache:{}};
let lbSeq = 0;
function lbKey(){ return lbState.board+'|'+lbState.period; }
function setC(key, v){ v.at = Date.now(); lbState.cache[key] = v; }
function lbFmt(board, s){
  if(s==null || isNaN(s)) return '–';
  if(board==='points') return Math.round(s).toLocaleString('en-IN')+' pts';
  if(board==='clean') return (Math.round(s*10)/10)+'%';
  if(board==='speed') return (Math.round(s*10)/10)+' s';
  const m = Math.round(s);
  if(m<1) return '<1 min';
  return m>=60 ? Math.floor(m/60)+' h '+(m%60)+' min' : m+' min';
}
// Loads one board. A newer request for the same board replaces an older one, so a slow reply can never overwrite fresh data.
function lbFetch(force){
  const key = lbKey(), c = lbState.cache[key];
  if(!force && c){
    const age = Date.now() - c.at;
    if(c.loading ? age < LB_STUCK : age < LB_TTL) return;
  }
  const db = sbClient();
  if(!db || !sbSession){ setC(key, {err:'Sign in to see the leaderboard.'}); return; }
  const tok = ++lbSeq, board = lbState.board, period = lbState.period;
  setC(key, {loading:true, tok});
  db.rpc('leaderboard', {p_board:board, p_period:period, p_limit:LB_LIMIT}).then(({data,error})=>{
    const cur = lbState.cache[key];
    if(!cur || cur.tok!==tok) return;
    if(error){ console.error(error); setC(key, {err:'Could not load the leaderboard. Check your connection and try again.'}); return; }
    const rows = (data||[]).map(r=>({place:Number(r.place), name:r.username||'Anonymous User', first:r.first_name||'',
      avatar:r.avatar_data||null, anon:!!r.is_anonymous, me:!!r.is_me, score:(r.score==null ? null : Number(r.score))}));
    // Remember our all-time points rank so future awards can taper for top ranks.
    if(board==='points' && period==='all'){
      const me = rows.find(r=>r.me), rank = me ? me.place : null;
      if(store.lbRank !== rank){ store.lbRank = rank; persist(); }
    }
    setC(key, {rows});
  }).catch(()=>{
    const cur = lbState.cache[key];
    if(cur && cur.tok===tok) setC(key, {err:'Could not load the leaderboard. Check your connection and try again.'});
  }).finally(()=>{ if(view==='leaderboard') render(); });
}
