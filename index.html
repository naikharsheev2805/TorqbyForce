here n is the number of unpaired electrons","use":"Spin-only magnetic moment"}],"concepts":[{"title":"Variable oxidation states come from the d electrons","analogy":"A shared key ring where several keys can be used. The d electrons are close in energy to the s electrons, so several can take part in bonding.","body":["Transition metals show several oxidation states because the d and s electrons have similar energies, and the number that takes part can vary.","Across the first row, the highest oxidation state rises to a peak around manganese, then falls, because the later elements hold their d electrons more tightly."],"example":{"q":"What is the oxidation state of Cr in K2Cr2O7?","a":"2 x (+1) + 2 x x + 7 x (-2) = 0, so x = +6."}},{"title":"Colour and magnetism from partly filled d orbitals","analogy":"A stained glass window. A coloured pane absorbs some light and shows the rest, and the colour depends on which wavelengths get through.","body":["Compounds of transition metals are often coloured because light excites an electron from one d level to another. The colour seen is the light not absorbed.","Unpaired d electrons make a compound paramagnetic. The more unpaired electrons, the stronger the effect."],"example":{"q":"Find the spin-only magnetic moment of a complex with 4 unpaired electrons.","a":"Magnetic moment = sqrt(4 x 6) = sqrt(24), about 4.9 BM."}},{"title":"Lanthanoids and actinoids","analogy":"Very similar siblings. Lanthanoids look alike because their outer electron shells are almost the same.","body":["Across the lanthanoids, atomic size falls slowly. This lanthanoid contraction makes elements after them have radii close to those of the 4d and 5d metals, which is why they are hard to separate.","Actinoids have more variable oxidation states than lanthanoids, and most of them are radioactive."],"example":{"q":"Why are Zr and Hf so alike in size and chemistry?","a":"Lanthanoid contraction makes Hf about as small as Zr, even though it has far more electrons."}}]},"Coordination Compounds":{"formulas":[{"eq":"Coordination number = number of donor atoms bonded to the central metal","use":"Counting ligand bonds"},{"eq":"Oxidation state of metal + charges of ligands = overall charge of complex","use":"Finding the metal's oxidation state"},{"eq":"Crystal field splitting: Delta o, the energy gap between t2g and eg orbitals","use":"Crystal field theory"},{"eq":"Ligands are named in alphabetical order, with the metal name last and its oxidation state in Roman numerals","use":"IUPAC naming rule"}],"concepts":[{"title":"Ligands and coordination number","analogy":"Arms holding a ball. A monodentate ligand gives one arm, a bidentate ligand gives two, and the number of arms is the coordination number.","body":["A ligand is a molecule or ion that donates a lone pair to the metal. Monodentate ligands give one donor atom, such as Cl- or NH3. Chelating ligands, such as ethylenediamine, give two or more, which makes the complex more stable.","The coordination number is the number of donor atoms attached to the metal, not the number of ligands."],"example":{"q":"What is the coordination number of the metal in [Ni(en)3]2+?","a":"Each en is bidentate, so 3 x 2 = 6."}},{"title":"Naming and isomerism","analogy":"Naming a family group. The ligands are listed first in alphabetical order, and the metal comes last.","body":["Anionic ligands end in -o, such as chlorido and cyanido. Neutral ligands keep their usual names, such as ammine for NH3 and aqua for H2O.","Structural isomers differ in how the atoms are bonded. Geometric isomers (cis and trans) differ in the arrangement of ligands around the metal. Optical isomers are mirror images."],"example":{"q":"Name [Co(NH3)4Cl2]+ with Co in the +3 state.","a":"Tetraamminedichloridocobalt(III) ion, with ammine and chlorido listed alphabetically."}},{"title":"Crystal field theory and colour","analogy":"A pair of hands pressing a ball. The ligands press the d orbitals unevenly, so the d orbitals split into two groups with an energy gap between them.","body":["In an octahedral complex the five d orbitals split into a lower t2g set and an upper eg set. Strong-field ligands produce a bigger gap, which pairs electrons more and lowers the number of unpaired electrons.","The colour comes from light absorbed to excite an electron across the gap. Crystal field theory explains colour and magnetism together."],"example":{"q":"Why is [Co(NH3)6]3+ diamagnetic while [CoF6]3- is paramagnetic?","a":"NH3 is a strong-field ligand that pairs all six electrons, while F- is weak-field and leaves four unpaired."}}]},"Sets, Relations and Functions":{"formulas":[{"eq":"n(A union B) = n(A) + n(B) - n(A intersection B)","use":"Counting elements in two overlapping sets"},{"eq":"n(power set of A) = 2^n(A)","use":"Number of subsets"},{"eq":"A relation is an equivalence relation if it is reflexive, symmetric and transitive","use":"Test for equivalence"},{"eq":"f is one-one if f(a) = f(b) implies a = b","use":"Injective test"},{"eq":"f is onto if every element of the codomain is an image","use":"Surjective test"}],"concepts":[{"title":"Sets and their operations","analogy":"Two overlapping circles on a Venn diagram. The overlap is the intersection, the total of both is the union, and the outside is the complement.","body":["Union collects all elements in either set, and intersection keeps only the common ones. The complement is what lies outside a set within a universal set.","De Morgan's laws connect these: the complement of a union is the intersection of the complements, and the reverse."],"example":{"q":"A has 10 elements, B has 7, and they share 3. How many elements are in A union B?","a":"10 + 7 - 3 = 14."}},{"title":"Equivalence relations","analogy":"Grouping people by birthday month. Each person is in exactly one group, and anyone in the same group is treated as equal for that purpose.","body":["A relation on a set is reflexive if every element relates to itself, symmetric if a relates to b means b relates to a, and transitive if a relates to b and b relates to c means a relates to c.","An equivalence relation has all three properties, and it splits the set into disjoint classes."],"example":{"q":"Is 'a is congruent to b mod 3' an equivalence relation on the integers?","a":"Yes: a - a is 0, a - b and b - a both divide by 3, and a - b plus b - c divides by 3 too."}},{"title":"One-one, onto and composition","analogy":"Seating guests at a table. One-one means no two guests share a seat, and onto means every seat is taken.","body":["A function is bijective when it is both one-one and onto, which is the case where an inverse function exists.","For composition, g(f(x)) is applied right to left: f acts first, then g."],"example":{"q":"Is f(x) = x^2 from the real numbers to the real numbers one-one?","a":"No, because f(2) = f(-2) = 4, so it is many-one."}}]},"Complex Numbers and Quadratic Equations":{"formulas":[{"eq":"i^2 = -1","use":"Definition of the imaginary unit"},{"eq":"|z| = sqrt(a^2 + b^2) for z = a + ib","use":"Modulus of a complex number"},{"eq":"Roots of ax^2 + bx + c = 0: x = (-b plus or minus sqrt(b^2 - 4ac)) / 2a","use":"Quadratic formula"},{"eq":"Sum of roots = -b/a, product of roots = c/a","use":"Relations between roots and coefficients"},{"eq":"Discriminant D = b^2 - 4ac: D > 0 two real roots, D = 0 equal roots, D < 0 complex roots","use":"Nature of roots"}],"concepts":[{"title":"Complex numbers on the Argand plane","analogy":"A map with two axes. Real numbers sit on the horizontal axis and imaginary numbers on the vertical one, so every point is an address.","body":["Multiplying by i rotates a point by 90 degrees anticlockwise. The modulus is the distance from the origin, and the argument is the angle from the positive real axis.","The conjugate of a + ib is a - ib, and z times its conjugate gives the square of the modulus."],"example":{"q":"Find the modulus of 3 + 4i.","a":"sqrt(9 + 16) = 5."}},{"title":"Nature of roots","analogy":"A quick test before a long calculation. The discriminant tells you what kind of answer to expect without solving the whole equation.","body":["If the discriminant is negative, the roots are a complex conjugate pair, so they always appear in pairs with the imaginary parts opposite.","Real coefficients guarantee this pairing."],"example":{"q":"What kind of roots does x^2 + 2x + 5 = 0 have?","a":"D = 4 - 20 = -16 is negative, so the roots are complex conjugates: -1 plus or minus 2i."}},{"title":"Forming an equation from given roots","analogy":"Reverse engineering a recipe. Given the ingredients, you rebuild the dish from the sum and product.","body":["If the roots are alpha and beta, the equation is x^2 - (alpha + beta) x + alpha beta = 0.","This is handy for checking answers and for problems that ask for an equation with given roots."],"example":{"q":"Form the equation with roots 2 and -3.","a":"Sum = -1, product = -6, so x^2 + x - 6 = 0."}}]},"Matrices and Determinants":{"formulas":[{"eq":"det [[a, b], [c, d]] = ad - bc","use":"Determinant of a 2 x 2 matrix"},{"eq":"A inverse = adj(A) / det(A)","use":"Inverse of a square matrix"},{"eq":"Area of triangle = (1/2) |det of the coordinate matrix|","use":"Area from vertices"},{"eq":"A(adj A) = (adj A) A = det(A) I","use":"Adjoint identity"},{"eq":"Cramer's rule: x = det(Dx) / det(D)","use":"Solving linear equations with a non-zero determinant"}],"concepts":[{"title":"Determinants and when a matrix can be inverted","analogy":"A lock that only opens with the right combination. A zero determinant means the matrix collapses space, so it cannot be undone.","body":["A square matrix has an inverse exactly when its determinant is non-zero.","Expanding along a row uses cofactors: each element multiplied by its signed minor."],"example":{"q":"Find the determinant of [[2, 1], [5, 3]].","a":"2 x 3 - 1 x 5 = 1, which is non-zero, so the matrix is invertible."}},{"title":"Solving equations with matrices","analogy":"A pair of puzzle clues. Writing the equations as a grid lets you solve them in one step.","body":["A system AX = B has a unique solution when det(A) is non-zero, given by X = A inverse B.","If det(A) = 0, the system either has no solution or infinitely many, and a consistency test decides which."],"example":{"q":"Solve x + y = 3 and x - y = 1.","a":"Determinant of [[1, 1], [1, -1]] is -2. Solving gives x = 2, y = 1."}},{"title":"Area of a triangle with determinants","analogy":"Measuring a field by its corners. The determinant of the corner coordinates gives twice the area, with a sign that depends on the order of the corners.","body":["Put the three vertices (x, y) with a column of ones into a 3 x 3 matrix. Its determinant is twice the signed area.","Take the absolute value so the area is always positive."],"example":{"q":"Find the area of the triangle with vertices (0,0), (4,0), (0,3).","a":"Area = (1/2) x 4 x 3 = 6."}}]},"Permutations and Combinations":{"formulas":[{"eq":"P(n, r) = n! / (n - r)!","use":"Arrangements of r objects from n, order matters"},{"eq":"C(n, r) = n! / (r! (n - r)!)","use":"Selections of r objects from n, order does not matter"},{"eq":"C(n, r) = C(n, n - r)","use":"Symmetry of combinations"},{"eq":"Pascal: C(n, r) = C(n - 1, r - 1) + C(n - 1, r)","use":"Recurrence for combinations"}],"concepts":[{"title":"Permutation or combination?","analogy":"Choosing a team versus choosing a line-up. A team is a group, but a line-up has positions, so order changes the outcome.","body":["Ask whether the order of the chosen items changes the result. If it does, use permutations; if not, use combinations.","The fundamental principle of counting multiplies the number of ways for each independent step."],"example":{"q":"How many ways can a committee of 3 be picked from 8 people?","a":"C(8, 3) = 56, since the committee has no order."}},{"title":"Arrangements with restrictions","analogy":"Seating a family where two people must sit together. Treat the pair as one seat, then arrange the pair inside it.","body":["If certain objects must stay together, treat them as one unit and multiply by the arrangements inside the unit.","If objects must not be together, count all arrangements and subtract the ones where they are together."],"example":{"q":"In how many ways can 4 boys and 3 girls sit in a row if the 3 girls sit together?","a":"Treat the girls as one block: 5! x 3! = 120 x 6 = 720."}},{"title":"Distributing identical objects","analogy":"Placing identical dividers in a row of coins. The dividers split the coins into groups.","body":["The number of ways to put n identical items into r distinct boxes is C(n + r - 1, r - 1).","This follows from placing r - 1 dividers among the n items."],"example":{"q":"In how many ways can 5 identical sweets go into 3 boys?","a":"C(5 + 3 - 1, 3 - 1) = C(7, 2) = 21."}}]},"Binomial Theorem":{"formulas":[{"eq":"(a + b)^n = sum from r = 0 to n of C(n, r) a^(n-r) b^r","use":"Binomial expansion for positive integer n"},{"eq":"General term T(r+1) = C(n, r) a^(n-r) b^r","use":"Formula for any term"},{"eq":"Middle term: if n is even, T(n/2 + 1); if n is odd, the two terms T((n+1)/2) and T((n+3)/2)","use":"Middle term of an expansion"},{"eq":"Sum of coefficients = 2^n","use":"Put a = b = 1"}],"concepts":[{"title":"The general term","analogy":"A pattern in a row of tiles. Once you know the rule for one tile, every other tile follows.","body":["Each term has a binomial coefficient, a power of a, and a power of b, and the powers shift one step at a time.","To find a specific term, set the power of b to the required index and read off the coefficient."],"example":{"q":"Find the term containing x^3 in the expansion of (x + 2)^6.","a":"The power of x is 3 when r = 3 in the general term, so C(6, 3) times 2^3 times x^3 = 160 x^3."}},{"title":"Middle term","analogy":"The middle seat in a row of seats. For an even number of seats there is one middle seat, and for an odd number there are two.","body":["Count the terms: there are n + 1 terms, so an even n gives one middle term, and an odd n gives two.","The middle term is the one with the largest coefficient in most standard expansions."],"example":{"q":"Find the middle term of (1 + x)^8.","a":"n = 8 is even, so the middle term is T5 = C(8, 4) x^4 = 70 x^4."}},{"title":"Using special values","analogy":"Testing a machine with a simple input. Setting a and b to 1 reveals the total of all the coefficients.","body":["Putting x = 1 gives the sum of all coefficients; putting x = -1 gives the alternating sum, which is useful for even and odd parts.","These tricks solve many problems without expanding the whole expression."],"example":{"q":"Find the sum of the coefficients in (1 + x)^10.","a":"Set x = 1: 2^10 = 1024."}}]},"Sequence and Series":{"formulas":[{"eq":"Arithmetic: a_n = a + (n - 1) d, S_n = (n/2)(2a + (n - 1) d)","use":"nth term and sum of an arithmetic progression"},{"eq":"Geometric: a_n = a r^(n-1), S_n = a (r^n - 1) / (r - 1)","use":"nth term and sum of a geometric progression"},{"eq":"Infinite GP: S = a / (1 - r) for |r| < 1","use":"Sum to infinity"},{"eq":"AM = (a + b)/2, GM = sqrt(ab), and AM >= GM","use":"Means of two numbers"}],"concepts":[{"title":"Arithmetic and geometric progressions","analogy":"Saving money. An arithmetic progression adds the same amount each month, while a geometric progression multiplies the savings by the same factor each time.","body":["The common difference d defines an arithmetic progression, and the common ratio r defines a geometric one.","Identify the type by checking whether the difference or the ratio between consecutive terms stays constant."],"example":{"q":"Find the sum of the first 10 terms of 2, 4, 8, 16, ...","a":"r = 2, so S10 = 2 (2^10 - 1) / (2 - 1) = 2046."}},{"title":"Inserting means","analogy":"Filling the gaps between two stepping stones with evenly spaced stones. The means are the stones placed between the two ends.","body":["To insert k arithmetic means between a and b, use common difference d = (b - a) / (k + 1).","To insert k geometric means, use ratio r = (b / a) raised to the power 1 / (k + 1)."],"example":{"q":"Insert 3 arithmetic means between 2 and 10.","a":"d = (10 - 2)/4 = 2, so the means are 4, 6, 8."}},{"title":"Sum to infinity","analogy":"Each step covers half the remaining distance to a wall. The steps get smaller, and the total stops short of the wall at a finite distance.","body":["A geometric series converges only when the absolute value of the ratio is less than 1.","Once the ratio is outside that range, the sum to infinity does not exist."],"example":{"q":"Find the sum to infinity of 1 + 1/2 + 1/4 + ...","a":"a = 1, r = 1/2, so S = 1 / (1 - 1/2) = 2."}}]},"Limit, Continuity and Differentiability":{"formulas":[{"eq":"Limit of sin x / x as x tends to 0 is 1","use":"Standard limit"},{"eq":"Limit of (1 + 1/x)^x as x tends to infinity is e","use":"Definition of e"},{"eq":"d/dx (x^n) = n x^(n-1); d/dx (sin x) = cos x; d/dx (e^x) = e^x; d/dx (ln x) = 1/x","use":"Basic derivatives"},{"eq":"Product rule: (uv)' = u'v + uv'; Quotient rule: (u/v)' = (u'v - uv') / v^2","use":"Differentiating products and quotients"},{"eq":"Chain rule: dy/dx = (dy/du)(du/dx)","use":"Differentiating composite functions"}],"concepts":[{"title":"Limits and continuity","analogy":"Approaching a bus stop. A limit is where the bus is heading, which can be different from where it stops if the road is broken.","body":["A function is continuous at a point when the left limit, right limit and value at that point all agree.","Algebra often removes a 0 over 0 form before taking the limit, by factorising or using a standard limit."],"example":{"q":"Find the limit of (x^2 - 4) / (x - 2) as x tends to 2.","a":"Factorise: (x - 2)(x + 2) / (x - 2) = x + 2, so the limit is 4."}},{"title":"Differentiability","analogy":"A road with a sharp corner. You can walk along it, but there is no single direction at the corner, so a derivative does not exist there.","body":["A function is differentiable at a point when the left and right derivatives agree there. Differentiability implies continuity, but not the other way round.","Corners and cusps are continuous but not differentiable."],"example":{"q":"Is f(x) = |x| differentiable at x = 0?","a":"No. The left derivative is -1 and the right derivative is +1, so they do not agree."}},{"title":"Applications: rates and extrema","analogy":"Tracking the peak of a hill. The derivative tells you when you are going uphill, flat or downhill.","body":["A function increases where its derivative is positive and decreases where it is negative. Maxima and minima occur where the derivative is zero, and the second derivative tells which.","Rate of change problems use the derivative directly."],"example":{"q":"Find the maximum of f(x) = x^2 (6 - x) for x between 0 and 6.","a":"f'(x) = 12x - 3x^2 = 0 at x = 4, and f''(4) is negative, so the maximum is f(4) = 32."}}]},"Integral Calculus":{"formulas":[{"eq":"Integral of x^n dx = x^(n+1)/(n+1) + C, n not equal to -1","use":"Power rule"},{"eq":"Integral of 1/x dx = ln |x| + C","use":"Logarithm rule"},{"eq":"Integration by parts: Integral of u dv = uv - Integral of v du","use":"Product integrals"},{"eq":"Integral from a to b of f(x) dx = F(b) - F(a)","use":"Fundamental theorem of calculus"},{"eq":"Integral of 1/(x^2 + a^2) dx = (1/a) arctan(x/a) + C","use":"Standard form"}],"concepts":[{"title":"Reversing the derivative","analogy":"Unpacking a parcel. Integration undoes differentiation, and the constant C is the missing piece you never see in the parcel.","body":["Integration finds a function whose derivative is the given one, up to an added constant C.","Most integrals reduce to standard forms through substitution or a known identity."],"example":{"q":"Find the integral of 3x^2 dx.","a":"x^3 + C."}},{"title":"Substitution and parts","analogy":"Swapping a hard tool for an easier one. Substitution changes the variable to simplify, and parts splits a product into a part you can differentiate and a part you can integrate.","body":["Choose the substitution that makes the derivative of the substituted part appear in the integrand.","For integration by parts, pick u as the function that becomes simpler when differentiated; a common order is logarithm, inverse trig, algebraic, trig, exponential."],"example":{"q":"Find the integral of x e^x dx.","a":"Let u = x and dv = e^x dx, so the result is x e^x - e^x + C."}},{"title":"Definite integrals and areas","analogy":"Measuring the area under a hill by slicing it into thin strips and adding them up.","body":["Evaluate the antiderivative at the upper limit and subtract its value at the lower limit.","The area between two curves is the integral of the upper function minus the lower one, over the interval where they bound a region."],"example":{"q":"Find the area under y = x^2 from 0 to 3.","a":"Integral from 0 to 3 of x^2 dx = 27/3 = 9."}}]},"Differential Equations":{"formulas":[{"eq":"Separable: dy/dx = f(x) g(y), so integral of dy/g(y) = integral of f(x) dx","use":"Separation of variables"},{"eq":"Linear first order: dy/dx + p(x) y = q(x), integrating factor e^(integral of p dx)","use":"Linear equation solution"},{"eq":"Order is the highest derivative present; degree is the power of that highest derivative","use":"Classifying a differential equation"},{"eq":"Homogeneous: substitute y = vx, so dy/dx = v + x dv/dx","use":"Homogeneous equations"}],"concepts":[{"title":"Separating variables","analogy":"Sorting laundry into two baskets. Put all the y terms on one side and all the x terms on the other, then integrate each side.","body":["Rearrange so that every term containing y sits with dy and every term containing x sits with dx.","Integrating both sides gives a general solution, with one constant C."],"example":{"q":"Solve dy/dx = x / y.","a":"y dy = x dx, so y^2/2 = x^2/2 + C, or y^2 - x^2 = constant."}},{"title":"Linear equations and integrating factors","analogy":"Multiplying a sum by a factor so it becomes one clean derivative. The integrating factor makes the left side collapse into a single product rule term.","body":["For dy/dx + p(x) y = q(x), multiply both sides by e to the power of the integral of p, which turns the left side into the derivative of y times that factor.","Integrate both sides, then divide by the factor to get y."],"example":{"q":"Solve dy/dx + y = e^x.","a":"The integrating factor is e^x, so y e^x = (e^(2x))/2 + C, giving y = e^x/2 + C e^(-x)."}},{"title":"Order and degree","analogy":"Classifying a building by its tallest floor and the number of stairs leading to it.","body":["The order is the highest derivative that appears, and the degree is the power of that derivative after the equation is free of fractions and radicals in its derivatives.","A non-polynomial function of a derivative means the degree is not defined."],"example":{"q":"Find the order and degree of (d^2y/dx^2)^3 + dy/dx = 0.","a":"Order 2, degree 3."}}]},"Co-ordinate Geometry":{"formulas":[{"eq":"Distance between (x1, y1) and (x2, y2) = sqrt((x2 - x1)^2 + (y2 - y1)^2)","use":"Distance formula"},{"eq":"Section formula: ((m x2 + n x1)/(m + n), (m y2 + n y1)/(m + n))","use":"Point dividing a segment in the ratio m:n"},{"eq":"Slope m = (y2 - y1)/(x2 - x1); lines parallel if slopes are equal, perpendicular if m1 m2 = -1","use":"Slope relations"},{"eq":"Distance from point (x1, y1) to line ax + by + c = 0: |a x1 + b y1 + c| / sqrt(a^2 + b^2)","use":"Point to line distance"},{"eq":"Circle: (x - h)^2 + (y - k)^2 = r^2","use":"Standard equation of a circle"}],"concepts":[{"title":"Lines and their equations","analogy":"Choosing the right form of a map. The same line can be described in several forms, and each form makes a different question easier.","body":["Use the slope-intercept form y = mx + c when the slope is known, the two-point form when two points are given, and the general form ax + by + c = 0 for most distance and intersection questions.","The intersection of two lines is found by solving their equations together."],"example":{"q":"Find where y = 2x + 1 and y = -x + 4 meet.","a":"2x + 1 = -x + 4, so x = 1 and y = 3, giving the point (1, 3)."}},{"title":"Circles","analogy":"Drawing a ring around a fixed point. Every point on the ring is the same distance from the centre.","body":["A circle is the set of points at a fixed distance r from its centre (h, k). The general form x^2 + y^2 + 2gx + 2fy + c = 0 has centre (-g, -f) and radius sqrt(g^2 + f^2 - c).","A line can meet a circle at 0, 1 or 2 points, depending on the distance from the centre to the line."],"example":{"q":"Find the centre and radius of x^2 + y^2 - 4x + 6y - 3 = 0.","a":"Centre (2, -3), radius sqrt(4 + 9 + 3) = 4."}},{"title":"Conic sections","analogy":"Slicing a cone at different angles. The slice gives a circle, ellipse, parabola or hyperbola, depending on the angle.","body":["A parabola is the set of points equidistant from a focus and a directrix, the ellipse has two foci with a constant sum of distances, and the hyperbola has a constant difference.","Standard forms make the focus, directrix and axis easy to read off."],"example":{"q":"Find the focus of y^2 = 8x.","a":"Comparing with y^2 = 4ax gives a = 2, so the focus is (2, 0)."}}]},"Three Dimensional Geometry":{"formulas":[{"eq":"Distance between (x1, y1, z1) and (x2, y2, z2) = sqrt((x2 - x1)^2 + (y2 - y1)^2 + (z2 - z1)^2)","use":"Distance in space"},{"eq":"Direction cosines l, m, n satisfy l^2 + m^2 + n^2 = 1","use":"Direction cosines of a line"},{"eq":"Direction cosines = a/R, b/R, c/R, where R = sqrt(a^2 + b^2 + c^2)","use":"From direction ratios a, b, c"},{"eq":"cos(theta) = |a1 a2 + b1 b2 + c1 c2| / (sqrt(a1^2 + b1^2 + c1^2) sqrt(a2^2 + b2^2 + c2^2))","use":"Angle between two lines"},{"eq":"Shortest distance between skew lines = |(a2 - a1) . (b1 x b2)| / |b1 x b2|","use":"Distance between skew lines"}],"concepts":[{"title":"Points, lines and direction","analogy":"Giving directions in a building. You need a floor, a corridor and a room, and direction ratios tell you which way a line runs.","body":["A line in space is fixed by a point on it and a direction. Direction ratios are any three numbers proportional to the direction, and direction cosines are the normalised version.","Direction cosines always satisfy l squared plus m squared plus n squared equal to 1."],"example":{"q":"Find the direction cosines of a line with direction ratios 2, 3, 6.","a":"R = sqrt(4 + 9 + 36) = 7, so the direction cosines are 2/7, 3/7 and 6/7."}},{"title":"Angle between lines","analogy":"Comparing two arrows. The angle depends only on how they point, not where they start.","body":["The angle between two lines is found from their direction ratios using the dot product of the direction vectors.","Perpendicular lines give a zero dot product."],"example":{"q":"Find the angle between lines with direction ratios (1, 0, 0) and (0, 1, 0).","a":"cos(theta) = 0, so theta = 90 degrees."}},{"title":"Skew lines and shortest distance","analogy":"Two wires in a room that never meet, one above the other. The shortest gap between them is a straight line perpendicular to both.","body":["Skew lines are non-parallel lines that do not intersect. The shortest distance between them is measured along the line perpendicular to both.","The formula uses the cross product of the two direction vectors to find that perpendicular direction."],"example":{"q":"Find the distance between the points (1, 2, 3) and (4, 6, 3).","a":"sqrt(9 + 16 + 0) = 5."}}]},"Vector Algebra":{"formulas":[{"eq":"a . b = |a| |b| cos(theta)","use":"Scalar (dot) product"},{"eq":"|a x b| = |a| |b| sin(theta)","use":"Magnitude of the vector (cross) product"},{"eq":"Area of triangle = (1/2) |a x b| for two sides a and b meeting at a vertex","use":"Area using the cross product"},{"eq":"Scalar projection of a on b = (a . b) / |b|","use":"Component of a along b"},{"eq":"a . (b x c) = scalar triple product, equal to the volume of the parallelepiped","use":"Volume and coplanarity"}],"concepts":[{"title":"Dot product measures alignment","analogy":"Pushing a trolley. The effective push is only the part aimed along the direction you want it to move.","body":["The dot product is large when two vectors point the same way and zero when they are perpendicular.","It gives the projection of one vector along the other, and it tests whether two vectors are perpendicular."],"example":{"q":"Find a . b for a = (1, 2, 3) and b = (2, -1, 1).","a":"2 - 2 + 3 = 3."}},{"title":"Cross product gives a perpendicular vector","analogy":"The axis of a spinning wheel. The cross product points along the axis that is perpendicular to both directions.","body":["The cross product of two vectors is perpendicular to both, and its magnitude is the area of the parallelogram they span.","Swapping the order reverses its direction."],"example":{"q":"Find the area of the triangle with sides a = (1, 2, 3) and b = (2, -1, 1) meeting at a vertex.","a":"a x b = (5, 5, -5), |a x b| = 5 sqrt(3), so the area is (5/2) sqrt(3)."}},{"title":"Components and the triple product","analogy":"Breaking a diagonal push into a sideways push and a forward push. Components split a vector along chosen directions.","body":["Any vector can be written as a sum of components along the x, y and z axes.","The scalar triple product is zero when the three vectors are coplanar, which is a quick test of coplanarity."],"example":{"q":"What is the scalar projection of a = (1, 2, 3) on b = (2, -1, 1)?","a":"a . b / |b| = 3 / sqrt(6)."}}]},"Statistics and Probability":{"formulas":[{"eq":"Mean = sum of x / n (ungrouped)","use":"Arithmetic mean"},{"eq":"Variance = (sum of (x - mean)^2) / n","use":"Population variance"},{"eq":"Standard deviation = sqrt(variance)","use":"Spread of data"},{"eq":"P(A or B) = P(A) + P(B) - P(A and B)","use":"Addition theorem"},{"eq":"P(A given B) = P(A and B) / P(B)","use":"Conditional probability"},{"eq":"Bayes' theorem: P(Ai given B) = P(B given Ai) P(Ai) / sum of P(B given Aj) P(Aj)","use":"Reversing conditional probability"},{"eq":"E(X) = sum of x p(x)","use":"Expected value of a random variable"}],"concepts":[{"title":"Measures of spread","analogy":"A class with the same average marks but very different results. The spread shows whether everyone scored close to the average or some scored far above and below it.","body":["Variance measures the average squared distance from the mean. Taking the square root gives standard deviation, which is in the same units as the data.","Mean deviation averages the absolute distances from the mean instead of the squares."],"example":{"q":"Find the variance of 2, 4, 6.","a":"Mean = 4, squared deviations 4, 0, 4, sum 8, so variance = 8 / 3."}},{"title":"Addition and multiplication of probability","analogy":"Choosing from a menu. Adding two options counts the overlap only once, and multiplying two independent choices counts each pairing.","body":["For mutually exclusive events the overlap is zero, so P(A or B) is just the sum.","Independent events satisfy P(A and B) = P(A) P(B)."],"example":{"q":"A die shows an even number or a number greater than 4. Find the probability.","a":"Even: 2, 4, 6; greater than 4: 5, 6; overlap 6. P = (3 + 2 - 1)/6 = 4/6 = 2/3."}},{"title":"Bayes' theorem","analogy":"Working out which of two boxes a red ball came from. You weight each box by how likely it was to be chosen, then by how likely it was to hold a red ball.","body":["Use Bayes' theorem to update a probability after seeing evidence. Compute the joint probability for each possibility and divide by the total.","The random variable's expected value gives the long-run average outcome."],"example":{"q":"Box 1 and Box 2 are equally likely. Box 1 has a 0.5 chance of red, and Box 2 has 0.2. Given a red ball, find P(Box 1).","a":"(0.5 x 0.5) / (0.5 x 0.5 + 0.5 x 0.2) = 0.25 / 0.35 = 5/7."}}]},"Trigonometry":{"formulas":[{"eq":"sin^2(x) + cos^2(x) = 1","use":"Pythagorean identity"},{"eq":"sin(A + B) = sin A cos B + cos A sin B","use":"Addition formula"},{"eq":"cos(2x) = cos^2(x) - sin^2(x)","use":"Double angle formula"},{"eq":"sin^(-1)(x) + cos^(-1)(x) = pi / 2","use":"Inverse trig relation"},{"eq":"tan^(-1)(x) + tan^(-1)(y) = tan^(-1)((x + y) / (1 - xy)), for xy less than 1","use":"Adding inverse tangents"}],"concepts":[{"title":"Identities as tools","analogy":"Interchangeable plugs. Each identity lets you swap one expression for an equivalent one that fits the problem better.","body":["The core identities let you rewrite a trig expression in terms of sine or cosine alone, or in terms of a single angle.","Choose the identity that removes the unwanted term or combines the angles."],"example":{"q":"Simplify sin^2(x) + cos^2(x) + tan^2(x) when cos(x) is not zero.","a":"sin^2(x) + cos^2(x) = 1, so the expression is 1 + tan^2(x) = sec^2(x)."}},{"title":"Inverse trigonometric functions","analogy":"Reading a map backwards. Given the ratio, the inverse tells you the angle, but only within the range the function is defined to cover.","body":["Inverse functions have restricted ranges, such as arcsin in the range from minus pi over 2 to pi over 2.","The principal value is the answer inside that range, and a question may ask for it specifically."],"example":{"q":"Find the principal value of sin^(-1)(1/2).","a":"pi / 6, since sin(pi/6) = 1/2 and pi/6 is within the principal range."}},{"title":"Solving trigonometric equations","analogy":"Finding every stop on a circular route. The same position comes around again each full turn, so the solutions repeat.","body":["Trig equations have infinitely many solutions because the functions repeat. Write the general solution by adding multiples of the period.","Check whether the question asks for solutions in a given interval, which limits the count."],"example":{"q":"Solve sin(x) = 1/2 for x in the interval from 0 to 2 pi.","a":"x = pi/6 or 5pi/6."}}]}};
function chIcon(name){
  const d = CH_ICONS[name]; if(!d) return '';
  return '<span class="ch-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg></span>';
}
// Percentage tags: how much of the question bank a chapter makes up, computed live
function chapterWeight(s, c){
  const all = QUESTIONS.filter(q=>q.subject===s); if(!all.length) return null;
  const n = all.filter(q=>q.chapter===c).length; return n ? Math.round(n/all.length*100) : null;
}
// Rank booster chip for the glossary: same style as the PYQ weight tag
function rankTag(c){
  if(c!=='Organic Terms Glossary') return '';
  return '<span class="wt rb">Rank booster</span>';
}
function wtTag(s, c){
  const p = chapterWeight(s, c); if(p===null) return '';
  return '<span class="wt'+(p>=10?' hi':'')+'">'+(p>=10?'High yield · ':'')+p+'% of PYQs</span>';
}
function barRow(name, acc, meta, tag){
  return el('<div class="row" style="cursor:default"><div><div class="name">'+esc(name)+'</div>'+(tag||'')+'<div class="meta">'+esc(meta)+'</div></div>'
    +'<div class="end">'+(acc===null?'Not started':'<div class="bar"'+(SUBJ_VAR[name]?' style="--bar:'+SUBJ_VAR[name]+'"':'')+'><i style="width:'+acc+'%"></i></div><div style="margin-top:6px">'+acc+'%</div>')+'</div></div>');
}

 {id:'main', label:'JEE Main', sub:'JEE Main 2027, Paper 1 (B.E./B.Tech.)', subjects:JEE_MAIN_SYLLABUS},

let SYL_PAPER = 'main';
function examAdv(){ return !!(store.profile && store.profile.exam==='adv'); }
function sylPapersShown(){ return SYL_PAPERS.filter(p=>p.id!=='adv'||examAdv()); }

const TC_SMALL = new Set(['of','and','the','in','for','on','with','to','a','an','or','at','by','from','as','into','per','via','its','is']);
const TC_KEEP = {'Co-ordinate Geometry':1,'p-Block Elements':1,'d- and f-Block Elements':1,'Three Dimensional Geometry':1};
function tc(s){
  if(TC_KEEP[s]) return s;
  return s.split(' ').map((w,i)=>{
    const lw = w.toLowerCase();
    if(i>0 && TC_SMALL.has(lw)) return lw;
    return w.split('-').map(p=>p.charAt(0).toUpperCase()+p.slice(1)).join('-');
  }).join(' ');
}

function sylUnits(units){
  const list = el('<div class="list"></div>');
  units.forEach((u,i)=>{
    list.appendChild(el('<details class="syl-unit"><summary><span class="k">'+(i+1)+'</span><span>'+esc(tc(u.t))+'</span></summary><p class="syl-text">'+esc(u.x)+'</p></details>'));
  });
  return list;
}

function syllabusView(){
  const w = el('<div></div>');
  w.appendChild(el('<h1 class="title">Syllabus</h1>'));
  const paper = sylPapersShown().find(p=>p.id===SYL_PAPER) || SYL_PAPERS[0];
  w.appendChild(el('<p class="sub">'+esc(paper.sub)+'</p>'));

  const tabs = el('<div class="syl-tabs" role="tablist"></div>');
  sylPapersShown().forEach(p=>{
    const b = el('<button role="tab" aria-selected="'+(p.id===paper.id)+'" class="'+(p.id===paper.id?'on':'')+'">'+esc(p.label)+'</button>');
    b.onclick = ()=>{ SYL_PAPER = p.id; render(); };
    tabs.appendChild(b);
  });
  w.appendChild(tabs);
  w.appendChild(chapterMap());

  if(!paper.subjects){
    w.appendChild(el('<div class="card empty" style="margin-top:14px">JEE Advanced syllabus is not added yet.</div>'));
    return w;
  }

  paper.subjects.forEach(sub=>{
    const count = sub.sec.reduce((n,x)=>n+x.u.length,0);
    const d = el('<details class="syl-subject"><summary><span>'+esc(tc(sub.s))+'</span><span class="k">'+count+' units</span></summary></details>');
    sub.sec.forEach(sec=>{
      if(sec.h) d.appendChild(el('<div class="field" style="margin:14px 0 6px">'+esc(tc(sec.h))+'</div>'));
      d.appendChild(sylUnits(sec.u));
    });
    w.appendChild(d);
  });
  w.appendChild(el('<p class="note-line" style="margin-top:18px">Check the official NTA brochure for the current syllabus.</p>'));
  return w;
}

// ---------- Quote rotation ----------
// Rules: a quote changes every 60 to 90 minutes (random within that window). Each quote is shown once
// per cycle; a cycle ends only when every quote has been shown, then it starts again.
// A quote only counts as "shown" when the home screen actually renders it, so time spent with the
// app closed does not use up a quote.
const QUOTE_KEY = 'quote_rotation_v1';
const QUOTE_MIN_MS = 60*60e3, QUOTE_MAX_MS = 90*60e3;
function loadQuoteState(){
  let st = null;
  try{ st = JSON.parse(localStorage.getItem(QUOTE_KEY)); }catch(e){}
  st = st && typeof st === 'object' ? st : {seen:[], cur:null, nextAt:0};
  st.seen = (Array.isArray(st.seen) ? st.seen : []).filter(i => Number.isInteger(i) && i>=0 && i<QUOTES.length);
  if(!Number.isInteger(st.cur) || st.cur<0 || st.cur>=QUOTES.length) st.cur = null;
  st.nextAt = Number(st.nextAt) || 0;
  return st;
}
let quoteState = loadQuoteState();
function quoteDue(now = Date.now()){ return quoteState.cur === null || now >= quoteState.nextAt; }
function advanceQuote(now = Date.now()){
  const all = QUOTES.map((_,i)=>i);
  let pool = all.filter(i => quoteState.seen.indexOf(i) < 0);
  if(!pool.length){                        // every quote has been shown: start a new cycle
    quoteState.seen = [];
    pool = all.filter(i => i !== quoteState.cur);
    if(!pool.length) pool = all;
  }
  const pick = shuffle(pool)[0];
  quoteState.seen.push(pick);
  quoteState.cur = pick;
  quoteState.nextAt = now + QUOTE_MIN_MS + Math.random() * (QUOTE_MAX_MS - QUOTE_MIN_MS);
  try{ localStorage.setItem(QUOTE_KEY, JSON.stringify(quoteState)); }catch(e){}
}
// Refresh the quote on screen while the app stays open on the home view.
setInterval(()=>{ if(view === 'home' && store.profile && (quoteDue() || window.__hour !== new Date().getHours())) render(); }, 60000);

function quoteCard(){
  if(quoteDue()) advanceQuote();
  const Q = QUOTES[quoteState.cur];
  const card = el('<figure class="qcard" aria-label="Thought for the day">'
    +'<span class="qmark" aria-hidden="true">\u201C</span>'
    +'<div class="eyebrow">Thought for the day</div>'
    +'<blockquote class="qtext">'+esc(Q.q)+'</blockquote>'
    +'<figcaption class="qauth"><span>'+esc(Q.a)+'</span>'+(Q.s?'<em>'+esc(Q.s)+'</em>':'')+'</figcaption></figure>');
  setTimeout(()=>fitQuote(card), 0);
  return card;
}
// The quote text takes the largest size at which the whole card still ends at the bottom of the screen.
function fitQuote(card){
  if(!card || !card.isConnected) return;
  const t = card.querySelector('.qtext'); if(!t) return;
  const limit = window.innerHeight - 16;
  const fits = ()=> card.getBoundingClientRect().bottom <= limit;
  // Phones get a lower ceiling so the quote stays a readable size; wide screens can go larger
  let lo = 14, hi = window.innerWidth < 760 ? 30 : 84;
  for(let i = 0; i < 14; i++){
    const mid = (lo + hi) / 2;
    t.style.fontSize = mid + 'px';
    if(fits()) lo = mid; else hi = mid;
  }
  t.style.fontSize = lo + 'px';
}
let quoteResizeBound = false;
function bindQuoteResize(){
  if(quoteResizeBound) return; quoteResizeBound = true;
  window.addEventListener('resize', ()=>{ const c = document.querySelector('figure.qcard'); if(c) fitQuote(c); });
}

function daysLeft(iso){ return Math.ceil((new Date(iso+'T00:00:00') - new Date()) / 864e5); }
// Any subject counts toward the goal; it counts questions answered today

  const today = dayKey();
  const done = new Set(store.attempts.filter(a=>a.d===today && !a.skipped && (a.c===true||a.c===false)).map(a=>a.q)).size;
  const pct = Math.min(100, Math.round(done/DAILY_GOAL*100));
  const exams = EXAMS.map(x=>'<span class="exam-chip"><b>'+daysLeft(x.date)+'</b> days to '+esc(x.name)+'</span>').join('');
  return el('<div class="card dgoal'+(done>=DAILY_GOAL?' st-ok':'')+'"><div class="dg-top"><div><div class="eyebrow">Daily goal</div>'
    +'<div class="dg-num">'+done+'<span> / '+DAILY_GOAL+' questions</span></div></div></div>'

const MISTAKE_TYPES = [['sign','Sign slip'],['unit','Unit slip'],['misread','Misread the question'],['concept','Concept gap'],['calc','Calculation slip'],['careless','Careless']];
const CH_STORY = {
 'Units and Measurements': 'Every number in physics carries a unit, and the units must agree before anything else happens.',
 'Kinematics': 'Motion is change of position over time, and every graph is a story about that change.',
 'Laws of Motion': 'A force is a push or pull; the same push changes a light object far more than a heavy one.',
 'Work, Energy and Power': 'Energy is the currency of motion: work moves it from one place to another.',
 'Rotational Motion': 'Rotation is motion where distance from the axis matters as much as the push itself.',
 'Gravitation': 'Everything pulls on everything, and the pull weakens with distance in a precise way.',
 'Properties of Solids and Liquids': 'Solids spring back when stretched, and liquids flow, but both push back in their own way.',
 'Thermodynamics': 'Heat and work are two ways of moving energy; the system keeps a careful account of both.'
};
function mistakeMirrorUI(q, parent){
  store.mistakes = store.mistakes || {};
  const cur = store.mistakes[q.id] || {type:null, text:''};
  const curTypes = Array.isArray(cur.types) ? cur.types : (cur.type ? [cur.type] : []);
  parent.appendChild(el('<div class="field">Mistake Mirror</div>'));
  parent.appendChild(el('<div class="note-line" style="margin:0 0 8px">If you got it wrong, name the slip. Patterns in your slips matter more than any single one.</div>'));
  const chips = el('<div class="chips"></div>');
  MISTAKE_TYPES.forEach(m=>{
    const on = curTypes.indexOf(m[0]) >= 0;
    const b = el('<button class="chip '+(on?'on':'')+'" aria-pressed="'+(on?'true':'false')+'">'+esc(m[1])+'</button>');
    b.onclick = ()=>{
      const next = on ? curTypes.filter(t=>t!==m[0]) : curTypes.concat([m[0]]);
      store.mistakes[q.id] = Object.assign({}, cur, {types: next, type: next[0] || null, d: dayKey()});
      persist(); render();
    };
    chips.appendChild(b);
  });
  parent.appendChild(chips);
  const ta = el('<textarea placeholder="What exactly went wrong? One line is enough."></textarea>');
  ta.value = cur.text || '';
  parent.appendChild(ta);
  const sv = el('<button class="linkish">Save mirror note</button>');
  sv.onclick = ()=>{ store.mistakes[q.id] = Object.assign({}, cur, {text: ta.value.trim(), d: dayKey()}); if(!store.mistakes[q.id].text && !(store.mistakes[q.id].types||[]).length && !store.mistakes[q.id].type) delete store.mistakes[q.id]; persist(); sv.innerText = 'Saved'; };
  parent.appendChild(sv);
}
// Logic: the chapters and subtopics this question draws on, and what each covers here
function logicBlock(q, parent){
  const subs = Array.isArray(q.subtopics) && q.subtopics.length ? q.subtopics : [{chapter:q.chapter, subtopic:q.topic || q.chapter}];
  const chs = Array.isArray(q.chapters) && q.chapters.length ? q.chapters : [q.chapter];
  parent.appendChild(el('<div class="field">Logic used</div>'));
  parent.appendChild(el('<div class="note-line" style="margin:0 0 6px">Chapters: '+esc(chs.join(', '))+'</div>'));
  subs.forEach(x=>parent.appendChild(el('<div class="logic-row"><b>'+esc(x.subtopic)+'</b><span>'+esc(x.chapter)+'</span></div>')));
}
function patternsPart(){
  const w = el('<div></div>');
  const counts = {};
  Object.values(store.mistakes || {}).forEach(m=>{ const ts = Array.isArray(m.types) ? m.types : (m.type ? [m.type] : []); ts.forEach(t=>{ counts[t] = (counts[t]||0)+1; }); });
  const ranked = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const card = el('<div class="card"><div class="eyebrow">Your top slips</div></div>');
  if(!ranked.length) card.appendChild(el('<p class="note-line">No mistakes named yet. Name a slip under a wrong answer to start seeing patterns.</p>'));
  ranked.forEach(([k,n])=>{ const lab = (MISTAKE_TYPES.find(m=>m[0]===k)||[k,k])[1]; card.appendChild(el('<div class="fx-row"><div class="fx-eq">'+esc(lab)+'</div><div class="meta">'+n+' time'+(n>1?'s':'')+'</div></div>')); });
  w.appendChild(card);
  const sure = {n:0, ok:0}, guess = {n:0, ok:0};
  store.attempts.forEach(a=>{ if(a.conf==='sure'){ sure.n++; if(a.c) sure.ok++; } else if(a.conf==='guess'){ guess.n++; if(a.c) guess.ok++; } });
  w.appendChild(el('<div class="eyebrow" style="margin:14px 0 10px">Confidence calibration</div>'));
  w.appendChild(calCardEl('When you were sure', sure, 'var(--c-phys)'));
  w.appendChild(calCardEl('When you were guessing', guess, 'var(--c-medium)'));
  const gap = sure.n && guess.n ? Math.abs(Math.round(sure.ok/sure.n*100) - Math.round(guess.ok/guess.n*100)) : null;
  w.appendChild(el('<div class="cal-note">'+(gap===null
    ? 'Answer a few questions with both confidence levels to see your calibration.'
    : 'The gap between these two is '+gap+' points. The smaller the gap, the better you judge your own answers. Guessing is cheap only when you know you are guessing.')+'</div>'));
  return w;
}
// One calibration card: the share right as the largest figure, with a bar of right against wrong
function calCardEl(title, o, tone){
  const has = o.n > 0;
  const p = has ? Math.round(o.ok/o.n*100) : 0;
  const wrong = o.n - o.ok;
  return el('<div class="cal-card" style="--ec:'+tone+'"><i class="exam-orb" aria-hidden="true"></i>'
    +'<div class="eyebrow">'+esc(title)+'</div>'
    +'<div class="cal-num">'+(has ? p+'<span>%</span>' : '<span class="cal-empty">no data</span>')+'</div>'
    +'<div class="cal-sub">'+(has ? o.ok+' right out of '+o.n+' answers' : 'Nothing recorded yet')+'</div>'
    +'<div class="cal-bar" role="img" aria-label="'+o.ok+' right, '+wrong+' wrong"><i class="cal-right" style="width:'+p+'%"></i></div>'
    +'<div class="cal-legend"><span><i class="lg ok"></i>Right '+o.ok+'</span><span><i class="lg bad"></i>Wrong '+wrong+'</span></div></div>');
}
// Exam-day mode: 15 hard questions per subject, in subject blocks.
// Hard and unattempted first. Only when those run out, hard questions this student got wrong (the mistake bank).
// Never filled with easier questions. One clock for the whole paper, two minutes a question.
const EXAM_PER_SUBJECT = 15;
function examDayPick(){
  const attempted = new Set(store.attempts.map(a=>a.q));
  const missed = new Set(store.errorLog || []);
  const isHard = q => String(q.difficulty||'').toLowerCase() === 'hard';
  const queue = [], short = [];
  SUBJECTS.forEach(sub=>{
    const hard  = QUESTIONS.filter(q=>q.subject===sub && isHard(q));
    const fresh = shuffle(hard.filter(q=>!attempted.has(q.id)));
    const bank  = shuffle(hard.filter(q=>attempted.has(q.id) && missed.has(q.id)));
    const picked = fresh.concat(bank).slice(0, EXAM_PER_SUBJECT);
    if(picked.length < EXAM_PER_SUBJECT) short.push(sub+' has '+picked.length);
    queue.push(...picked);
  });
  return {queue, short};
}
function startExamDay(){
  const {queue, short} = examDayPick();
  if(!queue.length){ appNotice('No hard questions yet', 'There are no hard questions for exam-day mode yet.'); return; }
  const go0 = ()=>startSession({mode:'pyq', title:'Exam-day mode', queue, limit:queue.length*120});
  if(short.length){
    appDialog({eyebrow:'Heads up', title:'Not enough hard questions yet', body:'Short on: '+short.join(', ')+'. Start with what is available?', ok:'Start anyway', cancel:'Go back'})
      .then(ok=>{ if(ok) go0(); });
    return;
  }
  go0();
}
function storyCard(c){
  if(!CH_STORY[c] || (store.storySeen||{})[c]) return null;
  const card = el('<div class="card story"><div class="eyebrow">Chapter story</div><p class="nt-p">'+esc(CH_STORY[c])+'</p></div>');
  const dismiss = el('<button class="linkish">Got it</button>');
  dismiss.onclick = ()=>{ store.storySeen = store.storySeen || {}; store.storySeen[c] = true; persist(); card.remove(); };
  card.appendChild(dismiss);
  return card;
}
function fcardEl(f, chapter){
  const d = el('<div class="fcard" role="button" tabindex="0" aria-label="Open formula"><div class="fcard-eq">$'+texify(f.eq)+'$</div><div class="fcard-use">'+esc(f.use)+'</div><div class="fcard-ch">'+esc(chapter)+'</div>'+(f.oos?'<div class="oos-tag">Not in JEE Main syllabus</div>':'')+'</div>');
  d.onclick = (e)=>{ e.stopPropagation(); openFcard(d, f, chapter); };
  setTimeout(()=>fitEq(d.querySelector('.fcard-eq')), 60);
  return d;
}
let fcOpen = null;
// Shrinks a formula to fit its card width. Formulas never scroll: a small card makes the formula smaller instead.
function fitEq(eqEl){
  if(!eqEl || eqEl.closest('.fc-travel.fc-open')) return;
  const k = eqEl.querySelector('.katex') || eqEl;
  let fs = 17; eqEl.style.fontSize = fs+'px';
  while(k.getBoundingClientRect().width > eqEl.clientWidth - 2 && fs > 9){ fs--; eqEl.style.fontSize = fs+'px'; }
}
function escFc(e){ if(e.key==='Escape') closeFcard(); }
function openFcard(src, f, chapter){
  if(fcOpen) return;
  const r = src.getBoundingClientRect();
  // A placeholder keeps the card's place in the grid, while the card itself travels to the centre
  const ph = el('<div class="fc-ph"></div>');
  ph.style.width = r.width+'px'; ph.style.height = r.height+'px';
  src.parentNode.insertBefore(ph, src);
  const back = el('<div class="fc-back"></div>');
  document.body.appendChild(back);
  document.body.appendChild(src);
  const origClick = src.onclick;
  src.classList.add('fc-travel');
  src.style.left = r.left+'px'; src.style.top = r.top+'px'; src.style.width = r.width+'px'; src.style.height = r.height+'px';
  fcOpen = {src, ph, back, origClick};
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    back.classList.add('on');
    src.classList.add('fc-open');
    const w = Math.min(window.innerWidth-32, 560), h = Math.min(window.innerHeight*0.6, 360);
    src.style.left = ((window.innerWidth-w)/2)+'px'; src.style.top = ((window.innerHeight-h)/2)+'px';
    src.style.width = w+'px'; src.style.height = h+'px';
  }));
  src.onclick = e=>{ e.stopPropagation(); closeFcard(); };
  back.onclick = closeFcard;
  document.addEventListener('keydown', escFc);
}
function closeFcard(){
  if(!fcOpen) return;
  const o = fcOpen; fcOpen = null;
  document.removeEventListener('keydown', escFc);
  const rr = o.ph.getBoundingClientRect();     // the card flies back to its own slot
  o.back.classList.remove('on');
  o.src.classList.remove('fc-open');
  o.src.style.left = rr.left+'px'; o.src.style.top = rr.top+'px';
  o.src.style.width = rr.width+'px'; o.src.style.height = rr.height+'px';
  setTimeout(()=>{
    o.ph.replaceWith(o.src);
    o.src.classList.remove('fc-travel');
    o.src.removeAttribute('style');
    o.src.onclick = o.origClick;
    fitEq(o.src.querySelector('.fcard-eq'));
    o.back.remove();
  }, 520);
}
