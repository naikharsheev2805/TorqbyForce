ries, every resistor carries the same current and the voltages share the battery. The total resistance is larger than any single one.","In parallel, every resistor sees the same voltage and the currents share. The total resistance is smaller than the smallest one, so a parallel pair always lowers the resistance."],"example":{"q":"A 2 ohm and a 3 ohm resistor are connected in parallel. What is the equivalent resistance?","a":"1/R = 1/2 + 1/3 = 5/6, so R = 6/5 = 1.2 ohm. It is smaller than both 2 ohm and 3 ohm, as expected."}},{"title":"Power is the rate at which the circuit uses energy","analogy":"A heater is a water pump in reverse: electrical energy is paid in, and heat comes out. The power, in watts, tells you how fast the bill runs.","body":["The power dissipated in a resistor can be written as VI, I squared R or V squared over R. Choose the form that matches what you know.","Household appliances are rated in watts at a fixed voltage. A 1100 W heater on a 220 V supply draws 5 A, and its resistance is 44 ohm."],"example":{"q":"A 1100 W heater runs on 220 V. What current does it draw, and what is its resistance?","a":"I = P/V = 1100/220 = 5 A. R = V^2 / P = 220^2 / 1100 = 44 ohm."}},{"title":"A real battery has internal resistance","analogy":"A battery is a pump with a small leak inside. Some of the energy it pumps is lost inside the pump itself, so less reaches the outside circuit as the current grows.","body":["The EMF E is the energy given per unit charge by the cell. The terminal voltage is what you measure across the outside circuit: V = E - Ir.","Terminal voltage falls as the current rises, and it equals the EMF only when no current is drawn."],"example":{"q":"A cell has EMF 12 V and internal resistance 1 ohm. It drives a 5 ohm resistor. What is the current, and what is the terminal voltage?","a":"I = E / (R + r) = 12 / 6 = 2 A. Terminal voltage V = 12 - 2 x 1 = 10 V, which also equals 2 x 5."}},{"title":"Kirchhoff's laws: current and energy are both conserved","analogy":"Water at a junction in a pipe network. What flows in must flow out. Going once around any closed loop, the pressure gained from pumps must equal the pressure lost across the pipes.","body":["At any junction, the sum of currents in equals the sum out. This is the current law, a consequence of charge conservation.","Around any closed loop, the sum of EMFs equals the sum of I R drops. This is the voltage law, a consequence of energy conservation. Choose a direction for each current and keep to it."],"example":{"q":"A 6 V battery, with no internal resistance, drives a 2 ohm and a 4 ohm resistor in series. What is the current?","a":"Loop law: 6 = I (2 + 4), so I = 1 A. The voltage across the 2 ohm is 2 V and across the 4 ohm is 4 V, adding to 6 V."}},{"title":"The Wheatstone bridge: find an unknown by balancing","analogy":"Two seesaws with pivots at the same ratio. When the pivots are balanced, the middle bar does not tilt, and that means no current flows through the galvanometer.","body":["Four resistors form a diamond with a galvanometer across the middle. When P/Q = R/S, the two midpoints are at the same potential and the galvanometer reads zero.","Once balanced, the unknown resistor follows from the other three: S = R Q / P. This is the principle behind the meter bridge."],"example":{"q":"In a balanced bridge P = 10 ohm, Q = 20 ohm and R = 5 ohm. What is S?","a":"P/Q = R/S gives S = R Q / P = 5 x 20 / 10 = 10 ohm."}}]},"Electrostatics":{"formulas":[{"eq":"F = \\frac{k\\,q_1 q_2}{r^{2}}, \\quad k = 9\\times10^{9}","use":"Coulomb's law: force between two point charges (attractive if opposite signs)"},{"eq":"E = \\frac{F}{q_0} = \\frac{kQ}{r^{2}}","use":"Electric field of a point charge Q at distance r"},{"eq":"V = \\frac{kQ}{r}","use":"Electric potential of a point charge, zero at infinity"},{"eq":"W = q\\,\\Delta V","use":"Work done moving a charge q through a potential difference"},{"eq":"\\Phi = \\frac{q_{enc}}{\\varepsilon_0}","use":"Gauss's law: total flux through a closed surface"},{"eq":"C = \\frac{\\varepsilon_0 A}{d}, \\quad C = \\frac{Q}{V}","use":"Capacitance of a parallel plate capacitor, and its definition"},{"eq":"U = \\tfrac{1}{2}CV^{2} = \\frac{Q^{2}}{2C}","use":"Energy stored in a charged capacitor"},{"eq":"C = K\\,C_0","use":"A dielectric of constant K multiplies the capacitance"}],"concepts":[{"title":"Like charges repel, unlike charges attract","analogy":"Gravity with two signs. Mass only pulls, but charge can push as well as pull, so the same inverse square law can attract or repel depending on the signs.","body":["Coulomb's law has the same inverse square shape as gravity. The force is along the line joining the charges, and it is the same size on each charge (Newton's third law still holds).","The constant k is enormous compared with G, which is why electric forces dominate atoms and molecules, while gravity dominates the sky."],"example":{"q":"A charge of +2 microcoulomb and -3 microcoulomb sit 0.3 m apart. What is the force?","a":"F = k q1 q2 / r^2 = 9 x 10^9 x 2 x 10^-6 x 3 x 10^-6 / 0.09 = 0.6 N, attractive because the signs are opposite."}},{"title":"The electric field is a force map per unit charge","analogy":"A wind map. At each point you draw an arrow showing which way and how hard a test charge would be pushed. Field lines start on positive charges, end on negative ones, and never cross.","body":["The field at a point is the force on a small positive test charge placed there, divided by that charge. Its direction is the direction a positive charge would move.","Denser field lines mean a stronger field. Between two oppositely charged plates the lines are straight and evenly spaced, which makes the field uniform."],"example":{"q":"What is the field 2 m from a charge of 4 microcoulomb?","a":"E = k Q / r^2 = 9 x 10^9 x 4 x 10^-6 / 4 = 9000 N/C, pointing away from the charge if it is positive."}},{"title":"Potential is the height of the electric hill","analogy":"Potential is like altitude. A positive charge rolls downhill from high potential to low, and the field is the slope of the hill. Work is needed to push a charge uphill against the field.","body":["Electric potential is energy per unit charge. Only potential differences matter, and the zero is usually chosen at infinity.","Equipotential surfaces are perpendicular to the field lines. Moving a charge along one costs no work."],"example":{"q":"What is the potential 1 m from a charge of 1 nanocoulomb?","a":"V = k Q / r = 9 x 10^9 x 1 x 10^-9 / 1 = 9 V."}},{"title":"Gauss's law: count the field lines leaving a box","analogy":"Count the water leaving a bucket. However the bucket is shaped, the total outflow depends only on how much water is inside it, not on the shape of the bucket.","body":["The total flux through any closed surface equals the enclosed charge divided by epsilon zero. Charges outside the surface contribute nothing to the total.","Gauss's law is most useful when the field has high symmetry, such as a sphere, a long line or a large sheet, because the field can be pulled out of the integral."],"example":{"q":"What is the total flux through a sphere that encloses a charge of 2 microcoulomb?","a":"Phi = q / epsilon0 = 2 x 10^-6 / 8.85 x 10^-12, about 2.26 x 10^5 N m^2/C."}},{"title":"A capacitor stores energy in its electric field","analogy":"A water tank that holds charge instead of water. The capacitance says how big the tank is, and the voltage says how high the water stands.","body":["Capacitance is the charge stored per volt. A parallel plate capacitor has more capacitance with bigger plates, smaller spacing and a better insulator between them.","The energy stored is one half C V squared. It is held in the field between the plates, not on the plates themselves."],"example":{"q":"A 4 microfarad capacitor is charged to 10 V. What charge and energy does it hold?","a":"Q = C V = 4 x 10^-6 x 10 = 40 microcoulomb. U = (1/2) C V^2 = 0.5 x 4 x 10^-6 x 100 = 2 x 10^-4 J."}},{"title":"A dielectric multiplies the capacitance","analogy":"A sponge soaking up part of the charge. The dielectric's molecules line up against the field and weaken it, so the plates can hold more charge at the same voltage.","body":["Inserting a dielectric of constant K multiplies capacitance by K, provided the capacitor remains connected to the same voltage or is isolated with its charge fixed as in the example.","A dielectric also raises the breakdown voltage, which is why capacitors often use one."],"example":{"q":"A 2 microfarad air capacitor is filled with a dielectric of K = 3. What is the new capacitance?","a":"C = K C0 = 3 x 2 = 6 microfarad."}}]},"Magnetic Effects of Current and Magnetism":{"formulas":[{"eq":"B = \\frac{\\mu_0 I}{2\\pi r}","use":"Field at distance r from a long straight wire carrying current I"},{"eq":"B = \\frac{\\mu_0 N I}{2R}","use":"Field at the centre of a circular loop of radius R with N turns"},{"eq":"B = \\mu_0 n I","use":"Field inside a long solenoid with n turns per metre"},{"eq":"\\vec{F} = q\\,\\vec{v}\\times\\vec{B}, \\quad F = qvB\\sin\\theta","use":"Magnetic (Lorentz) force on a moving charge"},{"eq":"F = B I L \\sin\\theta","use":"Force on a straight current-carrying wire in a magnetic field"},{"eq":"r = \\frac{mv}{qB}, \\quad T = \\frac{2\\pi m}{qB}","use":"Radius and period of a charge moving perpendicular to a uniform field"},{"eq":"\\frac{F}{L} = \\frac{\\mu_0 I_1 I_2}{2\\pi d}","use":"Force per unit length between two long parallel wires"},{"eq":"\\tau = N B I A \\sin\\theta","use":"Torque on a rectangular coil of area A in a magnetic field"}],"concepts":[{"title":"Currents create magnetic fields around them","analogy":"Wrap your right hand around the wire with the thumb along the current. The fingers curl in the direction of the magnetic field lines, which form circles around the wire.","body":["The field around a long straight wire falls off as one over the distance. Its direction follows the right-hand grip rule.","Loops and solenoids concentrate the field. Inside a long solenoid the field is nearly uniform, and outside it is very weak."],"example":{"q":"What is the field 0.1 m from a long wire carrying 10 A?","a":"B = mu0 I / (2 pi r) = (4 pi x 10^-7 x 10) / (2 pi x 0.1) = 2 x 10^-5 T."}},{"title":"A moving charge feels a sideways push","analogy":"A ball on a string swung in a circle. The string pulls sideways, changing the direction but not the speed. The magnetic force does the same to a charge: it bends the path but never speeds it up.","body":["The force is zero when the velocity is parallel to the field, and largest when they are perpendicular. Its direction comes from the right-hand rule for v cross B, and it does no work.","Because the force is always perpendicular to the velocity, the speed stays the same and the kinetic energy does not change."],"example":{"q":"An electron moves at 2 x 10^6 m/s perpendicular to a 0.5 T field. What is the force?","a":"F = q v B = 1.6 x 10^-19 x 2 x 10^6 x 0.5 = 1.6 x 10^-13 N."}},{"title":"Circular paths: radius and period in a magnetic field","analogy":"A racing car on a circular track with a steering wheel that always turns the car. The faster the car or the heavier it is, the wider the track. A stronger field tightens the turn.","body":["A charged particle moving perpendicular to a uniform field goes in a circle. Its radius is mv divided by qB, and its period does not depend on its speed.","This is the principle of the cyclotron, which uses the constant period to accelerate particles in steps."],"example":{"q":"A proton moves at 10^6 m/s perpendicular to a 0.5 T field. What is its radius? (m = 1.67 x 10^-27 kg)","a":"r = m v / (q B) = (1.67 x 10^-27 x 10^6) / (1.6 x 10^-19 x 0.5) = 0.021 m, about 2 cm."}},{"title":"Solenoids: many turns add up to a strong, uniform field","analogy":"Many people pushing in the same direction in a line. Each turn adds its push to the field, so the total grows with the number of turns per metre.","body":["Inside a long solenoid the field is B = mu0 n I, where n is turns per metre. It depends only on n and I, not on the radius of the coil.","Stacking more turns or raising the current makes a stronger field, which is how electromagnets are built."],"example":{"q":"A solenoid has 1000 turns per metre and carries 2 A. What is the field inside?","a":"B = mu0 n I = 4 pi x 10^-7 x 1000 x 2 = 2.5 x 10^-3 T."}},{"title":"Parallel currents attract, antiparallel repel","analogy":"Two people walking side by side in the same direction tend to drift together, while people walking in opposite directions push apart. Currents behave the same way through their magnetic fields.","body":["Each wire sits in the field of the other, and the force on each is perpendicular to its length. Parallel currents attract and antiparallel currents repel.","This is how the ampere is defined: two wires one metre apart carrying 1 A each feel a force of 2 x 10^-7 N per metre."],"example":{"q":"Two long parallel wires 0.1 m apart carry 10 A each in the same direction. What is the force per metre?","a":"F/L = mu0 I1 I2 / (2 pi d) = 2 x 10^-7 x 10 x 10 / 0.1 = 2 x 10^-4 N/m, attractive."}},{"title":"A moving coil galvanometer: current becomes an angle","analogy":"A coil on a spring in a magnet. The stronger the current, the more it twists, and the spring pulls it back so the angle reads the current.","body":["The torque on the coil is N B I A. It is balanced by a spring whose restoring torque grows with the twist, so the deflection is proportional to the current.","Adding a shunt in parallel protects the galvanometer and lets it measure larger currents."],"example":{"q":"A coil of 100 turns, area 10^-4 m^2 and field 0.2 T carries 1 mA. What torque acts on it?","a":"tau = N B I A = 100 x 0.2 x 10^-3 x 10^-4 = 2 x 10^-6 N m."}}]},"Electromagnetic Induction and Alternating Currents":{"formulas":[{"eq":"\\varepsilon = -N\\frac{d\\Phi}{dt}, \\quad \\Phi = BA\\cos\\theta","use":"Faraday's law: EMF induced by a changing magnetic flux (minus sign is Lenz's law)"},{"eq":"\\varepsilon = B L v","use":"Motional EMF of a rod of length L moving at speed v across a field B"},{"eq":"\\varepsilon = -L\\frac{dI}{dt}","use":"Self-induced EMF in an inductor of inductance L"},{"eq":"v_{rms} = \\frac{v_0}{\\sqrt{2}}","use":"Root mean square value of a sinusoidal alternating voltage"},{"eq":"X_L = \\omega L, \\quad X_C = \\frac{1}{\\omega C}","use":"Inductive and capacitive reactance"},{"eq":"Z = \\sqrt{R^{2} + (X_L - X_C)^{2}}","use":"Impedance of a series RLC circuit"},{"eq":"\\omega_0 = \\frac{1}{\\sqrt{LC}}","use":"Resonant angular frequency, where the reactances cancel"},{"eq":"P = V_{rms} I_{rms}\\cos\\varphi","use":"Average power; cos phi is the power factor"},{"eq":"\\frac{V_s}{V_p} = \\frac{N_s}{N_p}","use":"Ideal transformer voltage ratio"}],"concepts":[{"title":"A changing magnetic flux creates an EMF","analogy":"Pushing a magnet into a coil. The harder and faster you push, the bigger the push back you feel and the stronger the induced current. Only change produces the effect; a steady field gives nothing.","body":["The EMF depends on how fast the flux changes, not on the flux itself. A coil with N turns multiplies the effect by N.","Flux can change because the field changes, the area changes, or the coil rotates. Each of these is a route to induction."],"example":{"q":"A 100 turn coil sees its flux change by 0.02 Wb in 0.5 s. What is the induced EMF?","a":"|EMF| = N (change in flux) / time = 100 x 0.02 / 0.5 = 4 V."}},{"title":"Lenz's law: induction always opposes the change","analogy":"Nature resisting change, much like inertia. The induced current always acts to keep the flux the same as it was, so it pushes back against whatever is changing it.","body":["If a magnet's north pole approaches a coil, the induced current makes that face of the coil a north pole, so the two repel. Pulling the magnet away makes the face a south pole, so they attract.","Lenz's law is the reason the minus sign appears in Faraday's law, and it is also why induction obeys energy conservation."],"example":{"q":"A magnet's north pole is pushed toward a coil. What polarity does the coil face develop?","a":"A north face, which repels the approaching north pole and opposes the increase in flux."}},{"title":"A moving rod makes an EMF","analogy":"A conductor sliding through a magnetic field is pushed sideways by the field on its moving charges, the same way a generator works.","body":["A rod of length L moving at speed v across a field B develops EMF B L v. Keep the rod, field and motion mutually perpendicular for the simplest form.","If the rod slides on rails with a resistor, the induced current then brakes the rod, which is why eddy currents slow magnets falling through copper tubes."],"example":{"q":"A 0.5 m rod moves at 4 m/s across a 0.2 T field. What EMF is induced?","a":"EMF = B L v = 0.2 x 0.5 x 4 = 0.4 V."}},{"title":"Inductors oppose changes in current","analogy":"A heavy flywheel. Getting it spinning faster takes effort, and slowing it down releases energy. An inductor behaves the same way with current.","body":["The self-induced EMF is minus L times the rate of change of current. A larger inductance makes the current slower to change.","An inductor stores energy in its magnetic field, equal to one half L I squared."],"example":{"q":"An inductor of 2 H has its current rising at 3 A/s. What EMF is induced across it?","a":"|EMF| = L dI/dt = 2 x 3 = 6 V."}},{"title":"AC: rms values and reactance","analogy":"Water sloshing back and forth in a tank. The average is zero, so we quote the root mean square, the value that gives the same heating as a steady supply.","body":["Mains voltage of 220 V is the rms value; the peak is about 311 V. Peak equals rms times the square root of two.","Inductors and capacitors resist AC, but in different ways. Inductive reactance grows with frequency, capacitive reactance falls with it, and at resonance they cancel exactly."],"example":{"q":"A 220 V rms supply has frequency 50 Hz across a 0.1 H inductor. What are the peak voltage and the inductive reactance?","a":"Peak = 220 x sqrt(2) = 311 V. omega = 2 pi x 50 = 314 rad/s, so X_L = 314 x 0.1 = 31.4 ohm."}},{"title":"Transformers: step voltage up, current down","analogy":"A gearbox for electricity. Trading voltage for current, the power stays the same, just as a gear trades speed for torque.","body":["An ideal transformer keeps input power equal to output power. Raising the voltage by a factor lowers the current by the same factor.","This is why power lines run at high voltage: the current, and so the heat lost in the wires, is low."],"example":{"q":"A transformer has 100 turns on the primary and 500 on the secondary. The primary is 220 V and draws 5 A. What are the secondary voltage and current?","a":"Vs = 220 x 500/100 = 1100 V. Is = Ip x Np/Ns = 5 x 100/500 = 1 A. Power in and out are both 1100 W."}}]},"Optics":{"formulas":[{"eq":"n_1\\sin\\theta_1 = n_2\\sin\\theta_2","use":"Snell's law of refraction"},{"eq":"\\sin C = \\frac{n_2}{n_1}","use":"Critical angle for total internal reflection (light going from n1 into n2)"},{"eq":"\\frac{1}{f} = \\frac{1}{v} + \\frac{1}{u}","use":"Mirror formula, with the real-is-positive sign convention for mirrors"},{"eq":"\\frac{1}{v} - \\frac{1}{u} = \\frac{1}{f}","use":"Lens formula, Cartesian sign convention, u negative for a real object"},{"eq":"\\frac{1}{f} = (n-1)\\left(\\frac{1}{R_1} - \\frac{1}{R_2}\\right)","use":"Lensmaker's formula for a thin lens in air"},{"eq":"\\beta = \\frac{\\lambda D}{d}","use":"Fringe width in Young's double slit experiment"},{"eq":"a\\sin\\theta = n\\lambda","use":"Dark fringes (minima) of a single slit of width a"},{"eq":"n = \\frac{c}{v}","use":"Refractive index: ratio of the speed of light in vacuum to its speed in the medium"}],"concepts":[{"title":"Light bends toward the normal when it slows down","analogy":"A car whose wheels hit mud on one side of a road. The side in the mud slows, and the car swings toward the mud side. Light behaves the same way at a boundary.","body":["When light enters a denser medium, it slows and bends toward the normal. Entering a less dense medium, it bends away.","Refraction explains why a straw looks bent in a glass of water, and why lenses can focus light at all."],"example":{"q":"Light goes from air into glass (n = 1.5) at 45 degrees to the normal. What is the angle inside the glass?","a":"sin(theta2) = sin 45 / 1.5 = 0.707 / 1.5 = 0.471, so theta2 is about 28 degrees."}},{"title":"Total internal reflection traps light","analogy":"A sunken ball. Looking up from underwater at a steep angle, the surface looks like a mirror, because light can no longer escape into the air.","body":["Beyond the critical angle, light from the denser side is reflected completely. This needs the light to travel from the denser to the less dense medium.","Optical fibres rely on this: light bounces down the core with almost no loss."],"example":{"q":"What is the critical angle for light going from glass (n = 1.5) to air?","a":"sin C = 1 / 1.5 = 0.667, so C is about 42 degrees."}},{"title":"Mirrors: sign convention and the mirror formula","analogy":"A sign convention is a common language. Once everyone agrees that distances measured against the light are negative, the formulas work the same way for every mirror.","body":["Use the new Cartesian convention with the pole as origin and distances measured against the incoming light as negative. A concave mirror has a negative focal length and gives real, inverted images when the object is beyond the focus.","The magnification m = -v/u tells you the image height ratio and whether the image is inverted (negative) or upright (positive)."],"example":{"q":"A concave mirror of focal length 10 cm forms an image of an object placed 30 cm in front. Where is the image and what is its size?","a":"With f = -10 and u = -30, 1/v = 1/f - 1/u = -1/10 + 1/30 = -1/15, so v = -15 cm (real, in front). m = -v/u = -0.5: inverted, half size."}},{"title":"Lenses: a converging lens focuses light","analogy":"A magnifying glass. A converging lens bends rays toward a point, and the image it forms depends on where the object sits relative to the focus.","body":["Inside the focus a converging lens gives an enlarged, upright, virtual image, as in a magnifier. Beyond the focus it gives a real, inverted image, as in a camera.","Two thin lenses in contact combine as 1/F = 1/f1 + 1/f2, which is how eyepieces and corrective lenses are designed."],"example":{"q":"A converging lens of focal length 20 cm has an object 30 cm in front. Where is the image and how big is it?","a":"1/v = 1/f + 1/u = 1/20 - 1/30 = 1/60, so v = 60 cm (real, on the far side). m = v/u = 60/(-30) = -2: inverted and twice as big."}},{"title":"Young's double slit: light interferes","analogy":"Two ripples in a pond. Where crests meet crests the wave is bigger, where crests meet troughs it cancels. Light from two slits makes the same bright and dark stripes on a screen.","body":["Bright fringes sit where the path difference is a whole number of wavelengths. The spacing between neighbouring bright fringes is lambda D divided by d.","Fringes are wider for longer wavelengths and for screens further away, and narrower for wider slit spacing."],"example":{"q":"Light of wavelength 600 nm passes through slits 1 mm apart and reaches a screen 1 m away. What is the fringe width?","a":"beta = lambda D / d = (6 x 10^-7 x 1) / (1 x 10^-3) = 6 x 10^-4 m, which is 0.6 mm."}}]},"Dual Nature of Matter and Radiation":{"formulas":[{"eq":"E = h\\nu = \\frac{hc}{\\lambda}","use":"Energy of a photon, with h = 6.63 x 10^-34 J s"},{"eq":"K_{max} = h\\nu - \\varphi","use":"Maximum kinetic energy of photoelectrons (Einstein's photoelectric equation)"},{"eq":"\\nu_0 = \\frac{\\varphi}{h}","use":"Threshold frequency below which no electrons are emitted"},{"eq":"eV_0 = K_{max}","use":"Stopping potential V0 measures the maximum kinetic energy"},{"eq":"\\lambda = \\frac{h}{p} = \\frac{h}{mv}","use":"de Broglie wavelength of a particle with momentum p"},{"eq":"hc \\approx 1240\\ \\text{eV nm}","use":"Handy form: photon energy in eV equals 1240 divided by wavelength in nm"}],"concepts":[{"title":"Light arrives in packets of energy","analogy":"Sand falling from a hopper comes in grains, not as a smooth flow. Light energy comes in quanta called photons, each with energy set by its frequency.","body":["The energy of a single photon depends only on frequency: higher frequency, more energy. Brighter light means more photons, not more energy per photon.","Planck's constant h ties frequency to energy, and it is the reason quantum effects show up at small scales."],"example":{"q":"What is the energy of one photon of 500 nm light, in eV?","a":"E = 1240 / 500 = 2.48 eV."}},{"title":"Photoelectric effect: frequency matters, brightness does not","analogy":"A vending machine that needs exact coins. No number of small coins works if each is too small; one coin of the right value does. Each photon must carry enough energy to free an electron, and brightness only changes how many coins you feed in.","body":["Below the threshold frequency no electrons are emitted, however bright the light. Above it, emission is immediate and the photocurrent grows with intensity.","The maximum kinetic energy of the ejected electrons depends on frequency, not intensity. Increasing the frequency raises the kinetic energy."],"example":{"q":"A metal has work function 2.0 eV. Light of wavelength 400 nm falls on it. What is the maximum kinetic energy of the electrons?","a":"Photon energy = 1240 / 400 = 3.1 eV. K_max = 3.1 - 2.0 = 1.1 eV."}},{"title":"Stopping potential measures the maximum energy","analogy":"Pushing a ball up a slope until it just stops. The height it reaches tells you how much energy it had, and a retarding voltage does the same for electrons.","body":["Apply a reverse voltage across the photocell. The voltage that just stops the fastest electrons is the stopping potential V0, and eV0 equals K max.","Measuring V0 at different frequencies gives a straight line whose slope is h divided by e, which is how Millikan confirmed Einstein's equation."],"example":{"q":"Using the previous example, what stopping potential stops the fastest electrons?","a":"V0 = K_max / e = 1.1 V."}},{"title":"Matter has wavelengths too: de Broglie waves","analogy":"A wave as a cause of motion. Every moving object has a matching wavelength, but for everyday objects it is so tiny it never shows, while for electrons it is large enough to see in diffraction.","body":["The de Broglie wavelength is h over momentum. Heavier or faster objects have shorter wavelengths.","Electron diffraction experiments, and the electron microscope, both rely on this wave nature of matter."],"example":{"q":"An electron moves at 10^6 m/s. What is its de Broglie wavelength? (m = 9.1 x 10^-31 kg)","a":"lambda = h / (m v) = 6.63 x 10^-34 / (9.1 x 10^-31 x 10^6) = 7.3 x 10^-10 m, about 0.73 nm."}}]},"Units and Measurements":{"formulas":[{"eq":"[F] = MLT^{-2}, \\quad [E] = ML^{2}T^{-2}, \\quad [P] = ML^{-1}T^{-2}","use":"Dimensions of force, energy and pressure, built from the base quantities M, L, T"},{"eq":"\\frac{\\Delta z}{z} = \\frac{\\Delta x}{x} + \\frac{\\Delta y}{y}","use":"Maximum fractional error of a product z = x y"},{"eq":"\\frac{\\Delta z}{z} = a\\frac{\\Delta x}{x}","use":"Error when the quantity is raised to the power a"},{"eq":"\\text{LC} = \\frac{\\text{pitch}}{N}","use":"Least count of a screw gauge with N circular scale divisions"},{"eq":"\\text{Percentage error} = \\frac{\\Delta x}{x}\\times 100\\%","use":"Relative error expressed as a percentage"}],"concepts":[{"title":"Dimensions are a built-in error check","analogy":"Adding metres to seconds makes no sense, however well the numbers agree. Dimensions are the units' grammar: any equation that breaks them is wrong before any number is put in.","body":["Every term in a correct equation has the same dimensions. Use this to check a formula, or to guess one when you forget it.","Dimensional analysis cannot give pure numbers such as 2 or pi, so it confirms the form of a relation, not its constant."],"example":{"q":"From F = G m1 m2 / r^2, find the dimensions of G.","a":"[G] = [F][r^2] / [m1 m2] = (MLT^-2)(L^2) / M^2 = M^-1 L^3 T^-2."}},{"title":"Significant figures tell you what you actually know","analogy":"A ruler marked in millimetres cannot tell you a length to a tenth of a millimetre. Writing more digits than the instrument supports claims precision you do not have.","body":["Non-zero digits always count. Zeros between them count. Leading zeros do not count, and trailing zeros count only when a decimal point is shown.","In multiplication or division keep as many significant figures as the least precise input has."],"example":{"q":"How many significant figures does 0.00450 have, and what is 2.31 x 4.2 to the right number of figures?","a":"0.00450 has three (4, 5 and the final 0). 2.31 x 4.2 = 9.702, rounded to two significant figures because 4.2 has two: 9.7."}},{"title":"Errors add up when you combine measurements","analogy":"Three friends each guess a little off. The total error grows with how many guesses are combined, and for a product the fractional errors add.","body":["For a product or quotient, the fractional errors add. For a power, the fractional error is multiplied by the power.","Always use the largest possible errors for a worst-case estimate, and state the answer as value plus or minus error."],"example":{"q":"z = x y with x = 2.0 +/- 0.1 and y = 3.0 +/- 0.2. Find z with its error.","a":"z = 6.0. Fractional error = 0.1/2.0 + 0.2/3.0 = 0.05 + 0.067 = 0.117. So dz = 0.117 x 6.0, about 0.7, and z = 6.0 +/- 0.7."}},{"title":"Least count: the smallest reading an instrument gives","analogy":"The tick marks of a scale. You can only read to the smallest division, and a screw gauge is simply a very fine scale, moved by a screw.","body":["For a screw gauge the least count is the pitch divided by the number of divisions on the circular scale. Each turn moves the spindle by one pitch.","The zero error must be found and subtracted from every reading, or every measurement carries a hidden bias."],"example":{"q":"A screw gauge has pitch 1 mm and 100 divisions on its circular scale. What is its least count?","a":"LC = 1 mm / 100 = 0.01 mm."}},{"title":"Order of magnitude: the quick estimate","analogy":"Estimating a crowd by counting one row and multiplying. You do not need the exact number to know whether it is thousands or millions.","body":["Round every quantity to one significant figure and a power of ten. The answer tells you the scale, which is often all a question needs.","This is how you check a long calculation: if the estimate and the answer differ by a factor of ten, something went wrong."],"example":{"q":"Estimate the number of heartbeats in a 70 year life, to the nearest power of ten.","a":"About 1 heartbeat per second gives 3 x 10^7 seconds per year x 70, roughly 2 x 10^9 beats, so about 10^9 to 10^10 beats."}}]},"Properties of Solids and Liquids":{"formulas":[{"eq":"Y = \\frac{F/A}{\\Delta L/L}","use":"Young's modulus: stress divided by longitudinal strain"},{"eq":"\\Delta L = \\frac{F L}{A Y}","use":"Extension of a wire under a load F"},{"eq":"B = -\\frac{\\Delta P}{\\Delta V/V}","use":"Bulk modulus: pressure change per unit fractional volume change"},{"eq":"P = P_0 + \\rho g h","use":"Pressure at depth h in a liquid of density rho"},{"eq":"T = \\frac{F}{L}","use":"Surface tension: force per unit length of a surface"},{"eq":"\\Delta P = \\frac{2T}{r}","use":"Excess pressure inside a liquid drop of radius r"},{"eq":"h = \\frac{2T\\cos\\theta}{\\rho g r}","use":"Height of capillary rise in a tube of radius r"},{"eq":"A_1 v_1 = A_2 v_2","use":"Equation of continuity for steady flow"},{"eq":"P + \\tfrac{1}{2}\\rho v^{2} + \\rho g h = \\text{constant}","use":"Bernoulli's principle along a streamline"}],"concepts":[{"title":"Stress, strain and the spring inside every solid","analogy":"A spring: pull it and it stretches; the harder you pull, the more it stretches, until it breaks. Atoms in a solid behave like tiny springs bonded together.","body":["Stress is force per area and strain is the fractional change in shape. Within the elastic limit, stress is proportional to strain, and the constant of proportionality is the modulus.","Once the elastic limit is passed, the material does not return to its original length. Steel has a high Young's modulus, rubber a low one."],"example":{"q":"A 2 m wire of area 10^-6 m^2 and Young's modulus 2 x 10^11 Pa carries a 100 N load. How much does it stretch?","a":"Delta L = F L / (A Y) = (100 x 2) / (10^-6 x 2 x 10^11) = 10^-3 m, which is 1 mm."}},{"title":"Pressure in a liquid grows with depth","analogy":"A column of people standing on each other. The bottom person carries the weight of everyone above, so pressure builds up with depth and does not depend on the shape of the container.","body":["The pressure at depth h is the surface pressure plus rho g h. Every point at the same depth in a connected liquid has the same pressure.","This is why dams are thick at the bottom, and why a U-tube with two different liquids balances according to their densities."],"example":{"q":"What is the absolute pressure at 10 m depth in fresh water, with surface pressure 1 x 10^5 Pa? (g = 10)","a":"P = P0 + rho g h = 10^5 + 1000 x 10 x 10 = 2 x 10^5 Pa."}},{"title":"Surface tension: the skin on a liquid","analogy":"A taut rubber sheet. Molecules at the surface pull on their neighbours, so the surface behaves as if it were stretched, always trying to shrink to the smallest area.","body":["Surface tension gives small drops their round shape, and it lets some insects walk on water.","A curved surface has an excess pressure: smaller drops and bubbles are under higher pressure, which is why a small bubble inflates into a bigger one."],"example":{"q":"A water drop of radius 1 mm has surface tension 0.072 N/m. What is the excess pressure inside it?","a":"Delta P = 2T / r = 2 x 0.072 / 10^-3 = 144 Pa."}},{"title":"Capillary rise: liquids climbing up thin tubes","analogy":"A paper towel soaking up water. The liquid climbs because its surface tension pulls it up, and gravity stops it at the height where the two balance.","body":["Water wets glass and rises in a narrow tube. Mercury does not wet glass and is pushed down. The angle of contact decides which happens.","The height is inversely proportional to the tube radius, so thinner tubes make the liquid rise further."],"example":{"q":"Water (T = 0.072 N/m, density 1000 kg/m^3, perfect wetting) rises in a tube of radius 0.5 mm. How high?","a":"h = 2T cos(0) / (rho g r) = 0.144 / (1000 x 9.8 x 5 x 10^-4) = 0.029 m, about 3 cm."}},{"title":"Bernoulli: faster flow means lower pressure","analogy":"A river narrowing through a gorge. The same volume of water must pass the narrow part each second, so it speeds up, and the pressure there is lower.","body":["Continuity says the flow rate A v stays the same along a tube, so narrower sections have higher speeds. Bernoulli then says the pressure falls where the speed rises.","This explains lift on an aeroplane wing, the spray from an atomiser, and why a shower curtain bulges inward."],"example":{"q":"Water flows through a pipe of area 2 x 10^-4 m^2 at 1 m/s, then into a section of area 10^-4 m^2. What is the speed in the narrow section?","a":"A1 v1 = A2 v2, so v2 = (2 x 10^-4 x 1) / 10^-4 = 2 m/s."}}]},"Thermodynamics":{"formulas":[{"eq":"\\Delta U = Q - W","use":"First law of thermodynamics: heat added minus work done by the gas"},{"eq":"W = P\\,\\Delta V","use":"Work done by a gas at constant pressure"},{"eq":"W = nRT\\ln\\frac{V_2}{V_1}","use":"Work done in an isothermal expansion of an ideal gas"},{"eq":"PV^{\\gamma} = \\text{constant}, \\quad \\gamma = \\frac{C_p}{C_v}","use":"Adiabatic process; gamma is the ratio of specific heats"},{"eq":"C_p - C_v = R","use":"Mayer's relation for one mole of an ideal gas"},{"eq":"\\eta = 1 - \\frac{T_c}{T_h}","use":"Efficiency of a Carnot engine, with temperatures in kelvin"},{"eq":"PV = nRT","use":"Ideal gas law"}],"concepts":[{"title":"Energy in, energy out: the first law","analogy":"A bank account for a gas. Heat is a deposit, work is a withdrawal, and the change in internal energy is what is left in the account.","body":["The first law is conservation of energy written for a gas. Heat added raises the internal energy, and work done by the gas lowers it.","Sign convention matters: heat into the gas is positive, and work done by the gas is positive."],"example":{"q":"A gas absorbs 800 J of heat and does 300 J of work on its surroundings. By how much does its internal energy change?","a":"Delta U = Q - W = 800 - 300 = 500 J."}},{"title":"Work is the area under the PV curve","analogy":"A graph of the gas's pressure against its volume. The area under the curve is the work, like the area under a speed-time graph is distance.","body":["For a constant pressure step, work is P times the change in volume. In a general process, add up the area under the curve.","A cycle returns to its start, so the net change in internal energy is zero. The net work equals the area enclosed by the cycle."],"example":{"q":"A gas at 1 x 10^5 Pa expands from 0.01 m^3 to 0.02 m^3 at constant pressure. How much work does it do?","a":"W = P Delta V = 10^5 x 0.01 = 1000 J."}},{"title":"Isothermal and adiabatic: two ways to change a gas","analogy":"Isothermal is like stretching a rubber band in a warm room, which lets heat flow in to keep the temperature steady. Adiabatic is stretching it inside an insulated box, so it cools as it expands.","body":["In an isothermal change the temperature stays fixed, so PV is constant and the work is n R T ln(V2/V1). Heat flows in or out as the gas does work.","In an adiabatic change no heat enters or leaves. The gas cools as it expands, and its pressure and volume follow P V^gamma = constant."],"example":{"q":"One mole of gas at 300 K expands isothermally until its volume doubles. What work does it do? (R = 8.31)","a":"W = n R T ln 2 = 1 x 8.31 x 300 x 0.693, about 1730 J."}},{"title":"Heat engines and the Carnot limit","analogy":"A waterwheel driven by a fall. The bigger the drop from hot to cold, the more useful work you can extract, and no wheel can use the water's full energy.","body":["An engine takes heat from a hot reservoir, does work, and dumps the rest into a cold reservoir. Efficiency is work out divided by heat in.","No engine working between two temperatures can beat the Carnot efficiency, 1 - Tc/Th, with temperatures in kelvin. Real engines fall well short of this."],"example":{"q":"A Carnot engine operates between 600 K and 300 K. What is its efficiency?","a":"eta = 1 - 300/600 = 0.5, so 50%."}},{"title":"Heat capacity depends on how the gas can store energy","analogy":"A pile of blocks, where each way a molecule can move is a new place to store energy. Monatomic gases have three ways, diatomic gases have five.","body":["Constant pressure heating needs more heat than constant volume, because the gas also does work as it expands. The difference is exactly R per mole.","Gamma is 5/3 for monatomic gases and 7/5 for diatomic gases at ordinary temperatures."],"example":{"q":"For a monatomic ideal gas, what are Cv and Cp in terms of R?","a":"Cv = (3/2) R, and Cp = Cv + R = (5/2) R, so gamma = 5/3."}}]},"Kinetic Theory of Gases":{"formulas":[{"eq":"PV = nRT = Nk_BT","use":"Ideal gas law, in moles or molecules"},{"eq":"P = \\tfrac{1}{3}\\frac{N}{V} m \\overline{v^{2}}","use":"Pressure from molecular collisions with the walls"},{"eq":"\\overline{KE} = \\tfrac{3}{2}k_B T","use":"Average translational kinetic energy per molecule"},{"eq":"v_{rms} = \\sqrt{\\frac{3RT}{M}}","use":"Root mean square speed of molecules of molar mass M"},{"eq":"\\text{Energy per mole} = \\tfrac{f}{2}RT","use":"Equipartition: each degree of freedom gets one half of k_B T per molecule"},{"eq":"\\gamma = 1 + \\frac{2}{f}","use":"Ratio of specific heats in terms of the number of degrees of freedom f"}],"concepts":[{"title":"Pressure is molecules hitting the walls","analogy":"Hailstones on a tin roof. Each hit is tiny, but so many arrive every second that they add up to a steady, continuous push.","body":["A gas exerts pressure because its molecules keep bouncing off the container walls and changing their momentum. The average of all these tiny impacts is the pressure you measure.","More molecules, faster molecules or a smaller container all give more frequent or harder impacts, and so more pressure."],"example":{"q":"A gas is held in a fixed container, and its temperature doubles. What happens to its pressure?","a":"P = N k_B T / V. With N and V fixed, pressure is proportional to temperature, so it doubles. Faster molecules hit the walls harder and more often."}},{"title":"Temperature is the average kinetic energy","analogy":"A room full of people dancing. The room is hotter when the dancers move more energetically on average, whatever the room's size or how many dancers there are.","body":["The average translational kinetic energy is three halves k_B T, depending only on temperature and not on the gas or the molecular mass.","Heavier molecules move more slowly at the same temperature, because they carry the same average energy with more mass."],"example":{"q":"What is the average kinetic energy of a molecule at 300 K?","a":"KE = (3/2) k_B T = 1.5 x 1.38 x 10^-23 x 300 = 6.2 x 10^-21 J."}},{"title":"The rms speed of molecules","analogy":"A race of molecules where the lighter ones run faster. Their rms speed is the speed that gives the right average energy, which is more useful than the plain average.","body":["The rms speed is root of the average of the squared speeds. It scales with the square root of temperature and inversely with the square root of molar mass.","Hydrogen molecules are fast because they are light, which is why hydrogen escapes a planet's atmosphere more readily than heavier gases."],"example":{"q":"What is the rms speed of nitrogen molecules (M = 0.028 kg/mol) at 300 K? (R = 8.31)","a":"v_rms = sqrt(3 x 8.31 x 300 / 0.028) = sqrt(2.68 x 10^5), about 520 m/s."}},{"title":"Degrees of freedom and the ratio of heat capacities","analogy":"Ways a molecule can store energy. A single atom can only move along three axes. A diatomic molecule can also rotate about two axes, and each way takes an equal share of the energy.","body":["Each degree of freedom shares k_B T over two among molecules, which is the equipartition theorem. Translation gives three, rotation adds two for diatomic gases.","Gamma depends only on the number of degrees of freedom, which is why monatomic gases have gamma = 5/3 and diatomic gases 7/5 at room temperature."],"example":{"q":"What is gamma for a diatomic gas, counting translation and rotation only?","a":"f = 5, so gamma = 1 + 2/5 = 7/5 = 1.4."}},{"title":"Mean free path: a molecule's lonely journey","analogy":"Walking through a crowded market. You bump into people constantly, so you never walk far in a straight line before the next bump changes your path.","body":["The mean free path is the average distance a molecule travels between collisions. It grows as the gas gets thinner, and shrinks as the molecules get bigger.","At normal pressure the mean free path is very short, far less than a micrometre, which is why gases diffuse slowly."],"example":{"q":"Why does a gas at low pressure feel very different in a vacuum tube?","a":"Lower pressure means fewer molecules per volume, so the mean free path is much longer and molecules travel almost straight from wall to wall."}}]},"Oscillations and Waves":{"formulas":[{"eq":"x = A\\sin(\\omega t + \\varphi)","use":"Displacement in simple harmonic motion"},{"eq":"\\omega = \\sqrt{\\frac{k}{m}}, \\quad T = 2\\pi\\sqrt{\\frac{m}{k}}","use":"Angular frequency and period of a mass on a spring"},{"eq":"T = 2\\pi\\sqrt{\\frac{L}{g}}","use":"Period of a simple pendulum for small swings"},{"eq":"E = \\tfrac{1}{2}kA^{2}","use":"Total energy in SHM, shared between kinetic and potential"},{"eq":"v = f\\lambda","use":"Speed of a wave in terms of frequency and wavelength"},{"eq":"v = \\sqrt{\\frac{T}{\\mu}}","use":"Speed of a transverse wave on a string of tension T and mass per length mu"},{"eq":"f_{beat} = |f_1 - f_2|","use":"Beat frequency from two close frequencies"},{"eq":"f' = f\\,\\frac{v \\pm v_0}{v \\mp v_s}","use":"Doppler effect for sound, observer speed v0, source speed vs","oos":true}],"concepts":[{"title":"Simple harmonic motion: a restoring force proportional to displacement","analogy":"A ball rolling in a bowl. The further it is from the bottom, the harder gravity pulls it back, and it swings to and fro at a fixed rhythm set by the bowl's shape.","body":["SHM happens whenever the restoring force is proportional to displacement and points back toward equilibrium. The period does not depend on the amplitude.","Speed is greatest at the centre and zero at the ends, while acceleration is greatest at the ends and zero at the centre."],"example":{"q":"A 2 kg mass hangs from a spring with k = 200 N/m. What is its period?","a":"T = 2 pi sqrt(m/k) = 2 pi sqrt(2/200) = 2 pi x 0.1 = 0.63 s."}},{"title":"Pendulums keep time with length, not mass","analogy":"A child on a swing. The swing's timing depends on how long the ropes are, not on the child's weight, which is why heavier and lighter children swing at the same rate.","body":["For small swings a pendulum is simple harmonic, with period 2 pi sqrt(L/g). The mass of the bob cancels out.","Large swings take longer, because the restoring force is no longer proportional to displacement."],"example":{"q":"A simple pendulum is 1 m long. What is its period on a planet where g = 10 m/s^2?","a":"T = 2 pi sqrt(1/10) = 2 pi x 0.316 = 1.99 s, about 2 s."}},{"title":"Energy in SHM swaps between kinetic and potential","analogy":"A see-saw with no friction. At the top all the energy is stored as height, at the bottom it is all motion, and the total never changes.","body":["The total energy is one half k A squared, and it stays constant. At any point it is split between potential energy (one half k x squared) and kinetic energy.","Doubling the amplitude quadruples the energy, which is why big swings need so much more energy."],"example":{"q":"A spring with k = 200 N/m is stretched 0.1 m. What is the total energy of the oscillation?","a":"E = (1/2) k A^2 = 0.5 x 200 x 0.01 = 1 J."}},{"title":"Waves on a string: speed depends on tension and density","analogy":"A rope pulled tight vibrates faster in its waves than a slack one, and a thick rope is sluggish compared with a thin one of the same tension.","body":["The speed of a wave on a string is the square root of tension over mass per unit length. A tighter, lighter string carries waves faster.","The frequency is set by the source, so the wavelength adjusts to keep v = f lambda true."],"example":{"q":"A string of tension 100 N has mass per unit length 0.01 kg/m. What is the wave speed?","a":"v = sqrt(100 / 0.01) = sqrt(10000) = 100 m/s."}},{"title":"Beats","analogy":"Two slightly out-of-tune guitar strings. They reinforce and cancel in a slow rhythm, which is the beat.","body":["Two close frequencies produce beats at their difference, so the loudness swells and fades at that rate."],"example":{"q":"Two tuning forks of 256 Hz and 260 Hz sound together. How many beats are heard each second?","a":"f_beat = |256 - 260| = 4 beats per second."}},{"title":"Doppler effect","analogy":"Two slightly out-of-tune guitar strings. They reinforce and cancel in a slow rhythm, which is the beat. A passing ambulance does something similar to its siren, changing pitch as it moves.","body":["Two close frequencies produce beats at their difference. An observer moving toward a source hears a higher pitch, and one moving away hears a lower pitch.","The Doppler formula changes sign according to whether the source or observer moves toward or away from the other."],"example":{"q":"A 500 Hz source moves toward a stationary listener at 30 m/s. Sound speed is 330 m/s. What frequency does the listener hear?","a":"f' = f v / (v - vs) = 500 x 330 / (330 - 30) = 550 Hz."},"oos":true}]},"Electromagnetic Waves":{"formulas":[{"eq":"c = \\frac{1}{\\sqrt{\\mu_0 \\varepsilon_0}} \\approx 3\\times10^{8}\\ \\text{m/s}","use":"Speed of every electromagnetic wave in vacuum"},{"eq":"E_0 = c\\,B_0","use":"Peak electric and magnetic fields of a plane wave are linked by c"},{"eq":"\\oint \\vec{B}\\cdot d\\vec{l} = \\mu_0\\left(I + \\varepsilon_0\\frac{d\\Phi_E}{dt}\\right)","use":"Ampere-Maxwell law: a changing electric flux acts like a current"},{"eq":"I = \\tfrac{1}{2}\\,c\\,\\varepsilon_0 E_0^{2}","use":"Average intensity of a plane wave with peak field E_0"},{"eq":"p = \\frac{U}{c}","use":"Momentum carried by radiation of energy U (absorbed completely)"},{"eq":"P = \\frac{I}{c}\\ \\text{(absorbed)},\\quad P = \\frac{2I}{c}\\ \\text{(reflected)}","use":"Radiation pressure on a perfectly absorbing or reflecting surface"}],"concepts":[{"title":"A changing electric field makes a magnetic field","analogy":"A ripple in a pond. Push the water and it moves, and the movement pushes the water next to it. A changing electric field pushes a magnetic field outward in the same way, and the two keep regenerating each other.","body":["Maxwell noticed that Ampere's law fails for a capacitor being charged, because no current crosses the gap. The fix was a displacement current, the rate of change of electric flux, which also produces a magnetic field.","Each changing field sustains the other, so the disturbance travels through empty space. This is the origin of light and all electromagnetic radiation."],"example":{"q":"A plane wave has E_0 = 6 V/m. Find B_0 and the average intensity.","a":"B_0 = E_0 / c = 6 / (3 x 10^8) = 2 x 10^-8 T. I = (1/2) c eps_0 E_0^2 = 0.5 x 3 x 10^8 x 8.85 x 10^-12 x 36, about 0.048 W/m^2."}},{"title":"E and B are in phase and perpendicular to each other","analogy":"A rope shaken up and down, with the wave travelling along its length. The motion is across the direction of travel, and E and B both move across it, at right angles to one another.","body":["In a plane wave the electric field, the magnetic field and the direction of propagation form a mutually perpendicular set. The wave is transverse, which is why it can be polarised.","The Poynting vector E x B divided by mu_0 gives the direction and rate of energy flow, always along the direction the wave travels."],"example":{"q":"Which way does a wave travel if E points along +x and B along +y?","a":"The direction of propagation is E x B, which is along +z, since x-hat cross y-hat is z-hat."}},{"title":"Light carries momentum, so it can push","analogy":"A stream of tiny balls hitting a wall. Each ball gives a small push on impact, and many balls together give a steady force. Photons do the same thing on a surface.","body":["Electromagnetic radiation has momentum equal to its energy divided by c. A surface absorbing all of it feels a pressure I/c. A perfectly reflecting surface feels twice that, because the momentum is reversed.","This tiny pressure is why comet tails point away from the Sun, and why light sails are being explored as propulsion."],"example":{"q":"Sunlight of intensity 1400 W/m^2 falls on a perfectly absorbing sheet. Find the radiation pressure.","a":"P = I / c = 1400 / (3 x 10^8), about 4.7 x 10^-6 Pa."}}]},"Atoms and Nuclei":{"formulas":[{"eq":"r_n = n^{2}a_0,\\quad a_0 \\approx 0.53\\ \\text{\\AA}","use":"Radius of the nth Bohr orbit in hydrogen"},{"eq":"E_n = -\\frac{13.6}{n^{2}}\\ \\text{eV}","use":"Energy of the nth level of hydrogen"},{"eq":"h\\nu = E_i - E_f","use":"Photon emitted when an electron drops from level i to level f"},{"eq":"\\frac{1}{\\lambda} = R\\left(\\frac{1}{n_f^{2}} - \\frac{1}{n_i^{2}}\\right)","use":"Wavelengths of the spectral lines of hydrogen"},{"eq":"\\text{Ionisation energy of H} = 13.6\\ \\text{eV}","use":"Energy needed to remove the electron from the ground state"}],"concepts":[{"title":"Electrons sit in fixed energy levels","analogy":"A staircase. A person stands on a step, not between steps, and moving up or down means jumping a whole number of steps.","body":["Bohr's postulates say the electron moves in allowed orbits without radiating, and that its angular momentum is a whole-number multiple of h/2 pi. Each orbit has a fixed energy.","An atom emits or absorbs a photon only when the electron changes orbit. The photon energy equals the difference between the two levels, which is why each element has its own line spectrum."],"example":{"q":"An electron drops from n = 2 to n = 1 in hydrogen. Find the wavelength of the emitted photon.","a":"Energy released = 13.6 (1 - 1/4) = 10.2 eV. Wavelength = 1240 / 10.2 = 121.6 nm, the first line of the Lyman series."}},{"title":"Series of lines depend on which level the electron falls to","analogy":"Dropping a ball onto different floors of a building. Each landing floor gives a family of sounds with a related pattern.","body":["Lyman lines end on n = 1 and lie in the ultraviolet. Balmer lines end on n = 2 and include visible red light. Paschen lines end on n = 3 and lie in the infrared.","Ionisation is the limit where the electron is removed completely, so the series converge at the shortest wavelength."],"example":{"q":"Find the wavelength of the Balmer line from n = 3 to n = 2.","a":"Energy = 13.6 (1/4 - 1/9) = 1.89 eV. Wavelength = 1240 / 1.89, about 656 nm, a red line."}}]},"Electronic Devices":{"formulas":[{"eq":"I_E = I_B + I_C","use":"Current relation in a transistor (emitter, base, collector)","oos":true},{"eq":"\\alpha = \\frac{I_C}{I_E}","use":"Current gain of a common base transistor","oos":true},{"eq":"\\beta = \\frac{I_C}{I_B}","use":"Current gain of a common emitter transistor","oos":true},{"eq":"\\alpha = \\frac{\\beta}{1+\\beta}","use":"Links alpha and beta","oos":true},{"eq":"\\text{Forward bias: junction conducts; reverse bias: only a small leakage current}","use":"Behaviour of a p-n junction diode"}],"concepts":[{"title":"Doping makes a semiconductor useful","analogy":"A crowded room where a few extra people change how the room behaves. Adding a small number of impurity atoms changes the conduction in the same way.","body":["Pure silicon has few free electrons at room temperature. Adding a trivalent impurity creates holes (p-type), and a pentavalent impurity adds extra electrons (n-type).","Joining p-type and n-type gives a p-n junction, which conducts in one direction only. This is the basis of rectification."],"example":{"q":"Why does a p-n junction conduct easily under forward bias but hardly at all under reverse bias?","a":"Forward bias narrows the depletion region, so carriers cross the junction. Reverse bias widens it, leaving only a small leakage current from minority carriers."}},{"title":"A transistor uses a small base current to control a larger collector current","analogy":"A tap controlling a large pipe. A small turn of the handle sets a much larger flow.","body":["The base is thin and lightly doped, so most carriers from the emitter pass through to the collector. The base current is only a small fraction of the emitter current.","Because alpha is close to 1 and beta is large, a small change in base current produces a much larger change in collector current."],"example":{"q":"A transistor has beta = 100 and base current 10 micro-amperes. Find the collector and emitter currents.","a":"I_C = beta I_B = 1.0 mA. I_E = I_B + I_C = 1.01 mA. Alpha = 100/101, about 0.99."},"oos":true}]},"Experimental Skills":{"formulas":[{"eq":"\\text{LC of a vernier} = \\text{1 MSD} - \\text{1 VSD}","use":"Least count of a vernier caliper (1 VSD = 9 MSD divisions on the vernier)"},{"eq":"\\text{LC of a screw gauge} = \\frac{\\text{pitch}}{\\text{number of circular scale divisions}}","use":"Least count of a screw gauge"},{"eq":"\\text{Reading} = \\text{MSR} + (\\text{VSC} \\times \\text{LC}) - \\text{zero error}","use":"Corrected reading of a vernier caliper"},{"eq":"T = 2\\pi\\sqrt{\\frac{L}{g}}","use":"Period of a simple pendulum for small amplitudes, used to find g"},{"eq":"\\rho = \\frac{RA}{L}","use":"Resistivity from a wire's resistance, length and cross-sectional area"}],"concepts":[{"title":"Every instrument has a least count","analogy":"A ruler marked in millimetres cannot show a tenth of a millimetre. The smallest division is the limit of what you can read, and an honest result cannot be more precise than that.","body":["The least count is the smallest value an instrument can measure. Vernier calipers and screw gauges are both built to reach a finer least count than a plain scale.","A reading is written as the main scale reading plus the vernier or circular scale coincidence times the least count. Always subtract a zero error before using the result."],"example":{"q":"A vernier caliper has main scale reading 52 mm and the 7th vernier division coincides. The least count is 0.1 mm. Find the reading.","a":"Reading = 52 + 7 x 0.1 = 52.7 mm (with no zero error)."}},{"title":"Zero error must be corrected before measuring","analogy":"A bathroom scale that reads 1 kg before anyone stands on it. Every weight reading is then off by 1 kg, unless you correct for it.","body":["Close the jaws of a vernier or the anvil of a screw gauge with nothing between them. If the scale does not read zero, the difference is the zero error.","A positive zero error is subtracted from every reading, and a negative one is added back."],"example":{"q":"A screw gauge reads +0.03 mm with the anvil closed, and a wire reads 2.85 mm. Find the corrected diameter.","a":"Corrected diameter = 2.85 - 0.03 = 2.82 mm."}},{"title":"Pendulum timing: measure many swings, not one","analogy":"Timing a race with a stopwatch. A single lap has a big reaction-time error; timing ten laps and dividing by ten cuts that error.","body":["Time about 20 complete oscillations, then divide by 20 to get the period. This reduces the percentage error caused by starting and stopping the watch.","Keep the amplitude small, under about 5 degrees, so the simple pendulum formula holds."],"example":{"q":"A pendulum of length 1.0 m makes 20 swings in 40.1 s. Find g.","a":"T = 40.1 / 20 = 2.005 s. g = 4 pi^2 L / T^2 = 4 x 9.87 x 1.0 / 4.02, about 9.8 m/s^2."}}]},"Some Basic Concepts in Chemistry":{"formulas":[{"eq":"moles = mass / molar mass","use":"Converts between grams and moles"},{"eq":"number of particles = moles x 6.022 x 10^23","use":"Converts moles to atoms, molecules or ions"},{"eq":"% of element = (mass of element in formula / molar mass) x 100","use":"Percentage composition"},{"eq":"molarity = moles of solute / litres of solution","use":"Concentration in mol per litre"}],"concepts":[{"title":"The mole is a counting unit","analogy":"A dozen eggs. A dozen is 12 things, whatever they are, and a mole is 6.022 x 10^23 particles, whatever the substance.","body":["One mole of any substance has the same number of particles, Avogadro's number. The molar mass in grams is numerically equal to the atomic or molecular mass in amu.","Most calculations convert the given quantity to moles first, then use the balanced equation's ratio."],"example":{"q":"How many moles are in 18 g of water (molar mass 18 g/mol)?","a":"Moles = 18 / 18 = 1 mol, which contains 6.022 x 10^23 molecules."}},{"title":"Empirical and molecular formulae","analogy":"A recipe ratio. 1 cup flour to 1 cup sugar is the ratio; doubling both gives the real batch size.","body":["The empirical formula gives the simplest whole-number ratio of atoms. The molecular formula is a whole-number multiple of it.","Convert percentages to moles, divide by the smallest number, then multiply to get whole numbers."],"example":{"q":"A compound is 40% C, 6.7% H and 53.3% O by mass. Find its empirical formula.","a":"Moles: C 3.33, H 6.7, O 3.33. Dividing by 3.33 gives 1 : 2 : 1, so the empirical formula is CH2O."}},{"title":"Limiting reagent","analogy":"Making sandwiches with 10 slices of bread and 3 slices of cheese. Cheese runs out first and limits how many sandwiches you can make.","body":["The reactant that runs out first limits the amount of product formed. Find moles of product from each reactant, and the smaller answer is the limit.","Excess reactant is what is left over when the reaction stops."],"example":{"q":"2 mol H2 react with 1 mol O2 to form water. Which is limiting?","a":"2H2 + O2 gives 2H2O, so 2 mol H2 needs 1 mol O2. Both are used exactly, so neither is in excess."}}]},"Atomic Structure":{"formulas":[{"eq":"E_n = -13.6 Z^2 / n^2 eV","use":"Energy of an electron in a hydrogen-like atom"},{"eq":"r_n = 0.529 n^2 / Z angstrom","use":"Radius of the nth Bohr orbit"},{"eq":"lambda = h / (m v)","use":"de Broglie wavelength"},{"eq":"delta x x delta p >= h / (4 pi)","use":"Heisenberg uncertainty principle"},{"eq":"l = 0 to n-1, m = -l to +l, s = +1/2 or -1/2","use":"Allowed values of the quantum numbers"}],"concepts":[{"title":"Quantum numbers describe each electron","analogy":"An address: the building (n), the street (l), the room (m), and which of the two beds (s).","body":["The principal number n sets the shell and energy. The azimuthal number l sets the subshell (s, p, d, f) and the orbital shape. The magnetic number m gives the orientation.","Each orbital holds at most two electrons with opposite spin. A shell n holds 2n^2 electrons."],"example":{"q":"How many orbitals and electrons are in the n = 3 shell?","a":"Orbitals = n^2 = 9, electrons = 2n^2 = 18."}},{"title":"Filling electrons: three rules","analogy":"Filling seats on a bus. Start at the front (Aufbau), take a seat alone before sharing (Hund), and never put two people in one seat with the same orientation (Pauli).","body":["Aufbau: fill lower energy orbitals first. Pauli: at most two electrons per orbital, with opposite spins. Hund: fill each orbital of a subshell singly before pairing.","Half-filled and fully filled subshells are extra stable, which is why chromium is [Ar]3d5 4s1 and copper is [Ar]3d10 4s1."],"example":{"q":"Write the configuration of chromium (Z = 24).","a":"[Ar] 3d5 4s1, because the half-filled 3d subshell is more stable than 3d4 4s2."}},{"title":"Bohr model and the hydrogen spectrum","analogy":"Stairs again. Electrons sit on fixed steps, and a photon is emitted when they drop from one step to a lower one.","body":["Bohr's postulates give fixed orbits with fixed energies. The energy difference between two levels sets the wavelength of the emitted photon.","The model works for hydrogen-like ions but fails for atoms with more than one electron."],"example":{"q":"Find the energy of the photon from n = 2 to n = 1 in hydrogen.","a":"Delta E = 13.6 (1 - 1/4) = 10.2 eV."}}]},"Chemical Bonding and Molecular Structure":{"formulas":[{"eq":"formal charge = valence electrons - non-bonding electrons - (bonding electrons / 2)","use":"Formal charge on an atom in a Lewis structure"},{"eq":"bond order = (bonding electrons - antibonding electrons) / 2","use":"Molecular orbital bond order"},{"eq":"mu = q x d","use":"Dipole moment of a charge separation"},{"eq":"sp3 = 109.5 deg, sp2 = 120 deg, sp = 180 deg","use":"Ideal bond angles by hybridisation"}],"concepts":[{"title":"VSEPR: electron pairs push apart","analogy":"Balloons tied together. They spread out as far as they can, and lone pairs take up more room than bonding pairs.","body":["Count bonding pairs and lone pairs around the central atom. The arrangement minimises repulsion, and lone pairs compress bond angles.","Ammonia has 3 bonding and 1 lone pair, giving a pyramidal shape with angles about 107 degrees. Water has 2 lone pairs, giving a bent shape near 104.5 degrees."],"example":{"q":"What shape does BF3 have, and what is its hybridisation?","a":"3 bonding pairs and no lone pairs give a trigonal planar shape with sp2 hybridisation."}},{"title":"Molecular orbital theory and bond order","analogy":"Filling two bonding seats in a car and one antibonding seat. Net occupancy tells you how strongly the molecule holds together.","body":["Electrons fill bonding and antibonding orbitals together. Bond order counts the net bonding electrons pairs.","Higher bond order means a shorter, stronger bond. Paramagnetism appears when unpaired electrons are present, as in O2."],"example":{"q":"Find the bond order of O2.","a":"Bonding electrons 8, antibonding 4, so bond order = (8 - 4) / 2 = 2."}},{"title":"Dipole moment and polarity","analogy":"A see-saw with one end heavier. The imbalance makes it tilt, and charge imbalance in a molecule makes it polar.","body":["Dipole moment is charge times distance. Symmetric molecules such as CO2 have bond dipoles that cancel, so the net moment is zero.","Hydrogen bonding is a special strong dipole attraction, seen in water and alcohols, and it raises boiling points."],"example":{"q":"Why is CO2 nonpolar but H2O polar?","a":"CO2 is linear and symmetric, so its bond dipoles cancel. H2O is bent, so its bond dipoles add up."}}]},"Chemical Thermodynamics":{"formulas":[{"eq":"Delta U = q + w","use":"First law of thermodynamics (q heat in, w work on system)"},{"eq":"Delta H = Delta U + Delta n_g R T","use":"Relation between enthalpy and internal energy change"},{"eq":"Delta G = Delta H - T Delta S","use":"Gibbs energy; a process is spontaneous when Delta G is negative"},{"eq":"Delta G standard = -R T ln K","use":"Links Gibbs energy to the equilibrium constant"},{"eq":"Delta S universe = Delta S system + Delta S surroundings","use":"Second law criterion"}],"concepts":[{"title":"Hess's law: enthalpy is a state function","analogy":"Walking from the ground floor to the third floor by stairs or by lift. The height gained is the same, whichever route you take.","body":["The total enthalpy change of a reaction is the same whatever the path, so steps can be added together.","Use it to find an unknown enthalpy from known ones, by reversing equations when needed and adding them."],"example":{"q":"C + O2 gives CO2 (-394 kJ), and C + 1/2 O2 gives CO (-110 kJ). Find the enthalpy of CO + 1/2 O2 gives CO2.","a":"Reverse the CO equation (+110) and add it to C + O2 gives CO2 (-394), so the answer is -284 kJ."}},{"title":"Spontaneity: Gibbs energy decides","analogy":"A ball rolling down a hill. Enthalpy is the drop in height, and entropy is how much the ball spreads out, and Gibbs energy combines the two.","body":["A process is spontaneous when Delta G is negative. Exothermic reactions with rising disorder are always spontaneous.","At high temperature the T Delta S term dominates, so an entropy-driven process can become spontaneous even if it is endothermic."],"example":{"q":"Delta H = +40 kJ and Delta S = +0.1 kJ/K. At what temperature does the process become spontaneous?","a":"Delta G = 0 at T = 40 / 0.1 = 400 K, so above 400 K it is spontaneous."}},{"title":"Gibbs energy and the equilibrium constant","analogy":"The depth of a valley and the number of people at the bottom. A large negative Delta G means the reaction runs far toward products.","body":["Standard Gibbs energy links to K: a large K gives a negative standard Delta G.","Doubling the number of reaction steps does not change K for a single step, but multiplying K for combined steps multiplies their Ks."],"example":{"q":"K = 100 at 298 K. Find the standard Gibbs energy change.","a":"Delta G = -8.314 x 298 x ln 100 = -11.4 kJ/mol."}}]},"Solutions":{"formulas":[{"eq":"molality m = moles of solute / kg of solvent","use":"Concentration that does not change with temperature"},{"eq":"p = x_solvent x p0","use":"Raoult's law for an ideal solution"},{"eq":"Delta Tf = i Kf m","use":"Depression of freezing point"},{"eq":"Delta Tb = i Kb m","use":"Elevation of boiling point"},{"eq":"pi = i C R T","use":"Osmotic pressure"}],"concepts":[{"title":"Colligative properties depend on the number of particles","analogy":"Adding salt to ice. The effect depends on how many particles are dissolved, not on what they are.","body":["Lowering of vapour pressure, freezing-point depression, boiling-point elevation and osmotic pressure all depend on the mole fraction or number of solute particles.","The van't Hoff factor i counts the particles per formula unit: about 2 for NaCl, close to 1 for sugar."],"example":{"q":"Find the freezing-point depression of 0.1 m NaCl (Kf = 1.86 K kg/mol, i = 2).","a":"Delta Tf = 2 x 1.86 x 0.1 = 0.372 K."}},{"title":"Abnormal molar mass","analogy":"Counting people in a queue. If pairs stick together, you see fewer people than you counted as individuals.","body":["Association in solution (such as acetic acid dimers) lowers i below the expected value, so the calculated molar mass comes out too high.","Dissociation (such as NaCl) raises i, so the calculated molar mass comes out too low."],"example":{"q":"A solute gives an apparent molar mass twice its true value in benzene. Is it associating or dissociating?","a":"The apparent value is larger than the true one, so the solute associates, halving the particle count."}},{"title":"Ideal solutions and Raoult's law","analogy":"A crowd where everyone is equally likely to move. The vapour escapes in proportion to how many molecules are present.","body":["In an ideal solution the partial vapour pressure of each component is its mole fraction times its pure vapour pressure.","Real solutions show positive deviation when solute-solvent attraction is weaker than the attractions in the pure liquids, and negative deviation when it is stronger."],"example":{"q":"Pure solvent has vapour pressure 100 mmHg. Its mole fraction in the solution is 0.8. Find its partial pressure.","a":"p = 0.8 x 100 = 80 mmHg."}}]},"Equilibrium":{"formulas":[{"eq":"Kp = Kc (R T)^(Delta n_g)","use":"Converts Kc to Kp for gas reactions"},{"eq":"Ka x Kb = Kw = 1.0 x 10^-14 at 25 C","use":"Conjugate acid-base pairs"},{"eq":"pH = -log10 [H+]","use":"Definition of pH"},{"eq":"pH = pKa + log ([A-] / [HA])","use":"Henderson-Hasselbalch equation for buffers"},{"eq":"Ksp = [M+]^a [X-]^b","use":"Solubility product of a sparingly soluble salt"}],"concepts":[{"title":"Le Chatelier: systems resist change","analogy":"A seesaw that tips back when you push one end. The system moves to oppose whatever you did.","body":["Adding reactant or removing product shifts equilibrium forward. Raising the temperature favours the endothermic direction.","A catalyst speeds up both directions equally, so it does not change the equilibrium position or K."],"example":{"q":"N2 + 3H2 gives 2NH3 is exothermic. Does raising temperature increase the yield of NH3?","a":"No. Heat is a product, so raising T shifts equilibrium toward reactants."}},{"title":"Common ion effect and buffers","analogy":"Adding more people to a crowded room. The extra people reduce how many more can enter.","body":["Adding a salt with a common ion suppresses the ionisation of a weak acid or base, so its pH changes less.","A buffer resists pH change because it contains both a weak acid and its salt, so the Henderson equation holds."],"example":{"q":"What is the pH of a buffer with pKa = 4.74 and [A-]/[HA] = 1?","a":"pH = 4.74 + log 1 = 4.74."}},{"title":"pH of weak acids","analogy":"Only a few teacups break when a crowd of dishes is dropped. Weak acids release only a small fraction of their protons.","body":["For a weak acid, [H+] is about the square root of Ka times the concentration, when ionisation is small.","Strong acids are fully ionised, so [H+] equals their concentration."],"example":{"q":"Find the pH of 0.1 M acetic acid (Ka = 1.8 x 10^-5).","a":"[H+] = sqrt(1.8 x 10^-5 x 0.1) = 1.34 x 10^-3, so pH = 2.87."}}]},"Redox Reactions and Electrochemistry":{"formulas":[{"eq":"E = E standard - (0.0591 / n) log Q at 25 C","use":"Nernst equation"},{"eq":"Delta G = -n F E","use":"Links cell potential to Gibbs energy (F = 96500 C/mol)"},{"eq":"Lambda m = lambda+ + lambda-","use":"Kohlrausch's law for molar conductivity"},{"eq":"m = Z I t","use":"Mass deposited in electrolysis (Faraday's law)"}],"concepts":[{"title":"Oxidation numbers track electrons","analogy":"A bank ledger. Each atom's oxidation number records how many electrons it has gained or lost on paper.","body":["Oxidation increases the oxidation number and reduction decreases it. The sum of oxidation numbers is zero for a neutral molecule.","To balance redox reactions, balance atoms other than O and H first, then balance electrons gained and lost."],"example":{"q":"Find the oxidation state of Mn in MnO4-.","a":"4 x (-2) + x = -1, so x = +7."}},{"title":"Galvanic cells make electricity","analogy":"A water wheel driven by a fall. Electrons flow from the higher-energy side to the lower one, and the drop does the work.","body":["In a galvanic cell oxidation happens at the anode (negative) and reduction at the cathode (positive). The cell potential is the reduction potential of the cathode minus that of the anode.","A positive cell potential means a spontaneous reaction and a negative Delta G."],"example":{"q":"Zn/Zn2+ has E = -0.76 V and Cu2+/Cu has E = +0.34 V. Find the standard cell potential.","a":"E = 0.34 - (-0.76) = 1.10 V, which is positive, so the cell works."}},{"title":"Electrolysis and Faraday's law","analogy":"Counting coins into a box at a fixed rate. The total charge tells you how many coins arrived.","body":["The mass deposited depends on the charge passed, the molar mass, and the number of electrons per ion.","One faraday, 96500 C, deposits one mole of electrons' worth of product."],"example":{"q":"How much copper (molar mass 63.5, Z = 2) is deposited by 2 A for 1930 s?","a":"Charge = 3860 C, moles of electrons = 0.04, so moles of Cu = 0.02, mass = 1.27 g."}}]},"Chemical Kinetics":{"formulas":[{"eq":"zero order: [A] = [A]0 - k t","use":"Concentration against time for a zero-order reaction"},{"eq":"first order: ln([A]0 / [A]) = k t","use":"Concentration against time for a first-order reaction"},{"eq":"t half (first order) = 0.693 / k","use":"Half-life of a first-order reaction"},{"eq":"k = A exp(-Ea / R T)","use":"Arrhenius equation"},{"eq":"log (k2 / k1) = (Ea / 2.303 R) (1/T1 - 1/T2)","use":"Temperature dependence of k"}],"concepts":[{"title":"Order is found from data, not from the equation","analogy":"A recipe where you measure the change in taste as you add more of each ingredient. The data show how much each one matters.","body":["Order is the power of each concentration in the rate law, and it is found experimentally. It is not necessarily the coefficients of the balanced equation.","Molecularity is the number of molecules in an elementary step, and it is a whole number. Overall order can be fractional."],"example":{"q":"Rate doubles when [A] doubles. What is the order in A?","a":"Rate = k[A]^n, so 2 = 2^n, and n = 1: first order."}},{"title":"Half-life of a first-order reaction","analogy":"A radioactive sample loses half its atoms in each fixed period, whatever the amount left.","body":["The half-life of a first-order reaction does not depend on the starting concentration, which makes it simple to use.","After n half-lives, the fraction left is (1/2) to the power n."],"example":{"q":"A first-order reaction has half-life 20 min. What fraction remains after 60 min?","a":"Three half-lives give (1/2)^3 = 1/8, or 12.5 percent."}},{"title":"Temperature and activation energy","analogy":"Climbing a hill. A higher temperature gives more walkers enough energy to get over the top.","body":["A rise of about 10 K roughly doubles the rate for many reactions.","A catalyst lowers the activation energy, so more molecules react at the same temperature."],"example":{"q":"Ea = 50 kJ/mol. How does k change from 298 K to 308 K?","a":"log(k2/k1) = (50000 / (2.303 x 8.314)) x (1/298 - 1/308) = 0.28, so k rises about 1.9 times."}}]},"Classification of Elements and Periodicity in Properties":{"formulas":[{"eq":"Atomic radius decreases across a period and increases down a group","use":"Periodic trend in atomic size"},{"eq":"Ionisation enthalpy increases across a period and decreases down a group","use":"Periodic trend in ionisation enthalpy"},{"eq":"Electron gain enthalpy becomes more negative across a period, with exceptions in groups 2, 15 and 18","use":"Periodic trend in electron gain enthalpy"}],"concepts":[{"title":"Why the trends happen","analogy":"Standing on the rungs of a ladder. Adding protons pulls electrons closer, but each new shell moves them further away.","body":["Across a period, the nuclear charge rises while electrons enter the same shell, so atoms shrink and hold on harder to electrons.","Down a group, each new shell adds distance, so atoms grow and are easier to ionise."],"example":{"q":"Which has the larger radius, Na or Mg?","a":"Na, because it has one fewer proton in the same period and so less pull on its outer electron."}},{"title":"Exceptions in the trends","analogy":"Rules with well-known exceptions. Half-filled and fully filled shells are the exceptions here.","body":["Be and N have higher ionisation enthalpy than their neighbours because of their filled or half-filled subshells.","Fluorine has a lower electron gain enthalpy than chlorine, because its small size puts extra repulsion on the incoming electron."],"example":{"q":"Why is nitrogen's ionisation enthalpy higher than oxygen's?","a":"Nitrogen has a half-filled 2p subshell, which is stable, so removing an electron costs more energy."}},{"title":"Oxidation states and reactivity","analogy":"Titles held by an element. The highest title it can hold depends on how many electrons it can share.","body":["Elements in the same group often show the same highest oxidation state, such as +7 for Mn and Cl in some compounds.","Reactivity changes down a group: alkali metals become more reactive down the group because electrons are easier to lose."],"example":{"q":"What is the highest oxidation state of chlorine?","a":"+7, as in perchlorate, using all seven valence electrons."}}]},"p-Block Elements":{"formulas":[{"eq":"Group 13 to 18: valence electrons run from 3 to 8","use":"Counting outer electrons for p-block elements"},{"eq":"Inert pair effect: heavier p-block elements prefer lower oxidation states such as +2 for Pb","use":"Stability trend down a group"}],"concepts":[{"title":"Unique behaviour of the first element in each group","analogy":"The eldest child in a family who acts differently from the younger siblings, because the family role is different.","body":["The first element of each group is small and has no d orbitals, so it forms fewer bonds and pi bonds more strongly. Boron, carbon, nitrogen and oxygen all differ from their group members in this way.","Nitrogen's triple bond in N2 makes it very unreactive, while phosphorus is much more reactive."],"example":{"q":"Why is N2 unreactive at room temperature?","a":"The N triple bond is very strong, with a bond energy of about 945 kJ/mol, so it takes a lot of energy to break."}},{"title":"Trends down groups 13 to 18","analogy":"Layers of an onion. The outer layers change most quickly as you move down the group.","body":["Metallic character increases down a group, so the top element is a non-metal and the bottom is a metal in most groups.","Stability of the lower oxidation state increases down a group, which explains why Tl+ and Pb2+ are common."],"example":{"q":"Which is more stable, Tl+ or Tl3+?","a":"Tl+, because of the inert pair effect, where the 6s electrons are held tightly."}}]},"d- and f-Block Elements":{"formulas":[{"eq":"Transition metals: partly filled d subshell in at least one common oxidation state","use":"Definition of a transition element"},{"eq":"Lanthanoid contraction: atomic radii shrink steadily across the 4f series","use":"Trend across the f-block"},{"eq":"Mn in KMnO4 is +7; Cr in K2Cr2O7 is +6","use":"Highest oxidation states in the oxidising salts"},{"eq":"Magnetic moment = sqrt(n(n+2)) BM, w
