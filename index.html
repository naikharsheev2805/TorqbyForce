function qotdFor(d){ return QUESTIONS.length ? QUESTIONS[seed('qotd-'+d) % QUESTIONS.length] : null; }
// Days on which the question of the day was answered (right or wrong). A skip does not count.
function qotdDays(){
  const set = new Set();
  store.attempts.forEach(a=>{ const q = qotdFor(a.d); if(q && a.q===q.id && !a.skipped && a.c!==null) set.add(a.d); });
  return set;
}
// 'ok' | 'bad' | 'skip' | null for a given day
function qotdState(d){
  const q = qotdFor(d); if(!q) return null;
  let last = null;
  store.attempts.forEach(a=>{ if(a.q===q.id && a.d===d) last = a; });
  if(last && last.skipped) return 'skip';
  if(last) return last.c ? 'ok' : 'bad';
  if(store.qotdSkip && store.qotdSkip[d]===q.id) return 'skip';
  return null;
}

// ---------- Practice: clock, points, keypad, skip and the question drawer ----------
function qStartOf(q){
  if(!session.started) session.started = {};
  if(!session.started[q.id]) session.started[q.id] = Date.now();
  return session.started[q.id];
}
function clockLabel(answered, elapsed, left){
  if(answered) return 'Answered in '+fmtTime(elapsed);
  return left>=0 ? fmtTime(left)+' left' : 'Past 2 minutes';
}
function ringOffset(sec){ return (113*(1-Math.min(1, sec/120))).toFixed(1); }
// Practice-set points (separate from the JEE score, which is unchanged).
// Correct and sure: 6. Correct and guessing: 3. Up to +2 speed bonus for correct answers (under 2 minutes).
// Wrong and sure: -1. Wrong and guessing: -3. Skipping gives +1 (set in skipQ).
// Top ranks taper the points for correct answers only; penalties are never tapered.
// Top ranks taper slightly so the leaderboard rewards steady consistency over time.
function rankMult(){
  const r = store.lbRank;
  if(!r) return 1;
  if(r===1) return 0.8;
  if(r<=3) return 0.85;
  if(r<=10) return 0.9;
  if(r<=25) return 0.95;
  return 1;
}
function scoreFor(ok, conf, sec){
  if(!ok) return conf==='sure' ? -1 : -3;
  const speed = Math.max(0, Math.min(2, 2*(120-sec)/120));
  const base = (conf==='sure' ? 6 : 3) + speed;
  return Math.round(base * rankMult() * 10) / 10;
}
function addPoints(p){
  if(!p) return;
  session.points = (session.points||0) + p;
  store.points = (store.points||0) + p;
  persist();
  cacheUser({points: store.points});
}
function skipQ(){
  const q = session.queue[session.idx];
  const prev = session.answers[q.id];
  if(prev && !prev.skip) return;
  if(session.title==='Question of the day'){ store.qotdSkip = store.qotdSkip || {}; store.qotdSkip[dayKey()] = q.id; persist(); }
  const sec = Math.round((Date.now()-qStartOf(q))/1000);
  session.answers[q.id] = {skip:true, time:sec, pts:1};
  addPoints(1 - ((prev && prev.pts) || 0));
  checkDailyDone();
  if(session.idx < session.queue.length-1) session.idx++;
  render();
}
function goQ(i){ session.idx = i; render(); }
function tickQ(){
  if(!session || session.mode==='mock' || session.submitted) return;
  const q = session.queue[session.idx];
  if(!q) return;
  const a = session.answers[q.id];
  if(a && !a.skip) return;
  const sec = Math.floor((Date.now()-qStartOf(q))/1000);
  const t = document.getElementById('qTimer'); if(t) t.textContent = clockLabel(false, sec, 120-sec);
  const arc = document.getElementById('qArc'); if(arc) arc.style.strokeDashoffset = ringOffset(sec);
  const clock = document.querySelector('.qclock');
  if(clock){ clock.classList.toggle('over', sec>=120); clock.classList.toggle('warn', sec>=100 && sec<120); }
}
// Our own keypad: the answer box is not a text field, so the phone's keyboard never opens
function editValue(v, k){
  if(k==='⌫') return v.slice(0,-1);
  if(k==='Clear') return '';
  if(k==='\u2212') return v.charAt(0)==='\u2212' ? v.slice(1) : '\u2212'+v;
  if(k==='.'){
    if(v.indexOf('.')>=0) return v;
    return (v===''||v==='\u2212') ? v+'0.' : v+'.';
  }
  if(v.replace('\u2212','').length>=8) return v;
  return v+k;
}
function numpad(q, value, onChange, onCheck, locked, state){

      const b = el('<button type="button" class="nk'+((k==='⌫'||k==='Clear')?' fn':'')+'">'+esc(k)+'</button>');

// Wide screens: drifting formulas fill the side margins
function buildGutter(){
  if(document.querySelector('.gutter')) return;
  const g = el('<div class="gutter" aria-hidden="true"></div>');
  for(let r=0; r<16; r++){
    for(let c=0; c<2; c++){
      const t = el('<span class="gf">'+esc(BG_FORMULAS[(r*2+c) % BG_FORMULAS.length])+'</span>');
      t.style.left = (c===0 ? (2 + (r%3)*4 + (r%2)*3) : (84 + (r%3)*4 + (r%2)*3)) + '%';
      t.style.top = (r*6.4) + '%';
      t.style.animationDelay = (-(r*1.3 + c)) + 's';
      t.style.setProperty('--r', ((r%2?1:-1)*(3+(r%4)*2)) + 'deg');
      g.appendChild(t);
    }
  }
  document.body.insertBefore(g, document.body.firstChild);
}

}

const CONF_GLYPHS = ['\u03C0','\u2211','\u0394','\u03BB','\u03A9','\u222B','\u221A','\u03B8','\u03BC','\u221E'];
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches || view!=='results') return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = innerWidth, H = innerHeight;
  const c = document.createElement('canvas'); c.className = 'confetti'; c.setAttribute('aria-hidden', 'true');
  c.width = Math.round(W*dpr); c.height = Math.round(H*dpr); c.style.width = W+'px'; c.style.height = H+'px';
  document.body.appendChild(c);
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--accent','--c-easy','--c-medium','--c-phys','--c-maths','--c-chem','--c-hard'].map(v=>cs.getPropertyValue(v).trim()).filter(Boolean);
  const kinds = ['dot','bar','glyph','glyph','glyph'];
  const cannons = [
    {x:W*0.5, y:H*0.38, a:-Math.PI/2, spread:0.9, n:64},
    {x:-10,   y:H*0.86, a:-Math.PI/2+0.55, spread:0.35, n:30},
    {x:W+10,  y:H*0.86, a:-Math.PI/2-0.55, spread:0.35, n:30}
  ];
  const P = [];
  cannons.forEach(cn=>{
    for(let i=0;i<cn.n;i++){
      const ang = cn.a + (Math.random()-0.5)*cn.spread*2;
      const sp = 7 + Math.random()*9;
      P.push({
        x:cn.x, y:cn.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
        kind: kinds[Math.random()*kinds.length|0],
        ch: CONF_GLYPHS[Math.random()*CONF_GLYPHS.length|0],
        size: 7 + Math.random()*8,
        r: Math.random()*Math.PI*2, vr: (Math.random()-0.5)*0.22,
        flip: Math.random()*Math.PI*2, vf: 0.1 + Math.random()*0.16,
        c: cols[Math.random()*cols.length|0] || '#d97757'
      });
    }
  });
  const DUR = 3400, FADE = 800, t0 = performance.now();
  (function f(t){
    const e = t - t0;
    const alpha = Math.max(0, Math.min(1, (DUR - e) / FADE));
    g.clearRect(0, 0, W, H);
    P.forEach(p=>{
      p.vy += 0.2; p.vx *= 0.985; p.vy *= 0.992;
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.flip += p.vf;
      const squash = Math.max(0.18, Math.abs(Math.cos(p.flip)));
      g.save();
      g.globalAlpha = alpha * (p.kind === 'glyph' ? 0.9 : 0.95);
      g.translate(p.x, p.y); g.rotate(p.r); g.scale(1, squash);
      g.fillStyle = p.c;
      if(p.kind === 'dot'){ g.beginPath(); g.arc(0, 0, p.size*0.38, 0, Math.PI*2); g.fill(); }
      else if(p.kind === 'bar'){ g.fillRect(-p.size*0.18, -p.size*0.65, p.size*0.36, p.size*1.3); }
      else { g.font = 'italic 600 ' + Math.round(p.size*2.1) + 'px Lora, Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(p.ch, 0, 0); }
      g.restore();
    });
    if(e < DUR) requestAnimationFrame(f); else c.remove();
  })(t0);
}

  app.querySelectorAll('.rf').forEach(c=>requestAnimationFrame(()=>requestAnimationFrame(()=>{ c.style.strokeDashoffset = c.dataset.to; })));
}

document.addEventListener('pointerdown', e=>{
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const t = e.target.closest && e.target.closest('button, [role="button"], a, .row, .chip');
  if(!t || t.disabled || t.style.cursor === 'default') return;
  const r = t.getBoundingClientRect();

  const dot = document.createElement('span');
  dot.className = 'ripple';
  dot.style.width = dot.style.height = size + 'px';
  dot.style.left = (e.clientX - r.left - size/2) + 'px';
  dot.style.top = (e.clientY - r.top - size/2) + 'px';
  t.appendChild(dot);
  dot.addEventListener('animationend', ()=> dot.remove());
}, {passive:true});

// Cloud sync: each network step has its own timeout so a slow or missing bridge never blocks the app.
function cloudSync(){
  if(typeof claude === 'undefined' || !claude.use) return Promise.resolve();
  const timeout = ms => new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms));
  return Promise.race([claude.use('db'), timeout(3000)]).then(db=>{
    if(!db) return;
    return Promise.race([claude.use('user'), timeout(3000)]).then(user=>{
      if(!user) return;
      return Promise.race([user.id(), timeout(3000)]).then(uid=>{
        if(!uid) return;
        return Promise.race([db.doc('data/users/'+uid+'/progress').get(), timeout(3000)]).then(doc=>{
          if(doc && doc.data){ store = Object.assign(store, doc.data); persist(); render(); }
        });
      });
    });
  }).catch(()=>{});
}
(function init(){
  let saved=null; try{ saved=localStorage.getItem('torque_theme'); }catch(e){}
  applyTheme(saved || 'claude-dark');
  restoreLastView();
  sbClient();
  setTimeout(()=>{ if(authState === 'unknown'){ authState = 'offline'; render(); } }, 5000);
  // Autosave every 15 seconds; if the saved copy has not been read yet, read it first
  setInterval(()=>{
    if(!sbSession) return;
    if(!cloudReady){ restoreCloudState(sbSession.user.id).then(()=>{ if(typeof render==='function' && !authBusy) render(); }); }
    else { flushCloud(); uploadPending(); flushReports(); }
  }, 15000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden'){ if(practiceLeavePending()){ finalizeLeave(); go('home'); } flushCloud(); } });
  window.addEventListener('pagehide', ()=>{ if(practiceLeavePending()) finalizeLeave(); flushCloud(); });

  const TL = el(splashHTML());
  document.body.appendChild(TL);
  // Nothing from the page is visible under the splash while the app starts
  const appEl = document.getElementById('app');
  if(appEl) appEl.style.visibility = 'hidden';
  const bar = TL.querySelector('.spl-bar i');
  const pct = TL.querySelector('.spl-pct');
  const msg = TL.querySelector('.spl-msg');

  // Each step is a real piece of startup work. The bar moves only when one of them actually finishes.
  const steps = [
    { label:'Loading fonts',
      run:()=> document.fonts ? document.fonts.ready : Promise.resolve() },
    { label:'Preparing the page',
      run:()=> document.readyState==='complete' ? Promise.resolve()
              : new Promise(r=>window.addEventListener('load', r, {once:true})) },
    { label:'Opening your question bank',
      run:()=>{ const l = loadLocal(); if(l) store = Object.assign(store, l); return Promise.resolve(); },
      after:()=> render() },
    { label:'Syncing your progress',
      run:()=> cloudSync() }
  ];

  let done = 0, finished = false;
  const show = (p, label)=>{
    bar.style.width = p+'%';
    pct.textContent = p+'%';
    if(label) msg.textContent = label;
  };
  const finish = ()=>{
    if(finished) return; finished = true;
    show(100, 'Ready');
    setTimeout(()=>{ TL.classList.add('off'); setTimeout(()=>{ TL.remove(); if(appEl) appEl.style.visibility = ''; }, 300); }, 200);
  };
  const withTimeout = (p, ms)=> Promise.race([p, new Promise(r=>setTimeout(r, ms))]);
  const hardStop = setTimeout(finish, 3500);
  setTimeout(()=>{ if(appEl) appEl.style.visibility = ''; }, 6000); // never leave the user on the splash indefinitely

  (async ()=>{
    await loadBank();
    buildGutter();
    registerSW();
    for(const st of steps){
      msg.textContent = st.label;
      try{ await withTimeout(Promise.resolve().then(st.run), 3000); }catch(e){}
      if(st.after){ try{ st.after(); }catch(e){} }
      done++;
      show(Math.round(done/steps.length*100));
    }
    clearTimeout(hardStop);
    finish();
  })();
})();
