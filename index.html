        +'<span class="cs">'+(st.total ? st.acc+'% · '+st.total+' tries' : nq+' PYQ'+(nq===1?'':'s'))+'</span></button>');
      t.onclick = ()=>go('chapter',{subject:s, chapter:c});
      g.appendChild(t);
    });
    w.appendChild(g);
  });
  return w;
}

// ---------- Practice: clock, points, keypad, skip and the question drawer ----------
function qStartOf(q){
  if(!session.started) session.started = {};
  if(!session.started[q.id]) session.started[q.id] = Date.now();
  return session.started[q.id];
}
function clockLabel(answered, elapsed, left){
  if(answered) return 'Answered in '+fmtTime(elapsed);
  return left>=0 ? fmtTime(left)+' left' : 'Past 2 minutes';
}
function ringOffset(sec){ return (113*(1-Math.min(1, sec/120))).toFixed(1); }
// Points: a correct answer is worth 4, plus up to 2 for speed (under 2 minutes).
// Sure adds 1 and guessing takes 1 away. A wrong answer gives 0. Skipping gives 1.
// Top ranks taper slightly so the leaderboard rewards steady consistency over time.
function rankMult(){
  const r = store.lbRank;
  if(!r) return 1;
  if(r===1) return 0.8;
  if(r<=3) return 0.85;
  if(r<=10) return 0.9;
  if(r<=25) return 0.95;
  return 1;
}
function scoreFor(ok, conf, sec){
  if(!ok) return 0;
  const speed = Math.max(0, Math.min(2, 2*(120-sec)/120));
  const base = 4 + speed;
  return Math.round((conf==='sure' ? base+1 : base-1) * rankMult() * 10) / 10;
}
function addPoints(p){
  if(!p) return;
  session.points = (session.points||0) + p;
  store.points = (store.points||0) + p;
  persist();
  cacheUser({points: store.points});
}
function skipQ(){
  const q = session.queue[session.idx];
  const prev = session.answers[q.id];
  if(prev && !prev.skip) return;
  const sec = Math.round((Date.now()-qStartOf(q))/1000);
  session.answers[q.id] = {skip:true, time:sec, pts:1};
  addPoints(1 - ((prev && prev.pts) || 0));
  checkDailyDone();
  if(session.idx < session.queue.length-1) session.idx++;
  render();
}
function goQ(i){ session.idx = i; render(); }
function tickQ(){
  if(!session || session.mode==='mock' || session.submitted) return;
  const q = session.queue[session.idx];
  if(!q) return;
  const a = session.answers[q.id];
  if(a && !a.skip) return;
  const sec = Math.floor((Date.now()-qStartOf(q))/1000);
  const t = document.getElementById('qTimer'); if(t) t.textContent = clockLabel(false, sec, 120-sec);
  const arc = document.getElementById('qArc'); if(arc) arc.style.strokeDashoffset = ringOffset(sec);
  const clock = document.querySelector('.qclock');
  if(clock){ clock.classList.toggle('over', sec>=120); clock.classList.toggle('warn', sec>=100 && sec<120); }
}
// Our own keypad: the answer box is not a text field, so the phone's keyboard never opens
function editValue(v, k){
  if(k==='⌫') return v.slice(0,-1);
  if(k==='Clear') return '';
  if(k==='\u2212') return v.charAt(0)==='\u2212' ? v.slice(1) : '\u2212'+v;
  if(k==='.'){
    if(v.indexOf('.')>=0) return v;
    return (v===''||v==='\u2212') ? v+'0.' : v+'.';
  }
  if(v.replace('\u2212','').length>=8) return v;
  return v+k;
}
function numpad(q, value, onChange, onCheck, locked, state){
  const wrap = el('<div class="numwrap"></div>');
  const open = !locked && !!session.pad[q.id];
  const disp = el('<button type="button" class="numdisp'+(open?' open':'')+(locked?' locked':'')+(state?' '+state:'')+'"></button>');
  disp.innerHTML = value ? '<span>'+esc(value)+'</span>' : '<i>Tap to enter your answer</i>';
  disp.onclick = ()=>{ if(!locked){ session.pad[q.id] = !open; render(); } };
  wrap.appendChild(disp);
  if(open){
    const pad = el('<div class="numpad" role="group" aria-label="Number keypad"></div>');
    ['1','2','3','4','5','6','7','8','9','\u2212','0','.','⌫','Clear'].forEach(k=>{
      const b = el('<button type="button" class="nk'+((k==='⌫'||k==='Clear')?' fn':'')+'">'+esc(k)+'</button>');
      b.onclick = ()=>onChange(editValue(value, k));
      pad.appendChild(b);
    });
    if(onCheck){
      const ck = el('<button type="button" class="nk check">Check answer</button>');
      ck.onclick = onCheck;
      pad.appendChild(ck);
    }
    wrap.appendChild(pad);
  }
  return wrap;
}
// The question list: a small tab on the left edge that slides the drawer out
function qNavDrawer(){
  const open = !!session.navOpen;
  const wrap = el('<div class="qnav-wrap"></div>');
  const tab = el('<button type="button" class="qnav-tab'+(open?' open':'')+'" aria-expanded="'+open+'" aria-label="'+(open?'Close':'Open')+' question list">'+(open?'‹':'›')+'</button>');
  tab.onclick = ()=>{ session.navOpen = !open; render(); };
  const drawer = el('<div class="qnav-drawer'+(open?' open':'')+'"><div class="qnav-head"><b>Questions</b><small>'+esc(session.title)+'</small></div>'
    +'<div class="qnav-grid"></div>'
    +'<div class="qnav-legend"><span><i class="lg ok"></i>Correct</span><span><i class="lg bad"></i>Wrong</span><span><i class="lg skip"></i>Skipped</span><span><i class="lg todo"></i>Not yet</span></div></div>');
  const grid = drawer.querySelector('.qnav-grid');
  session.queue.forEach((x,i)=>{
    const y = session.answers[x.id];
    const s = !y ? 'todo' : (y.skip ? 'skip' : (y.correct ? 'ok' : 'bad'));
    const b = el('<button type="button" class="qn '+s+(i===session.idx?' cur':'')+'">'+(i+1)+'</button>');
    b.onclick = ()=>{ session.navOpen = false; goQ(i); };
    grid.appendChild(b);
  });
  wrap.appendChild(tab); wrap.appendChild(drawer);
  return wrap;
}
// Wide screens: drifting formulas fill the side margins
function buildGutter(){
  if(document.querySelector('.gutter')) return;
  const g = el('<div class="gutter" aria-hidden="true"></div>');
  for(let r=0; r<16; r++){
    for(let c=0; c<2; c++){
      const t = el('<span class="gf">'+esc(BG_FORMULAS[(r*2+c) % BG_FORMULAS.length])+'</span>');
      t.style.left = (c===0 ? (2 + (r%3)*4 + (r%2)*3) : (84 + (r%3)*4 + (r%2)*3)) + '%';
      t.style.top = (r*6.4) + '%';
      t.style.animationDelay = (-(r*1.3 + c)) + 's';
      t.style.setProperty('--r', ((r%2?1:-1)*(3+(r%4)*2)) + 'deg');
      g.appendChild(t);
    }
  }
  document.body.insertBefore(g, document.body.firstChild);
}

// Layout for question text: statements and the closing line start on their own lines
function qtextHTML(t){
  return esc(t).replace(/\s*(Statement[\s-]*(?:I{1,2}|1|2)\s*:|Assertion\s*\(A\)\s*:|Reason\s*\(R\)\s*:|In the light of)/gi,
    (m, p1, off)=> off===0 ? p1 : '<span class="stmt-break"></span>'+p1);
}
window.addEventListener('popstate', e=>{
  const st = e.state;
  if(!st || !st.torq) return;
  // a practice or results screen with no live session cannot be shown; step past it
  if((st.view==='practice' || st.view==='results') && (!session || (st.view==='practice' && session.submitted))){

  }
  view = st.view;
  Object.keys(nav).forEach(k=>{ if(!(k in st.nav)) delete nav[k]; });
  Object.assign(nav, st.nav);
  if(st.idx!=null && session) session.idx = st.idx;
  renderInner();
  window.scrollTo(0,0);
});
const CONF_GLYPHS = ['\u03C0','\u2211','\u0394','\u03BB','\u03A9','\u222B','\u221A','\u03B8','\u03BC','\u221E'];
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches || view!=='results') return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = innerWidth, H = innerHeight;
  const c = document.createElement('canvas'); c.className = 'confetti'; c.setAttribute('aria-hidden', 'true');
  c.width = Math.round(W*dpr); c.height = Math.round(H*dpr); c.style.width = W+'px'; c.style.height = H+'px';
  document.body.appendChild(c);
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--accent','--c-easy','--c-medium','--c-phys','--c-maths','--c-chem','--c-hard'].map(v=>cs.getPropertyValue(v).trim()).filter(Boolean);
  const kinds = ['dot','bar','glyph','glyph','glyph'];
  const cannons = [
    {x:W*0.5, y:H*0.38, a:-Math.PI/2, spread:0.9, n:64},
    {x:-10,   y:H*0.86, a:-Math.PI/2+0.55, spread:0.35, n:30},
    {x:W+10,  y:H*0.86, a:-Math.PI/2-0.55, spread:0.35, n:30}
  ];
  const P = [];
  cannons.forEach(cn=>{
    for(let i=0;i<cn.n;i++){
      const ang = cn.a + (Math.random()-0.5)*cn.spread*2;
      const sp = 7 + Math.random()*9;
      P.push({
        x:cn.x, y:cn.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
        kind: kinds[Math.random()*kinds.length|0],
        ch: CONF_GLYPHS[Math.random()*CONF_GLYPHS.length|0],
        size: 7 + Math.random()*8,
        r: Math.random()*Math.PI*2, vr: (Math.random()-0.5)*0.22,
        flip: Math.random()*Math.PI*2, vf: 0.1 + Math.random()*0.16,
        c: cols[Math.random()*cols.length|0] || '#d97757'
      });
    }
  });
  const DUR = 3400, FADE = 800, t0 = performance.now();
  (function f(t){
    const e = t - t0;
    const alpha = Math.max(0, Math.min(1, (DUR - e) / FADE));
    g.clearRect(0, 0, W, H);
    P.forEach(p=>{
      p.vy += 0.2; p.vx *= 0.985; p.vy *= 0.992;
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.flip += p.vf;
      const squash = Math.max(0.18, Math.abs(Math.cos(p.flip)));
      g.save();
      g.globalAlpha = alpha * (p.kind === 'glyph' ? 0.9 : 0.95);
      g.translate(p.x, p.y); g.rotate(p.r); g.scale(1, squash);
      g.fillStyle = p.c;
      if(p.kind === 'dot'){ g.beginPath(); g.arc(0, 0, p.size*0.38, 0, Math.PI*2); g.fill(); }
      else if(p.kind === 'bar'){ g.fillRect(-p.size*0.18, -p.size*0.65, p.size*0.36, p.size*1.3); }
      else { g.font = 'italic 600 ' + Math.round(p.size*2.1) + 'px Lora, Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(p.ch, 0, 0); }
      g.restore();
    });
    if(e < DUR) requestAnimationFrame(f); else c.remove();
  })(t0);
}
function announce(msg){ let l=document.getElementById('live'); if(!l){ l=document.createElement('div'); l.id='live'; l.className='sr'; l.setAttribute('aria-live','polite'); document.body.appendChild(l); } l.textContent=''; setTimeout(()=>{ l.textContent=msg; },50); }
document.addEventListener('keydown', e=>{
  const t = e.target;
  if((e.key==='Enter' || e.key===' ') && t.getAttribute && t.getAttribute('role')==='button' && t.tagName!=='BUTTON'){ e.preventDefault(); t.click(); }
});
let __lastKey = null;
let __lastView = null;
function enhance(app){
  app.querySelectorAll('.chip,.seg button').forEach(b=>b.setAttribute('aria-pressed', b.classList.contains('on')?'true':'false'));
  app.querySelectorAll('.opt').forEach(o=>{ o.setAttribute('role','button'); o.setAttribute('tabindex','0');
    const k = o.querySelector('.k'), st = o.classList.contains('ok')?', correct answer':o.classList.contains('bad')?', your answer, incorrect':o.classList.contains('sel')?', selected':'';
    o.setAttribute('aria-label','Option '+(k?k.textContent:'')+': '+(o.lastElementChild?o.lastElementChild.textContent:'')+st); o.setAttribute('aria-pressed', o.classList.contains('sel')||o.classList.contains('bad')||o.classList.contains('ok')?'true':'false'); });
  app.querySelectorAll('.row,.preset').forEach(r=>{ if(r.style.cursor!=='default' && !r.closest('.topline')){ r.setAttribute('role','button'); r.setAttribute('tabindex','0'); } });
  app.querySelectorAll('.pal').forEach((p,i)=>p.setAttribute('aria-label','Question '+(i+1)+(p.classList.contains('done')?', answered':', not answered')+(p.classList.contains('mark')?', marked for review':'')));
  const key = view+'|'+(session?session.idx:'');
  if(__lastKey!==key){ if(__lastKey!==null){ const h = app.querySelector('.title,.qtext'); if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); } } __lastKey = key; }
  app.querySelectorAll('.progress').forEach(p=>{
    const i = p.querySelector('i');
    p.setAttribute('role','progressbar'); p.setAttribute('aria-valuemin','0'); p.setAttribute('aria-valuemax','100');
    p.setAttribute('aria-valuenow', String(parseInt((i&&i.style.width)||'0',10)||0));
  });
  document.querySelectorAll('.bn').forEach(b=>b.setAttribute('aria-current', b.classList.contains('on')?'page':'false'));
  if(__lastView!==view){ __lastView = view; app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter'); }
  app.querySelectorAll('.rf').forEach(c=>requestAnimationFrame(()=>requestAnimationFrame(()=>{ c.style.strokeDashoffset = c.dataset.to; })));
}

// ---------- Start: render immediately, then try optional cloud sync with a timeout ----------
// ---------- Ripple on every tap (replaces the default blue highlight) ----------
document.addEventListener('pointerdown', e=>{
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const t = e.target.closest && e.target.closest('button, [role="button"], a, .row, .chip');
  if(!t || t.disabled || t.style.cursor === 'default') return;
  const r = t.getBoundingClientRect();
  const size = Math.max(r.width, r.height) * 2.4;
  const dot = document.createElement('span');
  dot.className = 'ripple';
  dot.style.width = dot.style.height = size + 'px';
  dot.style.left = (e.clientX - r.left - size/2) + 'px';
  dot.style.top = (e.clientY - r.top - size/2) + 'px';
  t.appendChild(dot);
  dot.addEventListener('animationend', ()=> dot.remove());
}, {passive:true});

function splashHTML(){
  const id = document.documentElement.getAttribute('data-theme') || 'claude-dark';
  const src = LOGOS[id] || LOGOS['claude-dark'];
  return '<div id="tauLoader" role="status" aria-live="polite"><div class="spl-bg" aria-hidden="true"><i></i><i></i><i></i></div><div class="spl-inner">'
    +'<div class="spl-eyebrow">JEE · Previous-year papers</div>'
    +torqWordmark('wm-lg')
    +'<div class="spl-bar" aria-hidden="true"><i></i></div>'
    +'<div class="spl-row"><span class="spl-msg">Starting</span><span class="spl-pct">0%</span></div>'
    +'</div></div>';
}
// Cloud sync: each network step has its own timeout so a slow or missing bridge never blocks the app.
function cloudSync(){
  if(typeof claude === 'undefined' || !claude.use) return Promise.resolve();
  const timeout = ms => new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms));
  return Promise.race([claude.use('db'), timeout(3000)]).then(db=>{
    if(!db) return;
    return Promise.race([claude.use('user'), timeout(3000)]).then(user=>{
      if(!user) return;
      return Promise.race([user.id(), timeout(3000)]).then(uid=>{
        if(!uid) return;
        return Promise.race([db.doc('data/users/'+uid+'/progress').get(), timeout(3000)]).then(doc=>{
          if(doc && doc.data){ store = Object.assign(store, doc.data); persist(); render(); }
        });
      });
    });
  }).catch(()=>{});
}
(function init(){
  let saved=null; try{ saved=localStorage.getItem('torque_theme'); }catch(e){}
  applyTheme(saved || 'claude-dark');
  sbClient();
  setTimeout(()=>{ if(authState === 'unknown'){ authState = 'offline'; render(); } }, 5000);

  const TL = el(splashHTML());
  document.body.appendChild(TL);
  const bar = TL.querySelector('.spl-bar i');
  const pct = TL.querySelector('.spl-pct');
  const msg = TL.querySelector('.spl-msg');

  // Each step is a real piece of startup work. The bar moves only when one of them actually finishes.
  const steps = [
    { label:'Loading fonts',
      run:()=> document.fonts ? document.fonts.ready : Promise.resolve() },
    { label:'Preparing the page',
      run:()=> document.readyState==='complete' ? Promise.resolve()
              : new Promise(r=>window.addEventListener('load', r, {once:true})) },
    { label:'Opening your question bank',
      run:()=>{ const l = loadLocal(); if(l) store = Object.assign(store, l); return Promise.resolve(); },
      after:()=> render() },
    { label:'Syncing your progress',
      run:()=> cloudSync() }
  ];

  let done = 0, finished = false;
  const show = (p, label)=>{
    bar.style.width = p+'%';
    pct.textContent = p+'%';
    if(label) msg.textContent = label;
  };
  const finish = ()=>{
    if(finished) return; finished = true;
    show(100, 'Ready');
    setTimeout(()=>{ TL.classList.add('off'); setTimeout(()=>TL.remove(), 600); }, 250);
  };
  const withTimeout = (p, ms)=> Promise.race([p, new Promise(r=>setTimeout(r, ms))]);
  const hardStop = setTimeout(finish, 3500); // never leave the user on the splash indefinitely

  (async ()=>{
    await loadBank();
    buildGutter();
    registerSW();
    for(const st of steps){
      msg.textContent = st.label;
      try{ await withTimeout(Promise.resolve().then(st.run), 3000); }catch(e){}
      if(st.after){ try{ st.after(); }catch(e){} }
      done++;
      show(Math.round(done/steps.length*100));
    }
    clearTimeout(hardStop);
    finish();
  })();
})();
</script>
