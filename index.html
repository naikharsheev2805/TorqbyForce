rs when unpaired electrons are present, as in O2."], "example": {"q": "Find the bond order of O2.", "a": "Bonding electrons 8, antibonding 4, so bond order = (8 - 4) / 2 = 2."}}, {"title": "Dipole moment and polarity", "analogy": "A see-saw with one end heavier. The imbalance makes it tilt, and charge imbalance in a molecule makes it polar.", "body": ["Dipole moment is charge times distance. Symmetric molecules such as CO2 have bond dipoles that cancel, so the net moment is zero.", "Hydrogen bonding is a special strong dipole attraction, seen in water and alcohols, and it raises boiling points."], "example": {"q": "Why is CO2 nonpolar but H2O polar?", "a": "CO2 is linear and symmetric, so its bond dipoles cancel. H2O is bent, so its bond dipoles add up."}}]}, "Chemical Thermodynamics": {"formulas": [{"eq": "Delta U = q + w", "use": "First law of thermodynamics (q heat in, w work on system)"}, {"eq": "Delta H = Delta U + Delta n_g R T", "use": "Relation between enthalpy and internal energy change"}, {"eq": "Delta G = Delta H - T Delta S", "use": "Gibbs energy; a process is spontaneous when Delta G is negative"}, {"eq": "Delta G standard = -R T ln K", "use": "Links Gibbs energy to the equilibrium constant"}, {"eq": "Delta S universe = Delta S system + Delta S surroundings", "use": "Second law criterion"}], "concepts": [{"title": "Hess's law: enthalpy is a state function", "analogy": "Walking from the ground floor to the third floor by stairs or by lift. The height gained is the same, whichever route you take.", "body": ["The total enthalpy change of a reaction is the same whatever the path, so steps can be added together.", "Use it to find an unknown enthalpy from known ones, by reversing equations when needed and adding them."], "example": {"q": "C + O2 gives CO2 (-394 kJ), and C + 1/2 O2 gives CO (-110 kJ). Find the enthalpy of CO + 1/2 O2 gives CO2.", "a": "Reverse the CO equation (+110) and add it to C + O2 gives CO2 (-394), so the answer is -284 kJ."}}, {"title": "Spontaneity: Gibbs energy decides", "analogy": "A ball rolling down a hill. Enthalpy is the drop in height, and entropy is how much the ball spreads out, and Gibbs energy combines the two.", "body": ["A process is spontaneous when Delta G is negative. Exothermic reactions with rising disorder are always spontaneous.", "At high temperature the T Delta S term dominates, so an entropy-driven process can become spontaneous even if it is endothermic."], "example": {"q": "Delta H = +40 kJ and Delta S = +0.1 kJ/K. At what temperature does the process become spontaneous?", "a": "Delta G = 0 at T = 40 / 0.1 = 400 K, so above 400 K it is spontaneous."}}, {"title": "Gibbs energy and the equilibrium constant", "analogy": "The depth of a valley and the number of people at the bottom. A large negative Delta G means the reaction runs far toward products.", "body": ["Standard Gibbs energy links to K: a large K gives a negative standard Delta G.", "Doubling the number of reaction steps does not change K for a single step, but multiplying K for combined steps multiplies their Ks."], "example": {"q": "K = 100 at 298 K. Find the standard Gibbs energy change.", "a": "Delta G = -8.314 x 298 x ln 100 = -11.4 kJ/mol."}}]}, "Solutions": {"formulas": [{"eq": "molality m = moles of solute / kg of solvent", "use": "Concentration that does not change with temperature"}, {"eq": "p = x_solvent x p0", "use": "Raoult's law for an ideal solution"}, {"eq": "Delta Tf = i Kf m", "use": "Depression of freezing point"}, {"eq": "Delta Tb = i Kb m", "use": "Elevation of boiling point"}, {"eq": "pi = i C R T", "use": "Osmotic pressure"}], "concepts": [{"title": "Colligative properties depend on the number of particles", "analogy": "Adding salt to ice. The effect depends on how many particles are dissolved, not on what they are.", "body": ["Lowering of vapour pressure, freezing-point depression, boiling-point elevation and osmotic pressure all depend on the mole fraction or number of solute particles.", "The van't Hoff factor i counts the particles per formula unit: about 2 for NaCl, close to 1 for sugar."], "example": {"q": "Find the freezing-point depression of 0.1 m NaCl (Kf = 1.86 K kg/mol, i = 2).", "a": "Delta Tf = 2 x 1.86 x 0.1 = 0.372 K."}}, {"title": "Abnormal molar mass", "analogy": "Counting people in a queue. If pairs stick together, you see fewer people than you counted as individuals.", "body": ["Association in solution (such as acetic acid dimers) lowers i below the expected value, so the calculated molar mass comes out too high.", "Dissociation (such as NaCl) raises i, so the calculated molar mass comes out too low."], "example": {"q": "A solute gives an apparent molar mass twice its true value in benzene. Is it associating or dissociating?", "a": "The apparent value is larger than the true one, so the solute associates, halving the particle count."}}, {"title": "Ideal solutions and Raoult's law", "analogy": "A crowd where everyone is equally likely to move. The vapour escapes in proportion to how many molecules are present.", "body": ["In an ideal solution the partial vapour pressure of each component is its mole fraction times its pure vapour pressure.", "Real solutions show positive deviation when solute-solvent attraction is weaker than the attractions in the pure liquids, and negative deviation when it is stronger."], "example": {"q": "Pure solvent has vapour pressure 100 mmHg. Its mole fraction in the solution is 0.8. Find its partial pressure.", "a": "p = 0.8 x 100 = 80 mmHg."}}]}, "Equilibrium": {"formulas": [{"eq": "Kp = Kc (R T)^(Delta n_g)", "use": "Converts Kc to Kp for gas reactions"}, {"eq": "Ka x Kb = Kw = 1.0 x 10^-14 at 25 C", "use": "Conjugate acid-base pairs"}, {"eq": "pH = -log10 [H+]", "use": "Definition of pH"}, {"eq": "pH = pKa + log ([A-] / [HA])", "use": "Henderson-Hasselbalch equation for buffers"}, {"eq": "Ksp = [M+]^a [X-]^b", "use": "Solubility product of a sparingly soluble salt"}], "concepts": [{"title": "Le Chatelier: systems resist change", "analogy": "A seesaw that tips back when you push one end. The system moves to oppose whatever you did.", "body": ["Adding reactant or removing product shifts equilibrium forward. Raising the temperature favours the endothermic direction.", "A catalyst speeds up both directions equally, so it does not change the equilibrium position or K."], "example": {"q": "N2 + 3H2 gives 2NH3 is exothermic. Does raising temperature increase the yield of NH3?", "a": "No. Heat is a product, so raising T shifts equilibrium toward reactants."}}, {"title": "Common ion effect and buffers", "analogy": "Adding more people to a crowded room. The extra people reduce how many more can enter.", "body": ["Adding a salt with a common ion suppresses the ionisation of a weak acid or base, so its pH changes less.", "A buffer resists pH change because it contains both a weak acid and its salt, so the Henderson equation holds."], "example": {"q": "What is the pH of a buffer with pKa = 4.74 and [A-]/[HA] = 1?", "a": "pH = 4.74 + log 1 = 4.74."}}, {"title": "pH of weak acids", "analogy": "Only a few teacups break when a crowd of dishes is dropped. Weak acids release only a small fraction of their protons.", "body": ["For a weak acid, [H+] is about the square root of Ka times the concentration, when ionisation is small.", "Strong acids are fully ionised, so [H+] equals their concentration."], "example": {"q": "Find the pH of 0.1 M acetic acid (Ka = 1.8 x 10^-5).", "a": "[H+] = sqrt(1.8 x 10^-5 x 0.1) = 1.34 x 10^-3, so pH = 2.87."}}]}, "Redox Reactions and Electrochemistry": {"formulas": [{"eq": "E = E standard - (0.0591 / n) log Q at 25 C", "use": "Nernst equation"}, {"eq": "Delta G = -n F E", "use": "Links cell potential to Gibbs energy (F = 96500 C/mol)"}, {"eq": "Lambda m = lambda+ + lambda-", "use": "Kohlrausch's law for molar conductivity"}, {"eq": "m = Z I t", "use": "Mass deposited in electrolysis (Faraday's law)"}], "concepts": [{"title": "Oxidation numbers track electrons", "analogy": "A bank ledger. Each atom's oxidation number records how many electrons it has gained or lost on paper.", "body": ["Oxidation increases the oxidation number and reduction decreases it. The sum of oxidation numbers is zero for a neutral molecule.", "To balance redox reactions, balance atoms other than O and H first, then balance electrons gained and lost."], "example": {"q": "Find the oxidation state of Mn in MnO4-.", "a": "4 x (-2) + x = -1, so x = +7."}}, {"title": "Galvanic cells make electricity", "analogy": "A water wheel driven by a fall. Electrons flow from the higher-energy side to the lower one, and the drop does the work.", "body": ["In a galvanic cell oxidation happens at the anode (negative) and reduction at the cathode (positive). The cell potential is the reduction potential of the cathode minus that of the anode.", "A positive cell potential means a spontaneous reaction and a negative Delta G."], "example": {"q": "Zn/Zn2+ has E = -0.76 V and Cu2+/Cu has E = +0.34 V. Find the standard cell potential.", "a": "E = 0.34 - (-0.76) = 1.10 V, which is positive, so the cell works."}}, {"title": "Electrolysis and Faraday's law", "analogy": "Counting coins into a box at a fixed rate. The total charge tells you how many coins arrived.", "body": ["The mass deposited depends on the charge passed, the molar mass, and the number of electrons per ion.", "One faraday, 96500 C, deposits one mole of electrons' worth of product."], "example": {"q": "How much copper (molar mass 63.5, Z = 2) is deposited by 2 A for 1930 s?", "a": "Charge = 3860 C, moles of electrons = 0.04, so moles of Cu = 0.02, mass = 1.27 g."}}]}, "Chemical Kinetics": {"formulas": [{"eq": "zero order: [A] = [A]0 - k t", "use": "Concentration against time for a zero-order reaction"}, {"eq": "first order: ln([A]0 / [A]) = k t", "use": "Concentration against time for a first-order reaction"}, {"eq": "t half (first order) = 0.693 / k", "use": "Half-life of a first-order reaction"}, {"eq": "k = A exp(-Ea / R T)", "use": "Arrhenius equation"}, {"eq": "log (k2 / k1) = (Ea / 2.303 R) (1/T1 - 1/T2)", "use": "Temperature dependence of k"}], "concepts": [{"title": "Order is found from data, not from the equation", "analogy": "A recipe where you measure the change in taste as you add more of each ingredient. The data show how much each one matters.", "body": ["Order is the power of each concentration in the rate law, and it is found experimentally. It is not necessarily the coefficients of the balanced equation.", "Molecularity is the number of molecules in an elementary step, and it is a whole number. Overall order can be fractional."], "example": {"q": "Rate doubles when [A] doubles. What is the order in A?", "a": "Rate = k[A]^n, so 2 = 2^n, and n = 1: first order."}}, {"title": "Half-life of a first-order reaction", "analogy": "A radioactive sample loses half its atoms in each fixed period, whatever the amount left.", "body": ["The half-life of a first-order reaction does not depend on the starting concentration, which makes it simple to use.", "After n half-lives, the fraction left is (1/2) to the power n."], "example": {"q": "A first-order reaction has half-life 20 min. What fraction remains after 60 min?", "a": "Three half-lives give (1/2)^3 = 1/8, or 12.5 percent."}}, {"title": "Temperature and activation energy", "analogy": "Climbing a hill. A higher temperature gives more walkers enough energy to get over the top.", "body": ["A rise of about 10 K roughly doubles the rate for many reactions.", "A catalyst lowers the activation energy, so more molecules react at the same temperature."], "example": {"q": "Ea = 50 kJ/mol. How does k change from 298 K to 308 K?", "a": "log(k2/k1) = (50000 / (2.303 x 8.314)) x (1/298 - 1/308) = 0.28, so k rises about 1.9 times."}}]}, "Classification of Elements and Periodicity in Properties": {"formulas": [{"eq": "Atomic radius decreases across a period and increases down a group", "use": "Periodic trend in atomic size"}, {"eq": "Ionisation enthalpy increases across a period and decreases down a group", "use": "Periodic trend in ionisation enthalpy"}, {"eq": "Electron gain enthalpy becomes more negative across a period, with exceptions in groups 2, 15 and 18", "use": "Periodic trend in electron gain enthalpy"}], "concepts": [{"title": "Why the trends happen", "analogy": "Standing on the rungs of a ladder. Adding protons pulls electrons closer, but each new shell moves them further away.", "body": ["Across a period, the nuclear charge rises while electrons enter the same shell, so atoms shrink and hold on harder to electrons.", "Down a group, each new shell adds distance, so atoms grow and are easier to ionise."], "example": {"q": "Which has the larger radius, Na or Mg?", "a": "Na, because it has one fewer proton in the same period and so less pull on its outer electron."}}, {"title": "Exceptions in the trends", "analogy": "Rules with well-known exceptions. Half-filled and fully filled shells are the exceptions here.", "body": ["Be and N have higher ionisation enthalpy than their neighbours because of their filled or half-filled subshells.", "Fluorine has a lower electron gain enthalpy than chlorine, because its small size puts extra repulsion on the incoming electron."], "example": {"q": "Why is nitrogen's ionisation enthalpy higher than oxygen's?", "a": "Nitrogen has a half-filled 2p subshell, which is stable, so removing an electron costs more energy."}}, {"title": "Oxidation states and reactivity", "analogy": "Titles held by an element. The highest title it can hold depends on how many electrons it can share.", "body": ["Elements in the same group often show the same highest oxidation state, such as +7 for Mn and Cl in some compounds.", "Reactivity changes down a group: alkali metals become more reactive down the group because electrons are easier to lose."], "example": {"q": "What is the highest oxidation state of chlorine?", "a": "+7, as in perchlorate, using all seven valence electrons."}}]}, "p-Block Elements": {"formulas": [{"eq": "Group 13 to 18: valence electrons run from 3 to 8", "use": "Counting outer electrons for p-block elements"}, {"eq": "Inert pair effect: heavier p-block elements prefer lower oxidation states such as +2 for Pb", "use": "Stability trend down a group"}], "concepts": [{"title": "Unique behaviour of the first element in each group", "analogy": "The eldest child in a family who acts differently from the younger siblings, because the family role is different.", "body": ["The first element of each group is small and has no d orbitals, so it forms fewer bonds and pi bonds more strongly. Boron, carbon, nitrogen and oxygen all differ from their group members in this way.", "Nitrogen's triple bond in N2 makes it very unreactive, while phosphorus is much more reactive."], "example": {"q": "Why is N2 unreactive at room temperature?", "a": "The N triple bond is very strong, with a bond energy of about 945 kJ/mol, so it takes a lot of energy to break."}}, {"title": "Trends down groups 13 to 18", "analogy": "Layers of an onion. The outer layers change most quickly as you move down the group.", "body": ["Metallic character increases down a group, so the top element is a non-metal and the bottom is a metal in most groups.", "Stability of the lower oxidation state increases down a group, which explains why Tl+ and Pb2+ are common."], "example": {"q": "Which is more stable, Tl+ or Tl3+?", "a": "Tl+, because of the inert pair effect, where the 6s electrons are held tightly."}}]}, "d- and f-Block Elements": {"formulas": [{"eq": "Transition metals: partly filled d subshell in at least one common oxidation state", "use": "Definition of a transition element"}, {"eq": "Lanthanoid contraction: atomic radii shrink steadily across the 4f series", "use": "Trend across the f-block"}, {"eq": "Mn in KMnO4 is +7; Cr in K2Cr2O7 is +6", "use": "Highest oxidation states in the oxidising salts"}, {"eq": "Magnetic moment = sqrt(n(n+2)) BM, where n is the number of unpaired electrons", "use": "Spin-only magnetic moment"}], "concepts": [{"title": "Variable oxidation states come from the d electrons", "analogy": "A shared key ring where several keys can be used. The d electrons are close in energy to the s electrons, so several can take part in bonding.", "body": ["Transition metals show several oxidation states because the d and s electrons have similar energies, and the number that takes part can vary.", "Across the first row, the highest oxidation state rises to a peak around manganese, then falls, because the later elements hold their d electrons more tightly."], "example": {"q": "What is the oxidation state of Cr in K2Cr2O7?", "a": "2 x (+1) + 2 x x + 7 x (-2) = 0, so x = +6."}}, {"title": "Colour and magnetism from partly filled d orbitals", "analogy": "A stained glass window. A coloured pane absorbs some light and shows the rest, and the colour depends on which wavelengths get through.", "body": ["Compounds of transition metals are often coloured because light excites an electron from one d level to another. The colour seen is the light not absorbed.", "Unpaired d electrons make a compound paramagnetic. The more unpaired electrons, the stronger the effect."], "example": {"q": "Find the spin-only magnetic moment of a complex with 4 unpaired electrons.", "a": "Magnetic moment = sqrt(4 x 6) = sqrt(24), about 4.9 BM."}}, {"title": "Lanthanoids and actinoids", "analogy": "Very similar siblings. Lanthanoids look alike because their outer electron shells are almost the same.", "body": ["Across the lanthanoids, atomic size falls slowly. This lanthanoid contraction makes elements after them have radii close to those of the 4d and 5d metals, which is why they are hard to separate.", "Actinoids have more variable oxidation states than lanthanoids, and most of them are radioactive."], "example": {"q": "Why are Zr and Hf so alike in size and chemistry?", "a": "Lanthanoid contraction makes Hf about as small as Zr, even though it has far more electrons."}}]}, "Coordination Compounds": {"formulas": [{"eq": "Coordination number = number of donor atoms bonded to the central metal", "use": "Counting ligand bonds"}, {"eq": "Oxidation state of metal + charges of ligands = overall charge of complex", "use": "Finding the metal's oxidation state"}, {"eq": "Crystal field splitting: Delta o, the energy gap between t2g and eg orbitals", "use": "Crystal field theory"}, {"eq": "Ligands are named in alphabetical order, with the metal name last and its oxidation state in Roman numerals", "use": "IUPAC naming rule"}], "concepts": [{"title": "Ligands and coordination number", "analogy": "Arms holding a ball. A monodentate ligand gives one arm, a bidentate ligand gives two, and the number of arms is the coordination number.", "body": ["A ligand is a molecule or ion that donates a lone pair to the metal. Monodentate ligands give one donor atom, such as Cl- or NH3. Chelating ligands, such as ethylenediamine, give two or more, which makes the complex more stable.", "The coordination number is the number of donor atoms attached to the metal, not the number of ligands."], "example": {"q": "What is the coordination number of the metal in [Ni(en)3]2+?", "a": "Each en is bidentate, so 3 x 2 = 6."}}, {"title": "Naming and isomerism", "analogy": "Naming a family group. The ligands are listed first in alphabetical order, and the metal comes last.", "body": ["Anionic ligands end in -o, such as chlorido and cyanido. Neutral ligands keep their usual names, such as ammine for NH3 and aqua for H2O.", "Structural isomers differ in how the atoms are bonded. Geometric isomers (cis and trans) differ in the arrangement of ligands around the metal. Optical isomers are mirror images."], "example": {"q": "Name [Co(NH3)4Cl2]+ with Co in the +3 state.", "a": "Tetraamminedichloridocobalt(III) ion, with ammine and chlorido listed alphabetically."}}, {"title": "Crystal field theory and colour", "analogy": "A pair of hands pressing a ball. The ligands press the d orbitals unevenly, so the d orbitals split into two groups with an energy gap between them.", "body": ["In an octahedral complex the five d orbitals split into a lower t2g set and an upper eg set. Strong-field ligands produce a bigger gap, which pairs electrons more and lowers the number of unpaired electrons.", "The colour comes from light absorbed to excite an electron across the gap. Crystal field theory explains colour and magnetism together."], "example": {"q": "Why is [Co(NH3)6]3+ diamagnetic while [CoF6]3- is paramagnetic?", "a": "NH3 is a strong-field ligand that pairs all six electrons, while F- is weak-field and leaves four unpaired."}}]}, "Sets, Relations and Functions": {"formulas": [{"eq": "n(A union B) = n(A) + n(B) - n(A intersection B)", "use": "Counting elements in two overlapping sets"}, {"eq": "n(power set of A) = 2^n(A)", "use": "Number of subsets"}, {"eq": "A relation is an equivalence relation if it is reflexive, symmetric and transitive", "use": "Test for equivalence"}, {"eq": "f is one-one if f(a) = f(b) implies a = b", "use": "Injective test"}, {"eq": "f is onto if every element of the codomain is an image", "use": "Surjective test"}], "concepts": [{"title": "Sets and their operations", "analogy": "Two overlapping circles on a Venn diagram. The overlap is the intersection, the total of both is the union, and the outside is the complement.", "body": ["Union collects all elements in either set, and intersection keeps only the common ones. The complement is what lies outside a set within a universal set.", "De Morgan's laws connect these: the complement of a union is the intersection of the complements, and the reverse."], "example": {"q": "A has 10 elements, B has 7, and they share 3. How many elements are in A union B?", "a": "10 + 7 - 3 = 14."}}, {"title": "Equivalence relations", "analogy": "Grouping people by birthday month. Each person is in exactly one group, and anyone in the same group is treated as equal for that purpose.", "body": ["A relation on a set is reflexive if every element relates to itself, symmetric if a relates to b means b relates to a, and transitive if a relates to b and b relates to c means a relates to c.", "An equivalence relation has all three properties, and it splits the set into disjoint classes."], "example": {"q": "Is 'a is congruent to b mod 3' an equivalence relation on the integers?", "a": "Yes: a - a is 0, a - b and b - a both divide by 3, and a - b plus b - c divides by 3 too."}}, {"title": "One-one, onto and composition", "analogy": "Seating guests at a table. One-one means no two guests share a seat, and onto means every seat is taken.", "body": ["A function is bijective when it is both one-one and onto, which is the case where an inverse function exists.", "For composition, g(f(x)) is applied right to left: f acts first, then g."], "example": {"q": "Is f(x) = x^2 from the real numbers to the real numbers one-one?", "a": "No, because f(2) = f(-2) = 4, so it is many-one."}}]}, "Complex Numbers and Quadratic Equations": {"formulas": [{"eq": "i^2 = -1", "use": "Definition of the imaginary unit"}, {"eq": "|z| = sqrt(a^2 + b^2) for z = a + ib", "use": "Modulus of a complex number"}, {"eq": "Roots of ax^2 + bx + c = 0: x = (-b plus or minus sqrt(b^2 - 4ac)) / 2a", "use": "Quadratic formula"}, {"eq": "Sum of roots = -b/a, product of roots = c/a", "use": "Relations between roots and coefficients"}, {"eq": "Discriminant D = b^2 - 4ac: D > 0 two real roots, D = 0 equal roots, D < 0 complex roots", "use": "Nature of roots"}], "concepts": [{"title": "Complex numbers on the Argand plane", "analogy": "A map with two axes. Real numbers sit on the horizontal axis and imaginary numbers on the vertical one, so every point is an address.", "body": ["Multiplying by i rotates a point by 90 degrees anticlockwise. The modulus is the distance from the origin, and the argument is the angle from the positive real axis.", "The conjugate of a + ib is a - ib, and z times its conjugate gives the square of the modulus."], "example": {"q": "Find the modulus of 3 + 4i.", "a": "sqrt(9 + 16) = 5."}}, {"title": "Nature of roots", "analogy": "A quick test before a long calculation. The discriminant tells you what kind of answer to expect without solving the whole equation.", "body": ["If the discriminant is negative, the roots are a complex conjugate pair, so they always appear in pairs with the imaginary parts opposite.", "Real coefficients guarantee this pairing."], "example": {"q": "What kind of roots does x^2 + 2x + 5 = 0 have?", "a": "D = 4 - 20 = -16 is negative, so the roots are complex conjugates: -1 plus or minus 2i."}}, {"title": "Forming an equation from given roots", "analogy": "Reverse engineering a recipe. Given the ingredients, you rebuild the dish from the sum and product.", "body": ["If the roots are alpha and beta, the equation is x^2 - (alpha + beta) x + alpha beta = 0.", "This is handy for checking answers and for problems that ask for an equation with given roots."], "example": {"q": "Form the equation with roots 2 and -3.", "a": "Sum = -1, product = -6, so x^2 + x - 6 = 0."}}]}, "Matrices and Determinants": {"formulas": [{"eq": "det [[a, b], [c, d]] = ad - bc", "use": "Determinant of a 2 x 2 matrix"}, {"eq": "A inverse = adj(A) / det(A)", "use": "Inverse of a square matrix"}, {"eq": "Area of triangle = (1/2) |det of the coordinate matrix|", "use": "Area from vertices"}, {"eq": "A(adj A) = (adj A) A = det(A) I", "use": "Adjoint identity"}, {"eq": "Cramer's rule: x = det(Dx) / det(D)", "use": "Solving linear equations with a non-zero determinant"}], "concepts": [{"title": "Determinants and when a matrix can be inverted", "analogy": "A lock that only opens with the right combination. A zero determinant means the matrix collapses space, so it cannot be undone.", "body": ["A square matrix has an inverse exactly when its determinant is non-zero.", "Expanding along a row uses cofactors: each element multiplied by its signed minor."], "example": {"q": "Find the determinant of [[2, 1], [5, 3]].", "a": "2 x 3 - 1 x 5 = 1, which is non-zero, so the matrix is invertible."}}, {"title": "Solving equations with matrices", "analogy": "A pair of puzzle clues. Writing the equations as a grid lets you solve them in one step.", "body": ["A system AX = B has a unique solution when det(A) is non-zero, given by X = A inverse B.", "If det(A) = 0, the system either has no solution or infinitely many, and a consistency test decides which."], "example": {"q": "Solve x + y = 3 and x - y = 1.", "a": "Determinant of [[1, 1], [1, -1]] is -2. Solving gives x = 2, y = 1."}}, {"title": "Area of a triangle with determinants", "analogy": "Measuring a field by its corners. The determinant of the corner coordinates gives twice the area, with a sign that depends on the order of the corners.", "body": ["Put the three vertices (x, y) with a column of ones into a 3 x 3 matrix. Its determinant is twice the signed area.", "Take the absolute value so the area is always positive."], "example": {"q": "Find the area of the triangle with vertices (0,0), (4,0), (0,3).", "a": "Area = (1/2) x 4 x 3 = 6."}}]}, "Permutations and Combinations": {"formulas": [{"eq": "P(n, r) = n! / (n - r)!", "use": "Arrangements of r objects from n, order matters"}, {"eq": "C(n, r) = n! / (r! (n - r)!)", "use": "Selections of r objects from n, order does not matter"}, {"eq": "C(n, r) = C(n, n - r)", "use": "Symmetry of combinations"}, {"eq": "Pascal: C(n, r) = C(n - 1, r - 1) + C(n - 1, r)", "use": "Recurrence for combinations"}], "concepts": [{"title": "Permutation or combination?", "analogy": "Choosing a team versus choosing a line-up. A team is a group, but a line-up has positions, so order changes the outcome.", "body": ["Ask whether the order of the chosen items changes the result. If it does, use permutations; if not, use combinations.", "The fundamental principle of counting multiplies the number of ways for each independent step."], "example": {"q": "How many ways can a committee of 3 be picked from 8 people?", "a": "C(8, 3) = 56, since the committee has no order."}}, {"title": "Arrangements with restrictions", "analogy": "Seating a family where two people must sit together. Treat the pair as one seat, then arrange the pair inside it.", "body": ["If certain objects must stay together, treat them as one unit and multiply by the arrangements inside the unit.", "If objects must not be together, count all arrangements and subtract the ones where they are together."], "example": {"q": "In how many ways can 4 boys and 3 girls sit in a row if the 3 girls sit together?", "a": "Treat the girls as one block: 5! x 3! = 120 x 6 = 720."}}, {"title": "Distributing identical objects", "analogy": "Placing identical dividers in a row of coins. The dividers split the coins into groups.", "body": ["The number of ways to put n identical items into r distinct boxes is C(n + r - 1, r - 1).", "This follows from placing r - 1 dividers among the n items."], "example": {"q": "In how many ways can 5 identical sweets go into 3 boys?", "a": "C(5 + 3 - 1, 3 - 1) = C(7, 2) = 21."}}]}, "Binomial Theorem": {"formulas": [{"eq": "(a + b)^n = sum from r = 0 to n of C(n, r) a^(n-r) b^r", "use": "Binomial expansion for positive integer n"}, {"eq": "General term T(r+1) = C(n, r) a^(n-r) b^r", "use": "Formula for any term"}, {"eq": "Middle term: if n is even, T(n/2 + 1); if n is odd, the two terms T((n+1)/2) and T((n+3)/2)", "use": "Middle term of an expansion"}, {"eq": "Sum of coefficients = 2^n", "use": "Put a = b = 1"}], "concepts": [{"title": "The general term", "analogy": "A pattern in a row of tiles. Once you know the rule for one tile, every other tile follows.", "body": ["Each term has a binomial coefficient, a power of a, and a power of b, and the powers shift one step at a time.", "To find a specific term, set the power of b to the required index and read off the coefficient."], "example": {"q": "Find the term containing x^3 in the expansion of (x + 2)^6.", "a": "The power of x is 3 when r = 3 in the general term, so C(6, 3) times 2^3 times x^3 = 160 x^3."}}, {"title": "Middle term", "analogy": "The middle seat in a row of seats. For an even number of seats there is one middle seat, and for an odd number there are two.", "body": ["Count the terms: there are n + 1 terms, so an even n gives one middle term, and an odd n gives two.", "The middle term is the one with the largest coefficient in most standard expansions."], "example": {"q": "Find the middle term of (1 + x)^8.", "a": "n = 8 is even, so the middle term is T5 = C(8, 4) x^4 = 70 x^4."}}, {"title": "Using special values", "analogy": "Testing a machine with a simple input. Setting a and b to 1 reveals the total of all the coefficients.", "body": ["Putting x = 1 gives the sum of all coefficients; putting x = -1 gives the alternating sum, which is useful for even and odd parts.", "These tricks solve many problems without expanding the whole expression."], "example": {"q": "Find the sum of the coefficients in (1 + x)^10.", "a": "Set x = 1: 2^10 = 1024."}}]}, "Sequence and Series": {"formulas": [{"eq": "Arithmetic: a_n = a + (n - 1) d, S_n = (n/2)(2a + (n - 1) d)", "use": "nth term and sum of an arithmetic progression"}, {"eq": "Geometric: a_n = a r^(n-1), S_n = a (r^n - 1) / (r - 1)", "use": "nth term and sum of a geometric progression"}, {"eq": "Infinite GP: S = a / (1 - r) for |r| < 1", "use": "Sum to infinity"}, {"eq": "AM = (a + b)/2, GM = sqrt(ab), and AM >= GM", "use": "Means of two numbers"}], "concepts": [{"title": "Arithmetic and geometric progressions", "analogy": "Saving money. An arithmetic progression adds the same amount each month, while a geometric progression multiplies the savings by the same factor each time.", "body": ["The common difference d defines an arithmetic progression, and the common ratio r defines a geometric one.", "Identify the type by checking whether the difference or the ratio between consecutive terms stays constant."], "example": {"q": "Find the sum of the first 10 terms of 2, 4, 8, 16, ...", "a": "r = 2, so S10 = 2 (2^10 - 1) / (2 - 1) = 2046."}}, {"title": "Inserting means", "analogy": "Filling the gaps between two stepping stones with evenly spaced stones. The means are the stones placed between the two ends.", "body": ["To insert k arithmetic means between a and b, use common difference d = (b - a) / (k + 1).", "To insert k geometric means, use ratio r = (b / a) raised to the power 1 / (k + 1)."], "example": {"q": "Insert 3 arithmetic means between 2 and 10.", "a": "d = (10 - 2)/4 = 2, so the means are 4, 6, 8."}}, {"title": "Sum to infinity", "analogy": "Each step covers half the remaining distance to a wall. The steps get smaller, and the total stops short of the wall at a finite distance.", "body": ["A geometric series converges only when the absolute value of the ratio is less than 1.", "Once the ratio is outside that range, the sum to infinity does not exist."], "example": {"q": "Find the sum to infinity of 1 + 1/2 + 1/4 + ...", "a": "a = 1, r = 1/2, so S = 1 / (1 - 1/2) = 2."}}]}, "Limit, Continuity and Differentiability": {"formulas": [{"eq": "Limit of sin x / x as x tends to 0 is 1", "use": "Standard limit"}, {"eq": "Limit of (1 + 1/x)^x as x tends to infinity is e", "use": "Definition of e"}, {"eq": "d/dx (x^n) = n x^(n-1); d/dx (sin x) = cos x; d/dx (e^x) = e^x; d/dx (ln x) = 1/x", "use": "Basic derivatives"}, {"eq": "Product rule: (uv)' = u'v + uv'; Quotient rule: (u/v)' = (u'v - uv') / v^2", "use": "Differentiating products and quotients"}, {"eq": "Chain rule: dy/dx = (dy/du)(du/dx)", "use": "Differentiating composite functions"}], "concepts": [{"title": "Limits and continuity", "analogy": "Approaching a bus stop. A limit is where the bus is heading, which can be different from where it stops if the road is broken.", "body": ["A function is continuous at a point when the left limit, right limit and value at that point all agree.", "Algebra often removes a 0 over 0 form before taking the limit, by factorising or using a standard limit."], "example": {"q": "Find the limit of (x^2 - 4) / (x - 2) as x tends to 2.", "a": "Factorise: (x - 2)(x + 2) / (x - 2) = x + 2, so the limit is 4."}}, {"title": "Differentiability", "analogy": "A road with a sharp corner. You can walk along it, but there is no single direction at the corner, so a derivative does not exist there.", "body": ["A function is differentiable at a point when the left and right derivatives agree there. Differentiability implies continuity, but not the other way round.", "Corners and cusps are continuous but not differentiable."], "example": {"q": "Is f(x) = |x| differentiable at x = 0?", "a": "No. The left derivative is -1 and the right derivative is +1, so they do not agree."}}, {"title": "Applications: rates and extrema", "analogy": "Tracking the peak of a hill. The derivative tells you when you are going uphill, flat or downhill.", "body": ["A function increases where its derivative is positive and decreases where it is negative. Maxima and minima occur where the derivative is zero, and the second derivative tells which.", "Rate of change problems use the derivative directly."], "example": {"q": "Find the maximum of f(x) = x^2 (6 - x) for x between 0 and 6.", "a": "f'(x) = 12x - 3x^2 = 0 at x = 4, and f''(4) is negative, so the maximum is f(4) = 32."}}]}, "Integral Calculus": {"formulas": [{"eq": "Integral of x^n dx = x^(n+1)/(n+1) + C, n not equal to -1", "use": "Power rule"}, {"eq": "Integral of 1/x dx = ln |x| + C", "use": "Logarithm rule"}, {"eq": "Integration by parts: Integral of u dv = uv - Integral of v du", "use": "Product integrals"}, {"eq": "Integral from a to b of f(x) dx = F(b) - F(a)", "use": "Fundamental theorem of calculus"}, {"eq": "Integral of 1/(x^2 + a^2) dx = (1/a) arctan(x/a) + C", "use": "Standard form"}], "concepts": [{"title": "Reversing the derivative", "analogy": "Unpacking a parcel. Integration undoes differentiation, and the constant C is the missing piece you never see in the parcel.", "body": ["Integration finds a function whose derivative is the given one, up to an added constant C.", "Most integrals reduce to standard forms through substitution or a known identity."], "example": {"q": "Find the integral of 3x^2 dx.", "a": "x^3 + C."}}, {"title": "Substitution and parts", "analogy": "Swapping a hard tool for an easier one. Substitution changes the variable to simplify, and parts splits a product into a part you can differentiate and a part you can integrate.", "body": ["Choose the substitution that makes the derivative of the substituted part appear in the integrand.", "For integration by parts, pick u as the function that becomes simpler when differentiated; a common order is logarithm, inverse trig, algebraic, trig, exponential."], "example": {"q": "Find the integral of x e^x dx.", "a": "Let u = x and dv = e^x dx, so the result is x e^x - e^x + C."}}, {"title": "Definite integrals and areas", "analogy": "Measuring the area under a hill by slicing it into thin strips and adding them up.", "body": ["Evaluate the antiderivative at the upper limit and subtract its value at the lower limit.", "The area between two curves is the integral of the upper function minus the lower one, over the interval where they bound a region."], "example": {"q": "Find the area under y = x^2 from 0 to 3.", "a": "Integral from 0 to 3 of x^2 dx = 27/3 = 9."}}]}, "Differential Equations": {"formulas": [{"eq": "Separable: dy/dx = f(x) g(y), so integral of dy/g(y) = integral of f(x) dx", "use": "Separation of variables"}, {"eq": "Linear first order: dy/dx + p(x) y = q(x), integrating factor e^(integral of p dx)", "use": "Linear equation solution"}, {"eq": "Order is the highest derivative present; degree is the power of that highest derivative", "use": "Classifying a differential equation"}, {"eq": "Homogeneous: substitute y = vx, so dy/dx = v + x dv/dx", "use": "Homogeneous equations"}], "concepts": [{"title": "Separating variables", "analogy": "Sorting laundry into two baskets. Put all the y terms on one side and all the x terms on the other, then integrate each side.", "body": ["Rearrange so that every term containing y sits with dy and every term containing x sits with dx.", "Integrating both sides gives a general solution, with one constant C."], "example": {"q": "Solve dy/dx = x / y.", "a": "y dy = x dx, so y^2/2 = x^2/2 + C, or y^2 - x^2 = constant."}}, {"title": "Linear equations and integrating factors", "analogy": "Multiplying a sum by a factor so it becomes one clean derivative. The integrating factor makes the left side collapse into a single product rule term.", "body": ["For dy/dx + p(x) y = q(x), multiply both sides by e to the power of the integral of p, which turns the left side into the derivative of y times that factor.", "Integrate both sides, then divide by the factor to get y."], "example": {"q": "Solve dy/dx + y = e^x.", "a": "The integrating factor is e^x, so y e^x = (e^(2x))/2 + C, giving y = e^x/2 + C e^(-x)."}}, {"title": "Order and degree", "analogy": "Classifying a building by its tallest floor and the number of stairs leading to it.", "body": ["The order is the highest derivative that appears, and the degree is the power of that derivative after the equation is free of fractions and radicals in its derivatives.", "A non-polynomial function of a derivative means the degree is not defined."], "example": {"q": "Find the order and degree of (d^2y/dx^2)^3 + dy/dx = 0.", "a": "Order 2, degree 3."}}]}, "Co-ordinate Geometry": {"formulas": [{"eq": "Distance between (x1, y1) and (x2, y2) = sqrt((x2 - x1)^2 + (y2 - y1)^2)", "use": "Distance formula"}, {"eq": "Section formula: ((m x2 + n x1)/(m + n), (m y2 + n y1)/(m + n))", "use": "Point dividing a segment in the ratio m:n"}, {"eq": "Slope m = (y2 - y1)/(x2 - x1); lines parallel if slopes are equal, perpendicular if m1 m2 = -1", "use": "Slope relations"}, {"eq": "Distance from point (x1, y1) to line ax + by + c = 0: |a x1 + b y1 + c| / sqrt(a^2 + b^2)", "use": "Point to line distance"}, {"eq": "Circle: (x - h)^2 + (y - k)^2 = r^2", "use": "Standard equation of a circle"}], "concepts": [{"title": "Lines and their equations", "analogy": "Choosing the right form of a map. The same line can be described in several forms, and each form makes a different question easier.", "body": ["Use the slope-intercept form y = mx + c when the slope is known, the two-point form when two points are given, and the general form ax + by + c = 0 for most distance and intersection questions.", "The intersection of two lines is found by solving their equations together."], "example": {"q": "Find where y = 2x + 1 and y = -x + 4 meet.", "a": "2x + 1 = -x + 4, so x = 1 and y = 3, giving the point (1, 3)."}}, {"title": "Circles", "analogy": "Drawing a ring around a fixed point. Every point on the ring is the same distance from the centre.", "body": ["A circle is the set of points at a fixed distance r from its centre (h, k). The general form x^2 + y^2 + 2gx + 2fy + c = 0 has centre (-g, -f) and radius sqrt(g^2 + f^2 - c).", "A line can meet a circle at 0, 1 or 2 points, depending on the distance from the centre to the line."], "example": {"q": "Find the centre and radius of x^2 + y^2 - 4x + 6y - 3 = 0.", "a": "Centre (2, -3), radius sqrt(4 + 9 + 3) = 4."}}, {"title": "Conic sections", "analogy": "Slicing a cone at different angles. The slice gives a circle, ellipse, parabola or hyperbola, depending on the angle.", "body": ["A parabola is the set of points equidistant from a focus and a directrix, the ellipse has two foci with a constant sum of distances, and the hyperbola has a constant difference.", "Standard forms make the focus, directrix and axis easy to read off."], "example": {"q": "Find the focus of y^2 = 8x.", "a": "Comparing with y^2 = 4ax gives a = 2, so the focus is (2, 0)."}}]}, "Three Dimensional Geometry": {"formulas": [{"eq": "Distance between (x1, y1, z1) and (x2, y2, z2) = sqrt((x2 - x1)^2 + (y2 - y1)^2 + (z2 - z1)^2)", "use": "Distance in space"}, {"eq": "Direction cosines l, m, n satisfy l^2 + m^2 + n^2 = 1", "use": "Direction cosines of a line"}, {"eq": "Direction cosines = a/R, b/R, c/R, where R = sqrt(a^2 + b^2 + c^2)", "use": "From direction ratios a, b, c"}, {"eq": "cos(theta) = |a1 a2 + b1 b2 + c1 c2| / (sqrt(a1^2 + b1^2 + c1^2) sqrt(a2^2 + b2^2 + c2^2))", "use": "Angle between two lines"}, {"eq": "Shortest distance between skew lines = |(a2 - a1) . (b1 x b2)| / |b1 x b2|", "use": "Distance between skew lines"}], "concepts": [{"title": "Points, lines and direction", "analogy": "Giving directions in a building. You need a floor, a corridor and a room, and direction ratios tell you which way a line runs.", "body": ["A line in space is fixed by a point on it and a direction. Direction ratios are any three numbers proportional to the direction, and direction cosines are the normalised version.", "Direction cosines always satisfy l squared plus m squared plus n squared equal to 1."], "example": {"q": "Find the direction cosines of a line with direction ratios 2, 3, 6.", "a": "R = sqrt(4 + 9 + 36) = 7, so the direction cosines are 2/7, 3/7 and 6/7."}}, {"title": "Angle between lines", "analogy": "Comparing two arrows. The angle depends only on how they point, not where they start.", "body": ["The angle between two lines is found from their direction ratios using the dot product of the direction vectors.", "Perpendicular lines give a zero dot product."], "example": {"q": "Find the angle between lines with direction ratios (1, 0, 0) and (0, 1, 0).", "a": "cos(theta) = 0, so theta = 90 degrees."}}, {"title": "Skew lines and shortest distance", "analogy": "Two wires in a room that never meet, one above the other. The shortest gap between them is a straight line perpendicular to both.", "body": ["Skew lines are non-parallel lines that do not intersect. The shortest distance between them is measured along the line perpendicular to both.", "The formula uses the cross product of the two direction vectors to find that perpendicular direction."], "example": {"q": "Find the distance between the points (1, 2, 3) and (4, 6, 3).", "a": "sqrt(9 + 16 + 0) = 5."}}]}, "Vector Algebra": {"formulas": [{"eq": "a . b = |a| |b| cos(theta)", "use": "Scalar (dot) product"}, {"eq": "|a x b| = |a| |b| sin(theta)", "use": "Magnitude of the vector (cross) product"}, {"eq": "Area of triangle = (1/2) |a x b| for two sides a and b meeting at a vertex", "use": "Area using the cross product"}, {"eq": "Scalar projection of a on b = (a . b) / |b|", "use": "Component of a along b"}, {"eq": "a . (b x c) = scalar triple product, equal to the volume of the parallelepiped", "use": "Volume and coplanarity"}], "concepts": [{"title": "Dot product measures alignment", "analogy": "Pushing a trolley. The effective push is only the part aimed along the direction you want it to move.", "body": ["The dot product is large when two vectors point the same way and zero when they are perpendicular.", "It gives the projection of one vector along the other, and it tests whether two vectors are perpendicular."], "example": {"q": "Find a . b for a = (1, 2, 3) and b = (2, -1, 1).", "a": "2 - 2 + 3 = 3."}}, {"title": "Cross product gives a perpendicular vector", "analogy": "The axis of a spinning wheel. The cross product points along the axis that is perpendicular to both directions.", "body": ["The cross product of two vectors is perpendicular to both, and its magnitude is the area of the parallelogram they span.", "Swapping the order reverses its direction."], "example": {"q": "Find the area of the triangle with sides a = (1, 2, 3) and b = (2, -1, 1) meeting at a vertex.", "a": "a x b = (5, 5, -5), |a x b| = 5 sqrt(3), so the area is (5/2) sqrt(3)."}}, {"title": "Components and the triple product", "analogy": "Breaking a diagonal push into a sideways push and a forward push. Components split a vector along chosen directions.", "body": ["Any vector can be written as a sum of components along the x, y and z axes.", "The scalar triple product is zero when the three vectors are coplanar, which is a quick test of coplanarity."], "example": {"q": "What is the scalar projection of a = (1, 2, 3) on b = (2, -1, 1)?", "a": "a . b / |b| = 3 / sqrt(6)."}}]}, "Statistics and Probability": {"formulas": [{"eq": "Mean = sum of x / n (ungrouped)", "use": "Arithmetic mean"}, {"eq": "Variance = (sum of (x - mean)^2) / n", "use": "Population variance"}, {"eq": "Standard deviation = sqrt(variance)", "use": "Spread of data"}, {"eq": "P(A or B) = P(A) + P(B) - P(A and B)", "use": "Addition theorem"}, {"eq": "P(A given B) = P(A and B) / P(B)", "use": "Conditional probability"}, {"eq": "Bayes' theorem: P(Ai given B) = P(B given Ai) P(Ai) / sum of P(B given Aj) P(Aj)", "use": "Reversing conditional probability"}, {"eq": "E(X) = sum of x p(x)", "use": "Expected value of a random variable"}], "concepts": [{"title": "Measures of spread", "analogy": "A class with the same average marks but very different results. The spread shows whether everyone scored close to the average or some scored far above and below it.", "body": ["Variance measures the average squared distance from the mean. Taking the square root gives standard deviation, which is in the same units as the data.", "Mean deviation averages the absolute distances from the mean instead of the squares."], "example": {"q": "Find the variance of 2, 4, 6.", "a": "Mean = 4, squared deviations 4, 0, 4, sum 8, so variance = 8 / 3."}}, {"title": "Addition and multiplication of probability", "analogy": "Choosing from a menu. Adding two options counts the overlap only once, and multiplying two independent choices counts each pairing.", "body": ["For mutually exclusive events the overlap is zero, so P(A or B) is just the sum.", "Independent events satisfy P(A and B) = P(A) P(B)."], "example": {"q": "A die shows an even number or a number greater than 4. Find the probability.", "a": "Even: 2, 4, 6; greater than 4: 5, 6; overlap 6. P = (3 + 2 - 1)/6 = 4/6 = 2/3."}}, {"title": "Bayes' theorem", "analogy": "Working out which of two boxes a red ball came from. You weight each box by how likely it was to be chosen, then by how likely it was to hold a red ball.", "body": ["Use Bayes' theorem to update a probability after seeing evidence. Compute the joint probability for each possibility and divide by the total.", "The random variable's expected value gives the long-run average outcome."], "example": {"q": "Box 1 and Box 2 are equally likely. Box 1 has a 0.5 chance of red, and Box 2 has 0.2. Given a red ball, find P(Box 1).", "a": "(0.5 x 0.5) / (0.5 x 0.5 + 0.5 x 0.2) = 0.25 / 0.35 = 5/7."}}]}, "Trigonometry": {"formulas": [{"eq": "sin^2(x) + cos^2(x) = 1", "use": "Pythagorean identity"}, {"eq": "sin(A + B) = sin A cos B + cos A sin B", "use": "Addition formula"}, {"eq": "cos(2x) = cos^2(x) - sin^2(x)", "use": "Double angle formula"}, {"eq": "sin^(-1)(x) + cos^(-1)(x) = pi / 2", "use": "Inverse trig relation"}, {"eq": "tan^(-1)(x) + tan^(-1)(y) = tan^(-1)((x + y) / (1 - xy)), for xy less than 1", "use": "Adding inverse tangents"}], "concepts": [{"title": "Identities as tools", "analogy": "Interchangeable plugs. Each identity lets you swap one expression for an equivalent one that fits the problem better.", "body": ["The core identities let you rewrite a trig expression in terms of sine or cosine alone, or in terms of a single angle.", "Choose the identity that removes the unwanted term or combines the angles."], "example": {"q": "Simplify sin^2(x) + cos^2(x) + tan^2(x) when cos(x) is not zero.", "a": "sin^2(x) + cos^2(x) = 1, so the expression is 1 + tan^2(x) = sec^2(x)."}}, {"title": "Inverse trigonometric functions", "analogy": "Reading a map backwards. Given the ratio, the inverse tells you the angle, but only within the range the function is defined to cover.", "body": ["Inverse functions have restricted ranges, such as arcsin in the range from minus pi over 2 to pi over 2.", "The principal value is the answer inside that range, and a question may ask for it specifically."], "example": {"q": "Find the principal value of sin^(-1)(1/2).", "a": "pi / 6, since sin(pi/6) = 1/2 and pi/6 is within the principal range."}}, {"title": "Solving trigonometric equations", "analogy": "Finding every stop on a circular route. The same position comes around again each full turn, so the solutions repeat.", "body": ["Trig equations have infinitely many solutions because the functions repeat. Write the general solution by adding multiples of the period.", "Check whether the question asks for solutions in a given interval, which limits the count."], "example": {"q": "Solve sin(x) = 1/2 for x in the interval from 0 to 2 pi.", "a": "x = pi/6 or 5pi/6."}}]}};
function chIcon(name){
  const d = CH_ICONS[name]; if(!d) return '';
  return '<span class="ch-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg></span>';
}
function barRow(name, acc, meta){
  return el('<div class="row" style="cursor:default"><div><div class="name">'+esc(name)+'</div><div class="meta">'+esc(meta)+'</div></div>'
    +'<div class="end">'+(acc===null?'Not started':'<div class="bar"'+(SUBJ_VAR[name]?' style="--bar:'+SUBJ_VAR[name]+'"':'')+'><i style="width:'+acc+'%"></i></div><div style="margin-top:6px">'+acc+'%</div>')+'</div></div>');
}

const SYL_INFO = {
 main:'JEE Main: 3 hours, 75 questions, 300 marks. Physics, Chemistry and Maths, 25 questions each. Chapters below.',
 adv:'JEE Advanced: two papers of 3 hours each. It covers the same chapters as Main, tested in greater depth. Chapters below.'

function syllabusPart(){
  const tab = nav.sylTab || 'main';
  const w = el('<div class="card"><div class="eyebrow">Syllabus</div></div>');
  const seg = el('<div class="seg"></div>');
  [['main','JEE Main'],['adv','JEE Advanced']].forEach(p=>{
    const b = el('<button class="'+(tab===p[0]?'on':'')+'">'+p[1]+'</button>');
    b.onclick = ()=>go('home',{sylTab:p[0]});
    seg.appendChild(b);
  });
  w.appendChild(seg);
  w.appendChild(el('<p class="note-line" style="margin:0 0 12px">'+esc(SYL_INFO[tab])+'</p>'));
  SUBJECTS.forEach(s=>{
    const d = el('<details style="border-bottom:1px solid var(--border);padding:10px 0"><summary style="cursor:pointer;font-weight:600">'+s+' · '+SYLLABUS[s].length+' chapters</summary><ul style="margin:8px 0 4px;padding-left:20px;font-size:14px;line-height:1.75"></ul></details>');
    const ul = d.querySelector('ul');
    SYLLABUS[s].forEach(c=>ul.appendChild(el('<li>'+esc(c)+'</li>')));

const SYL_PAPERS = [
 {id:'main', label:'JEE Main', sub:'JEE Main 2027, Paper 1 (B.E./B.Tech.)', subjects:JEE_MAIN_SYLLABUS},
 {id:'adv', label:'JEE Advanced', sub:'JEE Advanced 2027', subjects:null}
];
let SYL_PAPER = 'main';
function examAdv(){ return !!(store.profile && store.profile.exam==='adv'); }
function sylPapersShown(){ return SYL_PAPERS.filter(p=>p.id!=='adv'||examAdv()); }

const TC_SMALL = new Set(['of','and','the','in','for','on','with','to','a','an','or','at','by','from','as','into','per','via','its','is']);
const TC_KEEP = {'Co-ordinate Geometry':1,'p-Block Elements':1,'d- and f-Block Elements':1,'Three Dimensional- perception':1};
function tc(s){
  if(TC_KEEP[s]) return s;
  return s.split(' ').map((w,i)=>{
    const lw = w.toLowerCase();
    if(i>0 && TC_SMALL.has(lw)) return lw;
    return w.split('-').map(p=>p.charAt(0).toUpperCase()+p.slice(1)).join('-');
  }).join(' ');
}

function sylUnits(units){
  const list = el('<div class="list"></div>');
  units.forEach((u,i)=>{
    list.appendChild(el('<details class="syl-unit"><summary><span class="k">'+(i+1)+'</span><span>'+esc(tc(u.t))+'</span></summary><p class="syl-text">'+esc(u.x)+'</p></details>'));
  });
  return list;
}

function syllabusView(){
  const w = el('<div></div>');
  if(Object.keys(NOTES).length){ const nc = el('<div class="card"><div class="eyebrow">Revision notes</div></div>'); Object.keys(NOTES).forEach(k=>{ const rb = el('<div class="row"><div class="name">'+esc(k)+'</div><div class="end">Open</div></div>'); rb.onclick = ()=>go('notes',{chapter:k}); nc.appendChild(rb); }); w.appendChild(nc); }
  w.appendChild(el('<h1 class="title">Syllabus</h1>'));
  const paper = sylPapersShown().find(p=>p.id===SYL_PAPER) || SYL_PAPERS[0];
  w.appendChild(el('<p class="sub">'+esc(paper.sub)+'</p>'));

  const tabs = el('<div class="syl-tabs" role="tablist"></div>');
  sylPapersShown().forEach(p=>{
    const b = el('<button role="tab" aria-selected="'+(p.id===paper.id)+'" class="'+(p.id===paper.id?'on':'')+'">'+esc(p.label)+'</button>');
    b.onclick = ()=>{ SYL_PAPER = p.id; render(); };
    tabs.appendChild(b);
  });
  w.appendChild(tabs);
  w.appendChild(chapterMap());

  if(!paper.subjects){
    w.appendChild(el('<div class="card empty" style="margin-top:14px">JEE Advanced syllabus is not added yet.</div>'));
    return w;
  }

  paper.subjects.forEach(sub=>{
    const count = sub.sec.reduce((n,x)=>n+x.u.length,0);
    const d = el('<details class="syl-subject"><summary><span>'+esc(tc(sub.s))+'</span><span class="k">'+count+' units</span></summary></details>');
    sub.sec.forEach(sec=>{
      if(sec.h) d.appendChild(el('<div class="field" style="margin:14px 0 6px">'+esc(tc(sec.h))+'</div>'));
      d.appendChild(sylUnits(sec.u));
    });
    w.appendChild(d);
  });
  w.appendChild(el('<p class="note-line" style="margin-top:18px">Check the official NTA brochure for the current syllabus.</p>'));
  return w;
}

// ---------- Quote rotation ----------
// Rules: a quote changes every 60 to 90 minutes (random within that window). Each quote is shown once
// per cycle; a cycle ends only when every quote has been shown, then it starts again.
// A quote only counts as "shown" when the home screen actually renders it, so time spent with the
// app closed does not use up a quote.
const QUOTE_KEY = 'quote_rotation_v1';
const QUOTE_MIN_MS = 60*60e3, QUOTE_MAX_MS = 90*60e3;
function loadQuoteState(){
  let st = null;
  try{ st = JSON.parse(localStorage.getItem(QUOTE_KEY)); }catch(e){}
  st = st && typeof st === 'object' ? st : {seen:[], cur:null, nextAt:0};
  st.seen = (Array.isArray(st.seen) ? st.seen : []).filter(i => Number.isInteger(i) && i>=0 && i<QUOTES.length);
  if(!Number.isInteger(st.cur) || st.cur<0 || st.cur>=QUOTES.length) st.cur = null;
  st.nextAt = Number(st.nextAt) || 0;
  return st;
}
let quoteState = loadQuoteState();
function quoteDue(now = Date.now()){ return quoteState.cur === null || now >= quoteState.nextAt; }
function advanceQuote(now = Date.now()){
  const all = QUOTES.map((_,i)=>i);
  let pool = all.filter(i => quoteState.seen.indexOf(i) < 0);
  if(!pool.length){                        // every quote has been shown: start a new cycle
    quoteState.seen = [];
    pool = all.filter(i => i !== quoteState.cur);
    if(!pool.length) pool = all;
  }
  const pick = shuffle(pool)[0];
  quoteState.seen.push(pick);
  quoteState.cur = pick;
  quoteState.nextAt = now + QUOTE_MIN_MS + Math.random() * (QUOTE_MAX_MS - QUOTE_MIN_MS);
  try{ localStorage.setItem(QUOTE_KEY, JSON.stringify(quoteState)); }catch(e){}
}

  const ranked = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const card = el('<div class="card"><div class="eyebrow">Your top slips</div></div>');
  if(!ranked.length) card.appendChild(el('<p class="note-line">No mistakes named yet. Name a slip under a wrong answer to start seeing patterns.</p>'));
  ranked.forEach(([k,n])=>{ const lab = (MISTAKE_TYPES.find(m=>m[0]===k)||[k,k])[1]; card.appendChild(el('<div class="fx-row"><div class="fx-eq">'+esc(lab)+'</div><div class="meta">'+n+' time'+(n>1?'s':'')+'</div></div>')); });
  w.appendChild(card);
  const sure = {n:0, ok:0}, guess = {n:0, ok:0};
  store.attempts.forEach(a=>{ if(a.conf==='sure'){ sure.n++; if(a.c) sure.ok++; } else if(a.conf==='guess'){ guess.n++; if(a.c) guess.ok++; } });
  w.appendChild(el('<div class="eyebrow" style="margin:14px 0 10px">Confidence calibration</div>'));
  w.appendChild(calCardEl('When you were sure', sure, 'var(--c-phys)'));
  w.appendChild(calCardEl('When you were guessing', guess, 'var(--c-medium)'));
  const gap = sure.n && guess.n ? Math.abs(Math.round(sure.ok/sure.n*100) - Math.round(guess.ok/guess.n*100)) : null;
  w.appendChild(el('<div class="cal-note">'+(gap===null
    ? 'Answer a few questions with both confidence levels to see your calibration.'
    : 'The gap between these two is '+gap+' points. The smaller the gap, the better you judge your own answers. Guessing is cheap only when you know you are guessing.')+'</div>'));
  return w;
}
// One calibration card: the share right as the largest figure, with a bar of right against wrong

    +'<div class="cal-sub">'+(has ? o.ok+' right out of '+o.n+' answers' : 'Nothing recorded yet')+'</div>'
    +'<div class="cal-bar" role="img" aria-label="'+o.ok+' right, '+wrong+' wrong"><i class="cal-right" style="width:'+p+'%"></i></div>'

// Shrink a chosen photo to a 256px square JPEG before it is cached
function readAvatar(file, done){
  if(!file || !file.type || file.type.indexOf('image/') !== 0){ alert('Please choose a photo (JPG or PNG).'); return; }
  const fr = new FileReader();
  fr.onerror = ()=>alert('That photo could not be read. Try another one.');
  fr.onload = ()=>{
    const img = new Image();
    img.onerror = ()=>alert('That photo could not be opened. Try a JPG or PNG.');
    img.onload = ()=>{
      const S = 256, m = Math.min(img.width, img.height);
      const c = document.createElement('canvas'); c.width = S; c.height = S;
      c.getContext('2d').drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
      done(c.toDataURL('image/jpeg', 0.85));
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

  f.addEventListener('change', saveDraft);
  btns.forEach(b=>b.addEventListener('click', saveDraft));

  // Live preview: how this user looks to others on the leaderboard
  const prev = f.querySelector('.vis-preview'), vcb = g('visible');
  const paintPreview = ()=>{
    const on = vcb.checked;
    f.querySelector('.vis-lbl').textContent = on ? 'Visible to others' : 'Anonymous to others';
    const uname = (g('username').value.trim() || 'your_username');
    const av = loadAvatarCache();
    const pic = (on && av) ? '<img alt="" src="'+av+'">' : (on ? '<i>'+esc((g('name').value||'?').trim().charAt(0).toUpperCase()||'?')+'</i>' : ANON_SVG);
    prev.innerHTML = '<div class="lb-row lb-prev"><span class="lb-av">'+pic+'</span><span class="lb-name">'
      +(on ? esc(uname) : 'Anonymous User')+'</span><span class="lb-pts">— pts</span></div>'
      +'<p class="note-line">'+(on ? 'Others see your username and photo.' : 'Others see a generic avatar and "Anonymous User". Your points still count.')+'</p>';
  };
  vcb.onchange = paintPreview;
  ['name','username'].forEach(n=>g(n).addEventListener('input', paintPreview));
  paintPreview();

  const avatarState = {data: null, fresh: false};
  if(withAvatar){
    avatarState.data = loadAvatarCache();
    const av = el('<label class="av-pick"><input type="file" accept="image/*" hidden><span class="av-circle"></span>'
      +'<span class="av-text"><b>Add a photo</b></span></label>');
    const circle = av.querySelector('.av-circle');
    const paint = ()=>{ circle.innerHTML = avatarState.data ? '<img alt="" src="'+avatarState.data+'">' : '<i>+</i>'; paintPreview(); };
    paint();
    av.querySelector('input').onchange = e=>{
      const file = e.target.files && e.target.files[0];
      if(file) readAvatar(file, d=>{ avatarState.data = d; avatarState.fresh = true; paint(); });
    };

    const username = g('username').value.trim();
    const name = g('name').value.trim();
    const surname = g('surname').value.trim();
    const age = parseInt(g('age').value, 10);
    const bd = g('birthdate').value;
    if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){ return fail('Username must be 3 to 20 letters, numbers or underscores.'); }
    if(!name) return fail('Please enter your name.');
    if(!surname) return fail('Please enter your surname.');
    if(!(age>=10 && age<=60)) return fail('Please enter an age between 10 and 60.');
    if(bd){
      const d = new Date(bd+'T00:00:00'), now = new Date();

    const profile = {username, name, surname, age, birthdate: bd||null, standard:g('standard').value, exam, visible: vcb.checked};
    const btn = f.querySelector('button[type="submit"]');
    if(needOtp && !sbSession){
      const db = sbClient();
      const email = g('email').value.trim();
      const pw = g('password').value;
      if(!db) return fail('Sign-up is unavailable right now. Check your connection and try again.');
      if(!/^\S+@\S+\.\S+$/.test(email)) return fail('Enter a valid email address.');
      if(pw.length < 8) return fail('Password must be at least 8 characters.');
      if(pw !== g('password2').value) return fail('The two passwords do not match.');
      btn.disabled = true; authBusy = true;
      const { data, error } = await db.auth.signUp({ email, password: pw });
      if(error){ authBusy = false; btn.disabled = false; return fail(error.message); }
      if(!data.session){ authBusy = false; btn.disabled = false; return fail('Account created. Confirm your email from the message we sent, then log in. What you typed is kept on this device.'); }
      sbSession = data.session;
    }
    btn.disabled = true; authBusy = true;
    const res = await saveRemote(profile, avatarState.fresh ? avatarState.data : null);
    authBusy = false;
    btn.disabled = false;
    if(res.taken) return fail('That username is taken. Try another.');
    if(res.error) return fail('Could not save: ' + (res.error.message || 'unknown error') + '. Check the message and try again.');
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    onSave(profile, res.avatar || avatarState.data);
  };
  return f;
}

const ANON_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="9" r="4" fill="currentColor"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6z" fill="currentColor"/></svg>';
const LB_BOARDS = [
  {k:'time',   l:'Most time',             sub:'Minutes answered',        note:'Total minutes spent answering in this period.'},
  {k:'points', l:'Most points',           sub:'Points earned',           note:'Points from correct answers. Quicker and sure answers earn more.'},
  {k:'speed',  l:'Quickest',              sub:'Fastest correct answers', note:'Average seconds per correct answer. Lower is faster. Needs 5 or more answers.'},
  {k:'clean',  l:'Least skipped & right', sub:'Accuracy incl. skips',    note:'Correct answers as a share of every question in the period, skips included. Needs 5 or more answers.'}
];
const LB_PERIODS = [['day','Today'],['week','This week'],['month','This month'],['3m','Last 3 months'],['6m','Last 6 months'],['year','Last year'],['all','All time']];
let lbState = {board:'points', period:'all', cache:{}};
const LB_TTL = 60000;
function avatarUrl(path){ return path ? SB_URL+'/storage/v1/object/public/avatars/'+path : null; }
function lbKey(){ return lbState.board+'|'+lbState.period; }
function setC(key, v){ v.at = Date.now(); lbState.cache[key] = v; }
function lbFmt(board, s){
  if(s==null || isNaN(s)) return '–';
  if(board==='points') return (Math.round(s*10)/10)+' pts';
  if(board==='clean') return Math.round(s)+'%';
  if(board==='speed') return (Math.round(s*10)/10)+' s avg';
  const m = Math.round(s);
  return m>=60 ? Math.floor(m/60)+' h '+(m%60)+' min' : m+' min';
}
function lbFetch(){
  const key = lbKey(), c = lbState.cache[key];
  if(c && (c.loading || Date.now()-c.at < LB_TTL)) return;
  const db = sbClient();
  if(!db || !sbSession){ setC(key, {err:'Sign in to see the leaderboard.'}); return; }
  setC(key, {loading:true});
  db.rpc('leaderboard', {p_board:lbState.board, p_period:lbState.period, p_limit:50}).then(({data,error})=>{
    if(error){ console.error(error); setC(key, {err:'Could not load the leaderboard. Check your connection and try again.'}); return; }
    const rows = (data||[]).map(r=>({place:Number(r.place), name:r.username||'Anonymous User', first:r.first_name,
      avatar:avatarUrl(r.avatar_path), anon:!!r.is_anonymous, me:!!r.is_me, score:Number(r.score)}));
    // Remember our all-time points rank so future awards can taper for top ranks.
    if(lbState.board==='points' && lbState.period==='all'){
      const me = rows.find(r=>r.me);
      store.lbRank = me ? me.place : null;
      persist();
    }
    setC(key, {rows});
  }).catch(()=>setC(key, {err:'Could not load the leaderboard.'})).finally(()=>render());
}

    +'<label class="pf"><span class="eyebrow">Email</span><input name="email" type="email" maxlength="120" placeholder="you@example.com"></label>'
    +'<label class="pf"><span class="eyebrow">Phone <small style="opacity:.6">(optional)</small></span><input name="phone" type="tel" maxlength="20" placeholder="+91 98765 43210"></label>'
    +'<label class="pf"><span class="eyebrow">Comment</span><textarea name="message" maxlength="1000" placeholder="Tell us what is on your mind"></textarea></label>'
    +'<p class="note-line err" hidden></p>'
    +'<button class="btn block" type="submit">Send message</button>';
  const err = f.querySelector('.err'), btn = f.querySelector('button[type="submit"]');

  f.onsubmit = async e=>{
    e.preventDefault();
    const v = n=>f.querySelector('[name="'+n+'"]').value.trim();
    const name = v('name'), email = v('email'), phone = v('phone'), message = v('message');
    if(!name) return fail('Please enter your name.');

    if(phone && !/^\+?[0-9 ()-]{7,20}$/.test(phone)) return fail('Enter a valid phone number, or leave it empty.');
    if(message.length < 5) return fail('Please write a short comment.');
    const db = sbClient();
    if(!db) return fail('Sending is unavailable right now. Check your connection and try again.');
    btn.disabled = true; err.hidden = true;
    const { error } = await db.from('contact_messages').insert({ name, email, phone: phone || null, message, user_id: sbSession ? sbSession.user.id : null });
    btn.disabled = false;
    if(error) return fail('Could not send: ' + error.message);
    f.reset();
    btn.textContent = 'Sent. Thank you.';
    setTimeout(()=>{ btn.textContent = 'Send message'; }, 2600);
  };
  card.appendChild(f);
  return card;
}

function pyqPractice(w){
  const q = session.queue[session.idx];
  const a = session.answers[q.id];
  const reviewing = !!session.review;
  const locked = !!(a && a.pending);                       // chosen, waiting for submit
  const answered = reviewing || !!(a && !a.skip && !a.pending);   // reveal only when reviewing or submitted
  const n = session.queue.length;
  const elapsed = answered && a && a.time!=null ? a.time : Math.floor((Date.now()-qStartOf(q))/1000);
  const left = 120 - elapsed;
  const fresh = !!(answered && a.at && Date.now()-a.at < 900);
  const doneCount = session.queue.filter(x=>{ const y=session.answers[x.id]; return y && !y.skip; }).length;
  w.appendChild(topRow(session.title, '<span class="tag">'+(session.idx+1)+' / '+n+'</span>',
    ()=>requestLeave(exitSession)));
  w.appendChild(el('<div class="progress"><i style="width:'+Math.round(doneCount/n*100)+'%"></i></div>'));
  const over = !answered && left<0, warn = !answered && left<=20 && left>=0;
  w.appendChild(el('<div class="qclock'+(over?' over':(warn?' warn':''))+'">'
    +'<svg viewBox="0 0 44 44" aria-hidden="true"><circle class="qc-bg" cx="22" cy="22" r="18"/>'
    +'<circle id="qArc" class="qc-fg" cx="22" cy="22" r="18" style="stroke-dashoffset:'+ringOffset(elapsed)+'"/></svg>'
    +'<div class="qc-txt"><span id="qTimer">'+clockLabel(answered, elapsed, left)+'</span>'
    +'<small>'+(answered?'The exam expects this in under 2 minutes':'Aim to solve this in under 2 minutes')+'</small></div>'
    +'<div class="qc-pts">'+(session.points||0)+' pts</div></div>'));

  const card = el('<div class="card qcard" style="--bar:'+(SUBJ_VAR[q.subject]||'')+'"></div>');
  card.appendChild(el('<div class="tags"><span class="tag shift">'+q.year+' · '+SHIFT_NAME[q.shift]+'</span><span class="tag diff diff-'+q.difficulty.toLowerCase()+'">'+q.difficulty+'</span><span class="tag">'+esc(q.topic)+'</span></div>'));
  card.appendChild(el('<div class="qtext">'+qtextHTML(q.text)+'</div>'));
  if(q.image) card.appendChild(qImage(q.image));

  if(!answered){
    const pre = session.conf[q.id] || '';
    card.appendChild(el('<div class="sog-head">'+sogMark()+'<div><div class="sog-title">Choose before you answer</div><div class="sog-req">Required. Skip if you are not attempting.</div></div></div>'));
    const cr0 = el('<div class="chips"></div>');
    [['sure','Sure'],['guess','Guessing']].forEach(p=>{
      const b = el('<button class="sog-choice sog-'+p[0]+(pre===p[0]?' on':'')+'" aria-pressed="'+(pre===p[0])+'"><span class="sog-ico">'+(p[0]==='sure'?'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6M12 17h.01"/></svg>')+'</span><span>'+p[1]+'</span></button>');
      b.onclick = ()=>{ session.conf[q.id] = pre===p[0] ? null : p[0]; render(); };
      cr0.appendChild(b);
    });
    card.appendChild(cr0);
  }

  if(q.type==='integer'){
    const val = (answered || locked) ? String(a.sel||'') : (session.draft[q.id]||'');
    const state = answered && a && !a.skip ? (a.correct?'ok':'bad') : '';
    card.appendChild(numpad(q, val, v=>{ session.draft[q.id]=v; render(); },
      ()=>{ const v = session.draft[q.id]; if(v) answerNumeric(v); }, answered || locked, state));
  } else q.options.forEach((o,i)=>{
    const picked = (answered || locked) && a && a.sel===i;
    const cls = answered ? (i===q.correct ? 'ok' : (picked ? 'bad' : '')) : (picked ? 'sel' : '');
    const row = el('<div class="opt '+cls+(fresh?' fx':'')+(q.optionImages && q.optionImages[i] ? ' hasimg' : '')+'"><span class="k">'+L(i)+'</span>'+optBody(q,i)+'</div>');
    if(!answered && !locked) row.onclick = ()=>answerPYQ(i);
    card.appendChild(row);
  });

  let noteTa = null;
  if(locked){
    card.appendChild(el('<div class="note">Your answer is locked in. It is marked when you submit this set.</div>'));
  } else if(!answered){
    if(q.hint){
      if(!session.hints[q.id]){
        const hb = el('<button class="linkish" style="margin-top:6px">Show hint</button>');
        hb.onclick = ()=>{ session.hints[q.id]=true; render(); };
        card.appendChild(hb);
      } else card.appendChild(el('<div class="hint">Hint: '+esc(q.hint)+'</div>'));
    }
    if(a && a.skip) card.appendChild(el('<div class="note skipnote">Skipped. Leaving a question you are unsure of is the right call. It still earns '+a.pts+' point.</div>'));
  } else {
    const ptsLine = (!reviewing && a.pts!=null) ? '<div class="ptsline">+'+a.pts+' points</div>' : '';
    const verdict = a.skip ? 'Skipped. The answer is '+answerLabel(q) : (a.correct ? 'Correct' : 'Not quite. The answer is '+answerLabel(q));
    card.appendChild(el('<div class="note '+(a.skip?'':(a.correct?'ok':'bad'))+'"><div class="verdict">'+verdict+'</div>'+ptsLine+esc(q.explanation)+'</div>'));

    noteTa = el('<textarea placeholder="Add a note"></textarea>');
    noteTa.value = store.notes[q.id] || '';
    card.appendChild(el('<div class="field">Note</div>'));
    card.appendChild(noteTa);
    logicBlock(q, card);
    card.appendChild(el('<div class="field">My solution</div>'));
    const mysTa = el('<textarea placeholder="Your own, better way to solve this. Only you can see it."></textarea>');
    mysTa.value = (store.mySol && store.mySol[q.id]) || '';
    card.appendChild(mysTa);
    const mysBtn = el('<button class="linkish">Save my solution</button>');
    mysBtn.onclick = ()=>{ store.mySol = store.mySol || {}; const t = mysTa.value.trim(); if(t) store.mySol[q.id] = t; else delete store.mySol[q.id]; persist(); mysBtn.innerText = 'Saved'; };
    card.appendChild(mysBtn);
    mistakeMirrorUI(q, card);
    const saved = store.bookmarks.indexOf(q.id)>=0;
    const bmRow = el('<div class="row" style="justify-content:flex-start;margin-top:12px;padding:0;border:none"></div>');
    const bm = el('<button class="linkish">'+(saved?'★ Saved':'☆ Save for later')+'</button>');
    bm.onclick = ()=>{ saveNote(q.id, noteTa.value); toggleBookmark(q.id); };
    bmRow.appendChild(bm);
    const rp = el('<button class="linkish" style="margin-left:14px">⚑ Report</button>');
    rp.onclick = ()=>reportSheet(q);
    bmRow.appendChild(rp);
    card.appendChild(bmRow);
  }

  const last = session.idx===n-1;
  const nv = el('<div class="qnav-row"></div>');
  const prev = el('<button class="btn secondary"'+(session.idx===0?' disabled':'')+'>Previous</button>');
  prev.onclick = ()=>goQ(session.idx-1);
  const skip = el('<button class="linkish"'+((answered||locked)?' style="visibility:hidden"':'')+'>Skip</button>');
  skip.onclick = ()=>skipQ();
  const next = el('<button class="btn">'+(reviewing ? (last?'Done':'Next') : (last?'Submit set':'Next'))+'</button>');
  next.onclick = ()=>{
    if(noteTa) saveNote(q.id, noteTa.value);
    if(reviewing){ if(last) exitReview(); else goQ(session.idx+1); return; }
    if(last) submitPractice(); else goQ(session.idx+1);
  };
  nv.appendChild(prev); nv.appendChild(skip); nv.appendChild(next);
  card.appendChild(nv);

  w.appendChild(card);
  if(!reviewing){
    const sub = el('<div style="margin-top:12px"></div>');
    const sb = el('<button class="btn secondary block">Submit this set</button>');
    sb.onclick = ()=>submitPractice();
    sub.appendChild(sb);
    sub.appendChild(el('<p class="note-line" style="margin:8px 4px 0">Answers are marked only when you submit. Until then you can change your mind by going back to the question.</p>'));
    w.appendChild(sub);
  }
  w.appendChild(qNavDrawer());
  return w;
}

function mockResults(w){
  const n = session.queue.length;
  let score=0, c=0, wr=0, sk=0;

  session.queue.forEach(q=>{
    bySub[q.subject] = bySub[q.subject] || {score:0, max:0};
    bySub[q.subject].max += 4;

  w.appendChild(el('<div class="note-line" style="text-align:center">'+c+' correct · '+wr+' wrong · '+sk+' skipped</div>'));
  flair(w, Math.max(0,Math.round(score/(n*4)*100)), c+wr, 60);
  const sl = el('<div class="list"></div>');

  });
  w.appendChild(sl);
  w.appendChild(el('<div class="eyebrow" style="margin:22px 0 8px">Review</div>'));
  w.appendChild(reviewListEl());

function pyqResults(w){
  // Anything left untouched when the set ends is marked as skipped. Those earn no points; a deliberate skip earns 1.
  session.queue.forEach(q=>{
    if(session.answers[q.id]) return;
    session.answers[q.id] = {skip:true, auto:true, time:0, pts:0};
    recordSkip(q, 0);
    if(session.title==='Question of the day'){ store.qotdSkip = store.qotdSkip || {}; store.qotdSkip[dayKey()] = q.id; persist(); }
  });
  const total = session.queue.length;
  const answered = session.queue.filter(q=>session.answers[q.id] && !session.answers[q.id].skip);
  const correct = answered.filter(q=>session.answers[q.id].correct).length;
  w.appendChild(el('<div class="hm-hero"><div class="hm-orbs" aria-hidden="true"><i></i><i></i></div><div class="hm-eyebrow">Session results'+nameSuffix()+'</div><h1 class="hm-title">'+esc(session.title)+'</h1></div>'));
  { const wrong = answered.filter(q=>!session.answers[q.id].correct).length;
    const marks = correct*4 - wrong, max = total*4;
    const mp = max>0 ? Math.round(marks/max*100) : 0;
    const acc = answered.length ? Math.round(correct/answered.length*100) : 0;
    w.appendChild(ringMarks(marks, max));
    w.appendChild(el('<div class="note-line" style="text-align:center">Accuracy '+acc+'% · '+correct+' of '+answered.length+' answered correct</div>'));
    flair(w, mp, answered.length, 75);
    if(mp>=80) w.appendChild(shareBtn('I scored '+marks+' out of '+max+' marks ('+mp+'%) on TORQ. JEE practice that works.'));
  }
  w.appendChild(el('<div class="stats">'
    +'<div class="stat"><div class="n">'+correct+'/'+total+'</div><div class="l">Correct</div></div>'
    +'<div class="stat"><div class="n">'+(answered.length?Math.round(correct/answered.length*100):0)+'%</div><div class="l">Accuracy</div></div>'
    +'<div class="stat"><div class="n">'+answered.length+'</div><div class="l">Answered</div></div></div>'));

  const byCh = {};
  answered.forEach(q=>{
    byCh[q.chapter] = byCh[q.chapter] || {c:0,t:0};
    byCh[q.chapter].t++; if(session.answers[q.id].correct) byCh[q.chapter].c++;
  });
  const keys = Object.keys(byCh);
  if(keys.length){
    const list = el('<div class="list"></div>');
    keys.forEach(k=>list.appendChild(barRow(k, Math.round(byCh[k].c/byCh[k].t*100), byCh[k].c+' of '+byCh[k].t+' correct')));
    w.appendChild(list);
  }
  const wrong = answered.filter(q=>!session.answers[q.id].correct);
  if(wrong.length){
    const rb = el('<button class="btn block" style="margin-top:6px">Practice the '+wrong.length+' wrong one'+(wrong.length>1?'s':'')+'</button>');
    rb.onclick = ()=>startSession({mode:'redo', title:'Redo: '+session.title, queue:sortQs(wrong)});
    w.appendChild(rb);
  }
}
